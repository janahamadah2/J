ication without inflammation"],"c":0,"w":"Acute infective endocarditis, usually from virulent organisms such as S. aureus, is a suppurative (pus-forming) inflammation that rapidly destroys the valve. Not in your uploaded pathology slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q177; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Caseating granulomas describe tuberculosis-type inflammation.","2":"Sterile fibrin deposits describe NBTE or Libman-Sacks vegetations.","3":"Calcification without inflammation describes degenerative valve disease."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q76","u":"Pathology","t":"mc","q":"Stable angina is caused by:","o":["Uncomplicated atheroma","Acute pericarditis","Aortic dissection","Pulmonary embolism"],"c":0,"w":"Stable angina comes from a fixed, uncomplicated atheroma that limits flow on effort; acute plaque changes (rupture, thrombosis) cause infarction instead. The pairing is from the bank's key. (Stem expanded from \"stable angina :\".) (Shams Practices QB, Unknown-1 Q148; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Acute pericarditis is inflammation of the pericardium.","2":"Aortic dissection is a tear in the aortic wall.","3":"Pulmonary embolism is a blocked pulmonary artery."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q77","u":"Pathology","t":"mc","q":"Granulation tissue appears in a myocardial infarct after:","o":["7 days","30 minutes","2 hours","6 months"],"c":0,"w":"Granulation tissue forms in an infarct at about 7 days, as it is repaired; it is replaced by a scar over weeks. Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem expanded from \"Granulation tissue :\".) (Shams Practices QB, Unknown-1 Q150; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"At 30 minutes the infarct shows no visible change.","2":"At 2 hours there is still no granulation tissue.","3":"By 6 months the infarct is a dense scar."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q78","u":"Pathology","t":"mc","q":"Atherosclerosis involves:","o":["Macrophage engulf lipid","Neutrophils produce antibodies","Erythrocytes synthesize collagen","Platelets produce hemoglobin"],"c":0,"w":"In atherogenesis macrophages and smooth muscle cells engulf lipid and become foam cells, forming the fatty streak. (Stem expanded from \"atherosclerosis :\".) (Shams Practices QB, Unknown-1 Q146; Pathology L4 slides (atherosclerosis))","x":{"1":"Antibodies are made by plasma cells, not neutrophils.","2":"Collagen in plaques is made by smooth muscle cells, not red cells.","3":"Platelets do not make hemoglobin."},"m":{},"lp":true,"k":"path-athero","src":"materials","kind":"Apply a fact"},{"id":"q79","u":"Pathology","t":"mc","q":"Arteriolosclerosis is associated with:","o":["Hypertension","Allergic rhinitis","Lactose intolerance","Acute appendicitis"],"c":0,"w":"Arteriolosclerosis affects small arteries and arterioles and is associated with hypertension and diabetes mellitus. (Stem expanded from \"Arteriolosclerosis\".) (Shams Practices QB, Unknown-1 Q147; Pathology L4 slides (atherosclerosis))","x":{"1":"Allergic rhinitis is nasal allergy.","2":"Lactose intolerance is an enzyme deficiency.","3":"Appendicitis is an acute abdominal infection."},"m":{},"lp":true,"k":"path-arteriosclerosis","src":"materials","kind":"Apply a fact"}],"concepts":{"path-congestion":{"title":"Hyperemia and congestion","unit":"Pathology","points":["Hyperemia: an active process in which arteriolar dilation increases blood flow; tissue turns red (erythema) from oxygenated blood.","Congestion: a passive process from impaired venous outflow; tissue is dusky reddish-blue (cyanosis) from deoxygenated blood.","Acute localized congestion: sudden complete venous obstruction (DVT, ligature, twisted pedicle of an ovary) causing rapid edema and hemorrhage.","Chronic generalized venous congestion is caused by chronic right-sided heart failure; acute generalized congestion by acute heart failure."],"source":"Pathology L1 slides (hemodynamic disorders I)","items":["q0","q1","q2","q3","q4"],"sec":[{"id":"path-congestion","title":"Hyperemia and congestion","key":["Hyperemia: an active process in which arteriolar dilation increases blood flow; tissue turns red (erythema) from oxygenated blood.","Congestion: a passive process from impaired venous outflow; tissue is dusky reddish-blue (cyanosis) from deoxygenated blood.","Acute localized congestion: sudden complete venous obstruction (DVT, ligature, twisted pedicle of an ovary) causing rapid edema and hemorrhage.","Chronic generalized venous congestion is caused by chronic right-sided heart failure; acute generalized congestion by acute heart failure."]}]},"path-edema":{"title":"Edema: causes and classification","unit":"Pathology","points":["Edema: an abnormal increase in interstitial fluid within tissues; fluid may be transudate, exudate or lymph.","Causes: increased capillary hydrostatic pressure, decreased plasma colloid osmotic pressure, increased capillary permeability, lymphatic obstruction.","Hypoproteinemia: total plasma proteins below 2.5 gm% or serum albumin below 1.5 gm%.","Pitting edema: generalized edema and obstructive venous edema. Non-pitting: inflammatory and lymphatic edema."],"source":"Pathology L1 slides (hemodynamic disorders I)","items":["q5","q6","q7","q8"],"sec":[{"id":"path-edema","title":"Edema: causes and classification","key":["Edema: an abnormal increase in interstitial fluid within tissues; fluid may be transudate, exudate or lymph.","Causes: increased capillary hydrostatic pressure, decreased plasma colloid osmotic pressure, increased capillary permeability, lymphatic obstruction.","Hypoproteinemia: total plasma proteins below 2.5 gm% or serum albumin below 1.5 gm%.","Pitting edema: generalized edema and obstructive venous edema. Non-pitting: inflammatory and lymphatic edema."]}]},"path-ischemia-infarct":{"title":"Ischemia and infarction","unit":"Pathology","points":["Ischemia: deficient arterial blood supply due to partial or complete occlusion of the artery; acute (sudden complete) or chronic (gradual partial).","Organs with good collateral circulation show no effect; poor collateral circulation leads to infarction (acute) or chronic ischemic changes.","Infarct: an area of ischemic necrosis from occlusion of the arterial supply or venous drainage; 99% from thrombosis or embolism.","Red infarct: venous occlusion (ovary), loose tissue (lung), dual circulation (lung, liver, small intestine), reperfusion after angioplasty.","White infarct: arterial occlusion in solid organs with end-arterial circulation (heart, spleen, kidney); tissue density limits seepage of blood."],"source":"Pathology L1 slides (hemodynamic disorders I)","items":["q9","q10","q11","q12","q13"],"sec":[{"id":"path-ischemia-infarct","title":"Ischemia and infarction","key":["Ischemia: deficient arterial blood supply due to partial or complete occlusion of the artery; acute (sudden complete) or chronic (gradual partial).","Organs with good collateral circulation show no effect; poor collateral circulation leads to infarction (acute) or chronic ischemic changes.","Infarct: an area of ischemic necrosis from occlusion of the arterial supply or venous drainage; 99% from thrombosis or embolism.","Red infarct: venous occlusion (ovary), loose tissue (lung), dual circulation (lung, liver, small intestine), reperfusion after angioplasty.","White infarct: arterial occlusion in solid organs with end-arterial circulation (heart, spleen, kidney); tissue density limits seepage of blood."]}]},"path-virchow":{"title":"Thrombosis and Virchow's triad","unit":"Pathology","points":["Thrombosis: formation of a compact mass of circulating blood elements inside the cardiovascular system during life.","Virchow's triad: endothelial injury/dysfunction, alterations in blood flow (stasis or turbulence), hypercoagulability.","Endothelial dysfunction increases procoagulants (thromboplastin, vWF, PAI) and decreases anticoagulants (thrombomodulin, antithrombin III, NO, PA).","Stasis reduces inflow of fresh blood containing natural anticoagulants and retards removal of small platelet aggregates.","Acquired hypercoagulability: prolonged bed rest, surgery, burns, pregnancy, oral contraceptives, disseminated cancer, smoking, DIC. Hereditary: factor V and prothrombin gene mutations, antithrombin III deficiency."],"source":"Pathology L2 slides (hemodynamic disorders II)","items":["q14","q15","q16","q17","q54"],"sec":[{"id":"path-virchow","title":"Thrombosis and Virchow's triad","key":["Thrombosis: formation of a compact mass of circulating blood elements inside the cardiovascular system during life.","Virchow's triad: endothelial injury/dysfunction, alterations in blood flow (stasis or turbulence), hypercoagulability.","Endothelial dysfunction increases procoagulants (thromboplastin, vWF, PAI) and decreases anticoagulants (thrombomodulin, antithrombin III, NO, PA).","Stasis reduces inflow of fresh blood containing natural anticoagulants and retards removal of small platelet aggregates.","Acquired hypercoagulability: prolonged bed rest, surgery, burns, pregnancy, oral contraceptives, disseminated cancer, smoking, DIC. Hereditary: factor V and prothrombin gene mutations, antithrombin III deficiency."]}]},"path-thrombus-types":{"title":"Sites, types and fate of thrombi","unit":"Pathology","points":["Venous thrombi (phlebothrombosis, red thrombi) are the most common type, associated with stasis and hypercoagulability.","DVT sites: popliteal, femoral and iliac veins; complication: embolism to the lungs (pulmonary infarction).","Arterial thrombosis is less common because of rapid flow and the thick elastic arterial wall; most common cause is atherosclerosis (coronary, cerebral, femoral).","Cardiac thrombi: auricular thrombus in the left atrium in mitral stenosis; mural thrombus in the left ventricle over an infarct; vegetations on valves.","Fate: dissolution, propagation (a tail liable to detach), embolization, organization and recanalization."],"source":"Pathology L2 slides (hemodynamic disorders II)","items":["q18","q19","q20","q21","q22"],"sec":[{"id":"path-thrombus-types","title":"Sites, types and fate of thrombi","key":["Venous thrombi (phlebothrombosis, red thrombi) are the most common type, associated with stasis and hypercoagulability.","DVT sites: popliteal, femoral and iliac veins; complication: embolism to the lungs (pulmonary infarction).","Arterial thrombosis is less common because of rapid flow and the thick elastic arterial wall; most common cause is atherosclerosis (coronary, cerebral, femoral).","Cardiac thrombi: auricular thrombus in the left atrium in mitral stenosis; mural thrombus in the left ventricle over an infarct; vegetations on valves.","Fate: dissolution, propagation (a tail liable to detach), embolization, organization and recanalization."]}]},"path-embolism":{"title":"Embolism and pulmonary embolism","unit":"Pathology","points":["An embolus is a detached intravascular solid, liquid or gaseous mass carried by the blood to a site distant from its origin.","Thromboemboli are the most common type (99%); others: fat, parasitic, air or nitrogen, amniotic fluid, tumor, cholesterol and foreign body emboli.","Pulmonary emboli: 95% originate from deep vein thrombi of the legs; seen in up to 25-30% of DVT patients; 60-80% are small and silent.","Saddle embolus causes sudden death (acute right failure); medium emboli give hemorrhage in a normal lung or infarction in a congested lung; small repeated emboli give pulmonary hypertension and cor pulmonale."],"source":"Pathology L2 slides (hemodynamic disorders II)","items":["q23","q24","q25","q55"],"sec":[{"id":"path-embolism","title":"Embolism and pulmonary embolism","key":["An embolus is a detached intravascular solid, liquid or gaseous mass carried by the blood to a site distant from its origin.","Thromboemboli are the most common type (99%); others: fat, parasitic, air or nitrogen, amniotic fluid, tumor, cholesterol and foreign body emboli.","Pulmonary emboli: 95% originate from deep vein thrombi of the legs; seen in up to 25-30% of DVT patients; 60-80% are small and silent.","Saddle embolus causes sudden death (acute right failure); medium emboli give hemorrhage in a normal lung or infarction in a congested lung; small repeated emboli give pulmonary hypertension and cor pulmonale."]}]},"path-systemic-emboli":{"title":"Systemic, fat, air and amniotic fluid emboli","unit":"Pathology","points":["Systemic emboli: 80% from intracardiac thrombi (2/3 left ventricular wall infarcts, 1/3 dilated left atria or vegetations); also aortic aneurysm, ulcerated plaques, paradoxical emboli.","Paradoxical emboli start as venous emboli but pass through an interatrial or interventricular defect into the systemic circulation.","Site of arrest: 75% lower extremities, 10% brain.","Fat embolism: long bone fracture is the most common cause; the syndrome begins 1-3 days after injury with tachypnea, dyspnea, tachycardia, neurologic symptoms, thrombocytopenia and anemia.","Air embolism needs more than 100 cc of air for a pulmonary effect; causes include neck vein injury, chest wall injury, obstetric or laparoscopic procedures, bypass surgery and decompression sickness.","Amniotic fluid embolism: 1 in 40,000 deliveries, mortality 80%; sudden dyspnea, cyanosis, shock, seizures, pulmonary edema and DIC."],"source":"Pathology L2 slides (hemodynamic disorders II)","items":["q26","q27","q28","q29","q30","q31","q56","q57","q58","q59"],"sec":[{"id":"path-systemic-emboli","title":"Systemic, fat, air and amniotic fluid emboli","key":["Systemic emboli: 80% from intracardiac thrombi (2/3 left ventricular wall infarcts, 1/3 dilated left atria or vegetations); also aortic aneurysm, ulcerated plaques, paradoxical emboli.","Paradoxical emboli start as venous emboli but pass through an interatrial or interventricular defect into the systemic circulation.","Site of arrest: 75% lower extremities, 10% brain.","Fat embolism: long bone fracture is the most common cause; the syndrome begins 1-3 days after injury with tachypnea, dyspnea, tachycardia, neurologic symptoms, thrombocytopenia and anemia.","Air embolism needs more than 100 cc of air for a pulmonary effect; causes include neck vein injury, chest wall injury, obstetric or laparoscopic procedures, bypass surgery and decompression sickness.","Amniotic fluid embolism: 1 in 40,000 deliveries, mortality 80%; sudden dyspnea, cyanosis, shock, seizures, pulmonary edema and DIC."]}]},"path-arf":{"title":"Acute rheumatic fever: pathogenesis and lesions","unit":"Pathology","points":["ARF is an acute, immunologically mediated, multisystem inflammatory disease a few weeks after group A streptococcal pharyngitis.","It appears 10 days to 6 weeks after pharyngitis, in about 3% of infected patients, most often in children aged 5-15.","Antibodies and CD4+ T cells against streptococcal M proteins cross-react with self antigens in the heart.","Aschoff bodies are pathognomonic: focal necrosis, T lymphocytes and Anitschkow (caterpillar) cells with a slender wavy ribbon of chromatin.","Pancarditis: fibrinous \"bread and butter\" pericarditis, myocarditis, and small vegetations along the lines of closure over fibrinoid necrosis (mitral 65%, aortic 25%)."],"source":"Pathology L3 slides (rheumatic fever)","items":["q32","q33","q34","q35","q36","q37","q38","q61","q62"],"sec":[{"id":"path-arf","title":"Acute rheumatic fever: pathogenesis and lesions","key":["ARF is an acute, immunologically mediated, multisystem inflammatory disease a few weeks after group A streptococcal pharyngitis.","It appears 10 days to 6 weeks after pharyngitis, in about 3% of infected patients, most often in children aged 5-15.","Antibodies and CD4+ T cells against streptococcal M proteins cross-react with self antigens in the heart.","Aschoff bodies are pathognomonic: focal necrosis, T lymphocytes and Anitschkow (caterpillar) cells with a slender wavy ribbon of chromatin.","Pancarditis: fibrinous \"bread and butter\" pericarditis, myocarditis, and small vegetations along the lines of closure over fibrinoid necrosis (mitral 65%, aortic 25%)."]}]},"path-jones":{"title":"Jones criteria","unit":"Pathology","points":["Major: carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum, subcutaneous nodules.","Minor: fever, arthralgia, previous rheumatic fever, raised ESR, CRP or leukocytosis, prolonged PR interval.","Evidence of preceding group A strep: positive throat culture or rapid antigen test, or raised or rising streptococcal antibody titer.","Diagnosis: 2 major, or 1 major and 2 minor, supported by evidence of preceding group A streptococcal infection.","Migratory polyarthritis of large joints is self-limited with no chronic deformities."],"source":"Pathology L3 slides (rheumatic fever)","items":["q39","q40","q41","q60"],"sec":[{"id":"path-jones","title":"Jones criteria","key":["Major: carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum, subcutaneous nodules.","Minor: fever, arthralgia, previous rheumatic fever, raised ESR, CRP or leukocytosis, prolonged PR interval.","Evidence of preceding group A strep: positive throat culture or rapid antigen test, or raised or rising streptococcal antibody titer.","Diagnosis: 2 major, or 1 major and 2 minor, supported by evidence of preceding group A streptococcal infection.","Migratory polyarthritis of large joints is self-limited with no chronic deformities."]}]},"path-rhd":{"title":"Chronic rheumatic heart disease and mitral stenosis","unit":"Pathology","points":["Endocarditis of ARF heals by fibrosis; repeated pharyngeal infections reactivate the disease and scar the valves.","Mitral valve most commonly affected, then aortic; fibrosis of the leaflets leads to stenosis (\"fish mouth\" or \"buttonhole\").","Usually becomes clinically manifest decades after ARF.","Mitral stenosis: left atrial dilatation (with thrombi), chronic pulmonary venous congestion, lung fibrosis, pulmonary hypertension, chronic right-sided failure; the left ventricle is largely unaffected.","Other complications: arrhythmias (especially atrial fibrillation), thromboembolism, infective endocarditis."],"source":"Pathology L3 slides (rheumatic fever)","items":["q42","q43","q63","q64","q65","q66","q67"],"sec":[{"id":"path-rhd","title":"Chronic rheumatic heart disease and mitral stenosis","key":["Endocarditis of ARF heals by fibrosis; repeated pharyngeal infections reactivate the disease and scar the valves.","Mitral valve most commonly affected, then aortic; fibrosis of the leaflets leads to stenosis (\"fish mouth\" or \"buttonhole\").","Usually becomes clinically manifest decades after ARF.","Mitral stenosis: left atrial dilatation (with thrombi), chronic pulmonary venous congestion, lung fibrosis, pulmonary hypertension, chronic right-sided failure; the left ventricle is largely unaffected.","Other complications: arrhythmias (especially atrial fibrillation), thromboembolism, infective endocarditis."]}]},"path-arteriosclerosis":{"title":"Arteriosclerosis patterns","unit":"Pathology","points":["Arteriosclerosis: thickening and loss of elasticity of arterial walls (\"hardening of the arteries\").","Atherosclerosis: the most frequent and important pattern.","Mönckeberg medial sclerosis: calcific deposits in muscular arteries in people older than 50.","Arteriolosclerosis: small arteries and arterioles, with hypertension and diabetes; hyaline (amorphous proteinaceous wall) and hyperplastic (\"onion-skinning\")."],"source":"Pathology L4 slides (atherosclerosis)","items":["q44","q45","q79"],"sec":[{"id":"path-arteriosclerosis","title":"Arteriosclerosis patterns","key":["Arteriosclerosis: thickening and loss of elasticity of arterial walls (\"hardening of the arteries\").","Atheroscleros <script>
/* drill-core.js — pure drill logic (no DOM). Inlined into the drill page by
 * build-drill.py and loaded by simulate.js, so the simulations test the exact
 * code the page runs.
 *
 * Progress state S (saved in localStorage and synced to the account):
 *   seq        global answer counter (rest periods are counted in answers)
 *   p[id]      {h: recent results, ls: seq at last answer, lt: time, sid: session,
 *               t: last change, n: answers, sc: last full-question score 0..1,
 *               lp: last answer position (string)}
 *              h characters: R right, W wrong, P partly right, G right but guessed,
 *              r / w single-row practice right / wrong (r never counts toward solid)
 *   stars[id]  {on: 0|1, t}
 *   miss[]     {q, lab, t}  every wrong pick (misconception label when one exists)
 *   lastSid    id of the most recent session started
 */
(function (root) {
  'use strict';
  var H18 = 18 * 3600 * 1000;

  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function shuffle(a, r) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

  function newState() {
    return { v: 1, seq: 0, p: {}, stars: {}, miss: [], pre: { last: null }, tsec: { s: 0, n: 0 },
             lc: {}, ll: -1, lastSid: null, sidN: 0, t: 0 };
  }

  /* ------------------------------------------------------------ data context */
  function makeCtx(DATA) {
    var D = { cfg: DATA.cfg, items: DATA.items, concepts: DATA.concepts || {}, byId: {}, hiUnits: {} };
    DATA.items.forEach(function (it) { D.byId[it.id] = it; });
    (DATA.cfg.high_roi_units || []).forEach(function (u) { D.hiUnits[u] = 1; });
    return D;
  }
  // a question id is "q12" or a single-row variant "q12r3"
  function parseId(qid) {
    var m = /^(q\d+)(?:r(\d+))?$/.exec(qid);
    return m ? { base: m[1], row: m[2] === undefined ? -1 : +m[2] } : { base: qid, row: -1 };
  }
  function itemOf(D, qid) {
    var p = parseId(qid), it = D.byId[p.base];
    if (!it || p.row < 0) return it;
    return { id: qid, base: it.id, row: p.row, u: it.u, t: 'row', k: it.k, lp: it.lp, src: it.src, kind: it.kind,
             q: it.rs[p.row], o: it.o.choices, c: it.c[p.row], w: it.w, x: it.x, m: it.m, parent: it };
  }

  /* ------------------------------------------------------------ status */
  function eff(h) { return (h || '').replace(/r/g, '').replace(/w/g, 'W'); }
  function status(it, rec) {
    if (!rec) return 'new';
    var e = eff(rec.h);
    if (!e) return 'new';
    var last = e.charAt(e.length - 1);
    if (last !== 'R') return 'shaky';
    var need = it.t === 'tf' ? 3 : 2;
    return e.slice(-need) === new Array(need + 1).join('R') ? 'solid' : 'once';
  }
  function trailingMiss(rec) {
    var e = eff(rec && rec.h), n = 0;
    for (var i = e.length - 1; i >= 0 && (e[i] === 'W' || e[i] === 'P'); i--) n++;
    return n;
  }
  function lastIsMiss(rec) { var e = eff(rec && rec.h); var c = e.charAt(e.length - 1); return c === 'W' || c === 'P' || c === 'G'; }
  function isStar(S, id) { var s = S.stars[id]; return !!(s && s.on); }
  function isHi(D, S, it) { return isStar(S, it.id) || !!it.lp || !!D.hiUnits[it.u]; }

  function restLen(D, S, it, rec, n) {
    var e = eff(rec.h), last = e.charAt(e.length - 1);
    if (last === 'W' || last === 'P') {
      return trailingMiss(rec) >= 2 ? clamp(Math.round(0.10 * n), 6, 25) : clamp(Math.round(0.25 * n), 10, 60);
    }
    if (last === 'G') return clamp(Math.round(0.25 * n), 10, 60);
    var b = clamp(Math.round(0.7 * n), 12, 300);
    if (status(it, rec) === 'solid') b = Math.round(b * 1.5);
    if (isHi(D, S, it)) b = clamp(Math.round(0.4 * b), 8, 120);
    return b;
  }
  function isRested(D, S, it, n, now) {
    var rec = S.p[it.id];
    if (!rec || !eff(rec.h)) return true;
    if (now - rec.lt >= H18) return true;
    return (S.seq - rec.ls) >= restLen(D, S, it, rec, n);
  }
  // answered in the previous session and not allowed back yet
  function prevBlocked(D, S, it) {
    var rec = S.p[it.id], blk = S._block !== undefined ? S._block : S.lastSid;
    if (!rec || !blk || rec.sid !== blk) return false;
    return !(isHi(D, S, it) || trailingMiss(rec) >= 2);
  }

  /* ------------------------------------------------------------ pools */
  function unitItems(D, units) {
    var set = {}; units.forEach(function (u) { set[u] = 1; });
    return D.items.filter(function (it) { return set[it.u]; });
  }
  var FILTERS = {
    missed: function (D, S, it) { return status(it, S.p[it.id]) === 'shaky'; },
    starred: function (D, S, it) { return isStar(S, it.id); },
    lp: function (D, S, it) { return !!it.lp; },
    never: function (D, S, it) { return status(it, S.p[it.id]) === 'new'; }
  };
  function pool(D, S, units, filters, overlap) {
    var base = unitItems(D, units), act = Object.keys(FILTERS).filter(function (f) { return filters && filters[f]; });
    if (!act.length) return base.map(function (it) { return it.id; });
    return base.filter(function (it) {
      var hits = act.map(function (f) { return FILTERS[f](D, S, it); });
      return overlap ? hits.every(Boolean) : hits.some(Boolean);
    }).map(function (it) { return it.id; });
  }
  function filterCounts(D, S, units) {
    var base = unitItems(D, units), out = {};
    Object.keys(FILTERS).forEach(function (f) { out[f] = base.filter(function (it) { return FILTERS[f](D, S, it); }).length; });
    return out;
  }

  /* ------------------------------------------------------------ sequencing */
  function tfTruth(it) { return it.t === 'tf' ? (it.c === 0) : null; }
  function tfOK(it, tfh) {
    if (it.t !== 'tf') return true;
    var v = tfTruth(it), n = tfh.length;
    return !(n >= 2 && tfh[n - 1] === v && tfh[n - 2] === v);
  }
  // Order a list so the same topic never comes twice in a row when that is
  // possible, the same format is avoided, and no 3 identical true/false answers
  // run together (three true/false questions back to back with the same answer;
  // any other question in between breaks the run). prev = {u, t, tfh} carries
  // the state across a session; tfh holds true/false/null for the last questions.
  function arrangeSeq(D, ids, r, prev) {
    prev = prev || {};
    var groups = {}, order = [], total = ids.length;
    ids.forEach(function (id) { var it = itemOf(D, id); (groups[it.u] = groups[it.u] || []).push(id); });
    Object.keys(groups).forEach(function (u) { shuffle(groups[u], r); });
    var lastU = prev.u, lastT = prev.t, tfh = (prev.tfh || []).slice(), out = [];
    while (total > 0) {
      var units = Object.keys(groups).filter(function (u) { return groups[u].length; });
      var cand = units.filter(function (u) { return u !== lastU; });
      if (!cand.length) cand = units;
      var maxU = cand[0];
      cand.forEach(function (u) { if (groups[u].length > groups[maxU].length) maxU = u; });
      var pick;
      if (groups[maxU].length * 2 >= total) pick = maxU;
      else {
        var sum = 0; cand.forEach(function (u) { sum += groups[u].length; });
        var x = r() * sum; pick = cand[cand.length - 1];
        for (var i = 0; i < cand.length; i++) { x -= groups[cand[i]].length; if (x < 0) { pick = cand[i]; break; } }
      }
      var hasOK = function (u) { return groups[u].some(function (q) { return tfOK(itemOf(D, q), tfh); }); };
      if (!hasOK(pick)) {
        var alt = cand.filter(hasOK);
        if (!alt.length) alt = units.filter(function (u) { return u !== lastU && hasOK(u); });
        if (alt.length && !(groups[pick].length * 2 > total + 1)) pick = alt[Math.floor(r() * alt.length)];
      }
      var g = groups[pick], j = -1;
      for (var k = 0; k < g.length && j < 0; k++) { var a = itemOf(D, g[k]); if (a.t !== lastT && tfOK(a, tfh)) j = k; }
      for (k = 0; k < g.length && j < 0; k++) { if (tfOK(itemOf(D, g[k]), tfh)) j = k; }
      if (j < 0) j = 0;
      var id = g.splice(j, 1)[0], it = itemOf(D, id);
      out.push(id); total--; lastU = it.u; lastT = it.t;
      tfh.push(tfTruth(it));
    }
    return repairTF(D, out, prev);
  }
  // Moves a true/false item that would make 3 identical answers in a row to the
  // earliest place where it breaks no rule (true/false runs, topic adjacency).
  function tfBad(D, seq, tfh0) {
    var tfh = tfh0.slice();
    for (var i = 0; i < seq.length; i++) {
      var z = itemOf(D, seq[i]);
      if (!tfOK(z, tfh)) return i;
      tfh.push(tfTruth(z));
    }
    return -1;
  }
  function adj(D, seq, prevU) {
    var n = 0, last = prevU;
    seq.forEach(function (q) { var u = itemOf(D, q).u; if (u === last) n++; last = u; });
    return n;
  }
  function repairTF(D, seq, prev) {
    var tfh0 = (prev && prev.tfh) || [], guard = 0, i;
    while ((i = tfBad(D, seq, tfh0)) >= 0 && guard++ < 50) {
      var base = adj(D, seq, prev && prev.u), done = false;
      for (var slack = 0; slack <= 2 && !done; slack++) {
        for (var k = 0; k < seq.length && !done; k++) {
          if (k === i) continue;
          var t = seq.slice(), x = t.splice(i, 1)[0];
          t.splice(k, 0, x);
          var b = tfBad(D, t, tfh0);
          if ((b < 0 || b > i) && adj(D, t, prev && prev.u) <= base + slack) { seq = t; done = true; }
        }
      }
      if (!done) break;
    }
    return seq;
  }

  function info(D, S, it, n, now) {
    var rec = S.p[it.id], st = status(it, rec);
    return { id: it.id, it: it, rec: rec, st: st, hi: isHi(D, S, it), rested: isRested(D, S, it, n, now),
             blocked: prevBlocked(D, S, it), miss: !!rec && st === 'shaky', cons: trailingMiss(rec) >= 2,
             lt: rec ? rec.lt : 0 };
  }

  /* limited session: up to 1/4 rested misses, up to 1/5 rested review checks,
     then never answered (high ROI first-ish), then more rested, then recent. */
  function buildLimited(D, S, ids, N, nTopic, r, now) {
    var all = ids.map(function (id) { return info(D, S, D.byId[id], nTopic, now); });
    var elig = all.filter(function (x) { return !x.blocked; });
    var taken = {}, pick = [], counts = { miss: 0, review: 0, fresh: 0, more: 0, recent: 0, prev: 0 };
    function take(list, max, key) {
      for (var i = 0; i < list.length && max > 0 && pick.length < N; i++) {
        var x = list[i]; if (taken[x.id]) continue;
        taken[x.id] = 1; pick.push(x.id); counts[key]++; max--;
      }
    }
    var misses = elig.filter(function (x) { return x.miss && x.rested; })
      .sort(function (a, b) { return (b.cons - a.cons) || (a.lt - b.lt); });
    var rights = elig.filter(function (x) { return x.rec && !x.miss && x.st !== 'new' && x.rested; })
      .sort(function (a, b) { return (b.hi - a.hi) || (a.lt - b.lt); });
    var fresh = shuffle(elig.filter(function (x) { return x.st === 'new'; }), r)
      .map(function (x) { return { x: x, k: r() - (x.hi ? 0.5 : 0) }; })
      .sort(function (a, b) { return a.k - b.k; }).map(function (o) { return o.x; });
    take(misses, Math.floor(N / 4), 'miss');
    take(rights, Math.floor(N / 5), 'review');
    take(fresh, N, 'fresh');
    take(misses.concat(rights).sort(function (a, b) { return a.lt - b.lt; }), N, 'more');
    var note = null;
    if (pick.length < N) {
      var recent = elig.filter(function (x) { return !taken[x.id]; }).sort(function (a, b) { return a.lt - b.lt; });
      if (recent.length) { take(recent, N, 'recent'); note = 'recent'; }
    }
    if (pick.length < N) {
      var blocked = all.filter(function (x) { return x.blocked && !taken[x.id]; }).sort(function (a, b) { return a.lt - b.lt; });
      if (blocked.length) { take(blocked, N, 'prev'); note = 'prev'; }
    }
    return { ids: arrangeSeq(D, pick, r, { tfh: S.tfh || [] }), counts: counts, note: note };
  }

  function nextEndless(D, S, ids, nTopic, r, now, recent, prev) {
    prev = prev || {};
    var rec5 = {}; (recent || []).slice(-5).forEach(function (q) { rec5[parseId(q).base] = 1; });
    var all = ids.map(function (id) { return info(D, S, D.byId[id], nTopic, now); })
      .filter(function (x) { return !rec5[x.id]; });
    var cand = all.filter(function (x) { return x.rested && !x.blocked; });
    if (!cand.length) cand = all.slice().sort(function (a, b) { return a.lt - b.lt; }).slice(0, 10);
    if (!cand.length) return null;
    var tfh = prev.tfh || [], ws = cand.map(function (x) {
      var w = (x.miss ? 3 : 1) * (x.hi ? 1.5 : 1);
      if (x.it.u === prev.u) w *= 0.15;
      if (x.it.t === prev.t) w *= 0.4;
      if (!tfOK(x.it, tfh)) w *= 0.02;
      return w;
    });
    var sum = ws.reduce(function (a, b) { return a + b; }, 0), y = r() * sum;
    for (var i = 0; i < cand.length; i++) { y -= ws[i]; if (y < 0) return cand[i].id; }
    return cand[cand.length - 1].id;
  }

  var ST_RANK = { shaky: 0, 'new': 1, once: 2, solid: 3 };
  function buildLastPass(D, S, only20, r) {
    var lp = D.items.filter(function (it) { return it.lp; });
    var groups = [[], [], [], []];
    lp.forEach(function (it) { groups[ST_RANK[status(it, S.p[it.id])]].push(it.id); });
    var out = [], prev = { tfh: S.tfh || [] };
    groups.forEach(function (g) {
      var s = arrangeSeq(D, g, r, prev);
      out = out.concat(s);
      var tfh = prev.tfh.slice();
      s.forEach(function (q) { tfh.push(tfTruth(itemOf(D, q))); });
      if (s.length) { var it = itemOf(D, s[s.length - 1]); prev = { u: it.u, t: it.t, tfh: tfh }; }
    });
    return only20 ? out.slice(0, 20) : out;
  }
  function statusCounts(D, S, ids) {
    var c = { solid: 0, once: 0, shaky: 0, 'new': 0 };
    ids.forEach(function (id) { var it = D.byId[id]; c[status(it, S.p[id])]++; });
    return c;
  }

  /* ------------------------------------------------------------ levels and pre-test */
  function lastScore(rec) {
    var e = eff(rec && rec.h); if (!e) return null;
    var c = e.charAt(e.length - 1);
    if (c === 'R' || c === 'G') return 1;
    if (c === 'P') return typeof rec.sc === 'number' ? rec.sc : 0.5;
    return 0;
  }
  function topicLevels(D, S) {
    var out = {};
    D.cfg.units.forEach(function (u) {
      var sc = [];
      D.items.forEach(function (it) { if (it.u === u) { var s = lastScore(S.p[it.id]); if (s !== null) sc.push(s); } });
      if (!sc.length) { out[u] = { pct: null, n: 0, level: null }; return; }
      var pct = Math.round(100 * sc.reduce(function (a, b) { return a + b; }, 0) / sc.length);
      out[u] = { pct: pct, n: sc.length, level: pct >= 80 ? 'Strong' : pct >= 60 ? 'Okay' : 'Weak' };
    });
    return out;
  }
  function buildPretest(D, S, r) {
    var units = D.cfg.units.slice(), k = D.cfg.pretest_per_topic || (units.length > 10 ? 2 : 3);
    var hasStar = {}; D.items.forEach(function (it) { if (isStar(S, it.id)) hasStar[it.u] = 1; });
    units.sort(function (a, b) {
      return ((D.hiUnits[b] ? 2 : 0) + (hasStar[b] ? 1 : 0)) - ((D.hiUnits[a] ? 2 : 0) + (hasStar[a] ? 1 : 0))
        || D.cfg.units.indexOf(a) - D.cfg.units.indexOf(b);
    });
    var picks = {};
    units.forEach(function (u) {
      var cand = shuffle(D.items.filter(function (it) { return it.u === u && !it.lp; }), r)

      var per = {}; t.ids.forEach(function (q) { var u = it(q).u; if (t.weak.indexOf(u) >= 0) per[u] = (per[u] || 0) + 1; });

        t.mix.weak + ' from your weakest topics (' + t.weak.map(function (u) { return u + ' ' + (per[u] || 0); }).join(', ') + '), ' +

    header({});
    app.innerHTML = document.getElementById('readme-src').innerHTML +
      (CFG.guide_url ? '<p><a class="btn small ghost" href="' + esc(CFG.guide_url) + '" target="_blank" rel="noopener">Open the Mastery Guide</a></p>' : '');
  }

  /* ------------------------------------------------------------ events */
  var resetArmed = 0;
  function toggleStar() {
    var cur = SESS && SESS.cur; if (!cur || cur.card) return;
    var id = Core.parseId(cur.q).base, on = !Core.isStar(S, id);
    S.stars[id] = { on: on ? 1 : 0, t: now() }; dirtyStars[id] = 1; saveLocal(); push(false);
    var b = document.querySelector('[data-act="star"]'); if (b) { b.textContent = on ? '★ Starred' : '☆ Star'; b.setAttribute('aria-pressed', on); }
  }
  function doReset() {
    var b = document.getElementById('reset');
    if (!resetArmed || now() - resetArmed > 6000) {
      resetArmed = now(); if (b) { b.classList.add('armed'); b.textContent = 'Tap again to erase all progress (stars are kept)'; }
      return;
    }
    resetArmed = 0;
    var stars = S.stars; S = Core.newState(); S.stars = stars; SESS = null; LASTRES = null; lsSet('lastres', null);
    saveLocal(); push(true); go('main');
  }
  app.addEventListener('click', onClick); hb.addEventListener('click', onClick);
  function onClick(e) {
    var t = e.target.closest('[data-act],[data-opt],[data-step],[data-slot],[data-len]');
    if (!t) return;
    if (t.hasAttribute('data-opt')) return pickOption(+t.getAttribute('data-opt'));
    if (t.hasAttribute('data-step')) { var cur = SESS.cur; if (!cur.checked && cur.pick.indexOf(+t.getAttribute('data-step')) < 0) { cur.pick.push(+t.getAttribute('data-step')); refreshAnswer(); } return; }
    if (t.hasAttribute('data-slot')) { var c2 = SESS.cur, i = +t.getAttribute('data-slot'); if (!c2.checked && c2.pick[i] !== undefined) { c2.pick.splice(i, 1); refreshAnswer(); } return; }
    if (t.hasAttribute('data-len')) { UI.len = t.getAttribute('data-len'); saveLocal(); return renderMain(); }
    var a = t.getAttribute('data-act');
    if (a === 'overlap' || a === 'think') return;
    if (a !== 'reset') { resetArmed = 0; }
    switch (a) {
      case 'home': clearInterval(clockTimer); if (SESS) { saveLocal(); push(false); } return go('main');
      case 'readme': return go('readme');
      case 'fix': return go('fix');
      case 'resume': return go('q');
      case 'fresh': SESS = null; saveLocal(); push(false); return renderMain();
      case 'pretest': return startPretest();
      case 'lp': return startLastPass(false);
      case 'lp20': return startLastPass(true);
      case 'uall': UI.units = UNITS.slice(); saveLocal(); return renderMain();
      case 'unone': UI.units = []; saveLocal(); return renderMain();
      case 'start': return startFromSetup();
      case 'reset': return doReset();
      case 'check': return doCheck();
      case 'next': return doNext(false);
      case 'guessed': return doNext(true);
      case 'star': return toggleStar();
      case 'timer': UI.think = !UI.think; saveLocal(); t.textContent = 'Timer: ' + (UI.think ? 'on' : 'off'); if (!UI.think && SESS.cur && !SESS.cur.revealed) reveal(); return;
      case 'sofar': return go('review');
      case 'submit': return go('submit');
      case 'backq': return go('q');
      case 'backres': return go('results');
      case 'dosubmit': return finish();
      case 'viewans': return go('review');
      case 'again':
        if (LASTRES && (LASTRES.mode === 'lastpass' || LASTRES.mode === 'lp20')) return startLastPass(LASTRES.mode === 'lp20');
        if (LASTRES && LASTRES.mode === 'pretest') return startPretest();
        return startFromSetup();
      case 'weakdrill': UI.units = t.getAttribute('data-units').split('|'); UI.filters = {}; UI.len = '20'; saveLocal(); return startFromSetup();
      case 'fixall': return startFix(Object.keys((function () { var o = {}; D.items.forEach(function (x) { if (x.k && Core.status(x, S.p[x.id]) === 'shaky') o[x.k] = 1; }); return o; })()).slice(0, 15));
      case 'fixone': return startFix([t.getAttribute('data-cid')]);
      case 'cardnext': SESS.pos++; SESS.cur = null; saveLocal(); push(false); if (SESS.pos >= SESS.queue.length) return finish(); return go('q');
    }
  }
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-unit')) {
      var u = t.getAttribute('data-unit'), i = UI.units.indexOf(u);
      if (t.checked && i < 0) UI.units.push(u); if (!t.checked && i >= 0) UI.units.splice(i, 1);
      UI.units.sort(function (a, b) { return UNITS.indexOf(a) - UNITS.indexOf(b); });
      saveLocal(); var y = window.pageYOffset; renderMain(); window.scrollTo(0, y); return;
    }
    if (t.hasAttribute('data-filter')) { UI.filters[t.getAttribute('data-filter')] = t.checked; saveLocal(); var y2 = window.pageYOffset; renderMain(); window.scrollTo(0, y2); return; }
    var a = t.getAttribute('data-act');
    if (a === 'overlap') { UI.overlap = t.checked; saveLocal(); document.getElementById('desc').textContent = describe(); return; }
    if (a === 'think') { UI.think = t.checked; saveLocal(); return; }
    if (t.id === 'custom') { UI.custom = Math.max(5, Math.min(500, +t.value || 25)); t.value = UI.custom; saveLocal(); document.getElementById('desc').textContent = describe(); return; }
    if (t.hasAttribute('data-row') && SESS && SESS.cur) { SESS.cur.pick[+t.getAttribute('data-row')] = +t.value; saveLocal(); drawActions(); return; }
    if (t.hasAttribute('data-blank') && SESS && SESS.cur) { SESS.cur.pick[+t.getAttribute('data-blank')] = +t.value; saveLocal(); drawActions(); return; }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'numin' && SESS && SESS.cur) { SESS.cur.pick = e.target.value; saveLocal(); drawActions(); }
  });
  document.addEventListener('keydown', function (e) {
    if (screen !== 'q' || !SESS || !SESS.cur || e.metaKey || e.ctrlKey || e.altKey) return;
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA');
    var cur = SESS.cur;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (cur.card) return onClick({ target: document.querySelector('[data-act="cardnext"]') });
      return cur.checked ? doNext(false) : doCheck();
    }
    if (typing || cur.card) return;
    if (/^[1-6]$/.test(e.key)) { pickOption(+e.key - 1); return; }
    if (e.key === 's' || e.key === 'S') return toggleStar();
    if ((e.key === 'g' || e.key === 'G') && cur.checked && cur.res && cur.res.full) return doNext(true);
  });

  /* ------------------------------------------------------------ boot */
  if (SESS && SESS.cur && SESS.cur.checked === 'done') { SESS.pos++; SESS.cur = null; }
  render();
  initSync();
})();
</script>
