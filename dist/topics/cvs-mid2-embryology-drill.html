  <h2>Read me</h2>
  <p>This exam has two pages that work as one system: the <b>Drill</b> finds what you do not know and proves when you do, and the <b>Mastery Guide</b> teaches it again. Every fact on a Fix my misses card in the Drill is in the Guide section it links to.</p>

  <h3>How to use the Drill</h3>
  <ol>
    <li><b>Start with the pre-test.</b> It asks 3 questions from every topic and gives each topic a level: Strong (80% and up), Okay (60-79%) or Weak (under 60%). It never uses last-pass questions, so those stay fresh.</li>
    <li><b>Think first.</b> Each question appears without its choices for 10-15 seconds. Answer it in your head before the choices show up. Turn the timer off on any question if you need to.</li>
    <li><b>Be honest after a right answer.</b> Choose "Knew it" or "I guessed" (key G). A guess comes back sooner.</li>
    <li><b>Read the "why" on every miss.</b> You get why your pick is wrong, the key idea and the concept card. A different question on the same concept follows 3-6 questions later.</li>
    <li><b>Use short daily sessions.</b> Pick 20 questions or a 30-minute timed plan. Questions you just answered rest before they come back, so each session is new work.</li>
    <li><b>Finish with the last pass.</b> It asks every question from the cases asked in class, the slide exercises and the facts flagged on slides, shakiest first.</li>
  </ol>
  <p class="small">Keys: 1-6 pick an option, Enter checks and moves on, S stars, G marks a guess. Progress saves on this device and, inside claude.ai, to your account so your phone, tablet and laptop share it.</p>

  <h3>How to use the Mastery Guide</h3>
  <ol>
    <li>Read a section in order: how it works, what to do first, the client example, the common trap and the memory trick.</li>
    <li>Cover the page and tap each blank in "Test yourself" only after you have said the answer.</li>
    <li>Finish each section by reading the Key ideas box. Those lines are exactly what the Drill's concept cards show.</li>
  </ol>

  <h3>How to use both together</h3>
  <ol>
    <li><b>Drill to find:</b> run the pre-test, then open Fix my misses to see the concepts you keep missing.</li>
    <li><b>Guide to re-learn:</b> follow the card's "Open in the guide" link and study that section.</li>
    <li><b>Drill to prove:</b> come back and press "Fix this". A question counts as solid only after you get it right twice in a row (three times for true/false), with rest between.</li>
  </ol>

rent laryngeal nerves"},"lp":true,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q5","u":"Embryology","t":"tf","q":"A nurse states that the distal part of the right 6th aortic arch degenerates.","o":["True","False"],"c":0,"w":"True. On the right, the proximal 6th arch forms the right pulmonary artery and the distal part degenerates; on the left, the distal part persists as the ductus arteriosus. (Embryology L3 slides (aortic arches))","x":{"1":"This statement is true: the distal right 6th arch degenerates."},"m":{},"lp":false,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q6","u":"Embryology","t":"tf","q":"A nurse states that the 5th aortic arch vessel disappears completely.","o":["True","False"],"c":0,"w":"True. The 5th arch vessel disappears completely; only the 1st and 2nd arches leave small remnants (maxillary and stapedial arteries) among those that regress. (Embryology L3 slides (aortic arches))","x":{"1":"This statement is true: the 5th arch disappears completely."},"m":{},"lp":false,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q7","u":"Embryology","t":"tf","q":"A nurse states that the 2nd aortic arch persists as the maxillary artery.","o":["True","False"],"c":1,"w":"False. The remaining part of the 2nd arch forms the STAPEDIAL artery; the maxillary artery comes from the remaining part of the 1st arch. (Embryology L3 slides (aortic arches))","x":{"0":"The 2nd arch gives the stapedial artery; the 1st gives the maxillary."},"m":{"0":"mixes up the 1st and 2nd arches"},"lp":false,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q8","u":"Embryology","t":"order","q":"A nurse traces the embryological origin of the arch of the aorta. Arrange its parts from proximal to distal by origin.","o":["Aortic sac (up to the brachiocephalic artery)","Left horn of the aortic sac (between brachiocephalic and left common carotid)","Left 4th aortic arch (between left common carotid and left subclavian)","Left dorsal aorta between the 4th and 6th arches (distal arch)"],"c":[0,1,2,3],"w":"The arch of the aorta is built from four sources in sequence: the aortic sac forms the part proximal to the brachiocephalic artery, the left horn of the sac forms the part between the brachiocephalic and left common carotid, the left 4th arch forms the part between the left common carotid and left subclavian, and the left dorsal aorta between the 4th and 6th arches forms the distal part. (Embryology L3 slides (aortic arches))","x":{},"m":{},"lp":false,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q9","u":"Embryology","t":"blanks","q":"A nurse completes an embryology review sheet. The brachiocephalic artery arises from the {1}; the left subclavian artery arises from the left dorsal aorta at the {2}; and the proximal part of the right subclavian artery arises from the {3}.","o":[["right horn of the aortic sac","left horn of the aortic sac","3rd aortic arch"],["attachment of the 7th intersegmental artery","junction of the 3rd and 4th arches","region caudal to the 6th arch"],["right 4th aortic arch","left 4th aortic arch","right 6th aortic arch"]],"c":[0,0,0],"w":"The slide's fill-in questions ask for these origins. The brachiocephalic artery comes from the right horn of the aortic sac. The internal carotids come from the distal 3rd arches plus the dorsal aorta cranial to the 3rd arch. The left subclavian forms from the left dorsal aorta at the attachment of the 7th intersegmental artery. The right subclavian has two parts: proximal from the right 4th arch and distal from the right dorsal aorta at the 7th intersegmental artery. (Embryology L3 slides (aortic arches), slide exercise (??? slide))","x":{"0:1":"The left horn forms the part of the arch between the brachiocephalic and left common carotid.","0:2":"The 3rd arch forms the common and internal carotid arteries.","1:1":"The left dorsal aorta between the 3rd and 4th arches disappears.","1:2":"Caudal to the 6th arch, the left dorsal aorta forms the descending thoracic and abdominal aorta.","2:1":"The left 4th arch forms part of the arch of the aorta.","2:2":"The right 6th arch forms the right pulmonary artery; its distal part degenerates."},"m":{"0:1":"mixes up right and left horns","1:1":"places the subclavian at the 3rd-4th segment","2:1":"mixes up right and left 4th arches"},"lp":true,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q10","u":"Embryology","t":"tf","q":"A nurse states that the left horn of the aortic sac forms the part of the aortic arch between the brachiocephalic and left common carotid arteries.","o":["True","False"],"c":0,"w":"True. The aortic sac forms the arch proximal to the brachiocephalic artery, the left horn forms the part between the brachiocephalic and left common carotid, and the right horn forms the brachiocephalic artery. (Embryology L3 slides (aortic arches))","x":{"1":"This statement is true: the left horn forms that segment of the arch."},"m":{},"lp":false,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q11","u":"Embryology","t":"tf","q":"A nurse states that the right horn of the aortic sac forms the right common carotid artery.","o":["True","False"],"c":1,"w":"False. The right horn of the aortic sac forms the BRACHIOCEPHALIC artery. The common carotid arteries come from the proximal parts of the 3rd arches. (Embryology L3 slides (aortic arches))","x":{"0":"The right horn forms the brachiocephalic artery."},"m":{"0":"mixes up brachiocephalic and carotid origins"},"lp":false,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q12","u":"Embryology","t":"mc","q":"A nurse reviews the fate of the left dorsal aorta caudal to the 6th arch. Which adult vessels does this segment form?","o":["The descending thoracic and abdominal aorta","The distal part of the arch of the aorta","The left subclavian artery","The distal internal carotid artery"],"c":0,"w":"Each segment of the left dorsal aorta has its own fate: cranial to the 3rd arch it forms the distal internal carotid, between the 3rd and 4th arches it disappears, at the 7th intersegmental artery it forms the subclavian, between the 4th and 6th arches it forms the distal arch, and caudal to the 6th arch it forms the descending thoracic and abdominal aorta. The common dorsal aorta forms the abdominal aorta and median sacral artery. (Embryology L3 slides (aortic arches))","x":{"1":"The distal arch comes from the left dorsal aorta BETWEEN the 4th and 6th arches.","2":"The left subclavian forms at the attachment of the 7th intersegmental artery.","3":"The distal internal carotid comes from the dorsal aorta cranial to the 3rd arch."},"m":{"1":"shifts the dorsal aorta segments"},"lp":false,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q13","u":"Embryology","t":"mc","q":"A newborn has a continuous connection between the left pulmonary artery and the arch of the aorta. Which associated conditions should the nurse watch for?","o":["Aortic stenosis, pulmonary stenosis or Fallot's tetralogy","A vascular ring around the trachea and esophagus","Constriction of the aorta distal to the left subclavian","Persistence of the distal right dorsal aorta"],"c":0,"w":"Patent ductus arteriosus means the ductus, formed from the distal left 6th arch, stays open, leaving a duct between the left pulmonary artery and the arch of the aorta. It is associated with other congenital heart disease such as aortic stenosis, pulmonary stenosis and Fallot's tetralogy. (Embryology L3 slides (aortic arches))","x":{"1":"A vascular ring is the feature of a double aortic arch.","2":"That is coarctation of the aorta, a different anomaly.","3":"That is the cause of a double aortic arch."},"m":{"1":"mixes up PDA and double arch"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Apply a fact"},{"id":"q14","u":"Embryology","t":"mc","q":"An infant has noisy breathing and difficulty swallowing feeds, and imaging shows a vascular ring around the trachea and esophagus. Which anomaly should the nurse suspect?","o":["Double arch of the aorta","Right arch of the aorta","Patent ductus arteriosus","Coarctation of the aorta"],"c":0,"w":"A double aortic arch results from persistence of the distal part of the right dorsal aorta, so a second arch joins the left one. The two arches form a vascular ring around the trachea, causing dyspnea, and the esophagus, causing dysphagia. (Embryology L3 slides (aortic arches))","x":{"1":"A right arch forms from the right dorsal aorta and right 4th arch; a ring needs both arches to persist.","2":"PDA is an open duct between the left pulmonary artery and the aortic arch.","3":"Coarctation is a constriction of the aorta distal to the left subclavian."},"m":{"1":"mixes up right arch and double arch"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Recognize and interpret"},{"id":"q15","u":"Embryology","t":"mc","q":"A client's imaging shows a right-sided arch of the aorta. Which developmental cause should the nurse identify?","o":["The arch developed from the right dorsal aorta and the right 4th aortic arch.","The distal right dorsal aorta persisted alongside a normal left arch.","The ductus arteriosus failed to close.","The 5th arch persisted."],"c":0,"w":"Normally the left 4th arch and left dorsal aorta form the arch of the aorta. In a right arch of the aorta, the arch instead develops from the right dorsal aorta and the right 4th aortic arch vessel. (Embryology L3 slides (aortic arches))","x":{"1":"Persistence of the distal right dorsal aorta with the left arch gives a DOUBLE arch.","2":"A ductus that fails to close is a patent ductus arteriosus.","3":"The 5th arch vessel normally disappears completely and is not given as a cause of any listed anomaly."},"m":{"1":"mixes up right arch and double arch"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Recognize and interpret"},{"id":"q16","u":"Embryology","t":"mc","q":"A client's imaging shows a constriction of the aorta proximal to the entrance of the ductus arteriosus, with the ductus still open. How should this coarctation be classified?","o":["Preductal coarctation","Postductal coarctation","Double arch of the aorta","Patent ductus arteriosus alone"],"c":0,"w":"Coarctation is a constriction of the aorta distal to the origin of the left subclavian artery. In the preductal type the constriction is proximal to the entrance of the ductus arteriosus and the ductus stays open. In the postductal type the constriction is distal to the ductus, which is usually closed. Note: the slide labels preductal as \"Adult\" and postductal as \"fetal\" (and notes the closed duct as fatal); many references label them the other way round (preductal as infantile, postductal as adult), so check which label your instructor expects. (Embryology L3 slides (aortic arches))","x":{"1":"Postductal coarctation lies DISTAL to the ductus, which is usually closed.","2":"A double arch is a vascular ring, not a constriction.","3":"The ductus is open here, but the defining lesion is the constriction proximal to it."},"m":{"1":"mixes up preductal and postductal"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Apply a fact"},{"id":"q17","u":"Embryology","t":"tf","q":"A nurse states that coarctation of the aorta is a constriction proximal to the origin of the left subclavian artery.","o":["True","False"],"c":1,"w":"False. Coarctation of the aorta is a constriction DISTAL to the origin of the left subclavian artery, either before (preductal) or after (postductal) the entrance of the ductus arteriosus. (Embryology L3 slides (aortic arches))","x":{"0":"Coarctation lies distal to the left subclavian origin."},"m":{"0":"places coarctation proximal to the left subclavian"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Apply a fact"},{"id":"q18","u":"Embryology","t":"fill","q":"A nurse reviews the timeline of vascular development. The veins that drain into the horns of the sinus venosus develop at the ____ week.","o":["5th","4th","8th"],"c":0,"w":"The arterial system starts at the 4th week, when the two primitive aortae appear. The veins develop at the 5th week, when each horn of the sinus venosus receives an umbilical, a vitelline and a common cardinal vein. (Embryology L3 slides (aortic arches))","x":{"1":"The 4th week is when the two primitive aortae (arterial system) appear.","2":"The 8th week is not the time given for venous development."},"m":{"1":"mixes up arterial and venous timing"},"lp":false,"k":"emb-veins","src":"materials","kind":"Apply a fact"},{"id":"q19","u":"Embryology","t":"tf","q":"A nurse states that the vitelline veins form the inferior vena cava.","o":["True","False"],"c":1,"w":"False. The vitelline veins form the portal and superior mesenteric veins. The inferior vena cava develops from the posterior cardinal veins. (Embryology L3 slides (aortic arches))","x":{"0":"Vitelline veins form the portal and superior mesenteric veins; the IVC is posterior cardinal."},"m":{"0":"mixes up vitelline and cardinal derivatives"},"lp":false,"k":"emb-veins","src":"materials","kind":"Apply a fact"},{"id":"q20","u":"Embryology","t":"tf","q":"A nurse states that the inferior vena cava develops from the posterior cardinal veins.","o":["True","False"],"c":0,"w":"True. The posterior cardinal veins give the inferior vena cava, the common iliac, suprarenal, testicular or ovarian and renal veins. (Embryology L3 slides (aortic arches))","x":{"1":"This statement is true: the IVC is a posterior cardinal derivative."},"m":{},"lp":false,"k":"emb-veins","src":"materials","kind":"Apply a fact"},{"id":"q21","u":"Embryology","t":"cloze","q":"A nurse reviews the fate of the embryonic veins. Match each embryonic vein to its adult derivative.","o":{"rows":["Vitelline veins","Ductus venosus (after birth)","Left umbilical vein (after birth)","Left common cardinal vein"],"choices":["Portal and superior mesenteric veins","Ligamentum venosum","Ligamentum teres","Oblique vein of the left atrium","Inferior vena cava"]},"c":[0,1,2,3],"w":"Vitelline veins form the portal and superior mesenteric veins. After birth the ductus venosus closes to form the ligamentum venosum and the obliterated left umbilical vein forms the ligamentum teres. The common cardinal veins differ by side: the right forms the SVC inside the pericardium and the left forms the oblique vein of the left atrium. (Embryology L3 slides (aortic arches))","x":{"4":"The IVC comes from the posterior cardinal veins."},"m":{"4":"mixes up cardinal vein derivatives"},"lp":false,"k":"emb-veins","src":"materials","rs":{"0":"A nurse reviews the vitelline veins. Which adult veins do they form?","1":"After birth the ductus venosus closes. Which adult structure does it form?","2":"After birth the left umbilical vein is obliterated. Which adult structure does it form?","3":"A nurse traces the left common cardinal vein. Which adult vein does it form?"},"kind":"Apply a fact"},{"id":"q22","u":"Embryology","t":"sata","q":"A nurse reviews the derivatives of the posterior cardinal veins. Which adult veins develop from them? Select all that apply.","o":["Inferior vena cava","Common iliac veins","Renal veins","Testicular or ovarian veins","Suprarenal veins","Portal vein","Left brachiocephalic vein","Right internal jugular vein"],"c":[0,1,2,3,4],"w":"The cardinal veins are the main venous drainage of the fetus. The anterior cardinals drain the upper body and form the SVC (outside the pericardium), the brachiocephalic and internal jugular veins and the left superior intercostal vein. The posterior cardinals drain the lower body and form the IVC, common iliac, suprarenal, testicular or ovarian and renal veins. (Embryology L3 slides (aortic arches))","x":{"5":"The portal vein comes from the vitelline veins.","6":"The left brachiocephalic vein comes from the left ANTERIOR cardinal vein.","7":"The right internal jugular comes from the right ANTERIOR cardinal vein."},"m":{"5":"mixes up vitelline and cardinal derivatives","6":"mixes up anterior and posterior cardinal veins","7":"mixes up anterior and posterior cardinal veins"},"lp":false,"k":"emb-veins","src":"materials","kind":"Apply a fact"}],"concepts":{"emb-arches":{"title":"Formation and derivatives of the aortic arches","unit":"Embryology","points":["At the 4th week two primitive aortae appear, each with a ventral aorta, a dorsal aorta and a connecting segment; the ventral aortae fuse into the aortic sac with right and left horns.","1st arch: disappears, remnant forms the maxillary arteries. 2nd arch: disappears, remnant forms the stapedial arteries. 5th arch: disappears completely.","3rd arch: proximal parts form the common carotid arteries; distal parts join the dorsal aorta to form the internal carotid arteries. The external carotid is a new bud from the junction.","Left 4th arch: part of the arch of the aorta between the left common carotid and left subclavian. Right 4th arch: proximal part of the right subclavian artery.","6th arch: left proximal forms the left pulmonary artery and left distal forms the ductus arteriosus; right proximal forms the right pulmonary artery and right distal degenerates."],"source":"Embryology L3 slides (aortic arches)","items":["q0","q1","q2","q3","q4","q5","q6","q7"],"sec":[{"id":"emb-arches","title":"Formation and derivatives of the aortic arches","key":["At the 4th week two primitive aortae appear, each with a ventral aorta, a dorsal aorta and a connecting segment; the ventral aortae fuse into the aortic sac with right and left horns.","1st arch: disappears, remnant forms the maxillary arteries. 2nd arch: disappears, remnant forms the stapedial arteries. 5th arch: disappears completely.","3rd arch: proximal parts form the common carotid arteries; distal parts join the dorsal aorta to form the internal carotid arteries. The external carotid is a new bud from the junction.","Left 4th arch: part of the arch of the aorta between the left common carotid and left subclavian. Right 4th arch: proximal part of the right subclavian artery.","6th arch: left proximal forms the left pulmonary artery and left distal forms the ductus arteriosus; right proximal forms the right pulmonary artery and right distal degenerates."]}]},"emb-sac-dorsal":{"title":"Aortic sac, dorsal aorta and the origin of the great arteries","unit":"Embryology","points":["Aortic sac: arch of the aorta proximal to the brachiocephalic artery. Left horn: arch between the brachiocephalic and left common carotid. Right horn: brachiocephalic artery.","Right dorsal aorta: cranial to the 3rd arch forms the distal internal carotid; at the 7th intersegmental artery forms the distal right subclavian; the rest degenerates.","Left dorsal aorta: at the 7th intersegmental artery forms the subclavian; between the 4th and 6th arches forms the distal arch of the aorta; caudal to the 6th arch forms the descending thoracic and abdominal aorta.","Arch of the aorta from proximal to distal: aortic sac, left horn, left 4th arch, left dorsal aorta between the 4th and 6th arches."],"source":"Embryology L3 slides (aortic arches)","items":["q8","q9","q10","q11","q12"],"sec":[{"id":"emb-sac-dorsal","title":"Aortic sac, dorsal aorta and the origin of the great arteries","key":["Aortic sac: arch of the aorta proximal to the brachiocephalic artery. Left horn: arch between the brachiocephalic and left common carotid. Right horn: brachiocephalic artery.","Right dorsal aorta: cranial to the 3rd arch forms the distal internal carotid; at the 7th intersegmental artery forms the distal right subclavian; the rest degenerates.","Left dorsal aorta: at the 7th intersegmental artery forms the subclavian; between the 4th and 6th arches forms the distal arch of the aorta; caudal to the 6th arch forms the descending thoracic and abdominal aorta.","Arch of the aorta from proximal to distal: aortic sac, left horn, left 4th arch, left dorsal aorta between the 4th and 6th arches."]}]},"emb-anomalies":{"title":"Anomalies of the aortic arches","unit":"Embryology","points":["Patent ductus arteriosus: a patent duct between the left pulmonary artery and the arch of the aorta; associated with aortic stenosis, pulmonary stenosis and Fallot's tetralogy.","Right arch of aorta: develops from the right dorsal aorta and right 4th arch.","Double arch of aorta: persistence of the distal right dorsal aorta; a vascular ring around the trachea (dyspnea) and esophagus (dysphagia).","Coarctation: constriction of the aorta distal to the left subclavian. Postductal: distal to the ductus, ductus usually closed. Preductal: proximal to the ductus, ductus open."],"source":"Embryology L3 slides (aortic arches)","items":["q13","q14","q15","q16","q17"],"sec":[{"id":"emb-anomalies","title":"Anomalies of the aortic arches","key":["Patent ductus arteriosus: a patent duct between the left pulmonary artery and the arch of the aorta; associated with aortic stenosis, pulmonary stenosis and Fallot's tetralogy.","Right arch of aorta: develops from the right dorsal aorta and right 4th arch.","Double arch of aorta: persistence of the distal right dorsal aorta; a vascular ring around the trachea (dyspnea) and esophagus (dysphagia).","Coarctation: constriction of the aorta distal to the left subclavian. Postductal: distal to the ductus, ductus usually closed. Preductal: proximal to the ductus, ductus open."]}]},"emb-veins":{"title":"Development of the veins","unit":"Embryology","points":["At the 5th week each horn of the sinus venosus receives the umbilical, vitelline and common cardinal veins.","Vitelline veins form the portal and superior mesenteric veins. After birth the ductus venosus becomes the ligamentum venosum and the left umbilical vein the ligamentum teres.","Right common cardinal vein: SVC inside the pericardium. Left common cardinal vein: oblique vein of the left atrium.","Right anterior cardinal: SVC outside the pericardium, right brachiocephalic and right internal jugular veins. Left anterior cardinal: left superior intercostal, left brachiocephalic and left internal jugular veins.","Posterior cardinal veins: IVC, common iliac, suprarenal, testicular or ovarian, and renal veins."],"source":"Embryology L3 slides (aortic arches)","items":["q18","q19","q20","q21","q22"],"sec":[{"id":"emb-veins","title":"Development of the veins","key":["At the 5th week each horn of the sinus venosus receives the umbilical, vitelline and common cardinal veins.","Vitelline veins form the portal and superior mesenteric veins. After birth the ductus venosus becomes the ligamentum venosum and the left umbilical vein the ligamentum teres.","Right common cardinal vein: SVC inside the pericardium. Left common cardinal vein: oblique vein of the left atrium.","Right anterior cardinal: SVC outside the pericardium, right brachiocephalic and right internal jugular veins. Left anterior cardinal: left superior intercostal, left brachiocephalic and left internal jugular veins.","Posterior cardinal veins: IVC, common iliac, suprarenal, testicular or ovarian, and renal veins."]}]}}};

<script>
/* drill-core.js — pure drill logic (no DOM). Inlined into the drill page by
 * build-drill.py and loaded by simulate.js, so the simulations test the exact
 * code the page runs.
 *
 * Progress state S (saved in localStorage and synced to the account):
 *   seq        global answer counter (rest periods are counted in answers)
 *   p[id]      {h: recent results, ls: seq at last answer, lt: time, sid: session,
 *               t: last change, n: answers, sc: last full-question score 0..1,
 *               lp: last answer position (string)}
 *              h characters: R right, W wrong, P partly right, G right but guessed,
 *              r / w single-row practice right / wrong (r never counts toward solid)
 *   stars[id]  {on: 0|1, t}
 *   miss[]     {q, lab, t}  every wrong pick (misconception label when one exists)
 *   lastSid    id of the most recent session started
 */
(function (root) {
  'use strict';
  var H18 = 18 * 3600 * 1000;

  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function shuffle(a, r) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

  function newState() {
    return { v: 1, seq: 0, p: {}, stars: {}, miss: [], pre: { last: null }, tsec: { s: 0, n: 0 },
             lc: {}, ll: -1, lastSid: null, sidN: 0, t: 0 };
  }

  /* ------------------------------------------------------------ data context */
  function makeCtx(DATA) {
    var D = { cfg: DATA.cfg, items: DATA.items, concepts: DATA.concepts || {}, byId: {}, hiUnits: {} };
    DATA.items.forEach(function (it) { D.byId[it.id] = it; });
    (DATA.cfg.high_roi_units || []).forEach(function (u) { D.hiUnits[u] = 1; });
    return D;
  }
  // a question id is "q12" or a single-row variant "q12r3"
  function parseId(qid) {
    var m = /^(q\d+)(?:r(\d+))?$/.exec(qid);
    return m ? { base: m[1], row: m[2] === undefined ? -1 : +m[2] } : { base: qid, row: -1 };
  }
  function itemOf(D, qid) {
    var p = parseId(qid), it = D.byId[p.base];
    if (!it || p.row < 0) return it;
    return { id: qid, base: it.id, row: p.row, u: it.u, t: 'row', k: it.k, lp: it.lp, src: it.src, kind: it.kind,
             q: it.rs[p.row], o: it.o.choices, c: it.c[p.row], w: it.w, x: it.x, m: it.m, parent: it };
  }

  /* ------------------------------------------------------------ status */
  function eff(h) { return (h || '').replace(/r/g, '').replace(/w/g, 'W'); }
  function status(it, rec) {
    if (!rec) return 'new';
    var e = eff(rec.h);
    if (!e) return 'new';
    var last = e.charAt(e.length - 1);
    if (last !== 'R') return 'shaky';
    var need = it.t === 'tf' ? 3 : 2;
    return e.slice(-need) === new Array(need + 1).join('R') ? 'solid' : 'once';
  }
  function trailingMiss(rec) {
    var e = eff(rec && rec.h), n = 0;
    for (var i = e.length - 1; i >= 0 && (e[i] === 'W' || e[i] === 'P'); i--) n++;
    return n;
  }
  function lastIsMiss(rec) { var e = eff(rec && rec.h); var c = e.charAt(e.length - 1); return c === 'W' || c === 'P' || c === 'G'; }
  function isStar(S, id) { var s = S.stars[id]; return !!(s && s.on); }
  function isHi(D, S, it) { return isStar(S, it.id) || !!it.lp || !!D.hiUnits[it.u]; }

  function restLen(D, S, it, rec, n) {
    var e = eff(rec.h), last = e.charAt(e.length - 1);
    if (last === 'W' || last === 'P') {
      return trailingMiss(rec) >= 2 ? clamp(Math.round(0.10 * n), 6, 25) : clamp(Math.round(0.25 * n), 10, 60);
    }
    if (last === 'G') return clamp(Math.round(0.25 * n), 10, 60);
    var b = clamp(Math.round(0.7 * n), 12, 300);
    if (status(it, rec) === 'solid') b = Math.round(b * 1.5);
    if (isHi(D, S, it)) b = clamp(Math.round(0.4 * b), 8, 120);
    return b;
  }
  function isRested(D, S, it, n, now) {
    var rec = S.p[it.id];
    if (!rec || !eff(rec.h)) return true;
    if (now - rec.lt >= H18) return true;
    return (S.seq - rec.ls) >= restLen(D, S, it, rec, n);
  }
  // answered in the previous session and not allowed back yet
  function prevBlocked(D, S, it) {
    var rec = S.p[it.id], blk = S._block !== undefined ? S._block : S.lastSid;
    if (!rec || !blk || rec.sid !== blk) return false;
    return !(isHi(D, S, it) || trailingMiss(rec) >= 2);
  }

  /* ------------------------------------------------------------ pools */
  function unitItems(D, units) {
    var set = {}; units.forEach(function (u) { set[u] = 1; });
    return D.items.filter(function (it) { return set[it.u]; });
  }
  var FILTERS = {
    missed: function (D, S, it) { return status(it, S.p[it.id]) === 'shaky'; },
    starred: function (D, S, it) { return isStar(S, it.id); },
    lp: function (D, S, it) { return !!it.lp; },
    never: function (D, S, it) { return status(it, S.p[it.id]) === 'new'; }
  };
  function pool(D, S, units, filters, overlap) {
    var base = unitItems(D, units), act = Object.keys(FILTERS).filter(function (f) { return filters && filters[f]; });
    if (!act.length) return base.map(function (it) { return it.id; });
    return base.filter(function (it) {
      var hits = act.map(function (f) { return FILTERS[f](D, S, it); });

  function startLastPass(only20) { startSession(only20 ? 'lp20' : 'lastpass', Core.buildLastPass(D, S, only20, R), { units: UNITS.slice() }); }
  function startPretest() { startSession('pretest', Core.buildPretest(D, S, R), { units: UNITS.slice(), nTopic: D.items.length }); }
  function startFix(cids) {

      var other = members.filter(function (id) { return shaky.indexOf(id) < 0 && q.indexOf(id) < 0; });
      var pick = other.length ? other[Math.floor(R() * other.length)] : shaky[Math.floor(R() * shaky.length)];
      if (!pick) return;
      q.push('card:' + cid); q.push(pick);
    });
    if (q.length) startSession('fix', q, { units: UNITS.slice(), nTopic: D.items.length });
  }

  function curQid() { return SESS && SESS.queue[SESS.pos]; }
  function ensureCur() {
    if (SESS.mode === 'endless' && SESS.pos >= SESS.queue.length) {
      S._block = SESS.prevSid;
      var nx = Core.nextEndless(D, S, SESS.pool, SESS.nTopic, R, now(), SESS.recent, { u: SESS.lastU, t: SESS.lastT, tfh: S.tfh || [] });
      delete S._block;
      if (!nx) return false;

    }
    var q = curQid();

    if (!SESS.cur || SESS.cur.q !== q) {
      if (q.indexOf('card:') === 0) { SESS.cur = { q: q, card: true }; return true; }
      var a = Core.arrange(D, S, q, R), x = it(q);
      var init = x.t === 'sata' || x.t === 'order' ? [] : x.t === 'cloze' || x.t === 'blanks' ? x.c.map(function () { return -1; }) : x.num ? '' : -1;
      var wait = 0;
      if (UI.think && !x.num) wait = (x.t === 'tf' || (x.q.length < 170 && (x.t === 'mc' || x.t === 'fill' || x.t === 'row'))) ? 10 : 15;
      SESS.cur = { q: q, perm: a.perm, pos: a.pos, pick: init, checked: false, shownAt: now(), wait: wait, revealed: wait === 0 };
      saveLocal();
    }
    return true;
  }

  /* ---------------- question screen */
  function sessCount() { return SESS.queue.filter(function (q) { return q.indexOf('card:') !== 0; }).length; }
  function renderQuestion() {

    var cur = SESS.cur;

  function renderStem(x, cur) {

      var w = cur.pick >= 0 && cur.revealed ? esc(x.o[cur.perm[cur.pick]]) : '&nbsp;';

        var cls = '';

  function renderAnswerArea(x, cur) {

      order.forEach(function (d) {

        var cls = 'opt' + (multi ? ' multi' : '') + (sel ? ' sel' : '') + (cur.checked ? ' locked' : '');

        th += '<tr><td>' + esc(rw) + '</td><td><select data-row="' + r + '"' + cls + (cur.checked ? ' disabled' : '') + ' aria-label="' + esc(rw) + '"><option value="-1">Choose…</option>' +
          cur.perm.map(function (o, d) { return '<option value="' + d + '"' + (cur.pick[r] === d ? ' selected' : '') + '>' + esc(x.o.choices[o]) + '</option>'; }).join('') + '</select></td></tr>';

  }
  function canCheck(x, cur) {
    if (!cur.revealed) return false;
    if (x.num) return String(cur.pick).trim() !== '';
    if (x.t === 'sata') return cur.pick.length > 0;
    if (x.t === 'order') return cur.pick.length === x.o.length;
    if (x.t === 'cloze' || x.t === 'blanks') return cur.pick.every(function (p) { return p >= 0; });
    return cur.pick >= 0;
  }
  function drawActions() {
    var cur = SESS.cur, x = it(cur.q), el = document.getElementById('acts'); if (!el) return;
    if (!cur.checked) el.innerHTML = '<button class="btn primary" data-act="check"' + (canCheck(x, cur) ? '' : ' disabled') + '>Check</button>';
    else if (cur.res.full && Core.parseId(cur.q).row < 0) el.innerHTML = '<button class="btn primary" data-act="next">Knew it - Next</button><button class="btn" data-act="guessed">I guessed</button>';
    else el.innerHTML = '<button class="btn primary" data-act="next">Next</button>';
  }
  function runThink() {
    var cur = SESS.cur, left = cur.wait - Math.floor((now() - cur.shownAt) / 1000);
    var bar = document.getElementById('thinkbar'), lab = document.getElementById('thinkleft');
    function tick() {
      left = cur.wait - Math.floor((now() - cur.shownAt) / 1000);
      if (bar) bar.style.width = Math.max(0, 100 * left / cur.wait) + '%';
      if (lab) lab.textContent = Math.max(0, left) + ' s';
      if (left <= 0) { clearInterval(thinkTimer); reveal(); }
    }
    tick(); thinkTimer = setInterval(tick, 250);
  }
  function reveal() {
    var cur = SESS.cur; if (!cur || cur.revealed) return;

    cur.revealed = true; saveLocal();

  }
  function refreshAnswer() {
    var cur = SESS.cur, x = it(cur.q);

  }
  function pickOption(d) {
    var cur = SESS.cur, x = it(cur.q);

    else if (x.t === 'order') { if (d < cur.perm.length) { var o = cur.perm[d]; if (cur.pick.indexOf(o) < 0) cur.pick.push(o); } }
    else if (x.t === 'mc' || x.t === 'fill' || x.t === 'row' || x.t === 'tf') { if (d < (x.t === 'tf' ? 2 : cur.perm.length)) cur.pick = d; }
    else return;
    refreshAnswer();
  }

  /* ---------------- check / feedback */
  function doCheck() {
    var cur = SESS.cur, x = it(cur.q);
    if (!cur || cur.checked || !canCheck(x, cur)) return;
    var res = Core.grade(D, cur.q, cur.perm, cur.pick);
    cur.checked = true; cur.res = res;
    var secs = Math.max(0, (now() - cur.shownAt) / 1000 - (cur.wait || 0));
    Core.record(D, S, cur.q, res, SESS.sid, now(), secs, cur.pos);
    dirty[Core.parseId(cur.q).base] = 1; if (!res.full) dirtyMiss = true;
    SESS.ans.push({ q: cur.q, perm: cur.perm, pick: cur.pick, sc: res.sc, full: res.full, t: now() });
    SESS.lastU = x.u; SESS.lastT = x.t; SESS.recent.push(cur.q);
    
    if (!res.full) scheduleFollowUp(cur.q);
    SESS.t = now();
    saveLocal(); push(false);
    var y = window.pageYOffset;
    renderQuestion(); window.scrollTo(0, y);

  function scheduleFollowUp(q) {
    if (SESS.mode === 'pretest' || SESS.mode === 'lastpass' || SESS.mode === 'lp20') return;
    var cap = Math.floor(Math.max(SESS.planned, SESS.mode === 'endless' ? SESS.ans.length + 6 : 0) / 3);
    if (SESS.fu >= cap) return;
    var used = {}; SESS.queue.forEach(function (z) { used[z] = 1; });
    S._block = null;
    var f = Core.followUp(D, S, q, used, R);
    delete S._block;
    if (!f) return;
    var at = Math.min(SESS.pos + 3 + Math.floor(R() * 4), SESS.queue.length);
    if (SESS.mode === 'endless') { SESS.pending = SESS.pending || []; SESS.pending.push({ q: f, at: SESS.ans.length + 3 + Math.floor(R() * 4) }); }

  }
  function choiceText(x, o) { return x.t === 'cloze' ? x.o.choices[o] : x.t === 'row' ? x.o[o] : x.o[o]; }
  function feedbackHTML(q, perm, pick, res, withCard) {
    var x = it(q), h = '', t = x.t, wrongs = [];
    var parent = x.parent || x;
    var cls = res.full ? 'v-right' : res.sc > 0 && (t === 'sata' || t === 'cloze' || t === 'blanks') ? 'v-part' : 'v-wrong';
    var title = res.full ? 'Correct' : cls === 'v-part' ? 'Partly correct: ' + (t === 'sata' ? res.score : res.right) + ' of ' + res.max : 'Not quite';
    h += '<div class="verdict ' + cls + '" id="verdict"><h2>' + esc(title) + '</h2>';
    if (x.num) {
      if (res.accept) h += '<p>' + esc(res.accept) + '</p>';
      res.notes.forEach(function (n) { h += '<p><b>' + esc(n) + '</b></p>'; });
      if (!res.full) {
        h += '<div class="why"><b>Why ' + esc(pick) + ' is wrong:</b> ' + esc(res.near || 'It does not match the setup below; work through each step.') + '</div>';
        h += '<p><b>Right answer:</b> ' + esc(x.num.answer) + ' ' + esc(x.num.unit) + '</p>';
      }
    } else if (t === 'mc' || t === 'fill' || t === 'row' || t === 'tf') {
      if (!res.full) {
        var o = res.orig, why = x.x && x.x[o];
        if (t === 'row' && !why) { var ri = parent.c.indexOf(o); why = ri >= 0 ? 'That choice goes with "' + parent.o.rows[ri] + '".' : ''; }
        h += '<div class="why"><b>Why "' + esc(choiceText(x, o)) + '" is wrong:</b> ' + esc(why || '') + '</div>';
        h += '<p><b>Right answer:</b> ' + esc(choiceText(x, x.c)) + '</p>';
      }
    } else if (t === 'sata') {
      var wrongPicked = res.origs.filter(function (o) { return x.c.indexOf(o) < 0; });
      var missed = x.c.filter(function (o) { return res.origs.indexOf(o) < 0; });
      wrongPicked.forEach(function (o) { h += '<div class="why"><b>Why "' + esc(x.o[o]) + '" is wrong:</b> ' + esc(x.x[o] || '') + '</div>'; });
      if (missed.length) h += '<p><b>Right answers you left out:</b></p><ul>' + missed.map(function (o) { return '<li>' + esc(x.o[o]) + '</li>'; }).join('') + '</ul>';
      if (!res.full) h += '<p><b>All right answers:</b> ' + esc(x.c.map(function (o) { return x.o[o]; }).join('; ')) + '</p>';
    } else if (t === 'order') {
      if (!res.full) h += '<p><b>Right order:</b></p><ol>' + x.o.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>';
    } else if (t === 'cloze') {
      res.origs.forEach(function (o, r) {
        if (o === x.c[r]) return;
        var why = x.x[o];
        if (!why) { var ri = x.c.indexOf(o); why = ri >= 0 ? 'That choice goes with "' + x.o.rows[ri] + '".' : ''; }
        h += '<div class="why"><b>' + esc(x.o.rows[r]) + ': why "' + esc(x.o.choices[o]) + '" is wrong:</b> ' + esc(why) + ' Right: ' + esc(x.o.choices[x.c[r]]) + '.</div>';
      });
    } else if (t === 'blanks') {
      res.origs.forEach(function (o, b) {
        if (o === x.c[b]) return;
        h += '<div class="why"><b>Blank ' + (b + 1) + ': why "' + esc(x.o[b][o]) + '" is wrong:</b> ' + esc(x.x[b + ':' + o] || '') + ' Right: ' + esc(x.o[b][x.c[b]]) + '.</div>';
      });
    }
    h += '<div class="keyidea"><b>The key idea</b><p>' + esc(x.w) + '</p></div></div>';
    if (withCard && !res.full) h += conceptCard(x.k);
    return h;
  }
  function conceptCard(cid) {

    var extra = c.points.filter(function (p) { return !inKey[p]; });

  function drawFeedback() {

  function doNext(guessed) {

  function startClock() {

  /* ---------------- concept-card step (Fix this) */
  function renderCardStep(cid) {

  /* ---------------- review / submit */
  function reviewList(ans) {

      var x = it(a.q), res = Core.grade(D, a.q, a.perm, a.pick);
      return '<div class="rv"><p class="eyebrow">' + (i + 1) + '. ' + esc(x.u) + (a.guessed ? ' · guessed' : '') + '</p><p><b>' + esc(x.q.replace(/\{\d\}/g, '____')) + '</b></p><p class="small">Your answer: ' + esc(pickText(x, a)) + '</p>' + feedbackHTML(a.q, a.perm, a.pick, res, false) + '</div>';
    }).join('');
  }
  function pickText(x, a) {
    if (x.num) return a.pick + ' ' + x.num.unit;
    if (x.t === 'mc' || x.t === 'fill' || x.t === 'row') return a.pick >= 0 ? choiceText(x, a.perm[a.pick]) : '-';
    if (x.t === 'tf') return a.pick === 0 ? 'True' : a.pick === 1 ? 'False' : '-';
    if (x.t === 'sata') return a.pick.map(function (d) { return x.o[a.perm[d]]; }).join('; ') || '-';
    if (x.t === 'order') return a.pick.map(function (o, i) { return (i + 1) + '. ' + x.o[o]; }).join('  ');
    if (x.t === 'cloze') return a.pick.map(function (d, r) { return x.o.rows[r] + ' → ' + (d >= 0 ? x.o.choices[a.perm[d]] : '-'); }).join('; ');
    if (x.t === 'blanks') return a.pick.map(function (d, b) { return d >= 0 ? x.o[b][a.perm[b][d]] : '-'; }).join(' / ');
    return '';
  }
  function renderReview() {
    header({});
    var ans = SESS ? SESS.ans : (LASTRES ? LASTRES.ans : []);
    app.innerHTML = '<h1>Your answers' + (SESS ? ' so far' : '') + '</h1><p class="muted">' + plural(ans.length, 'answer') + ', with your pick, the right answer and both explanations.</p>' +
      '<div class="actions"><button class="btn primary" data-act="' + (SESS ? 'backq' : 'backres') + '">' + (SESS ? 'Back to the question' : 'Back to results') + '</button></div>' + reviewList(ans);
  }
  function renderSubmit() {
    header({});
    var n = SESS.ans.length, isPre = SESS.mode === 'pretest', left = SESS.mode === 'endless' ? 0 : Math.max(0, sessCount() - n);
    app.innerHTML = '<h1>' + (isPre ? 'Stop the pre-test?' : 'Submit this session?') + '</h1>' +
      '<div class="card strong"><p>You answered <b>' + n + '</b>' + (SESS.mode !== 'endless' ? ' of ' + sessCount() : '') + ' questions.</p>' +
      (left ? '<p>The ' + plural(left, 'unanswered question') + ' will not be graded or count toward your progress.</p>' : '') +
      (isPre ? '<p>Topics you did not reach get no level from this pre-test.</p>' : '') +
      '<p><b>This cannot be undone.</b></p><div class="actions"><button class="btn primary" data-act="backq">Keep going</button><button class="btn" data-act="dosubmit">Submit now</button></div></div>';
  }

  /* ---------------- results */
  var BANDS = [[90, 'Exam-ready', 'Keep it fresh: run the last pass once more the day before the exam.'],
    [80, 'Strong', 'Drill your starred and missed questions, then do a 30-minute timed plan.'],
    [70, 'Almost there', 'Open Fix my misses and fix your top two concepts, then drill 20 again.'],
    [60, 'Shaky', 'Re-read the guide sections for your weakest topic, then drill only that topic.'],
    [0, 'Needs work', 'Study the guide for your weakest topic first, then do 10-question sessions on it daily.']];
  function finish() {
    clearInterval(clockTimer);
    if (!SESS) return go('main');
    var ans = SESS.ans, res = { mode: SESS.mode, ans: ans, units: SESS.units, t: now(), sid: SESS.sid };
    if (SESS.mode === 'pretest') {
      var sc = ans.reduce(function (a, b) { return a + b.sc; }, 0);
      S.pre.last = { t: now(), pct: ans.length ? Math.round(100 * sc / ans.length) : 0, n: ans.length };
    }
    LASTRES = res; lsSet('lastres', { mode: res.mode, ans: ans, units: res.units, t: res.t });
    SESS = null; saveLocal(); push(false);
    go('results');
  }
  function renderResults() {
    header({});
    var r = LASTRES; if (!r) return go('main');
    var ans = r.ans, n = ans.length, sc = ans.reduce(function (a, b) { return a + b.sc; }, 0), pct = n ? Math.round(100 * sc / n) : 0;
    var band = BANDS.filter(function (b) { return pct >= b[0]; })[0];
    var per = {}; ans.forEach(function (a) { var u = it(a.q).u; per[u] = per[u] || { n: 0, s: 0 }; per[u].n++; per[u].s += a.sc; });
    var weakest = Object.keys(per).filter(function (u) { return per[u].n >= 3 && per[u].s / per[u].n < 0.8; })
      .sort(function (a, b) { return per[a].s / per[a].n - per[b].s / per[b].n; })[0];
    var h = '';
    if (r.mode === 'pretest') {
      var lv = Core.topicLevels(D, S);
      var weakU = UNITS.filter(function (u) { return lv[u].level; }).sort(function (a, b) { return lv[a].pct - lv[b].pct; }).filter(function (u) { return lv[u].level !== 'Strong'; }).slice(0, 3);
      h += '<p class="eyebrow">Pre-test results</p><h1>Your level by topic</h1><p class="big">' + pct + '%</p><p class="muted">' + (Math.round(sc * 10) / 10) + ' of ' + n + ' right on the pre-test. Levels combine the pre-test with all your saved answers.</p>';
      h += '<div class="card"><div class="tblwrap"><table class="rates"><tr><th>Topic</th><th>Level</th><th class="n">Score</th></tr>' + UNITS.map(function (u) {
        var L = lv[u]; return '<tr><td>' + esc(u) + '</td><td>' + (L.level ? '<span class="lvl ' + L.level + '">' + L.level + '</span>' : '<span class="muted">No level yet</span>') + '</td><td class="n">' + (L.pct === null ? '-' : L.pct + '%') + '</td></tr>';
      }).join('') + '</table></div></div>';
      h += '<div class="card strong"><h2>Next step</h2><p>Do the last pass next' + (weakU.length ? ', then drill your weakest topics: <b>' + esc(listText(weakU)) + '</b>.' : '.') + '</p>' +
        '<div class="actions"><button class="btn primary" data-act="lp">Start last pass</button>' + (weakU.length ? '<button class="btn" data-act="weakdrill" data-units="' + esc(weakU.join('|')) + '">Drill ' + esc(listText(weakU)) + '</button>' : '') + '</div></div>';
    } else {
      h += '<p class="eyebrow">Session results</p><h1>' + esc(band[1]) + '</h1><p class="big">' + pct + '%</p><p class="muted">' + (Math.round(sc * 10) / 10) + ' of ' + n + ' right' + (r.mode === 'timed' ? ' in the timed plan' : '') + '.</p>' +
        '<p><b>Next step:</b> ' + esc(band[2]) + '</p>';
      if (weakest) h += '<p>Weakest topic this session: <b>' + esc(weakest) + '</b> (' + Math.round(100 * per[weakest].s / per[weakest].n) + '% on ' + per[weakest].n + ').</p>';
      if (n < 10) h += '<p class="muted small">This session had fewer than 10 questions, so the score is a rough guide.</p>';
    }
    var lpMode = r.mode === 'lastpass' || r.mode === 'lp20';
    var ids = lpMode ? D.items.filter(function (x) { return x.lp; }).map(function (x) { return x.id; }) : Core.unitItems(D, r.units).map(function (x) { return x.id; });
    h += '<div class="card"><h2>' + (lpMode ? 'Last pass status' : 'Status for these topics') + '</h2>' + statusBar(Core.statusCounts(D, S, ids)) +
      '<p class="muted small">One session can only make a question "right once": it becomes solid after you get it right again in a later session, once it has rested.</p></div>';
    h += '<div class="card"><h2>By topic this session</h2><div class="bars">' + Object.keys(per).sort(function (a, b) { return UNITS.indexOf(a) - UNITS.indexOf(b); }).map(function (u) {
      var p = Math.round(100 * per[u].s / per[u].n);
      return '<div class="b"><span>' + esc(u) + '</span><span class="track"><span class="fill' + (p < 60 ? ' low' : '') + '" style="display:block;width:' + p + '%"></span></span><span class="pct">' + p + '%</span></div>';
    }).join('') + '</div></div>';
    h += '<div class="actions"><button class="btn primary" data-act="again">Drill again</button><button class="btn" data-act="viewans">Check my answers</button><button class="btn" data-act="home">Change topics</button><button class="btn danger" id="reset" data-act="reset">Reset all progress</button></div>';
    app.innerHTML = h;
  }

  /* ---------------- fix my misses */
  function rates(keyFn) {
    var out = {};
    D.items.forEach(function (x) {
      var rec = S.p[x.id]; if (!rec) return;
      var e = Core.eff(rec.h); if (!e) return;
      var k = keyFn(x); out[k] = out[k] || { a: 0, m: 0 };
      out[k].a += e.length; out[k].m += (e.match(/[WP]/g) || []).length;
    });
    return out;
  }
  function rateTable(title, o) {
    var ks = Object.keys(o).sort(function (a, b) { return o[b].m / o[b].a - o[a].m / o[a].a; });
    if (!ks.length) return '';
    return '<h3>' + esc(title) + '</h3><div class="tblwrap"><table class="rates"><tr><th>' + esc(title.replace('By ', '')) + '</th><th class="n">Answers</th><th class="n">Misses</th><th class="n">Miss rate</th></tr>' +
      ks.map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="n">' + o[k].a + '</td><td class="n">' + o[k].m + '</td><td class="n">' + Math.round(100 * o[k].m / o[k].a) + '%</td></tr>'; }).join('') + '</table></div>';
  }
  var FMT = { mc: 'Multiple choice', sata: 'Select all', cloze: 'Matching table', fill: 'Word bank', order: 'Put in order', tf: 'True/false', blanks: 'Sentence blanks' };
  function renderFix() {
    header({});
    var labs = {};
    S.miss.forEach(function (m) { (m.lab || '').split('; ').forEach(function (l) { if (!l) return; labs[l] = labs[l] || { n: 0, k: it(m.q) && it(m.q).k }; labs[l].n++; }); });
    var lk = Object.keys(labs).sort(function (a, b) { return labs[b].n - labs[a].n; }).slice(0, 10);
    var byC = {};
    D.items.forEach(function (x) { if (Core.status(x, S.p[x.id]) === 'shaky' && x.k) (byC[x.k] = byC[x.k] || []).push(x.id); });
    var cids = Object.keys(byC).sort(function (a, b) { return byC[b].length - byC[a].length; });
    var h = '<h1>Fix my misses</h1><p class="muted">Each fix re-teaches the concept, then asks a different question on it. A missed question is fixed once you get it and its follow-up right.</p>';
    h += '<div class="card"><h2>Mistakes I keep making</h2>' + (lk.length ? '<ul>' + lk.map(function (l) {
      var c = labs[l].k && D.concepts[labs[l].k];
      return '<li><b>' + esc(l) + '</b> <span class="count">× ' + labs[l].n + '</span>' + (c ? ' <span class="muted small">· ' + esc(c.title) + '</span>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="muted">No repeated mistakes yet.</p>') + '</div>';
    h += '<div class="card"><h2>Shaky questions by concept</h2>' + (cids.length ? '<div class="actions"><button class="btn primary" data-act="fixall">Fix all (' + cids.length + ' concepts)</button></div>' +
      cids.map(function (cid) {
        var c = D.concepts[cid];
        return '<div class="rv"><p class="eyebrow">' + esc(c.unit) + '</p><div class="row" style="justify-content:space-between"><span><b>' + esc(c.title) + '</b> <span class="count">' + plural(byC[cid].length, 'shaky question') + '</span></span><button class="btn small" data-act="fixone" data-cid="' + esc(cid) + '">Fix this</button></div></div>';
      }).join('') : '<p class="muted">Nothing shaky right now.</p>') + '</div>';
    h += '<details class="fold"><summary>Detailed miss rates</summary>' +
      rateTable('By kind of question', rates(function (x) { return x.kind; })) +
      rateTable('By topic', rates(function (x) { return x.u; })) +
      rateTable('By format', rates(function (x) { return x.num ? 'Typed number' : FMT[x.t]; })) +
      rateTable('By source', rates(function (x) { return x.src; })) + '</details>';
    app.innerHTML = h;
  }
  function renderReadme() {
    header({});
    app.innerHTML = document.getElementById('readme-src').innerHTML +
      (CFG.guide_url ? '<p><a class="btn small ghost" href="' + esc(CFG.guide_url) + '" target="_blank" rel="noopener">Open the Mastery Guide</a></p>' : '');
  }

  /* ------------------------------------------------------------ events */
  var resetArmed = 0;
  function toggleStar() {
    var cur = SESS && SESS.cur; if (!cur || cur.card) return;
    var id = Core.parseId(cur.q).base, on = !Core.isStar(S, id);
    S.stars[id] = { on: on ? 1 : 0, t: now() }; dirtyStars[id] = 1; saveLocal(); push(false);
    var b = document.querySelector('[data-act="star"]'); if (b) { b.textContent = on ? '★ Starred' : '☆ Star'; b.setAttribute('aria-pressed', on); }
  }
  function doReset() {
    var b = document.getElementById('reset');
    if (!resetArmed || now() - resetArmed > 6000) {
      resetArmed = now(); if (b) { b.classList.add('armed'); b.textContent = 'Tap again to erase all progress (stars are kept)'; }
      return;
    }
    resetArmed = 0;
    var stars = S.stars; S = Core.newState(); S.stars = stars; SESS = null; LASTRES = null; lsSet('lastres', null);
    saveLocal(); push(true); go('main');
  }
  app.addEventListener('click', onClick); hb.addEventListener('click', onClick);
  function onClick(e) {
    var t = e.target.closest('[data-act],[data-opt],[data-step],[data-slot],[data-len]');
    if (!t) return;
    if (t.hasAttribute('data-opt')) return pickOption(+t.getAttribute('data-opt'));
    if (t.hasAttribute('data-step')) { var cur = SESS.cur; if (!cur.checked && cur.pick.indexOf(+t.getAttribute('data-step')) < 0) { cur.pick.push(+t.getAttribute('data-step')); refreshAnswer(); } return; }
    if (t.hasAttribute('data-slot')) { var c2 = SESS.cur, i = +t.getAttribute('data-slot'); if (!c2.checked && c2.pick[i] !== undefined) { c2.pick.splice(i, 1); refreshAnswer(); } return; }
    if (t.hasAttribute('data-len')) { UI.len = t.getAttribute('data-len'); saveLocal(); return renderMain(); }
    var a = t.getAttribute('data-act');
    if (a === 'overlap' || a === 'think') return;
    if (a !== 'reset') { resetArmed = 0; }
    switch (a) {
      case 'home': clearInterval(clockTimer); if (SESS) { saveLocal(); push(false); } return go('main');
      case 'readme': return go('readme');
      case 'fix': return go('fix');
      case 'resume': return go('q');
      case 'fresh': SESS = null; saveLocal(); push(false); return renderMain();
      case 'pretest': return startPretest();
      case 'lp': return startLastPass(false);
      case 'lp20': return startLastPass(true);
      case 'uall': UI.units = UNITS.slice(); saveLocal(); return renderMain();
      case 'unone': UI.units = []; saveLocal(); return renderMain();
      case 'start': return startFromSetup();
      case 'reset': return doReset();
      case 'check': return doCheck();
      case 'next': return doNext(false);
      case 'guessed': return doNext(true);
      case 'star': return toggleStar();
      case 'timer': UI.think = !UI.think; saveLocal(); t.textContent = 'Timer: ' + (UI.think ? 'on' : 'off'); if (!UI.think && SESS.cur && !SESS.cur.revealed) reveal(); return;
      case 'sofar': return go('review');
      case 'submit': return go('submit');
      case 'backq': return go('q');
      case 'backres': return go('results');
      case 'dosubmit': return finish();
      case 'viewans': return go('review');
      case 'again':
        if (LASTRES && (LASTRES.mode === 'lastpass' || LASTRES.mode === 'lp20')) return startLastPass(LASTRES.mode === 'lp20');
        if (LASTRES && LASTRES.mode === 'pretest') return startPretest();
        return startFromSetup();
      case 'weakdrill': UI.units = t.getAttribute('data-units').split('|'); UI.filters = {}; UI.len = '20'; saveLocal(); return startFromSetup();
      case 'fixall': return startFix(Object.keys((function () { var o = {}; D.items.forEach(function (x) { if (x.k && Core.status(x, S.p[x.id]) === 'shaky') o[x.k] = 1; }); return o; })()).slice(0, 15));
      case 'fixone': return startFix([t.getAttribute('data-cid')]);
      case 'cardnext': SESS.pos++; SESS.cur = null; saveLocal(); push(false); if (SESS.pos >= SESS.queue.length) return finish(); return go('q');
    }
  }
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-unit')) {
      var u = t.getAttribute('data-unit'), i = UI.units.indexOf(u);
      if (t.checked && i < 0) UI.units.push(u); if (!t.checked && i >= 0) UI.units.splice(i, 1);
      UI.units.sort(function (a, b) { return UNITS.indexOf(a) - UNITS.indexOf(b); });
      saveLocal(); var y = window.pageYOffset; renderMain(); window.scrollTo(0, y); return;
    }
    if (t.hasAttribute('data-filter')) { UI.filters[t.getAttribute('data-filter')] = t.checked; saveLocal(); var y2 = window.pageYOffset; renderMain(); window.scrollTo(0, y2); return; }
    var a = t.getAttribute('data-act');
    if (a === 'overlap') { UI.overlap = t.checked; saveLocal(); document.getElementById('desc').textContent = describe(); return; }
    if (a === 'think') { UI.think = t.checked; saveLocal(); return; }
    if (t.id === 'custom') { UI.custom = Math.max(5, Math.min(500, +t.value || 25)); t.value = UI.custom; saveLocal(); document.getElementById('desc').textContent = describe(); return; }
    if (t.hasAttribute('data-row') && SESS && SESS.cur) { SESS.cur.pick[+t.getAttribute('data-row')] = +t.value; saveLocal(); drawActions(); return; }
    if (t.hasAttribute('data-blank') && SESS && SESS.cur) { SESS.cur.pick[+t.getAttribute('data-blank')] = +t.value; saveLocal(); drawActions(); return; }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'numin' && SESS && SESS.cur) { SESS.cur.pick = e.target.value; saveLocal(); drawActions(); }
  });
  document.addEventListener('keydown', function (e) {
    if (screen !== 'q' || !SESS || !SESS.cur || e.metaKey || e.ctrlKey || e.altKey) return;
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA');
    var cur = SESS.cur;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (cur.card) return onClick({ target: document.querySelector('[data-act="cardnext"]') });
      return cur.checked ? doNext(false) : doCheck();
    }
    if (typing || cur.card) return;
    if (/^[1-6]$/.test(e.key)) { pickOption(+e.key - 1); return; }
    if (e.key === 's' || e.key === 'S') return toggleStar();
    if ((e.key === 'g' || e.key === 'G') && cur.checked && cur.res && cur.res.full) return doNext(true);
  });

  /* ------------------------------------------------------------ boot */
  if (SESS && SESS.cur && SESS.cur.checked === 'done') { SESS.pos++; SESS.cur = null; }
  render();
  initSync();
})();
</script>
