<script>
var DATA = {"cfg":{"title":"CVS Mid 2 Pharmacology Drill","eyebrow":"CVS block · Mid 2 · Pharmacology only · Sunday 29 November 2026","storage_key":"cvs-mid2-2026-11-29-pharmacology","units":["Pharmacology"],"high_roi_units":[],"last_pass_note":"The Pharmacology questions from the Shams Practices past-paper bank, the cases asked in class, slide exercises and facts flagged on slides with NOTE, N.B. or REMEMBER.","guide_url":"https://claude.ai/artifact/9E3TcJ36SXeUGwmpUgx7GV","hub_url":"https://claude.ai/artifact/PXVXQrpDCUtSC7jAcMMtRe","pretest_per_topic":10,"guide_title":"CVS Mid 2 Pharmacology Guide"},"items":[{"id":"q0","u":"Pharmacology","t":"mc","q":"A 52-year-old client's average blood pressure over several visits is 132/82 mm Hg. How should the nurse interpret this reading?","o":["It meets the definition of hypertension.","It is normal because hypertension starts at 140/90 mm Hg.","It is hypertension only if the systolic reading is 140 or more.","It cannot be classified without a renin level."],"c":0,"w":"Both the ACC/AHA (2023) and the Saudi Heart Association define hypertension as a blood pressure of 130/80 mm Hg or higher. A reading of 132/82 is above both numbers. Hypertension affects 1 in 3 US adults and is more common with age and obesity. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"The current definition (ACC/AHA 2023 and SHA) is 130/80 mm Hg or higher.","2":"Either value at or above 130/80 meets the definition; 132/82 exceeds both.","3":"Hypertension is defined by blood pressure, not by renin."},"m":{"1":"uses the old 140/90 threshold"},"lp":false,"k":"pharm-classes","src":"materials","lec":"pharm-l2-4","kind":"Recognize and interpret"},{"id":"q1","u":"Pharmacology","t":"cloze","q":"A nurse reviews a client's antihypertensive medication list. Match each drug to its class.","o":{"rows":["Hydrochlorothiazide","Clonidine","Hydralazine","Losartan"],"choices":["Diuretic","Sympathoplegic drug","Vasodilator","Angiotensin receptor blocker (ARB)","ACE inhibitor","Renin inhibitor"]},"c":[0,1,2,3],"w":"The drug list groups antihypertensives by where they act: diuretics (hydrochlorothiazide, indapamide, furosemide, spironolactone), sympathoplegic drugs (clonidine, methyldopa, prazosin, propranolol, labetalol, esmolol), vasodilators (hydralazine, nitroprusside, minoxidil, diazoxide, fenoldopam, CCBs) and inhibitors of the renin-angiotensin system: ACE inhibitors (captopril, enalapril, enalaprilat), ARBs (losartan) and renin inhibitors (aliskiren). (Pharmacology L2-L4 slides (treatment of hypertension), drug list slide)","x":{"4":"ACE inhibitors on the list are captopril, enalapril and enalaprilat.","5":"The only renin inhibitor is aliskiren."},"m":{"4":"mixes up ARBs and ACE inhibitors"},"lp":true,"k":"pharm-classes","src":"materials","rs":{"0":"A client is started on hydrochlorothiazide for hypertension. To which drug class does it belong?","1":"A client's medication list includes clonidine. Which drug class should the nurse identify?","2":"A client receives hydralazine for blood pressure. Which drug class does it belong to?","3":"A client who could not tolerate captopril is switched to losartan. Which drug class is losartan?"},"lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q2","u":"Pharmacology","t":"mc","q":"A client who has taken a thiazide for 6 weeks asks why the blood pressure stays down even though urination is back to normal. Which explanation by the nurse is accurate?","o":["Peripheral vascular resistance has fallen because body sodium depletion lowers calcium in vascular smooth muscle.","Plasma volume and cardiac output stay reduced for as long as the drug is taken.","The thiazide blocks L-type calcium channels in the arterioles.","The thiazide blocks beta-1 receptors on the heart."],"c":0,"w":"Diuretics first lower blood pressure by reducing plasma volume and cardiac output. After 4-8 weeks of therapy volume and output return toward normal, but peripheral vascular resistance falls through arteriolar vasodilation. The likely main mechanism is depletion of body Na+ stores: less Na+ in smooth muscle lowers intracellular Ca++ through the Na/Ca exchanger. Renal prostaglandins and K channel opening may also contribute. This is why diuretic efficacy does not strictly match antihypertensive efficacy. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Volume and cardiac output return toward normal after 4-8 weeks; the early effect does not persist.","2":"Blocking L-type Ca++ channels is the mechanism of calcium channel blockers.","3":"Beta-1 blockade is the mechanism of beta blockers."},"m":{"1":"thinks diuretics work only by volume loss"},"lp":false,"k":"pharm-diuretics","src":"materials","lec":"pharm-l2-4","kind":"Teaching and statements"},{"id":"q3","u":"Pharmacology","t":"mc","q":"A client with chronic kidney disease has hypertension that needs a diuretic. Which diuretic class should the nurse anticipate?","o":["A loop diuretic such as furosemide","A thiazide such as hydrochlorothiazide","A potassium-sparing diuretic alone","Diazoxide"],"c":0,"w":"Thiazides and thiazide-like drugs are the first-choice antihypertensive diuretics and the most effective in patients with normal renal function. Loop diuretics are preferable only in specific situations such as malignant hypertension and concomitant chronic kidney disease. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Thiazides are first choice in patients with NORMAL renal function.","2":"Potassium-sparing diuretics are used only combined with thiazides to counteract hypokalemia.","3":"Diazoxide is a potassium channel opener that does not cause diuresis."},"m":{"1":"uses thiazides in CKD","2":"thinks K-sparing diuretics are used alone"},"lp":false,"k":"pharm-diuretics","src":"materials","lec":"pharm-l2-4","kind":"Recognize and interpret"},{"id":"q4","u":"Pharmacology","t":"mc","q":"A client on hydrochlorothiazide has a low serum potassium. Which drug should the nurse anticipate being added?","o":["Spironolactone","Furosemide","Indapamide","Fenoldopam"],"c":0,"w":"Potassium-sparing diuretics are used only in combination with thiazides, to counteract the hypokalemia thiazides cause. Spironolactone is the potassium-sparing diuretic on the list and is also used for hypertension due to hyperaldosteronism. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Furosemide is a loop diuretic; it would not correct hypokalemia.","2":"Indapamide is a thiazide-like diuretic, which also lowers potassium.","3":"Fenoldopam is an IV D1 agonist that itself decreases serum potassium."},"m":{"1":"adds a K-wasting diuretic"},"lp":false,"k":"pharm-diuretics","src":"materials","lec":"pharm-l2-4","kind":"Recognize and interpret"},{"id":"q5","u":"Pharmacology","t":"tf","q":"A nurse explains that the antihypertensive doses of thiazides are lower than those required for a diuretic effect.","o":["True","False"],"c":0,"w":"True. Thiazides lower blood pressure at doses lower than those needed for diuresis, another sign that they do not work only by increasing urine output. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"This statement is true: antihypertensive doses are lower than diuretic doses."},"m":{},"lp":false,"k":"pharm-diuretics","src":"materials","lec":"pharm-l2-4","kind":"Teaching and statements"},{"id":"q6","u":"Pharmacology","t":"mc","q":"A client starts nifedipine for hypertension. Which change in heart rate should the nurse expect?","o":["Heart rate may increase.","Heart rate will decrease.","Heart rate will fall and AV block will develop.","Marked postural drops in heart rate will occur."],"c":0,"w":"Dihydropyridines such as nifedipine block Ca++ channels in the vessels only, so they lower peripheral resistance and heart rate (and cardiac output) may increase. Verapamil and diltiazem also block cardiac channels, so heart rate is unchanged or decreased. All CCBs lower peripheral resistance with negligible postural hypotension. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Unchanged or decreased heart rate is the pattern of verapamil and diltiazem.","2":"Bradycardia and AV block are risks of central sympatholytics and of beta blockers.","3":"Postural hypotension with CCBs is negligible."},"m":{"1":"mixes up dihydropyridine and non-dihydropyridine effects"},"lp":false,"k":"pharm-ccb","src":"materials","lec":"pharm-l2-4","kind":"Recognize and interpret"},{"id":"q7","u":"Pharmacology","t":"sata","q":"A nurse reviews the pharmacology of calcium channel blockers. Which statements are accurate? Select all that apply.","o":["They bind L-type voltage-gated Ca++ channels from the inner side of the membrane.","Verapamil and diltiazem block Ca++ channels in both heart and vessels.","Dihydropyridines block Ca++ channels in the vessels only.","Their blockade can be partly reversed by beta-1 agonists.","Nicardipine has low vascular selectivity.","Short-acting nifedipine is preferred for long-term hypertension."],"c":[0,1,2,3],"w":"Calcium channel blockers bind the L-type voltage-gated Ca++ channel from the inner side of the membrane. Verapamil and diltiazem (low vascular selectivity) block channels in heart and vessels, while dihydropyridines (nifedipine high, nicardipine very high selectivity) act only on vessels. Drugs that increase Ca++ flux, such as beta-1 agonists, can partly reverse the blockade. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"4":"Nicardipine has VERY HIGH vascular selectivity; verapamil and diltiazem have low selectivity.","5":"Short-acting nifedipine has been linked to increased mortality in hypertension."},"m":{"4":"mixes up vascular selectivity of CCBs","5":"thinks short-acting nifedipine is safe"},"lp":false,"k":"pharm-ccb","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q8","u":"Pharmacology","t":"mc","q":"A client is admitted with a hypertensive emergency. Which calcium channel blocker should the nurse anticipate?","o":["Nicardipine","Short-acting nifedipine","Verapamil","Diltiazem"],"c":0,"w":"Calcium channel blockers are first-choice drugs in hypertension and are more effective in African patients. For hypertensive emergencies nicardipine is used. Long-term studies have linked short-acting nifedipine to increased mortality, whereas slow-release formulations apparently do not increase the risk. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Short-acting nifedipine is linked to increased mortality in hypertension.","2":"Verapamil is not the CCB named for hypertensive emergencies; it also blocks cardiac channels.","3":"Diltiazem is not the CCB named for hypertensive emergencies."},"m":{},"lp":false,"k":"pharm-ccb","src":"materials","lec":"pharm-l2-4","kind":"Recognize and interpret"},{"id":"q9","u":"Pharmacology","t":"tf","q":"A nurse states that short-acting nifedipine is preferred for long-term hypertension because it lowers mortality.","o":["True","False"],"c":1,"w":"False. Long-term epidemiological studies report an INCREASED risk of mortality with short-acting nifedipine in hypertension; slow-release formulations apparently do not increase this risk. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"0":"Short-acting nifedipine is linked to increased mortality."},"m":{"0":"thinks short-acting nifedipine is safe"},"lp":false,"k":"pharm-ccb","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q10","u":"Pharmacology","t":"mc","q":"A client is started on aliskiren. Which laboratory pattern should the nurse expect?","o":["Decreased angiotensin II and aldosterone with increased renin concentration","Increased angiotensin II with decreased renin","Decreased renin, angiotensin II and aldosterone","Increased bradykinin with unchanged angiotensin II"],"c":0,"w":"Aliskiren, the only renin inhibitor on the market, competitively inhibits renin, the enzyme that converts angiotensinogen to angiotensin I (the rate-limiting step). Angiotensin I, angiotensin II and aldosterone fall, and with less negative feedback the renin level rises. It is usually well tolerated but can cause hyperkalemia when combined with ACE inhibitors or ARBs. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Aliskiren lowers angiotensin II; renin RISES because feedback is removed.","2":"Renin concentration increases, not decreases.","3":"Raised bradykinin is an effect of ACE inhibitors."},"m":{"1":"reverses the renin response","2":"thinks renin falls with a renin inhibitor","3":"mixes up renin and ACE inhibitors"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Recognize and interpret"},{"id":"q11","u":"Pharmacology","t":"mc","q":"A client taking captopril reports a dry, irritating cough. Which explanation should the nurse give?","o":["Accumulation of bradykinin, prostaglandins or substance P in the lungs","Accumulation of angiotensin II in the lungs","Excess aldosterone secretion","Blockade of beta-2 receptors in the airways"],"c":0,"w":"The converting enzyme both forms angiotensin II and inactivates bradykinin. Inhibiting it lowers angiotensin II and raises bradykinin. The dry, disturbing cough may be mediated by accumulation in the lungs of bradykinin and prostaglandins or, more likely, substance P. ARBs have no effect on bradykinin, which is why they are the alternative. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"ACE inhibitors DECREASE angiotensin II formation.","2":"ACE inhibitors reduce angiotensin II-driven aldosterone; aldosterone does not cause cough.","3":"Bronchoconstriction from beta blockade is a beta-blocker effect."},"m":{"1":"thinks ACE inhibitors raise angiotensin II","3":"mixes up ACE inhibitor cough and beta-blocker bronchospasm"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q12","u":"Pharmacology","t":"sata","q":"A client is started on enalapril. Which adverse effects should the nurse monitor for? Select all that apply.","o":["Hypotension after the first doses","Dry cough","Hyperkalemia","Angioedema","Renal insufficiency in bilateral renal artery stenosis","Hypokalemia","Hypertrichosis","Positive Coombs' test"],"c":[0,1,2,3,4],"w":"ACE inhibitor adverse effects follow from less angiotensin II and more bradykinin: hypotension and postural hypotension mainly after the first doses (in salt- and water-depleted or heart failure patients), dry cough, renal insufficiency in bilateral renal artery stenosis or a stenosed solitary kidney, hyperkalemia and rare but possibly fatal angioedema. They are pregnancy category D. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"5":"ACE inhibitors cause HYPERkalemia.","6":"Hypertrichosis is an adverse effect of minoxidil.","7":"A positive Coombs' test is caused by methyldopa."},"m":{"5":"reverses the potassium effect of ACE inhibitors"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q13","u":"Pharmacology","t":"mc","q":"A client who started lisinopril last week reports swelling of the lips and tongue. Which action should the nurse take first?","o":["Treat it as a potentially fatal reaction and report it immediately.","Reassure the client that this is the common ACE inhibitor cough.","Tell the client it happens only after the first dose and will settle.","Advise taking the next dose with food."],"c":0,"w":"Angioneurotic edema is a rare adverse effect of ACE inhibitors (up to 0.3%) but it may be fatal; inhibition of bradykinin metabolism may be involved. Swelling of the lips and tongue therefore needs immediate action, unlike the common dry cough. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"The cough is a different, non-dangerous adverse effect; swelling of lips and tongue is angioedema.","2":"First-dose hypotension, not angioedema, is the effect linked to initial doses.","3":"Taking the drug with food does nothing for angioedema."},"m":{"1":"confuses angioedema with ACE inhibitor cough","2":"confuses angioedema with first-dose hypotension"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Priority / first action"},{"id":"q14","u":"Pharmacology","t":"mc","q":"A client has liver disease and needs an ACE inhibitor. Which ACE inhibitor must be activated by the liver before it works?","o":["Enalapril","Captopril","Lisinopril","Enalaprilat"],"c":0,"w":"Captopril, lisinopril and enalaprilat are active drugs. All other ACE inhibitors (enalapril, benazepril, fosinopril and others) are prodrugs that the liver converts into active metabolites. Enalaprilat is also the only one given intravenously. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Captopril is an active drug and needs no activation.","2":"Lisinopril is an active drug and needs no activation.","3":"Enalaprilat is the active form of enalapril, given IV."},"m":{"1":"thinks all ACE inhibitors are prodrugs","2":"thinks all ACE inhibitors are prodrugs","3":"mixes up enalapril and enalaprilat"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q15","u":"Pharmacology","t":"mc","q":"A client in a hypertensive emergency needs an ACE inhibitor intravenously. Which drug should the nurse anticipate?","o":["Enalaprilat","Enalapril","Captopril","Losartan"],"c":0,"w":"All ACE inhibitors except enalaprilat are given by the oral route only. Enalaprilat, the active form of enalapril, is given IV and is the ACE inhibitor used in hypertensive emergencies. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Enalapril is an oral prodrug.","2":"Captopril is given by mouth only.","3":"Losartan is an ARB given by mouth only."},"m":{"1":"mixes up enalapril and enalaprilat"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Recognize and interpret"},{"id":"q16","u":"Pharmacology","t":"sata","q":"A pregnant client at 20 weeks has hypertension. Which drug orders should the nurse question? Select all that apply.","o":["Losartan","Enalapril","Methyldopa","Labetalol"],"c":[0,1],"w":"ACE inhibitors and ARBs are pregnancy category D; ARBs carry a substantial teratogenic risk. Orders for losartan or enalapril in pregnancy should be questioned. Methyldopa is often preferred in pregnancy, and labetalol is used for hypertension in pregnancy. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"2":"Methyldopa is often preferred in pregnancy; long experience shows it is not harmful to the fetus.","3":"Labetalol is used to treat hypertension in pregnancy."},"m":{"2":"thinks methyldopa is unsafe in pregnancy","3":"thinks labetalol is unsafe in pregnancy"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q17","u":"Pharmacology","t":"mc","q":"A client who developed a cough on captopril is switched to losartan. Which statement by the client indicates correct understanding?","o":["\"Losartan blocks the angiotensin receptor, so it should not cause the same cough.\"","\"Losartan works the same way as captopril by blocking the converting enzyme.\"","\"Losartan raises bradykinin even more than captopril.\"","\"Losartan is safe if I become pregnant.\""],"c":0,"w":"Losartan competitively and selectively blocks AT1 receptors. It prevents or reverses most actions of angiotensin II and inhibits them more completely than ACE inhibitors, because enzymes other than ACE can still make angiotensin II. It has no effect on bradykinin, so it does not cause the bradykinin-related cough, which makes it the alternative to ACE inhibitors. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Losartan blocks AT1 receptors; it does not inhibit ACE.","2":"ARBs have no effect on bradykinin metabolism.","3":"ARBs are pregnancy category D with substantial teratogenic risk."},"m":{"1":"thinks ARBs inhibit ACE","3":"thinks ARBs are safe in pregnancy"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Teaching and statements"},{"id":"q18","u":"Pharmacology","t":"tf","q":"A nurse states that losartan lowers blood pressure by inhibiting the converting enzyme that forms angiotensin II.","o":["True","False"],"c":1,"w":"False. Losartan is an angiotensin II receptor antagonist: it competitively blocks AT1 receptors. Inhibiting the converting enzyme is the mechanism of ACE inhibitors such as captopril. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"0":"Losartan blocks AT1 receptors; ACE inhibitors block the enzyme."},"m":{"0":"thinks ARBs inhibit ACE"},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q19","u":"Pharmacology","t":"mc","q":"A client with diabetes and early glomerular disease is prescribed an ACE inhibitor. How does the drug slow progression of the kidney disease?","o":["It prevents angiotensin II-induced vasoconstriction of the efferent glomerular arteriole.","It dilates the afferent arteriole by releasing nitric oxide.","It increases aldosterone to retain sodium.","It blocks D1 receptors in the renal vessels."],"c":0,"w":"In diabetic glomerulopathy and hypertensive nephroangiosclerosis, ACE inhibitors decrease disease progression by preventing angiotensin II-induced vasoconstriction of the efferent glomerular arteriole. They are also first-choice in hypertension and are used after myocardial infarction and in chronic heart failure. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Nitric oxide release is the mechanism of nitroprusside.","2":"ACE inhibitors reduce angiotensin II-driven aldosterone secretion.","3":"Fenoldopam ACTIVATES D1 receptors; ACE inhibitors do not act on them."},"m":{},"lp":false,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q20","u":"Pharmacology","t":"mc","q":"A pregnant client needs treatment for chronic hypertension. Which drug is often preferred because long experience shows it is not harmful to the fetus?","o":["Methyldopa","Losartan","Enalapril","Minoxidil"],"c":0,"w":"Methyldopa is taken up by adrenergic neurons and converted to methylnorepinephrine, which activates central alpha-2 receptors and lowers sympathetic tone. It is a second-choice drug in general, but it is often preferred for hypertension in pregnancy because long experience shows it does not harm the fetus. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Losartan is pregnancy category D with substantial teratogenic risk.","2":"ACE inhibitors are pregnancy category D.","3":"Minoxidil is reserved for severe resistant hypertension because of its toxicity."},"m":{"1":"thinks ARBs are safe in pregnancy","2":"thinks ACE inhibitors are safe in pregnancy"},"lp":false,"k":"pharm-central","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q21","u":"Pharmacology","t":"mc","q":"A client taking clonidine plans to stop the drug suddenly because it causes drowsiness. Which response by the nurse is best?","o":["\"Stopping clonidine suddenly can cause a hypertensive crisis, so talk with your provider before stopping.\"","\"Stopping suddenly is safe because clonidine has no withdrawal effects.\"","\"Drowsiness means the dose is too low; take an extra tablet.\"","\"Clonidine only causes problems when given through the skin.\""],"c":0,"w":"Clonidine and methyldopa lower central adrenergic tone. Their CNS adverse effects include sedation and drowsiness, and clonidine (rarely methyldopa) can cause a hypertensive crisis when suddenly withdrawn. The client should not stop it abruptly. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Sudden withdrawal of clonidine can cause a hypertensive crisis.","2":"Sedation and drowsiness are adverse effects, not a sign of under-dosing.","3":"Transdermal clonidine causes skin eruptions, but withdrawal crisis can occur with any route."},"m":{"1":"thinks clonidine can be stopped abruptly"},"lp":false,"k":"pharm-central","src":"materials","lec":"pharm-l2-4","kind":"Teaching and statements"},{"id":"q22","u":"Pharmacology","t":"mc","q":"A client on long-term methyldopa needs a blood transfusion and the crossmatch shows a problem. Which adverse effect of methyldopa explains this?","o":["A positive Coombs' test","Lupoid syndrome","Hyperkalemia","Cyanide toxicity"],"c":0,"w":"Methyldopa is a false neurotransmitter that becomes methylnorepinephrine and stimulates central alpha-2 receptors. Besides sedation and sexual dysfunction, it can cause a positive Coombs' test, which matters when blood is crossmatched. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Lupoid syndrome is an immunological adverse effect of hydralazine.","2":"Hyperkalemia is an adverse effect of ACE inhibitors and aliskiren combinations.","3":"Cyanide toxicity is an adverse effect of nitroprusside."},"m":{"1":"mixes up methyldopa and hydralazine immune effects"},"lp":false,"k":"pharm-central","src":"materials","lec":"pharm-l2-4","kind":"Teaching and statements"},{"id":"q23","u":"Pharmacology","t":"cloze","q":"A nurse reviews how several antihypertensives act. Match each drug to its mechanism.","o":{"rows":["Methyldopa","Clonidine","Prazosin","Propranolol"],"choices":["False neurotransmitter converted to methylnorepinephrine","Activates imidazoline receptors in the medulla","Selective alpha-1 receptor blockade","Non-selective beta receptor blockade","Selective beta-1 blockade"]},"c":[0,1,2,3],"w":"Methyldopa is taken up into adrenergic neurons and converted to methylnorepinephrine, an alpha-2 agonist. Clonidine activates central alpha-2 receptors and imidazoline receptors in the medulla. Both reduce central adrenergic tone. Prazosin selectively blocks alpha-1 receptors, dilating resistance and capacitance vessels. Propranolol is a non-selective beta blocker. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"4":"Selective beta-1 blockers are atenolol, bisoprolol and metoprolol."},"m":{"4":"thinks propranolol is beta-1 selective"},"lp":false,"k":"pharm-central","src":"materials","rs":{"0":"A client asks how methyldopa lowers blood pressure. Which mechanism should the nurse describe?","1":"A nurse explains clonidine's action. Which receptor site in the medulla does it activate?","2":"A client starts prazosin. Which mechanism lowers the client's blood pressure?","3":"A client with asthma is prescribed propranolol. Which mechanism makes the nurse concerned?"},"lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q24","u":"Pharmacology","t":"mc","q":"A client receives the first dose of prazosin. Which adverse effect should the nurse monitor for most closely?","o":["Postural hypotension","Bronchoconstriction","Hypertrichosis","Cyanide toxicity","Dry cough"],"c":0,"w":"Prazosin and doxazosin selectively block alpha-1 receptors and lower blood pressure by dilating both resistance and capacitance (venous) vessels. Dilating the veins reduces venous return on standing, so postural hypotension can occur, mainly after the first dose: the \"first-dose phenomenon\". Tachycardia, palpitations and syncope may accompany it. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Bronchoconstriction is an adverse effect of beta blockers.","2":"Hypertrichosis is an adverse effect of minoxidil.","3":"Cyanide toxicity is an adverse effect of nitroprusside.","4":"Dry cough is an adverse effect of ACE inhibitors."},"m":{"1":"mixes up alpha and beta blocker effects"},"lp":false,"k":"pharm-alpha-beta","src":"materials","lec":"pharm-l2-4","kind":"Priority / first action"},{"id":"q25","u":"Pharmacology","t":"sata","q":"A client is started on a beta blocker for hypertension. Which adverse effects should the nurse teach the client about? Select all that apply.","o":["Bradycardia","Bronchoconstriction","Hypoglycemia","Rebound hypertension if stopped abruptly","Insomnia or depression","Postural hypotension","Hyperglycemia","Hypertrichosis"],"c":[0,1,2,3,4],"w":"Beta blockers lower heart rate and cardiac output and leave venous tone unchanged, so they do not cause postural hypotension. Adverse effects: bradycardia, hypotension and rebound hypertension on abrupt withdrawal; bronchoconstriction; insomnia, depression and nightmares; hypoglycemia because the liver's gluconeogenesis and glycogenolysis are impaired; and sexual dysfunction. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"5":"Beta blockers do not cause postural hypotension because venous tone is unchanged.","6":"Hyperglycemia is an adverse effect of diazoxide; beta blockers cause HYPOglycemia.","7":"Hypertrichosis is an adverse effect of minoxidil."},"m":{"5":"thinks beta blockers cause postural hypotension","6":"reverses the glucose effect of beta blockers"},"lp":false,"k":"pharm-alpha-beta","src":"materials","lec":"pharm-l2-4","kind":"Teaching and statements"},{"id":"q26","u":"Pharmacology","t":"mc","q":"A client with asthma needs a beta blocker. Which drug is beta-1 selective?","o":["Metoprolol","Propranolol","Timolol","Penbutolol","Labetalol"],"c":0,"w":"Beta blockers are divided into beta-1 selective drugs (atenolol, bisoprolol, metoprolol) and non-selective drugs (propranolol, penbutolol, timolol). Bronchoconstriction is a respiratory adverse effect of beta blockade, so selectivity matters in a client with asthma. Labetalol and carvedilol block both alpha and beta receptors. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Propranolol is a non-selective beta blocker.","2":"Timolol is a non-selective beta blocker.","3":"Penbutolol is a non-selective beta blocker.","4":"Labetalol blocks both alpha and beta receptors."},"m":{"1":"thinks propranolol is beta-1 selective"},"lp":false,"k":"pharm-alpha-beta","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q27","u":"Pharmacology","t":"mc","q":"A nurse explains how a beta blocker lowers a client's blood pressure. Which explanation is accurate?","o":["It decreases cardiac output and inhibits renin release by blocking beta-1 receptors.","It dilates both arterioles and veins by blocking alpha-1 receptors.","It opens potassium channels in arteriolar smooth muscle.","It lowers venous tone so blood pools on standing."],"c":0,"w":"Beta blockers lower blood pressure by two beta-1 effects: blocking cardiac beta-1 receptors lowers heart rate and cardiac output, and blocking beta-1 receptors on juxtaglomerular cells inhibits renin release. Venous tone is unchanged, so they do not cause postural hypotension. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Alpha-1 blockade of resistance and capacitance vessels is how prazosin works.","2":"Potassium channel opening is the mechanism of minoxidil and diazoxide.","3":"Beta blockers leave venous tone unchanged and do not cause postural hypotension."},"m":{"1":"mixes up alpha and beta blocker mechanisms"},"lp":false,"k":"pharm-alpha-beta","src":"materials","lec":"pharm-l2-4","kind":"Teaching and statements"},{"id":"q28","u":"Pharmacology","t":"mc","q":"A client has heart failure and hypertension. Which alpha-beta blocker is used to treat heart failure?","o":["Carvedilol","Labetalol","Prazosin","Esmolol"],"c":0,"w":"Labetalol and carvedilol block both alpha and beta receptors, causing vasodilation and reduced heart rate and contractility. They are used in black and elderly patients; labetalol in hypertension with pregnancy and IV for hypertensive emergencies; carvedilol to treat heart failure. Their main side effects are orthostatic hypotension and dizziness. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Labetalol is used in pregnancy and IV for hypertensive emergencies, not named for heart failure.","2":"Prazosin is a selective alpha-1 blocker.","3":"Esmolol is on the sympathoplegic list but is not an alpha-beta blocker."},"m":{"1":"mixes up labetalol and carvedilol uses"},"lp":false,"k":"pharm-alpha-beta","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q29","u":"Pharmacology","t":"cloze","q":"A nurse reviews the vasodilators used in hypertension. Match each drug to its mechanism of action.","o":{"rows":["Nitroprusside","Minoxidil","Fenoldopam","Hydralazine"],"choices":["Production of nitric oxide in arterioles and veins","K+ channel opening in arterioles","D1-receptor activation in arterioles","Uncertain; perhaps inhibition of Ca++ release and NO release","Selective alpha-1 receptor blockade"]},"c":[0,1,2,3],"w":"The direct vasodilators differ by site and mechanism. Nitroprusside acts on arterioles and veins by producing nitric oxide. Minoxidil and diazoxide open K+ channels in arterioles. Fenoldopam activates D1 receptors in arterioles. Hydralazine relaxes arterioles by an uncertain mechanism, perhaps inhibiting Ca++ release from the sarcoplasmic reticulum and stimulating NO release. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"4":"Alpha-1 blockade is the mechanism of prazosin, not a direct vasodilator."},"m":{"4":"mixes up alpha blockers and direct vasodilators"},"lp":false,"k":"pharm-vasodilators","src":"materials","rs":{"0":"A client receives a nitroprusside infusion. Which mechanism produces its vasodilation?","1":"A client with resistant hypertension starts minoxidil. Which mechanism lowers the blood pressure?","2":"A client in a hypertensive emergency receives fenoldopam. Which mechanism does it use?","3":"A nurse explains hydralazine's mechanism to a client. Which description is accurate?"},"lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q30","u":"Pharmacology","t":"mc","q":"A client has received a nitroprusside infusion for several days. Which toxicity should the nurse monitor for?","o":["Cyanide toxicity","Lupoid syndrome","Hypertrichosis","Hyperglycemia"],"c":0,"w":"Nitroprusside is rapidly metabolized by red blood cells, liberating cyanide, which is then metabolized to thiocyanate. Its half-life is about 2 minutes, so it must be given by continuous infusion. Adverse effects include excessive vasodilation, rebound hypertension, palpitations, nausea, substernal pain and cyanide toxicity. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Lupoid syndrome is an immunological adverse effect of hydralazine.","2":"Hypertrichosis is an adverse effect of minoxidil.","3":"Hyperglycemia is an adverse effect of diazoxide."},"m":{"1":"mixes up nitroprusside and hydralazine toxicity"},"lp":false,"k":"pharm-vasodilators","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q31","u":"Pharmacology","t":"tf","q":"A nurse states that nitroprusside has a half-life of about 2 minutes and must be given by continuous infusion.","o":["True","False"],"c":0,"w":"True. Nitroprusside's half-life is about 2 minutes, so it must be given by continuous infusion to be effective. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"This statement is true: half-life about 2 minutes, continuous infusion."},"m":{},"lp":false,"k":"pharm-vasodilators","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q32","u":"Pharmacology","t":"mc","q":"A client takes high-dose hydralazine. Which adverse effect is immunological rather than an extension of the drug's vasodilator action?","o":["Lupoid syndrome","Headache","Palpitations","Flushing"],"c":0,"w":"Hydralazine relaxes small arteries and arterioles. Headache, dizziness, palpitations and flushing extend that vasodilator effect. Separately, immunological reactions occur: lupoid syndrome (up to 20% with very high doses), fever, serum sickness, hemolytic anemia and vasculitis. It is used with isosorbide mononitrate in heart failure. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Headache is an extension of the pharmacological (vasodilator) effect.","2":"Palpitations are an extension of the pharmacological effect.","3":"Flushing is an extension of the pharmacological effect."},"m":{"1":"mixes up immune and pharmacological effects","2":"mixes up immune and pharmacological effects","3":"mixes up immune and pharmacological effects"},"lp":false,"k":"pharm-vasodilators","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q33","u":"Pharmacology","t":"mc","q":"A client on minoxidil for severe hypertension notices increased hair growth on the face and arms. How should the nurse interpret this?","o":["It is hypertrichosis, a known adverse effect of minoxidil.","It is a sign of cyanide toxicity.","It is part of a lupoid syndrome.","It means the drug is acting as a diuretic."],"c":0,"w":"Minoxidil is a prodrug that the liver converts to an active K+ channel opener in arterioles. Because of its toxicity it is reserved for severe hypertension that responds poorly to other drugs. Adverse effects are salt and water retention, tachycardia, palpitations, flushing and hypertrichosis, which is why it is also used locally to treat baldness. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Cyanide toxicity comes from nitroprusside.","2":"Lupoid syndrome is a hydralazine adverse effect.","3":"Minoxidil causes salt and water retention, not diuresis."},"m":{"2":"mixes up minoxidil and hydralazine effects"},"lp":false,"k":"pharm-vasodilators","src":"materials","lec":"pharm-l2-4","kind":"Recognize and interpret"},{"id":"q34","u":"Pharmacology","t":"mc","q":"A client with diabetes receives diazoxide for a hypertensive emergency. Which value should the nurse monitor closely?","o":["Blood glucose, because diazoxide causes hyperglycemia","Urine output, because diazoxide causes strong diuresis","Blood cyanide, because diazoxide releases cyanide","Coombs' test, because diazoxide causes hemolysis"],"c":0,"w":"Diazoxide is a potassium channel opener used for hypertensive emergencies. It resembles the thiazides but does not cause diuresis, apparently because it lacks a sulfonamide group. Adverse effects are salt and water retention with edema, hyperglycemia, and excessive hypotension, flushing and headache. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Diazoxide does NOT cause diuresis (it lacks a sulfonamide group); it causes salt and water retention.","2":"Cyanide is released from nitroprusside.","3":"A positive Coombs' test is caused by methyldopa."},"m":{"1":"thinks diazoxide is a diuretic"},"lp":false,"k":"pharm-vasodilators","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q35","u":"Pharmacology","t":"mc","q":"Fenoldopam is ordered for several clients with severe hypertension. For which client should the nurse question the order?","o":["A client with glaucoma","A client with a hypertensive emergency","A client with hyperkalemia","A client who needs renal vasodilation"],"c":0,"w":"Fenoldopam, the only D1-receptor agonist, is given by IV infusion for hypertensive emergencies. It dilates mainly renal and mesenteric vessels and increases natriuresis. Its adverse effects explain its contraindications: reflex tachycardia (angina), a dose-dependent rise in intraocular pressure (glaucoma) and a fall in serum potassium (hypokalemic states). (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"A hypertensive emergency is fenoldopam's therapeutic use.","2":"Fenoldopam lowers potassium; the contraindication is HYPOkalemia.","3":"Fenoldopam mainly dilates renal and mesenteric vessels."},"m":{"2":"reverses the potassium contraindication"},"lp":false,"k":"pharm-vasodilators","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q36","u":"Pharmacology","t":"mc","q":"A woman with hypertension is in early pregnancy. Which antihypertensive is contraindicated because it is an angiotensin-converting enzyme (ACE) inhibitor?","o":["Enalapril","Labetalol","Methyldopa","Extended-release nifedipine"],"c":0,"w":"ACE inhibitors such as enalapril are pregnancy category D and should not be used in pregnancy. Methyldopa is often preferred and labetalol is used for hypertension in pregnancy. (Shams Practices QB, 2025 Q26; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Labetalol is an alpha-beta blocker used for hypertension in pregnancy.","2":"Methyldopa is often preferred in pregnancy because it is not harmful to the fetus.","3":"Nifedipine is a dihydropyridine CCB, not an ACE inhibitor."},"m":{"2":"thinks methyldopa is unsafe in pregnancy"},"lp":true,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q37","u":"Pharmacology","t":"mc","q":"A patient taking lisinopril and amlodipine for hypertension develops hyperkalemia. Which medication is the most likely cause?","o":["Lisinopril","Amlodipine","Acetaminophen","Loratadine"],"c":0,"w":"ACE inhibitors such as lisinopril reduce angiotensin II and aldosterone and cause hyperkalemia. Amlodipine is a dihydropyridine CCB and does not raise potassium. (Shams Practices QB, 2025 Q27; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Amlodipine is a calcium channel blocker, which does not cause hyperkalemia.","2":"Acetaminophen is a pain reliever, not an antihypertensive.","3":"Loratadine is an antihistamine."},"m":{},"lp":true,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q38","u":"Pharmacology","t":"mc","q":"Which ACE inhibitor can be administered intravenously to treat hypertension when oral therapy is impractical?","o":["Enalaprilat","Captopril","Lisinopril","Ramipril"],"c":0,"w":"All ACE inhibitors except enalaprilat are given orally only; enalaprilat is the IV form used in hypertensive emergencies. (Shams Practices QB, 2025 Q30; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Captopril is given by mouth only.","2":"Lisinopril is given by mouth only.","3":"Ramipril is an oral ACE inhibitor (a prodrug)."},"m":{"1":"thinks captopril can be given IV"},"lp":true,"k":"pharm-ras","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q39","u":"Pharmacology","t":"mc","q":"Which change has been proposed to contribute to the long-term vasodilator effect of thiazide diuretics?","o":["Decreased sodium content in vascular smooth muscle","Increased intracellular calcium in vascular smooth muscle","Increased alpha₁-receptor stimulation in vascular smooth muscle","Increased endothelin-mediated vasoconstriction"],"c":0,"w":"Depletion of body Na+ lowers smooth muscle Na+, which lowers intracellular Ca++ through the Na/Ca exchanger and relaxes arterioles. (Shams Practices QB, 2025 Q28; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Intracellular calcium FALLS, which is why the vessels relax.","2":"Alpha-1 stimulation would constrict vessels.","3":"Endothelin-mediated vasoconstriction would raise resistance."},"m":{"1":"reverses the calcium effect of diuretics"},"lp":true,"k":"pharm-diuretics","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q40","u":"Pharmacology","t":"mc","q":"Which potentially toxic metabolite can accumulate during a prolonged intravenous infusion of sodium nitroprusside?","o":["Thiocyanate","Urea","Bilirubin","Creatinine"],"c":0,"w":"Red blood cells metabolize nitroprusside, releasing cyanide, which is converted to thiocyanate; both can accumulate with prolonged infusion. (Shams Practices QB, 2025 Q29; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Urea is a normal nitrogen waste product.","2":"Bilirubin comes from hemoglobin breakdown.","3":"Creatinine comes from muscle creatine."},"m":{},"lp":true,"k":"pharm-vasodilators","src":"materials","lec":"pharm-l2-4","kind":"Apply a fact"},{"id":"q41","u":"Pharmacology","t":"mc","q":"Beta blocker drug that can also block K channels?","o":["Sotalol","Atenolol","Metoprolol","Esmolol"],"c":0,"w":"Sotalol is a beta blocker that also blocks K+ channels, so it acts as a class III antiarrhythmic. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q56; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Atenolol is a selective beta-1 blocker without K+ channel block.","2":"Metoprolol is a selective beta-1 blocker without K+ channel block.","3":"Esmolol is a short-acting beta-1 blocker without K+ channel block."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q42","u":"Pharmacology","t":"mc","q":"During antiarrhythmic treatment a patient suffers from headache and tinnitus. Which drug is the cause?","o":["Quinidine","Omeprazole","Metformin","Levothyroxine"],"c":0,"w":"Quinidine causes cinchonism: headache, dizziness and tinnitus. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q57; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Metformin is a diabetes drug.","3":"Levothyroxine is thyroid hormone replacement."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q43","u":"Pharmacology","t":"mc","q":"In paroxysmal supraventricular tachycardia we choose?","o":["Adenosine","Atorvastatin","Levothyroxine","Omeprazole"],"c":0,"w":"Adenosine is the drug of choice to stop paroxysmal supraventricular tachycardia. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q59; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Atorvastatin is a statin for high cholesterol.","2":"Levothyroxine is thyroid hormone replacement.","3":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q44","u":"Pharmacology","t":"mc","q":"Which drug blocks Na and K channels?","o":["Procainamide","Omeprazole","Metformin","Levothyroxine"],"c":0,"w":"Procainamide is a class IA antiarrhythmic that blocks both Na+ and K+ channels. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q83; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Metformin is a diabetes drug.","3":"Levothyroxine is thyroid hormone replacement."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q45","u":"Pharmacology","t":"mc","q":"A patient came to the ER complaining of ventricular arrhythmia. After treatment the patient complained of headaches, dizziness and tinnitus. Which drug caused those symptoms?","o":["Quinidine","Adenosine","Esmolol","Atropine"],"c":0,"w":"Headache, dizziness and tinnitus are cinchonism, the classic adverse effect of quinidine. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q84; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Adenosine causes brief flushing and chest discomfort, not tinnitus.","2":"Esmolol is a short-acting beta blocker.","3":"Atropine is an anticholinergic used for bradycardia."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q46","u":"Pharmacology","t":"mc","q":"Which drug works on both ventricular and supraventricular arrhythmias?","o":["Amiodarone","Atorvastatin","Famotidine","Levothyroxine"],"c":0,"w":"Amiodarone is a broad-spectrum antiarrhythmic effective in both ventricular and supraventricular arrhythmias. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q85; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Atorvastatin is a statin.","2":"Famotidine is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Levothyroxine is thyroid hormone replacement."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q47","u":"Pharmacology","t":"mc","q":"Which of the following drugs is not in class I?","o":["Amiodarone","Quinidine","Lidocaine","Flecainide"],"c":0,"w":"Quinidine (IA), lidocaine (IB) and flecainide (IC) are class I Na+ channel blockers; amiodarone is class III. Note: the paper prints only options a-c but keys \"d\"; option d, \"Amiodarone\", is restored here as the class III drug used elsewhere in this bank. Not in your uploaded Mid 2 slides. (Shams Practices QB, 2023 Q111; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Quinidine is a class IA antiarrhythmic.","2":"Lidocaine is a class IB antiarrhythmic.","3":"Flecainide is a class IC antiarrhythmic."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q48","u":"Pharmacology","t":"mc","q":"A patient came to the clinic with pulmonary fibrosis; respiratory cultures were negative, and he noted he had taken an antiarrhythmic drug. Which drug do you suspect?","o":["Amiodarone","Adenosine","Esmolol","Lidocaine"],"c":0,"w":"Amiodarone causes pulmonary fibrosis. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2023 Q114; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Adenosine acts for seconds and does not cause fibrosis.","2":"Esmolol is a short-acting beta blocker.","3":"Lidocaine is a class IB drug that does not cause lung fibrosis."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Recognize and interpret"},{"id":"q49","u":"Pharmacology","t":"mc","q":"A patient was having side effects of headache, tinnitus and dizziness. Which drug is most likely to cause such side effects?","o":["Quinidine","Polyethylene glycol","Docusate","Calcium carbonate"],"c":0,"w":"Quinidine causes cinchonism: headache, tinnitus and dizziness. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q126; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Polyethylene glycol is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Docusate is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Calcium carbonate is an antacid and calcium supplement."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q50","u":"Pharmacology","t":"mc","q":"This drug blocks Na+ channels with no effect on the action potential duration:","o":["Flecainide","Amlodipine","Lisinopril","Losartan"],"c":0,"w":"Flecainide (class IC) blocks Na+ channels strongly with little effect on action potential duration. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q128; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Amlodipine is a dihydropyridine calcium channel blocker.","2":"Lisinopril is an ACE inhibitor.","3":"Losartan is an angiotensin receptor blocker."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q51","u":"Pharmacology","t":"mc","q":"Class 3 antiarrhythmics are:","o":["Potassium channel blockers","Sodium channel blockers","Beta receptor blockers","Calcium channel blockers"],"c":0,"w":"Class III antiarrhythmics (amiodarone, sotalol) block K+ channels and prolong repolarization. Class I block Na+, class II are beta blockers, class IV block Ca++. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-1 Q152; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Sodium channel blockers are class I.","2":"Beta blockers are class II.","3":"Calcium channel blockers are class IV."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q52","u":"Pharmacology","t":"mc","q":"Drug for intraoperative use:","o":["Esmolol","Ezetimibe","Cholestyramine","Fenofibrate"],"c":0,"w":"Esmolol is a very short-acting IV beta blocker, so it suits intraoperative control of heart rate and pressure. It is on your hypertension drug list; its intraoperative use is from the bank's key. (Shams Practices QB, Unknown-1 Q153; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Ezetimibe blocks intestinal cholesterol absorption.","2":"Cholestyramine binds bile acids in the gut.","3":"Fenofibrate lowers triglycerides."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q53","u":"Pharmacology","t":"mc","q":"Gray-blue skin discoloration in sun-exposed areas (smurf skin) is caused by:","o":["Amiodarone","Adenosine","Esmolol","Diltiazem"],"c":0,"w":"Amiodarone can cause blue-gray discoloration of sun-exposed skin. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-1 Q154; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Adenosine acts for seconds and has no skin effect.","2":"Esmolol is a short-acting beta blocker.","3":"Diltiazem is a non-dihydropyridine CCB."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q54","u":"Pharmacology","t":"mc","q":"During antihyperlipidemic treatment a patient suffers from muscle pain. Which drug is the cause?","o":["Lovastatin","Famotidine","Loratadine","Polyethylene glycol"],"c":0,"w":"Statins such as lovastatin cause muscle pain (myopathy). Note: the paper prints only options a-c but keys \"d\"; option d, \"Lovastatin\", is restored from the matching questions in this bank. Not in your uploaded Mid 2 slides. (Shams Practices QB, 2024 Nov Q58; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Famotidine is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Loratadine is an antihistamine.","3":"Polyethylene glycol is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q55","u":"Pharmacology","t":"mc","q":"Niacin (antihyperlipidemic) can cause?","o":["Hyperuricemia","Iron-deficiency anemia","Vitamin B12 deficiency","Hypocalcemia"],"c":0,"w":"Niacin can raise uric acid (hyperuricemia) and cause flushing. Your slides mention large-dose vitamin B3 as a cholesterol-lowering dietary factor; its adverse effects are from the bank's key. (Shams Practices QB, 2024 Nov Q60; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Iron-deficiency anemia is not a niacin effect.","2":"B12 deficiency is not a niacin effect.","3":"Hypocalcemia is not a niacin effect."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q56","u":"Pharmacology","t":"mc","q":"A patient diagnosed with hyperlipidemia is prescribed cholestyramine. What is the action of this drug?","o":["Binds bile acids in the intestine and is excreted with them in the stool","Blocks beta₁ receptors in the heart","Inhibits gastric acid secretion","Blocks sodium channels in peripheral nerves"],"c":0,"w":"Cholestyramine is a bile acid sequestrant: it binds bile acids in the gut so they are lost in the stool, and the liver uses cholesterol to make more. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q74; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Blocking beta-1 receptors is the action of beta blockers.","2":"Inhibiting gastric acid is the action of drugs such as omeprazole.","3":"Blocking nerve sodium channels is the action of local anesthetics."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q57","u":"Pharmacology","t":"mc","q":"Which of the following is the drug of choice for hypertriglyceridemia?","o":["Fenofibrate","Amlodipine","Omeprazole","Loratadine"],"c":0,"w":"Fibrates such as fenofibrate are the drugs of choice for high triglycerides. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q86; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Amlodipine is a calcium channel blocker.","2":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Loratadine is an antihistamine."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q58","u":"Pharmacology","t":"mc","q":"A woman came to the ER complaining of muscle pain. She has a history of hyperlipidemia and is taking medication to treat it. Which drug caused her pain?","o":["Lovastatin","Pantoprazole","Cetirizine","Docusate"],"c":0,"w":"Statins such as lovastatin can cause myalgia and myopathy. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q87; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pantoprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Cetirizine is an antihistamine.","3":"Docusate is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q59","u":"Pharmacology","t":"mc","q":"Which of the following drugs is a selective inhibitor of intestinal cholesterol absorption?","o":["Ezetimibe","Fenofibrate","Atorvastatin","Niacin"],"c":0,"w":"Ezetimibe selectively blocks cholesterol absorption in the intestine. Your slides describe the same idea for plant sterols. The drug answer is from the bank's key. (Shams Practices QB, 2023 Q112; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Fenofibrate lowers triglycerides.","2":"Atorvastatin inhibits HMG CoA reductase.","3":"Niacin lowers triglycerides and raises HDL."},"m":{"2":"mixes up statins and ezetimibe"},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q60","u":"Pharmacology","t":"mc","q":"A patient treated with an antihyperlipidemic drug has rhabdomyolysis. Which drug has been used to treat him?","o":["Lovastatin","Loratadine","Famotidine","Polyethylene glycol"],"c":0,"w":"Statins can cause rhabdomyolysis, the severe form of statin myopathy. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2023 Q113; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Loratadine is an antihistamine.","2":"Famotidine is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Polyethylene glycol is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q61","u":"Pharmacology","t":"mc","q":"Adverse effect of niacin includes?","o":["Skin flushing","Gingival hyperplasia","Tooth discoloration","Orange discoloration of urine"],"c":0,"w":"Niacin causes skin flushing. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q127; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Gingival hyperplasia is not a niacin effect.","2":"Tooth discoloration is not a niacin effect.","3":"Orange urine is not a niacin effect."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q62","u":"Pharmacology","t":"mc","q":"A 62-year-old patient is on lovastatin; cholesterol levels decreased but he still has high triglycerides and low HDL. Which drug should be used?","o":["Niacin","Lisinopril","Omeprazole","Loratadine"],"c":0,"w":"Niacin lowers triglycerides and raises HDL, so it covers what a statin leaves. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q129; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Lisinopril is an ACE inhibitor for blood pressure.","2":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Loratadine is an antihistamine."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q63","u":"Pharmacology","t":"mc","q":"A patient with increased nitrate tolerance is treated by?","o":["No therapy for a brief time","Shortening the interval between nitrate doses","Switching to continuous nitrate infusion","Adding an extra nitrate dose during the nitrate-free interval"],"c":0,"w":"Tolerance to nitrates develops with continuous exposure and is prevented or reversed by a daily nitrate-free interval. Your slides list nitrates as coronary dilators; tolerance is from the bank's key. (Shams Practices QB, Unknown-2 Q170; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Shorter dosing intervals give more continuous exposure, worsening tolerance.","2":"Continuous infusion is the setting in which tolerance develops.","3":"Filling the nitrate-free interval removes the break that prevents tolerance."},"m":{},"lp":true,"k":"pharm-antianginal","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q64","u":"Pharmacology","t":"mc","q":"Beta blocker action in angina is to?","o":["Decrease O₂ demand","Increase heart rate through β₁ stimulation","Increase myocardial contractility through β₁ stimulation","Increase renin release through β₁ stimulation"],"c":0,"w":"Beta blockers block cardiac beta-1 receptors, lowering heart rate and contractility, so the heart needs less oxygen; your slides list exertional angina among their uses. (Shams Practices QB, Unknown-2 Q171; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Beta blockers DEcrease heart rate by blocking beta-1.","2":"Beta blockers DEcrease contractility.","3":"Beta blockers INHIBIT renin release from juxtaglomerular cells."},"m":{"1":"thinks beta blockers stimulate beta receptors"},"lp":true,"k":"pharm-antianginal","src":"materials","lec":"pharm-pp","kind":"Apply a fact"},{"id":"q65","u":"Pharmacology","t":"mc","q":"Contraindication of nitrate is?","o":["Hyperthyroidism","Myopia","Lactose intolerance","Seasonal allergic rhinitis"],"c":0,"w":"The bank keys hyperthyroidism. Note: this is not in your slides, and standard nitrate contraindications are mainly hypotension and recent use of PDE-5 inhibitors; hyperthyroidism is simply the only cardiovascular-relevant option offered here. Check with your instructor. (Shams Practices QB, Unknown-2 Q175; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Myopia is short-sightedness, unrelated to nitrates.","2":"Lactose intolerance is an enzyme deficiency, unrelated to nitrates.","3":"Allergic rhinitis is nasal allergy, unrelated to nitrates."},"m":{},"lp":true,"k":"pharm-antianginal","src":"materials","lec":"pharm-pp","kind":"Apply a fact"}],"concepts":{"pharm-classes":{"title":"Hypertension: definition and drug classes","unit":"Pharmacology","points":["Hypertension is defined as 130/80 mm Hg or higher (ACC/AHA 2023 and Saudi Heart Association).","Classes: diuretics, calcium channel blockers, drugs acting on the renin-angiotensin system, sympatholytic drugs, vasodilators.","Drug list: hydrochlorothiazide, indapamide, furosemide, spironolactone (diuretics); clonidine, methyldopa, prazosin, propranolol, labetalol, esmolol (sympathoplegic); hydralazine, nitroprusside, minoxidil, diazoxide, fenoldopam, CCBs (vasodilators); captopril, enalapril, enalaprilat (ACE inhibitors); losartan (ARB); aliskiren (renin inhibitor)."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q0","q1"],"lec":"pharm-l2-4","sec":[{"id":"pharm-classes","title":"Hypertension: definition and drug classes","key":["Hypertension is defined as 130/80 mm Hg or higher (ACC/AHA 2023 and Saudi Heart Association).","Classes: diuretics, calcium channel blockers, drugs acting on the renin-angiotensin system, sympatholytic drugs, vasodilators.","Drug list: hydrochlorothiazide, indapamide, furosemide, spironolactone (diuretics); clonidine, methyldopa, prazosin, propranolol, labetalol, esmolol (sympathoplegic); hydralazine, nitroprusside, minoxidil, diazoxide, fenoldopam, CCBs (vasodilators); captopril, enalapril, enalaprilat (ACE inhibitors); losartan (ARB); aliskiren (renin inhibitor)."]}]},"pharm-diuretics":{"title":"Diuretics in hypertension","unit":"Pharmacology","points":["Early: diuretics lower plasma volume and cardiac output. After 4-8 weeks volume and output return toward normal while peripheral vascular resistance falls (arteriolar vasodilation).","Main mechanism of the vasodilation: depletion of body Na+, lowering smooth muscle Na+ and then intracellular Ca++ via the Na/Ca exchanger.","Thiazides are first choice; antihypertensive doses are lower than diuretic doses.","Loop diuretics are preferable in malignant hypertension and chronic kidney disease.","Potassium-sparing diuretics are used with thiazides to counteract hypokalemia; spironolactone is used in hyperaldosteronism."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q2","q3","q4","q5","q39"],"lec":"pharm-l2-4","sec":[{"id":"pharm-diuretics","title":"Diuretics in hypertension","key":["Early: diuretics lower plasma volume and cardiac output. After 4-8 weeks volume and output return toward normal while peripheral vascular resistance falls (arteriolar vasodilation).","Main mechanism of the vasodilation: depletion of body Na+, lowering smooth muscle Na+ and then intracellular Ca++ via the Na/Ca exchanger.","Thiazides are first choice; antihypertensive doses are lower than diuretic doses.","Loop diuretics are preferable in malignant hypertension and chronic kidney disease.","Potassium-sparing diuretics are used with thiazides to counteract hypokalemia; spironolactone is used in hyperaldosteronism."]}]},"pharm-ccb":{"title":"Calcium channel blockers","unit":"Pharmacology","points":["CCBs bind the L-type voltage-gated Ca++ channel from the inner side of the membrane.","Verapamil and diltiazem block Ca++ channels in heart and vessels; dihydropyridines (nifedipine, nicardipine) block vessels only.","Heart rate: increased with dihydropyridines; unchanged or decreased with verapamil and diltiazem. Postural hypotension is negligible.","First-choice drugs, more effective in African patients; nicardipine for hypertensive emergencies; short-acting nifedipine increases mortality."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q6","q7","q8","q9"],"lec":"pharm-l2-4","sec":[{"id":"pharm-ccb","title":"Calcium channel blockers","key":["CCBs bind the L-type voltage-gated Ca++ channel from the inner side of the membrane.","Verapamil and diltiazem block Ca++ channels in heart and vessels; dihydropyridines (nifedipine, nicardipine) block vessels only.","Heart rate: increased with dihydropyridines; unchanged or decreased with verapamil and diltiazem. Postural hypotension is negligible.","First-choice drugs, more effective in African patients; nicardipine for hypertensive emergencies; short-acting nifedipine increases mortality."]}]},"pharm-ras":{"title":"Renin inhibitors, ACE inhibitors and ARBs","unit":"Pharmacology","points":["Aliskiren competitively inhibits renin: angiotensin I, II and aldosterone fall and renin rises; hyperkalemia when combined with ACE inhibitors or ARBs.","ACE inhibitors block conversion of angiotensin I to II and raise bradykinin; less angiotensin II removes negative feedback, so renin rises.","Captopril, lisinopril and enalaprilat are active drugs; enalapril, benazepril and fosinopril are prodrugs activated by the liver; enalaprilat is the IV form.","ACE inhibitor adverse effects: first-dose hypotension, dry cough (bradykinin, prostaglandins or substance P), renal insufficiency in bilateral renal artery stenosis, hyperkalemia, angioedema; pregnancy category D.","ARBs (losartan) selectively block AT1 receptors, inhibit angiotensin more completely and have no effect on bradykinin; contraindicated in bilateral renal artery stenosis and pregnancy."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q10","q11","q12","q13","q14","q15","q16","q17","q18","q19","q36","q37","q38"],"lec":"pharm-l2-4","sec":[{"id":"pharm-ras","title":"Renin inhibitors, ACE inhibitors and ARBs","key":["Aliskiren competitively inhibits renin: angiotensin I, II and aldosterone fall and renin rises; hyperkalemia when combined with ACE inhibitors or ARBs.","ACE inhibitors block conversion of angiotensin I to II and raise bradykinin; less angiotensin II removes negative feedback, so renin rises.","Captopril, lisinopril and enalaprilat are active drugs; enalapril, benazepril and fosinopril are prodrugs activated by the liver; enalaprilat is the IV form.","ACE inhibitor adverse effects: first-dose hypotension, dry cough (bradykinin, prostaglandins or substance P), renal insufficiency in bilateral renal artery stenosis, hyperkalemia, angioedema; pregnancy category D.","ARBs (losartan) selectively block AT1 receptors, inhibit angiotensin more completely and have no effect on bradykinin; contraindicated in bilateral renal artery stenosis and pregnancy."]}]},"pharm-central":{"title":"Centrally acting sympatholytics","unit":"Pharmacology","points":["Clonidine and methyldopa are alpha-2 receptor agonists; methyldopa is a false neurotransmitter converted to methylnorepinephrine; clonidine also acts on imidazoline receptors in the medulla.","The final common effect is a decrease in central adrenergic tone.","Second-choice drugs; methyldopa is often preferred in pregnancy.","Adverse effects: sedation, depression, bradycardia, AV block, sexual dysfunction; clonidine withdrawal can cause a hypertensive crisis; methyldopa can cause a positive Coombs' test."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q20","q21","q22","q23"],"lec":"pharm-l2-4","sec":[{"id":"pharm-central","title":"Centrally acting sympatholytics","key":["Clonidine and methyldopa are alpha-2 receptor agonists; methyldopa is a false neurotransmitter converted to methylnorepinephrine; clonidine also acts on imidazoline receptors in the medulla.","The final common effect is a decrease in central adrenergic tone.","Second-choice drugs; methyldopa is often preferred in pregnancy.","Adverse effects: sedation, depression, bradycardia, AV block, sexual dysfunction; clonidine withdrawal can cause a hypertensive crisis; methyldopa can cause a positive Coombs' test."]}]},"pharm-alpha-beta":{"title":"Alpha blockers, beta blockers and alpha-beta blockers","unit":"Pharmacology","points":["Prazosin and doxazosin selectively block alpha-1 receptors, dilating resistance and capacitance vessels; postural hypotension after the first dose (\"first-dose phenomenon\").","Beta blockers lower cardiac output (cardiac beta-1) and inhibit renin release (juxtaglomerular beta-1); they do not cause postural hypotension.","Selective beta-1: atenolol, bisoprolol, metoprolol. Non-selective: propranolol, penbutolol, timolol.","Beta-blocker adverse effects: bradycardia, rebound hypertension on abrupt withdrawal, bronchoconstriction, insomnia, depression, hypoglycemia, sexual dysfunction.","Labetalol and carvedilol block alpha and beta; labetalol for hypertension in pregnancy and IV in emergencies; carvedilol for heart failure."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q24","q25","q26","q27","q28"],"lec":"pharm-l2-4","sec":[{"id":"pharm-alpha-beta","title":"Alpha blockers, beta blockers and alpha-beta blockers","key":["Prazosin and doxazosin selectively block alpha-1 receptors, dilating resistance and capacitance vessels; postural hypotension after the first dose (\"first-dose phenomenon\").","Beta blockers lower cardiac output (cardiac beta-1) and inhibit renin release (juxtaglomerular beta-1); they do not cause postural hypotension.","Selective beta-1: atenolol, bisoprolol, metoprolol. Non-selective: propranolol, penbutolol, timolol.","Beta-blocker adverse effects: bradycardia, rebound hypertension on abrupt withdrawal, bronchoconstriction, insomnia, depression, hypoglycemia, sexual dysfunction.","Labetalol and carvedilol block alpha and beta; labetalol for hypertension in pregnancy and IV in emergencies; carvedilol for heart failure."]}]},"pharm-vasodilators":{"title":"Direct vasodilators","unit":"Pharmacology","points":["Nitroprusside: arterioles and veins, nitric oxide; metabolized by red cells releasing cyanide (to thiocyanate); half-life about 2 minutes, continuous infusion; for emergencies, severe heart failure, controlled hypotension.","Hydralazine: arterioles, uncertain mechanism; headache, palpitations, flushing; immunological lupoid syndrome (up to 20% at very high doses).","Minoxidil: arteriolar K+ channel opener, a prodrug; salt and water retention, tachycardia, hypertrichosis; also used for baldness.","Diazoxide: K+ channel opener without diuresis (lacks a sulfonamide group); salt and water retention, hyperglycemia; for hypertensive emergencies.","Fenoldopam: IV D1 agonist, renal and mesenteric vasodilation and natriuresis; reflex tachycardia, raised intraocular pressure, low potassium; contraindicated in angina, glaucoma and hypokalemia."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q29","q30","q31","q32","q33","q34","q35","q40"],"lec":"pharm-l2-4","sec":[{"id":"pharm-vasodilators","title":"Direct vasodilators","key":["Nitroprusside: arterioles and veins, nitric oxide; metabolized by red cells releasing cyanide (to thiocyanate); half-life about 2 minutes, continuous infusion; for emergencies, severe heart failure, controlled hypotension.","Hydralazine: arterioles, uncertain mechanism; headache, palpitations, flushing; immunological lupoid syndrome (up to 20% at very high doses).","Minoxidil: arteriolar K+ channel opener, a prodrug; salt and water retention, tachycardia, hypertrichosis; also used for baldness.","Diazoxide: K+ channel opener without diuresis (lacks a sulfonamide group); salt and water retention, hyperglycemia; for hypertensive emergencies.","Fenoldopam: IV D1 agonist, renal and mesenteric vasodilation and natriuresis; reflex tachycardia, raised intraocular pressure, low potassium; contraindicated in angina, glaucoma and hypokalemia."]}]},"pharm-antiarrhythmic":{"title":"Antiarrhythmic drugs (past papers)","unit":"Pharmacology","points":["Class I antiarrhythmics block Na+ channels: quinidine and procainamide (IA, also block K+), lidocaine (IB), flecainide (IC, no effect on action potential duration).","Quinidine causes cinchonism: headache, dizziness and tinnitus.","Class III antiarrhythmics block K+ channels: sotalol (also a beta blocker) and amiodarone.","Amiodarone treats both ventricular and supraventricular arrhythmias; it can cause pulmonary fibrosis and gray-blue (smurf) skin.","Adenosine is the choice for paroxysmal supraventricular tachycardia; esmolol is used intraoperatively."],"source":"Shams Practices QB (past papers); not in your uploaded slides","items":["q41","q42","q43","q44","q45","q46","q47","q48","q49","q50","q51","q52","q53"],"lec":"pharm-pp","sec":[{"id":"pharm-antiarrhythmic","title":"Antiarrhythmic drugs (past papers)","key":["Class I antiarrhythmics block Na+ channels: quinidine and procainamide (IA, also block K+), lidocaine (IB), flecainide (IC, no effect on action potential duration).","Quinidine causes cinchonism: headache, dizziness and tinnitus.","Class III antiarrhythmics block K+ channels: sotalol (also a beta blocker) and amiodarone.","Amiodarone treats both ventricular and supraventricular arrhythmias; it can cause pulmonary fibrosis and gray-blue (smurf) skin.","Adenosine is the choice for paroxysmal supraventricular tachycardia; esmolol is used intraoperatively."]}]},"pharm-lipid":{"title":"Lipid-lowering drugs (past papers)","unit":"Pharmacology","points":["Statins (lovastatin, atorvastatin) competitively inhibit HMG CoA reductase; they can cause muscle pain and rhabdomyolysis.","Niacin lowers triglycerides and raises HDL; adverse effects are skin flushing and hyperuricemia.","Fenofibrate is the drug of choice for hypertriglyceridemia; ezetimibe selectively inhibits intestinal cholesterol absorption; cholestyramine binds bile acids in the intestine."],"source":"Shams Practices QB (past papers); not in your uploaded slides","items":["q54","q55","q56","q57","q58","q59","q60","q61","q62"],"lec":"pharm-pp","sec":[{"id":"pharm-lipid","title":"Lipid-lowering drugs (past papers)","key":["Statins (lovastatin, atorvastatin) competitively inhibit HMG CoA reductase; they can cause muscle pain and rhabdomyolysis.","Niacin lowers triglycerides and raises HDL; adverse effects are skin flushing and hyperuricemia.","Fenofibrate is the drug of choice for hypertriglyceridemia; ezetimibe selectively inhibits intestinal cholesterol absorption; cholestyramine binds bile acids in the intestine."]}]},"pharm-antianginal":{"title":"Nitrates and beta blockers in angina (past papers)","unit":"Pharmacology","points":["Nitrate tolerance is treated by a nitrate-free interval (no therapy for a brief time).","Beta blockers relieve angina by decreasing myocardial O2 demand."],"source":"Shams Practices QB (past papers); nitrates and beta blockers for IHD are on Physiology L9 slides","items":["q63","q64","q65"],"lec":"pharm-pp","sec":[{"id":"pharm-antianginal","title":"Nitrates and beta blockers in angina (past papers)","key":["Nitrate tolerance is treated by a nitrate-free interval (no therapy for a brief time).","Beta blockers relieve angina by decreasing myocardial O2 demand."]}]}},"lectures":[{"id":"pharm-l2-4","unit":"Pharmacology","short":"Pharmacology L2-L4","title":"Treatment of hypertension"},{"id":"pharm-pp","unit":"Pharmacology","short":"Pharmacology past papers",
