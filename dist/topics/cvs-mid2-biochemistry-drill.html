  <h2>Read me</h2>
  <p>This exam has two pages that work as one system: the <b>Drill</b> finds what you do not know and proves when you do, and the <b>Mastery Guide</b> teaches it again. Every fact on a Fix my misses card in the Drill is in the Guide section it links to.</p>

  <h3>How to use the Drill</h3>
  <ol>
    <li><b>Start with the pre-test.</b> It asks 3 questions from every topic and gives each topic a level: Strong (80% and up), Okay (60-79%) or Weak (under 60%). It never uses last-pass questions, so those stay fresh.</li>
    <li><b>Or go lecture by lecture.</b> The "By lecture" card gives every lecture its own pre-test (up to 8 questions), its own last pass, a level, and a Guide button that opens only that lecture's sections.</li>
    <li><b>Think first.</b> Each question appears without its choices for 10-15 seconds. Answer it in your head before the choices show up. Turn the timer off on any question if you need to.</li>
    <li><b>Be honest after a right answer.</b> Choose "Knew it" or "I guessed" (key G). A guess comes back sooner.</li>
    <li><b>Read the "why" on every miss.</b> You get why your pick is wrong, the key idea and the concept card. A different question on the same concept follows 3-6 questions later.</li>
    <li><b>Use short daily sessions.</b> Pick 20 questions or a 30-minute timed plan. Questions you just answered rest before they come back, so each session is new work.</li>
    <li><b>Finish with the last pass.</b> It asks every question from the cases asked in class, the slide exercises and the facts flagged on slides, shakiest first.</li>
  </ol>
  <p class="small">Keys: 1-6 pick an option, Enter checks and moves on, S stars, G marks a guess. Progress saves on this device and, inside claude.ai, to your account so your phone, tablet and laptop share it.</p>

  <h3>How to use the Mastery Guide</h3>
  <ol>
    <li>Use the lecture bar at the top to show one lecture at a time, or "All lectures" for everything.</li>
    <li>Read a section in order: how it works, what to do first, the client example, the common trap and the memory trick.</li>
    <li>Cover the page and tap each blank in "Test yourself" only after you have said the answer.</li>
    <li>Finish each section by reading the Key ideas box. Those lines are exactly what the Drill's concept cards show.</li>
  </ol>

  <h3>How to use both together</h3>
  <ol>
    <li><b>Drill to find:</b> run the pre-test, then open Fix my misses to see the concepts you keep missing.</li>
    <li><b>Guide to re-learn:</b> follow the card's "Open in the guide" link and study that section.</li>
    <li><b>Drill to prove:</b> come back and press "Fix this". A question counts as solid only after you get it right twice in a row (three times for true/false), with rest between.</li>
  </ol>

,2,3],"w":"Saturated fats are triacylglycerols whose fatty acids have no double bonds. Their main sources are dairy and meat products and some vegetable oils, notably coconut and palm oils. Saturated fat intake is strongly associated with high total and LDL-cholesterol and high CHD risk, so intake should be limited. (Biochemistry L5 slides (diet fat and CHD))","x":{"4":"Olive oil is mainly monounsaturated (oleic acid).","5":"Corn oil is an omega-6 polyunsaturated fat.","6":"Flaxseed oil is a plant source of omega-3 alpha-linolenic acid."},"m":{"4":"thinks all oils are unsaturated or all are saturated"},"lp":false,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Teaching and statements"},{"id":"q2","u":"Biochemistry","t":"mc","q":"A client replaces butter with olive oil in cooking. Which change in blood lipids should the nurse expect?","o":["Lower total and LDL-cholesterol with higher HDL-cholesterol","Lower total and LDL-cholesterol with lower HDL-cholesterol","Higher LDL-cholesterol with lower HDL-cholesterol","Lower triacylglycerol with little effect on LDL or HDL"],"c":0,"w":"Olive oil is rich in monounsaturated fat (oleic acid, one double bond). Substituting monounsaturated for saturated fatty acids lowers total and LDL-cholesterol and increases HDL-cholesterol, lowering CHD risk. Mediterranean diets rich in olive oil show a low incidence of CHD. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Lowering HDL too is the pattern of omega-6 fats.","2":"This is the pattern of trans fats.","3":"This is the pattern of omega-3 fats."},"m":{"1":"mixes up MUFA and omega-6 effects","2":"mixes up MUFA and trans fat effects","3":"mixes up MUFA and omega-3 effects"},"lp":false,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Recognize and interpret"},{"id":"q3","u":"Biochemistry","t":"mc","q":"A client uses large amounts of corn and sunflower oil to protect the heart. Which effect of these oils limits their benefit?","o":["They lower HDL-cholesterol as well and have a proinflammatory effect.","They raise LDL-cholesterol.","They contain dietary cholesterol.","They are not essential fatty acids."],"c":0,"w":"Corn, sesame, cottonseed and sunflower oils are rich in omega-6 polyunsaturated fat such as linoleic acid (18:2 n-6), an essential fatty acid needed for membrane fluidity and eicosanoid synthesis. They lower total and LDL-cholesterol, but they also lower HDL-cholesterol and are proinflammatory, which decreases their effect on CHD. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Omega-6 oils LOWER total and LDL-cholesterol; raising LDL is a trans fat effect.","2":"Dietary cholesterol is found only in animal products.","3":"Linoleic acid, the omega-6 in these oils, IS an essential fatty acid."},"m":{"1":"thinks omega-6 raises LDL"},"lp":false,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q4","u":"Biochemistry","t":"sata","q":"A client with high triglycerides asks about eating fatty fish such as salmon and sardines. Which effects of omega-3 fats should the nurse describe? Select all that apply.","o":["Suppressing cardiac arrhythmia","Reducing blood triacylglycerol","Decreasing the tendency to vascular thrombosis","Reducing inflammation","Markedly lowering LDL-cholesterol","Lowering HDL-cholesterol"],"c":[0,1,2,3],"w":"Omega-3 fats come from plants (alpha-linolenic acid in flaxseed and walnuts) and fatty fish (EPA and DHA in salmon, mackerel, anchovies, sardines, herring and tuna). They reduce CHD risk by suppressing arrhythmia, reducing blood triacylglycerol, decreasing thrombosis and reducing inflammation, with little effect on LDL- and HDL-cholesterol. (Biochemistry L5 slides (diet fat and CHD))","x":{"4":"Omega-3 fats have LITTLE effect on LDL- and HDL-cholesterol.","5":"Lowering HDL is an omega-6 effect."},"m":{"4":"thinks omega-3 mainly lowers LDL","5":"mixes up omega-3 and omega-6 effects"},"lp":false,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Teaching and statements"},{"id":"q5","u":"Biochemistry","t":"fill","q":"A nurse explains fatty acid naming to a client. In an omega-3 fat, the first double bond begins at carbon number ____ counting from the methyl end.","o":["3","6","9"],"c":0,"w":"The omega number is the position of the first double bond counted from the methyl end of the fatty acid. Omega-3 fats begin at the 3rd carbon, omega-6 fats (linoleic acid) at the 6th and the monounsaturated oleic acid is omega-9. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Carbon 6 marks omega-6 fats such as linoleic acid.","2":"Carbon 9 marks omega-9 fats such as oleic acid (monounsaturated)."},"m":{"1":"mixes up omega-3 and omega-6"},"lp":false,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Priority / first action"},{"id":"q6","u":"Biochemistry","t":"mc","q":"A vegetarian client wants an essential omega-3 fatty acid from plant foods. Which fatty acid should the nurse identify?","o":["Alpha-linolenic acid (ALA) from flaxseed oil and walnuts","Eicosapentaenoic acid (EPA) from flaxseed","Docosahexaenoic acid (DHA) from walnuts","Oleic acid from olive oil"],"c":0,"w":"Plant sources (flaxseed oils, walnuts) provide alpha-linolenic acid, an essential omega-3 fatty acid needed at 0.6-1.2% of total calories, with double bonds at carbons 9, 12 and 15. Fatty fish provide EPA (20 carbons, 5 double bonds) and DHA (22 carbons, 6 double bonds), which are not essential. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"EPA comes from fatty fish oils and is not an essential fatty acid.","2":"DHA (22 carbons, 6 double bonds) comes from fatty fish oils, not walnuts.","3":"Oleic acid is a monounsaturated omega-9 fat."},"m":{"1":"thinks EPA is a plant essential fatty acid"},"lp":false,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Recognize and interpret"},{"id":"q7","u":"Biochemistry","t":"mc","q":"A nurse teaches a client how to spot trans fats when shopping. Which words on an ingredient list indicate trans fatty acids?","o":["\"Partially hydrogenated\"","\"Cold-pressed olive oil\"","\"Contains plant sterols\"","\"Fish oil (EPA/DHA)\""],"c":0,"w":"Trans fatty acids are not found in plants and occur only in small amounts in animal foods, but they are formed during hydrogenation of liquid vegetable oils, as in margarine manufacture. The key to their presence in a food is the words \"partially hydrogenated\" on the ingredient list. (Biochemistry L5 slides (diet fat and CHD), slide note (key to trans fats))","x":{"1":"Olive oil is a monounsaturated fat, not a trans fat.","2":"Plant sterols lower LDL by blocking cholesterol absorption.","3":"Fish oils are omega-3 fats."},"m":{"2":"confuses plant sterols with trans fats"},"lp":true,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Teaching and statements"},{"id":"q8","u":"Biochemistry","t":"tf","q":"A nurse explains that trans fatty acids are chemically unsaturated but behave more like saturated fatty acids.","o":["True","False"],"c":0,"w":"True. Trans fatty acids are chemically classified as unsaturated, but they behave more like saturated fatty acids: they raise LDL-cholesterol, lower HDL-cholesterol and increase CHD risk. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"This statement is true: trans fats are unsaturated yet act like saturated fats."},"m":{},"lp":false,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Teaching and statements"},{"id":"q9","u":"Biochemistry","t":"tf","q":"A nurse states that WHO recommends limiting trans fat to less than 10% of total energy intake.","o":["True","False"],"c":1,"w":"False. WHO recommends limiting trans fat to less than 1% of total energy intake, which is less than 2.2 g per day on a 2000-calorie diet. (Biochemistry L5 slides (diet fat and CHD))","x":{"0":"The WHO limit is less than 1% of energy (under 2.2 g/day on 2000 kcal)."},"m":{"0":"overestimates the trans fat limit"},"lp":false,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q10","u":"Biochemistry","t":"cloze","q":"A nurse reviews dietary fats with a client. Match each type of fat to its effect on blood lipids.","o":{"rows":["Saturated fat","Trans fat","Monounsaturated fat","Omega-3 fat"],"choices":["Raises total and LDL-cholesterol","Raises LDL-cholesterol and lowers HDL-cholesterol","Lowers LDL-cholesterol and raises HDL-cholesterol","Lowers triacylglycerol with little effect on LDL or HDL","Lowers both LDL- and HDL-cholesterol"]},"c":[0,1,2,3],"w":"Each fat has a signature effect. Saturated fats raise total and LDL-cholesterol. Trans fats raise LDL and lower HDL. Monounsaturated fats lower LDL and raise HDL. Omega-6 fats lower both LDL and HDL. Omega-3 fats lower triacylglycerol, suppress arrhythmia, thrombosis and inflammation, with little effect on LDL or HDL. (Biochemistry L5 slides (diet fat and CHD))","x":{"4":"Lowering both LDL and HDL is the effect of omega-6 fats."},"m":{"4":"mixes up omega-3 and omega-6 effects"},"lp":false,"k":"bio-fats","src":"materials","rs":{"0":"A client eats a diet high in saturated fat. Which effect on blood lipids should the nurse expect?","1":"A client eats many foods made with partially hydrogenated oil. Which lipid effect should the nurse expect?","2":"A client substitutes monounsaturated fat for saturated fat. Which lipid effect should the nurse expect?","3":"A client adds fish oil (omega-3) to the diet. Which lipid effect should the nurse expect?"},"lec":"bio-l5","kind":"Apply a fact"},{"id":"q11","u":"Biochemistry","t":"mc","q":"A nurse teaches a client about diet and cholesterol. Which statement by the client indicates a need for further teaching?","o":["\"The cholesterol I eat affects my blood cholesterol more than the type of fat I eat.\"","\"Cholesterol is found only in animal products.\"","\"Plant sterols lower LDL by blocking cholesterol absorption in my gut.\"","\"Fish oils can lower my triglycerides.\""],"c":0,"w":"Dietary cholesterol is found only in animal products, but its effect on blood cholesterol is LESS important than the amount and type of fatty acids eaten. A client who believes the opposite needs more teaching. Plant sterols in fortified margarines reduce LDL by blocking cholesterol absorption, and fish oils reduce triacylglycerol. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"This is accurate: dietary cholesterol is found only in animal products, so no teaching is needed.","2":"This is accurate: plant sterols inhibit intestinal absorption of cholesterol.","3":"This is accurate: omega-3 fish oils reduce blood triacylglycerol."},"m":{},"lp":false,"k":"bio-cholesterol-sterols","src":"materials","lec":"bio-l5","kind":"Teaching and statements"},{"id":"q12","u":"Biochemistry","t":"sata","q":"A client with high cholesterol asks which dietary factors help lower blood cholesterol. Which factors should the nurse include? Select all that apply.","o":["Monounsaturated fats","Plant sterols","Vegetable fiber","Antioxidants such as vitamins E and C","Large doses of vitamin B3","Saturated fats","Partially hydrogenated oils"],"c":[0,1,2,3,4],"w":"The dietary factors listed as decreasing blood cholesterol are omega-6 polyunsaturated fats, monounsaturated fats, antioxidants (beta carotene, vitamins E and C), plant sterols, vegetable fiber and large doses of vitamin B3. Saturated and trans fats push cholesterol the other way. (Biochemistry L5 slides (diet fat and CHD))","x":{"5":"Saturated fats RAISE total and LDL-cholesterol.","6":"Partially hydrogenated oils contain trans fats, which raise LDL."},"m":{"5":"thinks saturated fat lowers cholesterol","6":"thinks margarine trans fats are protective"},"lp":false,"k":"bio-cholesterol-sterols","src":"materials","lec":"bio-l5","kind":"Teaching and statements"},{"id":"q13","u":"Biochemistry","t":"mc","q":"A nurse explains oxidative stress to a client with coronary disease. Which definition is accurate?","o":["An imbalance favoring oxidants and/or disfavoring antioxidants that can lead to damage","Any production of reactive oxygen species in the body","An excess of antioxidants over oxidants","The buildup of lipid-rich plaque in the intima"],"c":0,"w":"Oxidative stress is a state in which reactive species increase without a matching increase in antioxidants: an imbalance favoring oxidants and/or disfavoring antioxidants, potentially leading to damage. Reactive oxygen species are not always harmful; phagocytes use them to kill microbes. The imbalance is what has been implicated in diseases such as atherosclerosis. (Biochemistry L6 slides (oxidative stress))","x":{"1":"ROS are made normally and can be useful (e.g. microbial killing); stress is the IMBALANCE.","2":"That is the opposite of oxidative stress.","3":"That describes atherosclerosis, which oxidative stress helps cause."},"m":{"1":"thinks any ROS is oxidative stress","2":"reverses the imbalance"},"lp":false,"k":"bio-ros","src":"materials","lec":"bio-l6","kind":"Teaching and statements"},{"id":"q14","u":"Biochemistry","t":"mc","q":"A nurse reviews reactive nitrogen species. Which one is a NON-radical?","o":["Peroxynitrite","Nitric oxide","Nitrogen dioxide","Superoxide"],"c":0,"w":"Reactive species are split into radicals, which carry an unpaired electron, and non-radicals, which are strong oxidants or favor strong oxidant formation. Among reactive nitrogen species, nitric oxide and nitrogen dioxide are radicals and peroxynitrite is a non-radical. Among reactive oxygen species, superoxide, hydroxyl and peroxyl are radicals; hydrogen peroxide, hypochlorous acid and ozone are not. (Biochemistry L6 slides (oxidative stress))","x":{"1":"Nitric oxide (NO.) is a free radical.","2":"Nitrogen dioxide (NO2.) is a free radical.","3":"Superoxide is a reactive OXYGEN species and a radical."},"m":{"1":"thinks NO is a non-radical"},"lp":false,"k":"bio-ros","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q15","u":"Biochemistry","t":"tf","q":"A nurse states that hydrogen peroxide is a free radical because it has an unpaired electron.","o":["True","False"],"c":1,"w":"False. Hydrogen peroxide (H2O2) is a NON-radical reactive oxygen species: a strong oxidant without an unpaired electron. The ROS radicals are superoxide, hydroxyl and peroxyl. (Biochemistry L6 slides (oxidative stress))","x":{"0":"H2O2 is a non-radical ROS."},"m":{"0":"thinks H2O2 is a radical"},"lp":false,"k":"bio-ros","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q16","u":"Biochemistry","t":"sata","q":"A nurse reviews ENDOGENOUS sources of free radicals in a client's cells. Which sources apply? Select all that apply.","o":["Leakage of electrons from the respiratory chain","Xanthine oxidase activity","Synthesis of prostaglandins","Phagocytosis by white cells","Cigarette smoke","X-ray exposure","Halothane metabolism"],"c":[0,1,2,3],"w":"Endogenous free radicals come from cellular metabolism: electron leakage from the respiratory chain, oxidase enzymes such as xanthine oxidase, prostaglandin synthesis, production of nitric oxide from arginine and phagocytosis (myeloperoxidase, NADPH oxidase). Exogenous sources are drug metabolism, ionizing radiation and cigarette smoke. (Biochemistry L6 slides (oxidative stress))","x":{"4":"Cigarette smoke is an exogenous (environmental) source.","5":"Ionizing radiation is an exogenous source.","6":"Drug metabolism (halothane, cytochrome P450) is listed as exogenous."},"m":{"4":"mixes up endogenous and exogenous sources","5":"mixes up endogenous and exogenous sources"},"lp":false,"k":"bio-ros","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q17","u":"Biochemistry","t":"order","q":"A client's neutrophils engulf bacteria. Arrange the steps of the oxygen-dependent killing pathway in order.","o":["Bacteria are phagocytosed and ROS production rises (respiratory burst)","NADPH oxidase converts molecular oxygen into superoxide","Superoxide dismutase converts superoxide into hydrogen peroxide","Myeloperoxidase converts H2O2 and chloride into hypochlorous acid","Hypochlorous acid kills the bacteria"],"c":[0,1,2,3,4],"w":"Reactive oxygen species are sometimes useful. In neutrophils and monocytes, phagocytosis triggers a rapid rise in ROS called the respiratory burst. NADPH oxidase converts oxygen to superoxide, superoxide dismutase converts it to H2O2, and myeloperoxidase uses H2O2 and chloride ions to make hypochlorous acid, which kills bacteria. H2O2 can also form hydroxyl radicals in a reaction catalyzed by free ferrous ions. (Biochemistry L6 slides (oxidative stress))","x":{},"m":{},"lp":false,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q18","u":"Biochemistry","t":"mc","q":"A client with severe sepsis has very high nitric oxide production driven by bacterial toxins and cytokines. Which enzyme is responsible?","o":["Inducible nitric oxide synthase (iNOS)","Endothelial nitric oxide synthase (eNOS)","Neural nitric oxide synthase (nNOS)","Xanthine oxidase"],"c":0,"w":"Nitric oxide is made from L-arginine by NO synthase. eNOS (endothelium) and nNOS (neural) are constitutive and produce low levels constantly. iNOS is expressed in many cells including macrophages and neutrophils; it is induced by bacterial toxins, TNF and inflammatory cytokines and can produce large amounts of NO for hours or days, so it is linked to inflammation. (Biochemistry L6 slides (oxidative stress))","x":{"1":"eNOS is constitutive and constantly produces LOW levels of NO.","2":"nNOS is constitutive and produces low levels of NO in neurons.","3":"Xanthine oxidase is an oxidase that produces ROS, not NO."},"m":{"1":"mixes up eNOS and iNOS"},"lp":false,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q19","u":"Biochemistry","t":"mc","q":"A client with angina takes sublingual nitroglycerin. How does it relieve coronary spasm?","o":["It is metabolized into nitric oxide, which causes vasodilation.","It is converted into superoxide, which relaxes smooth muscle.","It acts as an antioxidant that neutralizes oxidized LDL.","It induces iNOS in macrophages."],"c":0,"w":"NO produced by endothelial NOS improves vascular dilation and perfusion, which is beneficial. Vasodilators such as nitroglycerin are metabolized into NO and so dilate coronary arteries in spasm in angina, a therapeutic and diagnostic use. (Biochemistry L6 slides (oxidative stress))","x":{"1":"Superoxide is a damaging ROS radical, not a vasodilator.","2":"Nitroglycerin works through NO-mediated vasodilation, not as an antioxidant.","3":"iNOS induction is linked to inflammation, not to nitroglycerin's therapeutic effect."},"m":{"3":"mixes up iNOS and therapeutic NO"},"lp":false,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q20","u":"Biochemistry","t":"tf","q":"A nurse explains that nitric oxide is a free-radical gas with a half-life of seconds that is made from L-arginine.","o":["True","False"],"c":0,"w":"True. NO is a free radical gas with a very short half-life (seconds), synthesized by NO synthase from L-arginine and metabolized into nitrates, nitrites and peroxynitrite. (Biochemistry L6 slides (oxidative stress))","x":{"1":"This statement is true: NO is a short-lived radical made from L-arginine."},"m":{},"lp":false,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Teaching and statements"},{"id":"q21","u":"Biochemistry","t":"cloze","q":"A nurse reviews the body's antioxidant defenses with a client. Match each antioxidant to its type.","o":{"rows":["Superoxide dismutase","Vitamin E (tocopherol)","Glutathione","Catalase"],"choices":["Enzymatic antioxidant","Nutrient (non-enzymatic) antioxidant","Metabolic (non-enzymatic) antioxidant","Pro-oxidant transition metal"]},"c":[0,1,2,0],"w":"Antioxidants are enzymatic (superoxide dismutase, catalase, glutathione peroxidase with glutathione reductase and G6PD) or non-enzymatic. Non-enzymatic antioxidants are nutrient (carotene, tocopherol, ascorbic acid, selenium) or metabolic (glutathione, thioredoxin, ceruloplasmin, albumin, melatonin, transferrin, ferritin, uric acid). (Biochemistry L6 slides (oxidative stress))","x":{"3":"Transition metals favor the formation of strong oxidants; they are not antioxidants."},"m":{"3":"thinks metals are antioxidants"},"lp":false,"k":"bio-burst-no","src":"materials","rs":{"0":"A nurse explains how superoxide dismutase protects cells. What type of antioxidant is it?","1":"A client takes vitamin E supplements. What type of antioxidant is vitamin E?","2":"A nurse describes glutathione to a client. What type of antioxidant is it?","3":"A nurse reviews catalase. What type of antioxidant is it?"},"lec":"bio-l6","kind":"Apply a fact"},{"id":"q22","u":"Biochemistry","t":"order","q":"A nurse explains how oxidized LDL drives atherosclerosis. Arrange the key stages in order.","o":["Endothelial dysfunction from hypertension, smoking or dyslipidemia","LDL enters the intima and is oxidized","Adhesion molecules (VCAM-1, ICAM-1) and MCP-1 recruit monocytes","Macrophages engulf oxidized LDL and become foam cells (fatty streak)","Smooth muscle cells migrate and form a fibrous cap","Plaque rupture or erosion triggers thrombosis"],"c":[0,1,2,3,4,5],"w":"Stressors damage the endothelium. LDL passes into the intima and is oxidized by free radicals and lipoxygenases. Activated endothelium expresses VCAM-1, ICAM-1 and MCP-1 that recruit monocytes and T cells. Monocytes become macrophages that engulf oxidized LDL via scavenger receptors and become foam cells, forming the fatty streak. Smooth muscle cells migrate from the media, proliferate and lay down a fibrous cap; a necrotic core and calcification follow, and a vulnerable plaque may rupture and trigger thrombosis. (Biochemistry L6 slides (oxidative stress), key stages slide)","x":{},"m":{},"lp":true,"k":"bio-oxldl","src":"materials","lec":"bio-l6","kind":"Teaching and statements"},{"id":"q23","u":"Biochemistry","t":"mc","q":"A nurse explains how fatty streaks form in a client's arteries. How do macrophages take up oxidized LDL?","o":["Through scavenger receptors, turning into lipid-laden foam cells","Through VCAM-1 and ICAM-1 on the macrophage","By efferocytosis of dead smooth muscle cells","By secreting collagen around the lipid"],"c":0,"w":"Monocytes recruited into the intima differentiate into macrophages and engulf oxidized LDL via scavenger receptors, becoming lipid-laden foam cells. The initial accumulation of foam cells creates the earliest visible lesion, the fatty streak. (Biochemistry L6 slides (oxidative stress))","x":{"1":"VCAM-1 and ICAM-1 are adhesion molecules on activated ENDOTHELIAL cells that capture monocytes.","2":"Efferocytosis is clearing dead cells; its failure enlarges the necrotic core.","3":"Collagen and proteoglycans are made by smooth muscle cells forming the fibrous cap."},"m":{"1":"mixes up adhesion molecules and scavenger receptors"},"lp":false,"k":"bio-oxldl","src":"materials","lec":"bio-l6","kind":"Teaching and statements"},{"id":"q24","u":"Biochemistry","t":"mc","q":"A nurse reviews why some atherosclerotic plaques develop a large necrotic core. Which process is responsible?","o":["Apoptosis of macrophages and SMCs with impaired clearance of the dead cells (efferocytosis)","Migration of smooth muscle cells to form a fibrous cap","Expression of VCAM-1 and ICAM-1 by endothelial cells","Inhibition of intestinal cholesterol absorption"],"c":0,"w":"As plaques progress, macrophages and smooth muscle cells undergo apoptosis and secondary necrosis. When the dead cells are not cleared (impaired efferocytosis), an acellular necrotic core rich in lipids and debris enlarges, and calcium salts deposit, causing calcification. Vulnerable plaques can then rupture or erode and trigger thrombosis. (Biochemistry L6 slides (oxidative stress))","x":{"1":"SMC migration builds the fibrous cap over the lipid core, not the necrotic core.","2":"Adhesion molecules recruit monocytes early in the process.","3":"Blocking intestinal cholesterol absorption is how plant sterols lower LDL."},"m":{"1":"mixes up cap formation and necrotic core"},"lp":false,"k":"bio-oxldl","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q25","u":"Biochemistry","t":"mc","q":"Which antioxidant enzyme contains selenium in its active site and uses reduced glutathione to break down peroxides?","o":["Glutathione peroxidase","Catalase","Superoxide dismutase","Glutathione reductase"],"c":0,"w":"Glutathione peroxidase uses reduced glutathione to break down peroxides and contains selenium. Your slides list glutathione peroxidase among the enzymatic antioxidants and selenium among the nutrient antioxidants; the link between them is from the bank's key. (Shams Practices QB, 2025 Q21; Biochemistry L6 slides (oxidative stress))","x":{"1":"Catalase breaks down H2O2 without glutathione or selenium.","2":"Superoxide dismutase converts superoxide into H2O2.","3":"Glutathione reductase regenerates reduced glutathione; it does not break down peroxides."},"m":{"3":"mixes up glutathione peroxidase and reductase"},"lp":true,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q26","u":"Biochemistry","t":"mc","q":"Which molecule mediates vasodilation after administration of sublingual nitroglycerin?","o":["Nitric oxide (NO)","Endothelin-1","Angiotensin II","Thromboxane A₂"],"c":0,"w":"Nitroglycerin is metabolized into nitric oxide, which relaxes vascular smooth muscle and relieves coronary spasm in angina. (Shams Practices QB, 2025 Q24; Biochemistry L6 slides (oxidative stress))","x":{"1":"Endothelin-1 is a vasoconstrictor.","2":"Angiotensin II is a vasoconstrictor.","3":"Thromboxane A2 is a vasoconstrictor that promotes platelet aggregation."},"m":{},"lp":true,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q27","u":"Biochemistry","t":"mc","q":"Nitroglycerin is metabolized into?","o":["Nitric oxide","Angiotensin II","Endothelin-1","Thromboxane A₂"],"c":0,"w":"Vasodilators such as nitroglycerin are metabolized into NO, which dilates coronary arteries in spasm. (Shams Practices QB, 2023 Q108; Biochemistry L6 slides (oxidative stress))","x":{"1":"Angiotensin II is a vasoconstrictor.","2":"Endothelin-1 is a vasoconstrictor.","3":"Thromboxane A2 is a vasoconstrictor."},"m":{},"lp":true,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q28","u":"Biochemistry","t":"mc","q":"Which of the following converts molecular oxygen into superoxide to help kill bacteria?","o":["NADPH oxidase","Catalase","Glutathione reductase","Carbonic anhydrase"],"c":0,"w":"In the respiratory burst of phagocytes, NADPH oxidase converts molecular oxygen into superoxide, which leads on to H2O2 and hypochlorous acid. (The paper calls it a \"ROS\"; it is the enzyme that makes ROS.) (Shams Practices QB, 2024 May Q81; Biochemistry L6 slides (oxidative stress))","x":{"1":"Catalase breaks down H2O2; it is an antioxidant enzyme.","2":"Glutathione reductase regenerates glutathione, an antioxidant role.","3":"Carbonic anhydrase makes bicarbonate from CO2 and water."},"m":{},"lp":true,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q29","u":"Biochemistry","t":"mc","q":"In microbial killing, molecular oxygen is converted into superoxide by?","o":["NADPH oxidase","Catalase","Pancreatic amylase","Creatine kinase"],"c":0,"w":"NADPH oxidase in neutrophils and monocytes converts O2 into superoxide during the respiratory burst. (Shams Practices QB, 2022 Q119; Biochemistry L6 slides (oxidative stress))","x":{"1":"Catalase breaks down H2O2.","2":"Pancreatic amylase digests starch.","3":"Creatine kinase transfers phosphate in muscle energy metabolism."},"m":{},"lp":true,"k":"bio-burst-no","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q30","u":"Biochemistry","t":"mc","q":"Which modification of LDL occurs early in atherosclerosis and promotes foam cell formation?","o":["Oxidation of LDL","Conversion of LDL into HDL","Conversion of LDL into chylomicrons","Conversion of LDL into albumin"],"c":0,"w":"LDL that enters the intima is oxidized by free radicals; macrophages take up oxidized LDL via scavenger receptors and become foam cells. (Shams Practices QB, 2025 Q22; Biochemistry L6 slides (oxidative stress))","x":{"1":"LDL is not converted into HDL.","2":"Chylomicrons are made in the intestine from dietary fat, not from LDL.","3":"Albumin is a plasma protein, not made from LDL."},"m":{},"lp":true,"k":"bio-oxldl","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q31","u":"Biochemistry","t":"mc","q":"Which of the following is the first step in formation of atherosclerotic plaques?","o":["Oxidized LDL","Calcification of the plaque","Rupture of the fibrous cap","Hemorrhage into the plaque"],"c":0,"w":"Among these options, LDL oxidation in the intima comes earliest; your slides list endothelial dysfunction first, then LDL retention and oxidation. Calcification, cap rupture and hemorrhage are late changes. (Shams Practices QB, 2024 May Q82; Biochemistry L6 slides (oxidative stress))","x":{"1":"Calcification is a late change in a progressed plaque.","2":"Rupture of the fibrous cap is a late complication.","3":"Hemorrhage into a plaque is an acute plaque change."},"m":{},"lp":true,"k":"bio-oxldl","src":"materials","lec":"bio-l6","kind":"Priority / first action"},{"id":"q32","u":"Biochemistry","t":"mc","q":"The core of an atherosclerotic plaque contains:","o":["Oxidized LDL","Bile salts","Glycogen granules","Keratin"],"c":0,"w":"The plaque core is rich in lipid, including oxidized LDL, debris and dead foam cells. (Stem fixed from \"Atherosclerosis contain in its core :\".) (Shams Practices QB, Unknown-1 Q140; Biochemistry L6 slides (oxidative stress))","x":{"1":"Bile salts are in bile, not plaques.","2":"Glycogen is a stored carbohydrate in liver and muscle.","3":"Keratin is a skin and hair protein."},"m":{},"lp":true,"k":"bio-oxldl","src":"materials","lec":"bio-l6","kind":"Apply a fact"},{"id":"q33","u":"Biochemistry","t":"mc","q":"Which effect of omega-3 fatty acids may help lower the risk of coronary heart disease?","o":["Reduced vascular thrombosis","Increased platelet aggregation","Increased coronary vasoconstriction","Increased formation of blood clots"],"c":0,"w":"Omega-3 fats suppress arrhythmia, reduce triacylglycerol, decrease the tendency to vascular thrombosis and reduce inflammation. (Shams Practices QB, 2025 Q23; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"More platelet aggregation would RAISE risk.","2":"Vasoconstriction would raise risk.","3":"More clots would raise risk."},"m":{},"lp":true,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q34","u":"Biochemistry","t":"mc","q":"A doctor advises a patient to reduce dietary trans fat intake. How does trans fat affect blood LDL cholesterol?","o":["It increases LDL cholesterol","It decreases LDL cholesterol","It leaves LDL cholesterol unchanged","It removes all LDL cholesterol from the bloodstream"],"c":0,"w":"Trans fats are chemically unsaturated but behave like saturated fats: they raise LDL-cholesterol and lower HDL-cholesterol. (Shams Practices QB, 2025 Q25; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Lowering LDL is the effect of MUFA and omega-6 fats.","2":"Trans fats do change LDL: they raise it.","3":"No fat removes all LDL."},"m":{"1":"thinks trans fats behave like unsaturated fats"},"lp":true,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q35","u":"Biochemistry","t":"mc","q":"HDL is increased by:","o":["Olive oil – Fish oil","Cigarette smoking","Physical inactivity","Industrial trans fat intake"],"c":0,"w":"Substituting monounsaturated fat (olive oil) for saturated fat raises HDL-cholesterol; fish oils are the protective omega-3 fats. (Stem fixed from \"increase HDL by :\".) (Shams Practices QB, Unknown-1 Q144; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Smoking is a coronary risk factor.","2":"Lack of exercise is a coronary risk factor.","3":"Trans fats LOWER HDL."},"m":{},"lp":true,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q36","u":"Biochemistry","t":"mc","q":"Biological effect of trans fatty acids is seen with:","o":["Palm oil","Egg whites","Table salt","Distilled water"],"c":0,"w":"The bank keys palm oil. Note: the question looks garbled; your slides list palm oil as a source of SATURATED fat, and trans fats come from partially hydrogenated vegetable oils. Palm oil is the only fat among the options. (Stem fixed from \"trans fatty acids biologi effect :\".) (Shams Practices QB, Unknown-1 Q145; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Egg whites are mostly protein and contain no fat.","2":"Table salt contains no fat.","3":"Distilled water contains no fat."},"m":{},"lp":true,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q37","u":"Biochemistry","t":"mc","q":"In the diet, which prevents coronary heart disease?","o":["Oleic acid","Industrial trans fat","Elaidic acid"],"c":0,"w":"Oleic acid is the monounsaturated (omega-9) fat of olive oil, linked with low CHD in Mediterranean diets. (The paper prints three options.) (Shams Practices QB, Unknown-2 Q172; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Industrial trans fat raises LDL and CHD risk.","2":"Elaidic acid is a trans fatty acid, which raises CHD risk."},"m":{"2":"thinks trans fats are protective"},"lp":true,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q38","u":"Biochemistry","t":"mc","q":"Which is a beneficial fatty acid?","o":["Omega 3","Elaidic acid","Industrial trans fatty acids","Trans-palmitelaidic acid"],"c":0,"w":"Omega-3 fatty acids reduce CHD risk; the other options are all trans fatty acids, which raise it. (Shams Practices QB, Unknown-2 Q174; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Elaidic acid is a trans fatty acid.","2":"Industrial trans fats raise LDL and lower HDL.","3":"Trans-palmitelaidic acid is a trans fatty acid."},"m":{},"lp":true,"k":"bio-fats","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q39","u":"Biochemistry","t":"mc","q":"A patient had coronary disease and a lipid profile was done. Which lipoprotein would you expect to find at a very low level?","o":["HDL","LDL","VLDL","IDL"],"c":0,"w":"High HDL-cholesterol is associated with decreased CHD risk, so a low HDL is expected in coronary disease. Elevated LDL raises risk. (Shams Practices QB, 2024 Nov Q44; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"LDL is expected to be HIGH in coronary disease.","2":"VLDL is not expected to be very low.","3":"IDL is not expected to be very low."},"m":{},"lp":true,"k":"bio-lipids-chd","src":"materials","lec":"bio-l5","kind":"Recognize and interpret"},{"id":"q40","u":"Biochemistry","t":"mc","q":"Which of the following is a negative risk factor?","o":["HDL more than 60 mg/dL","Cigarette smoking","HDL less than 40 mg/dL","Hypertension"],"c":0,"w":"A high HDL protects against CHD, so HDL above 60 mg/dL counts as a negative (protective) risk factor. The 60 mg/dL cut-off is from the bank's key. (Shams Practices QB, 2023 Q109; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Smoking is a positive risk factor.","2":"A low HDL is a positive risk factor.","3":"Hypertension is a positive risk factor."},"m":{"2":"thinks all HDL values raise risk"},"lp":true,"k":"bio-lipids-chd","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q41","u":"Biochemistry","t":"mc","q":"Which of these factors is a negative risk factor?","o":["LDL less than 100 mg/dl","Cigarette smoking","Hypertension","HDL less than 40 mg/dl"],"c":0,"w":"The bank keys LDL below 100 mg/dL as the protective option. Note: in most risk-factor schemes the classic negative risk factor is HDL of 60 mg/dL or more (as in the 2023 question); here LDL below 100 is simply the only option that is not a risk factor. (Shams Practices QB, 2022 Q118; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Smoking is a positive risk factor.","2":"Hypertension is a positive risk factor.","3":"A low HDL is a positive risk factor."},"m":{},"lp":true,"k":"bio-lipids-chd","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q42","u":"Biochemistry","t":"mc","q":"A 56-year-old male patient smokes cigarettes and has HDL 30. How many risk factors does he have?","o":["Three","Zero","One","Six"],"c":0,"w":"The key counts three: male age (over 45), cigarette smoking and a low HDL (under 40 mg/dL). The age cut-off and counting scheme are from the bank's key, not your slides. (Shams Practices QB, 2023 Q110; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Smoking alone is a risk factor, so it cannot be zero.","2":"Smoking and low HDL are already two.","3":"Only three listed findings count as risk factors."},"m":{},"lp":true,"k":"bio-lipids-chd","src":"materials","lec":"bio-l5","kind":"Apply a fact"},{"id":"q43","u":"Biochemistry","t":"mc","q":"Statins reduce cholesterol level in blood by competitively inhibiting the?","o":["HMG CoA reductase","Lipoprotein lipase","Pancreatic lipase","Lactate dehydrogenase"],"c":0,"w":"Statins competitively inhibit HMG CoA reductase, the rate-limiting enzyme of cholesterol synthesis. Your slides say statins lower TC and LDL-C by 30-40%; the enzyme is from the bank's key. (Shams Practices QB, 2024 Nov Q40; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Lipoprotein lipase breaks down triglycerides in circulating lipoproteins.","2":"Pancreatic lipase digests dietary fat.","3":"Lactate dehydrogenase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q44","u":"Biochemistry","t":"mc","q":"Statin drugs inhibit which enzyme?","o":["HMG CoA reductase","Pancreatic amylase","Creatine kinase","Lactate dehydrogenase"],"c":0,"w":"Statins inhibit HMG CoA reductase. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q76; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pancreatic amylase digests starch.","2":"Creatine kinase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism.","3":"Lactate dehydrogenase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q45","u":"Biochemistry","t":"mc","q":"During the fed state, insulin increases the activity of which enzyme?","o":["HMG CoA reductase","Pepsin","Carbonic anhydrase","Lactase"],"c":0,"w":"Insulin activates HMG CoA reductase in the fed state, increasing cholesterol synthesis. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q115; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pepsin digests protein in the stomach.","2":"Carbonic anhydrase makes bicarbonate.","3":"Lactase digests milk sugar."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q46","u":"Biochemistry","t":"mc","q":"In a hypothyroid patient, the increased cholesterol level is due to impairment in converting cholesterol to?","o":["Bile acid","Glycogen","Lactate","Creatinine"],"c":0,"w":"Thyroid hormone is needed for converting cholesterol to bile acids; in hypothyroidism this is impaired and cholesterol rises. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q41; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Glycogen is stored glucose, not made from cholesterol.","2":"Lactate is made from glucose.","3":"Creatinine comes from muscle creatine."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q47","u":"Biochemistry","t":"mc","q":"A patient came to the clinic with hypothyroidism and hypercholesterolemia. Which conversion of cholesterol is defective?","o":["Bile acids","Glycogen","Lactate","Creatinine"],"c":0,"w":"Hypothyroidism impairs the conversion of cholesterol to bile acids. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q75; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Glycogen is stored glucose.","2":"Lactate is made from glucose.","3":"Creatinine comes from muscle creatine."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q48","u":"Biochemistry","t":"mc","q":"A hypothyroid patient will develop hypercholesterolemia due to?","o":["Decrease in conversion of cholesterol to bile acids","Increased excretion of cholesterol in the stool","Decreased intestinal cholesterol absorption","Increased removal of LDL from the blood"],"c":0,"w":"Less cholesterol is converted to bile acids in hypothyroidism, so it accumulates. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q116; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"More cholesterol lost in the stool would LOWER blood cholesterol.","2":"Less absorption would LOWER blood cholesterol.","3":"More LDL removal would LOWER blood cholesterol."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q49","u":"Biochemistry","t":"mc","q":"Structural apolipoprotein of VLDL?","o":["Apo B-100","Apo A-I","Apo A-II","Apo B-48"],"c":0,"w":"Apo B-100 is the structural apolipoprotein of VLDL (and LDL); apo B-48 is the chylomicron's. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q42; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Apo A-I is the main apolipoprotein of HDL.","2":"Apo A-II is an HDL apolipoprotein.","3":"Apo B-48 is the structural apolipoprotein of chylomicrons."},"m":{"3":"mixes up apo B-100 and apo B-48"},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q50","u":"Biochemistry","t":"mc","q":"In fatty liver, production of TG in the liver will be more than ..?","o":["VLDL","Chylomicrons","HDL","IDL"],"c":0,"w":"The liver exports triglyceride packed in VLDL; fatty liver develops when triglyceride production exceeds VLDL export. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q43; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Chylomicrons are made by the intestine, not the liver.","2":"HDL carries cholesterol, not the liver's triglyceride export.","3":"IDL is a remnant of VLDL in the blood."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q51","u":"Biochemistry","t":"mc","q":"Fatty liver is due to accumulation of triglycerides in the liver and a decrease in liver synthesis of?","o":["VLDL","Hemoglobin","Chylomicrons","Myoglobin"],"c":0,"w":"Less VLDL synthesis means the liver cannot export its triglyceride, which accumulates. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q121; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Hemoglobin is the red cell oxygen carrier.","2":"Chylomicrons are made by the intestine.","3":"Myoglobin is the muscle oxygen store."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q52","u":"Biochemistry","t":"mc","q":"Which of the following is activated by apo A-I to convert free cholesterol to cholesterol esters?","o":["LCAT","Pancreatic amylase","Lactate dehydrogenase","Creatine kinase"],"c":0,"w":"Apo A-I of HDL activates LCAT (lecithin-cholesterol acyltransferase), which esterifies free cholesterol. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q45; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pancreatic amylase digests starch.","2":"Lactate dehydrogenase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism.","3":"Creatine kinase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q53","u":"Biochemistry","t":"mc","q":"The apo A-I of HDL activates which enzyme?","o":["LCAT","Pepsin","Acetylcholinesterase","Carbonic anhydrase"],"c":0,"w":"Apo A-I activates LCAT. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q120; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pepsin digests protein.","2":"Acetylcholinesterase breaks down acetylcholine at synapses.","3":"Carbonic anhydrase makes bicarbonate."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q54","u":"Biochemistry","t":"mc","q":"Where do nascent chylomicrons and VLDL get apo C-II and apo E?","o":["HDL","Albumin","Hemoglobin","Fibrinogen"],"c":0,"w":"HDL acts as a reservoir that donates apo C-II and apo E to nascent chylomicrons and VLDL. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q77; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Albumin carries free fatty acids, not apolipoproteins.","2":"Hemoglobin carries oxygen in red cells.","3":"Fibrinogen is a clotting protein."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q55","u":"Biochemistry","t":"mc","q":"Apo C-II activates which enzyme?","o":["Lipoprotein lipase","Pepsin","Carbonic anhydrase","Acetylcholinesterase"],"c":0,"w":"Apo C-II activates lipoprotein lipase, which breaks down triglycerides in chylomicrons and VLDL. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q78; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pepsin digests protein.","2":"Carbonic anhydrase makes bicarbonate.","3":"Acetylcholinesterase breaks down acetylcholine."},"m":{"1":"mixes up apo C-II and apo A-I targets"},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q56","u":"Biochemistry","t":"mc","q":"A patient came to the ER with orange-colored tonsils and an enlarged spleen and liver and was diagnosed with Tangier disease. Which lipoprotein is expected to be low?","o":["HDL","VLDL","Chylomicrons","IDL"],"c":0,"w":"Tangier disease is a defect in cholesterol efflux to HDL, so HDL is very low and cholesterol esters build up in tissues such as the tonsils. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q79; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"VLDL is not the lipoprotein lost in Tangier disease.","2":"Chylomicrons are not the lipoprotein lost in Tangier disease.","3":"IDL is not the lipoprotein lost in Tangier disease."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Recognize and interpret"},{"id":"q57","u":"Biochemistry","t":"mc","q":"A patient with a history of LDL receptor deficiency (type 2 hyperlipoproteinemia) came to the ER with acute pancreatitis and eruptive xanthomas. Deficiency of which of the following caused this condition?","o":["Apo B100","Hemoglobin A","Fibrinogen","Immunoglobulin A"],"c":0,"w":"The bank keys apo B-100, the ligand the LDL receptor binds. Note: this question looks garbled. Acute pancreatitis with eruptive xanthomas is classically type I (lipoprotein lipase or apo C-II deficiency), while type II is an LDL receptor or apo B-100 problem; apo B-100 is the only lipoprotein-related option. (Shams Practices QB, 2024 May Q80; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Hemoglobin A is the normal adult hemoglobin.","2":"Fibrinogen is a clotting protein.","3":"Immunoglobulin A is an antibody."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q58","u":"Biochemistry","t":"mc","q":"Effect of abetalipoproteinemia on lipoproteins?","o":["Decrease VLDL + decrease chylomicrons","Increase VLDL + increase chylomicrons","Increase VLDL + unchanged chylomicrons","Unchanged VLDL + increase chylomicrons"],"c":0,"w":"Abetalipoproteinemia is a failure to assemble apo B-containing lipoproteins, so both VLDL (apo B-100) and chylomicrons (apo B-48) are decreased. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q117; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Neither lipoprotein increases; both fall.","2":"VLDL falls and chylomicrons also fall.","3":"Chylomicrons fall, and VLDL falls too."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q59","u":"Biochemistry","t":"mc","q":"COX-2 is involved in:","o":["Inflammatory response","Hemoglobin synthesis","DNA replication","Glycogen breakdown"],"c":0,"w":"COX-2 is the inducible cyclooxygenase that makes prostaglandins in inflammation. Your slides mention prostaglandin synthesis as a free-radical source; COX-2's role is from the bank's key. (Stem expanded from \"COX-2 :\".) (Shams Practices QB, Unknown-1 Q142; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Hemoglobin synthesis does not involve COX-2.","2":"DNA replication does not involve COX-2.","3":"Glycogen breakdown does not involve COX-2."},"m":{},"lp":true,"k":"bio-eicosanoids","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q60","u":"Biochemistry","t":"mc","q":"PGI2 is a:","o":["Vasodilator","Vasoconstrictor","Platelet aggregation promoter","Clotting factor"],"c":0,"w":"Prostacyclin (PGI2) dilates vessels and opposes platelet aggregation. Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem expanded from \"PGI2 :\".) (Shams Practices QB, Unknown-1 Q143; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"PGI2 dilates, it does not constrict.","2":"PGI2 INHIBITS platelet aggregation; thromboxane A2 promotes it.","3":"PGI2 is a prostaglandin, not a clotting factor."},"m":{"2":"mixes up prostacyclin and thromboxane"},"lp":true,"k":"bio-eicosanoids","src":"materials","lec":"bio-pp","kind":"Apply a fact"},{"id":"q61","u":"Biochemistry","t":"mc","q":"Which enzyme makes prostaglandins in inflammation?","o":["Cox-2","Pancreatic amylase","Creatine kinase","Lactase"],"c":0,"w":"COX-2 produces inflammatory prostaglandins. Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem expanded from \"Prostaglandin inflammation ??\".) (Shams Practices QB, Unknown-2 Q173; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pancreatic amylase digests starch.","2":"Creatine kinase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism.","3":"Lactase digests milk sugar."},"m":{},"lp":true,"k":"bio-eicosanoids","src":"materials","lec":"bio-pp","kind":"Apply a fact"}],"concepts":{"bio-lipids-chd":{"title":"Blood lipids and coronary heart disease","unit":"Biochemistry","points":["Total blood cholesterol comes from diet and endogenous synthesis and is carried by lipoproteins, especially LDL and HDL.","CHD risk rises with total and LDL cholesterol; high HDL-cholesterol is associated with decreased risk.","Diet control lowers TC and LDL-C by 10-20%; statins lower them by 30-40%."],"source":"Biochemistry L5 slides (diet fat and CHD)","items":["q0","q39","q40","q41","q42"],"lec":"bio-l5","sec":[{"id":"bio-lipids-chd","title":"Blood lipids and coronary heart disease","key":["Total blood cholesterol comes from diet and endogenous synthesis and is carried by lipoproteins, especially LDL and HDL.","CHD risk rises with total and LDL cholesterol; high HDL-cholesterol is associated with decreased risk.","Diet control lowers TC and LDL-C by 10-20%; statins lower them by 30-40%."]}]},"bio-fats":{"title":"Types of dietary fat and their effects","unit":"Biochemistry","points":["Saturated fats (no double bonds; dairy, meat, coconut and palm oils) raise TC and LDL-C and CHD risk.","Monounsaturated fats (one double bond; olive oil, oleic acid, omega-9) lower TC and LDL-C and raise HDL-C when substituted for saturated fats.","Omega-6 fats (first double bond at carbon 6 from the methyl end; corn, sesame, cottonseed, sunflower oils) lower TC and LDL-C but also lower HDL-C and are proinflammatory.","Omega-3 fats suppress arrhythmia, reduce blood triacylglycerol, decrease thrombosis and inflammation, with little effect on LDL-C and HDL-C.","Trans fats are chemically unsaturated but behave like saturated fats: they raise LDL-C and lower HDL-C; formed by partial hydrogenation of vegetable oils (margarine)."],"source":"Biochemistry L5 slides (diet fat and CHD)","items":["q1","q2","q3","q4","q5","q6","q7","q8","q9","q10","q33","q34","q35","q36","q37","q38"],"lec":"bio-l5","sec":[{"id":"bio-fats","title":"Types of dietary fat and their effects","key":["Saturated fats (no double bonds; dairy, meat, coconut and palm oils) raise TC and LDL-C and CHD risk.","Monounsaturated fats (one double bond; olive oil, oleic acid, omega-9) lower TC and LDL-C and raise HDL-C when substituted for saturated fats.","Omega-6 fats (first double bond at carbon 6 from the methyl end; corn, sesame, cottonseed, sunflower oils) lower TC and LDL-C but also lower HDL-C and are proinflammatory.","Omega-3 fats suppress arrhythmia, reduce blood triacylglycerol, decrease thrombosis and inflammation, with little effect on LDL-C and HDL-C.","Trans fats are chemically unsaturated but behave like saturated fats: they raise LDL-C and lower HDL-C; formed by partial hydrogenation of vegetable oils (margarine)."]}]},"bio-choles s engulf oxidized LDL via scavenger receptors and become lipid-laden foam cells.","Failure to clear dead macrophages and SMCs (impaired efferocytosis) enlarges an acellular necrotic core."]}]},"bio-lipoproteins":{"title":"Lipoproteins and cholesterol metabolism (past papers)","unit":"Biochemistry","points":["Statins competitively inhibit HMG CoA reductase, the enzyme insulin activates in the fed state.","In hypothyroidism cholesterol is high because conversion of cholesterol to bile acids is impaired.","Apo B-100 is the structural apolipoprotein of VLDL; nascent chylomicrons and VLDL get apo C-II and apo E from HDL.","Apo C-II activates lipoprotein lipase; apo A-I activates LCAT, which converts free cholesterol to cholesterol esters.","Fatty liver: the liver makes more triglyceride than it can export as VLDL.","Tangier disease: low HDL. Abetalipoproteinemia: decreased VLDL and chylomicrons."],"source":"Shams Practices QB (past papers); not in your uploaded slides","items":["q43","q44","q45","q46","q47","q48","q49","q50","q51","q52","q53","q54","q55","q56","q57","q58"],"lec":"bio-pp","sec":[{"id":"bio-lipoproteins","title":"Lipoproteins and cholesterol metabolism (past papers)","key":["Statins competitively inhibit HMG CoA reductase, the enzyme insulin activates in the fed state.","In hypothyroidism cholesterol is high because conversion of cholesterol to bile acids is impaired.","Apo B-100 is the structural apolipoprotein of VLDL; nascent chylomicrons and VLDL get apo C-II and apo E from HDL.","Apo C-II activates lipoprotein lipase; apo A-I activates LCAT, which converts free cholesterol to cholesterol esters.","Fatty liver: the liver makes more triglyceride than it can export as VLDL.","Tangier disease: low HDL. Abetalipoproteinemia: decreased VLDL and chylomicrons."]}]},"bio-eicosanoids":{"title":"Eicosanoids: COX-2 and prostacyclin (past papers)","unit":"Biochemistry","points":["COX-2 makes the prostaglandins of the inflammatory response.","Prostacyclin (PGI2) is <script>
/* drill-core.js — pure drill logic (no DOM). Inlined into the drill page by
 * build-drill.py and loaded by simulate.js, so the simulations test the exact
 * code the page runs.
 *
 * Progress state S (saved in localStorage and synced to the account):
 *   seq        global answer counter (rest periods are counted in answers)
 *   p[id]      {h: recent results, ls: seq at last answer, lt: time, sid: session,
 *               t: last change, n: answers, sc: last full-question score 0..1,
 *               lp: last answer position (string)}
 *              h characters: R right, W wrong, P partly right, G right but guessed,
 *              r / w single-row practice right / wrong (r never counts toward solid)
 *   stars[id]  {on: 0|1, t}
 *   miss[]     {q, lab, t}  every wrong pick (misconception label when one exists)
 *   lastSid    id of the most recent session started
 */
(function (root) {
  'use strict';
  var H18 = 18 * 3600 * 1000;

  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function shuffle(a, r) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

  function newState() {
    return { v: 1, seq: 0, p: {}, stars: {}, miss: [], pre: { last: null }, tsec: { s: 0, n: 0 },
             lc: {}, ll: -1, lastSid: null, sidN: 0, t: 0 };
  }

  /* ------------------------------------------------------------ data context */
  function makeCtx(DATA) {
    var D = { cfg: DATA.cfg, items: DATA.items, concepts: DATA.concepts || {}, lectures: DATA.lectures || [], byId: {}, hiUnits: {} };
    DATA.items.forEach(function (it) { D.byId[it.id] = it; });
    (DATA.cfg.high_roi_units || []).forEach(function (u) { D.hiUnits[u] = 1; });
    return D;
  }
  // a question id is "q12" or a single-row variant "q12r3"
  function parseId(qid) {
    var m = /^(q\d+)(?:r(\d+))?$/.exec(qid);
    return m ? { base: m[1], row: m[2] === undefined ? -1 : +m[2] } : { base: qid, row: -1 };
  }
  function itemOf(D, qid) {
    var p = parseId(qid), it = D.byId[p.base];
    if (!it || p.row < 0) return it;
    return { id: qid, base: it.id, row: p.row, u: it.u, lec: it.lec, t: 'row', k: it.k, lp: it.lp, src: it.src, kind: it.kind,
             q: it.rs[p.row], o: it.o.choices, c: it.c[p.row], w: it.w, x: it.x, m: it.m, parent: it };
  }

  /* ------------------------------------------------------------ status */
  function eff(h) { return (h || '').replace(/r/g, '').replace(/w/g, 'W'); }
  function status(it, rec) {
    if (!rec) return 'new';
    var e = eff(rec.h);
    if (!e) return 'new';
    var last = e.charAt(e.length - 1);
    if (last !== 'R') return 'shaky';
    var need = it.t === 'tf' ? 3 : 2;
    return e.slice(-need) === new Array(need + 1).join('R') ? 'solid' : 'once';
  }
  function trailingMiss(rec) {
    var e = eff(rec && rec.h), n = 0;
    for (var i = e.length - 1; i >= 0 && (e[i] === 'W' || e[i] === 'P'); i--) n++;
    return n;
  }
  function lastIsMiss(rec) { var e = eff(rec && rec.h); var c = e.charAt(e.length - 1); return c === 'W' || c === 'P' || c === 'G'; }
  function isStar(S, id) { var s = S.stars[id]; return !!(s && s.on); }
  function isHi(D, S, it) { return isStar(S, it.id) || !!it.lp || !!D.hiUnits[it.u]; }

  function restLen(D, S, it, rec, n) {
    var e = eff(rec.h), last = e.charAt(e.length - 1);
    if (last === 'W' || last === 'P') {
      return trailingMiss(rec) >= 2 ? clamp(Math.round(0.10 * n), 6, 25) : clamp(Math.round(0.25 * n), 10, 60);
    }
    if (last === 'G') return clamp(Math.round(0.25 * n), 10, 60);
    var b = clamp(Math.round(0.7 * n), 12, 300);
    if (status(it, rec) === 'solid') b = Math.round(b * 1.5);
    if (isHi(D, S, it)) b = clamp(Math.round(0.4 * b), 8, 120);
    return b;
  }
  function isRested(D, S, it, n, now) {
    var rec = S.p[it.id];
    if (!rec || !eff(rec.h)) return true;
    if (now - rec.lt >= H18) return true;
    return (S.seq - rec.ls) >= restLen(D, S, it, rec, n);
  }
  // answered in the previous session and not allowed back yet
  function prevBlocked(D, S, it) {
    var rec = S.p[it.id], blk = S._block !== undefined ? S._block : S.lastSid;
    if (!rec || !blk || rec.sid !== blk) return false;
    return !(isHi(D, S, it) || trailingMiss(rec) >= 2);
  }

  /* ------------------------------------------------------------ pools */
  function unitItems(D, units) {
    var set = {}; units.forEach(function (u) { set[u] = 1; });
    return D.items.filter(function (it) { return set[it.u]; });
  }
  var FILTERS = {
    missed: function (D, S, it) { return status(it, S.p[it.id]) === 'shaky'; },
    starred: function (D, S, it) { return isStar(S, it.id); },
    lp: function (D, S, it) { return !!it.lp; },
    never: function (D, S, it) { return status(it, S.p[it.id]) === 'new'; }
  };
  function pool(D, S, units, filters, overlap) {
    var base = unitItems(D, units), act = Object.keys(FILTERS).filter(function (f) { return filters && filters[f]; });
    if (!act.length) return base.map(function (it) { return it.id; });
    return base.filter(function (it) {
      var hits = act.map(function (f) { return FILTERS[f](D, S, it); });
      return overlap ? hits.every(Boolean) : hits.some(Boolean);
    }).map(function (it) { return it.id; });
  }
  function filterCounts(D, S, units) {
    var base = unitItems(D, units), out = {};
    Object.keys(FILTERS).forEach(function (f) { out[f] = base.filter(function (it) { return FILTERS[f](D, S, it); }).length; });
    return out;
  }

  /* ------------------------------------------------------------ sequencing */
  function tfTruth(it) { return it.t === 'tf' ? (it.c === 0) : null; }
  function tfOK(it, tfh) {
    if (it.t !== 'tf') return true;
    var v = tfTruth(it), n = tfh.length;
    return !(n >= 2 && tfh[n - 1] === v && tfh[n - 2] === v);
  }
  // Order a list so the same topic never comes twice in a row when that is
  // possible, the same format is avoided, and no 3 identical true/false answers
  // run together (three true/false questions back to back with the same answer;
  // any other question in between breaks the run). prev = {u, t, tfh} carries
  // the state across a session; tfh holds true/false/null for the last questions.
  function arrangeSeq(D, ids, r, prev) {
    prev = prev || {};
    var groups = {}, order = [], total = ids.length;
    ids.forEach(function (id) { var it = itemOf(D, id); (groups[it.u] = groups[it.u] || []).push(id); });
    Object.keys(groups).forEach(function (u) { shuffle(groups[u], r); });
    var lastU = prev.u, lastT = prev.t, tfh = (prev.tfh || []).slice(), out = [];
    while (total > 0) {
      var units = Object.keys(groups).filter(function (u) { return groups[u].length; });
      var cand = units.filter(function (u) { return u !== lastU; });
      if (!cand.length) cand = units;
      var maxU = cand[0];
      cand.forEach(function (u) { if (groups[u].length > groups[maxU].length) maxU = u; });
      var pick;
      if (groups[maxU].length * 2 >= total) pick = maxU;
      else {
        var sum = 0; cand.forEach(function (u) { sum += groups[u].length; });
        var x = r() * sum; pick = cand[cand.length - 1];
        for (var i = 0; i < cand.length; i++) { x -= groups[cand[i]].length; if (x < 0) { pick = cand[i]; break; } }
      }
      var hasOK = function (u) { return groups[u].some(function (q) { return tfOK(itemOf(D, q), tfh); }); };
      if (!hasOK(pick)) {
        var alt = cand.filter(hasOK);
        if (!alt.length) alt = units.filter(function (u) { return u !== lastU && hasOK(u); });
        if (alt.length && !(groups[pick].length * 2 > total + 1)) pick = alt[Math.floor(r() * alt.length)];
      }
      var g = groups[pick], j = -1;
      for (var k = 0; k < g.length && j < 0; k++) { var a = itemOf(D, g[k]); if (a.t !== lastT && tfOK(a, tfh)) j = k; }
      for (k = 0; k < g.length && j < 0; k++) { if (tfOK(itemOf(D, g[k]), tfh)) j = k; }
      if (j < 0) j = 0;
      var id = g.splice(j, 1)[0], it = itemOf(D, id);
      out.push(id); total--; lastU = it.u; lastT = it.t;
      tfh.push(tfTruth(it));
    }
    return repairTF(D, out, prev);
  }
  // Moves a true/false item that would make 3 identical answers in a row to the
  // earliest place where it breaks no rule (true/false runs, topic adjacency).
  function tfBad(D, seq, tfh0) {
    var tfh = tfh0.slice();
    for (var i = 0; i < seq.length; i++) {
      var z = itemOf(D, seq[i]);
      if (!tfOK(z, tfh)) return i;
      tfh.push(tfTruth(z));
    }
    return -1;
  }
  function adj(D, seq, prevU) {
    var n = 0, last = prevU;
    seq.forEach(function (q) { var u = itemOf(D, q).u; if (u === last) n++; last = u; });
    return n;
  }
  function repairTF(D, seq, prev) {
    var tfh0 = (prev && prev.tfh) || [], guard = 0, i;
    while ((i = tfBad(D, seq, tfh0)) >= 0 && guard++ < 50) {
      var base = adj(D, seq, prev && prev.u), done = false;
      for (var slack = 0; slack <= 2 && !done; slack++) {
        for (var k = 0; k < seq.length && !done; k++) {
          if (k === i) continue;
          var t = seq.slice(), x = t.splice(i, 1)[0];
          t.splice(k, 0, x);
          var b = tfBad(D, t, tfh0);
          if ((b < 0 || b > i) && adj(D, t, prev && prev.u) <= base + slack) { seq = t; done = true; }
        }
      }
      if (!done) break;
    }
    return seq;
  }

  function info(D, S, it, n, now) {
    var rec = S.p[it.id], st = status(it, rec);
    return { id: it.id, it: it, rec: rec, st: st, hi: isHi(D, S, it), rested: isRested(D, S, it, n, now),
             blocked: prevBlocked(D, S, it), miss: !!rec && st === 'shaky', cons: trailingMiss(rec) >= 2,
             lt: rec ? rec.lt : 0 };
  }

  /* limited session: up to 1/4 rested misses, up to 1/5 rested review checks,
     then never answered (high ROI first-ish), then more rested, then recent. */
  function buildLimited(D, S, ids, N, nTopic, r, now) {
    var all = ids.map(function (id) { return info(D, S, D.byId[id], nTopic, now); });
    var elig = all.filter(function (x) { return !x.blocked; });
    var taken = {}, pick = [], counts = { miss: 0, review: 0, fresh: 0, more: 0, recent: 0, prev: 0 };
    function take(list, max, key) {
      for (var i = 0; i < list.length && max > 0 && pick.length < N; i++) {
        var x = list[i]; if (taken[x.id]) continue;
        taken[x.id] = 1; pick.push(x.id); counts[key]++; max--;
      }
    }
    var misses = elig.filter(function (x) { return x.miss && x.rested; })
      .sort(function (a, b) { return (b.cons - a.cons) || (a.lt - b.lt); });
    var rights = elig.filter(function (x) { return x.rec && !x.miss && x.st !== 'new' && x.rested; })
      .sort(function (a, b) { return (b.hi - a.hi) || (a.lt - b.lt); });
    var fresh = shuffle(elig.filter(function (x) { return x.st === 'new'; }), r)
      .map(function (x) { return { x: x, k: r() - (x.hi ? 0.5 : 0) }; })
      .sort(function (a, b) { return a.k - b.k; }).map(function (o) { return o.x; });
    take(misses, Math.floor(N / 4), 'miss');
    take(rights, Math.floor(N / 5), 'review');
    take(fresh, N, 'fresh');
    take(misses.concat(rights).sort(function (a, b) { return a.lt - b.lt; }), N, 'more');
    var note = null;
    if (pick.length < N) {
      var recent = elig.filter(function (x) { return !taken[x.id]; }).sort(function (a, b) { return a.lt - b.lt; });
      if (recent.length) { take(recent, N, 'recent'); note = 'recent'; }
    }
    if (pick.length < N) {
      var blocked = all.filter(function (x) { return x.blocked && !taken[x.id]; }).sort(function (a, b) { return a.lt - b.lt; });
      if (blocked.length) { take(blocked, N, 'prev'); note = 'prev'; }
    }
    return { ids: arrangeSeq(D, pick, r, { tfh: S.tfh || [] }), counts: counts, note: note };
  }

  function nextEndless(D, S, ids, nTopic, r, now, recent, prev) {
    prev = prev || {};
    var rec5 = {}; (recent || []).slice(-5).forEach(function (q) { rec5[parseId(q).base] = 1; });
    var all = ids.map(function (id) { return info(D, S, D.byId[id], nTopic, now); })
      .filter(function (x) { return !rec5[x.id]; });
    var cand = all.filter(function (x) { return x.rested && !x.blocked; });
    if (!cand.length) cand = all.slice().sort(function (a, b) { return a.lt - b.lt; }).slice(0, 10);
    if (!cand.length) return null;
    var tfh = prev.tfh || [], ws = cand.map(function (x) {
      var w = (x.miss ? 3 : 1) * (x.hi ? 1.5 : 1);
      if (x.it.u === prev.u) w *= 0.15;
      if (x.it.t === prev.t) w *= 0.4;
      if (!tfOK(x.it, tfh)) w *= 0.02;
      return w;
    });
    var sum = ws.reduce(function (a, b) { return a + b; }, 0), y = r() * sum;
    for (var i = 0; i < cand.length; i++) { y -= ws[i]; if (y < 0) return cand[i].id; }
    return cand[cand.length - 1].id;
  }

  var ST_RANK = { shaky: 0, 'new': 1, once: 2, solid: 3 };
  function buildLastPass(D, S, only20, r, lec) {
    var lp = D.items.filter(function (it) { return it.lp && (!lec || it.lec === lec); });
    var groups = [[], [], [], []];
    lp.forEach(function (it) { groups[ST_RANK[status(it, S.p[it.id])]].push(it.id); });
    var out = [], prev = { tfh: S.tfh || [] };
    groups.forEach(function (g) {
      var s = arrangeSeq(D, g, r, prev);
      out = out.concat(s);
      var tfh = prev.tfh.slice();
      s.forEach(function (q) { tfh.push(tfTruth(itemOf(D, q))); });
      if (s.length) { var it = itemOf(D, s[s.length - 1]); prev = { u: it.u, t: it.t, tfh: tfh }; }
    });
    return only20 ? out.slice(0, 20) : out;
  }
  function statusCounts(D, S, ids) {
    var c = { solid: 0, once: 0, shaky: 0, 'new': 0 };
    ids.forEach(function (id) { var it = D.byId[id]; c[status(it, S.p[id])]++; });
    return c;
  }

  /* ------------------------------------------------------------ levels and pre-test */
  function lastScore(rec) {
    var e = eff(rec && rec.h); if (!e) return null;
    var c = e.charAt(e.length - 1);
    if (c === 'R' || c === 'G') return 1;
    if (c === 'P') return typeof rec.sc === 'number' ? rec.sc : 0.5;
    return 0;
  }
  function topicLevels(D, S) {
    var out = {};
    D.cfg.units.forEach(function (u) {
      var sc = [];
      D.items.forEach(function (it) { if (it.u === u) { var s = lastScore(S.p[it.id]); if (s !== null) sc.push(s); } });
      if (!sc.length) { out[u] = { pct: null, n: 0, level: null }; return; }
      var pct = Math.round(100 * sc.reduce(function (a, b) { return a + b; }, 0) / sc.length);
      out[u] = { pct: pct, n: sc.length, level: pct >= 80 ? 'Strong' : pct >= 60 ? 'Okay' : 'Weak' };
    });
    return out;
  }
  /* ------------------------------------------------------------ lectures */
  function lecItems(D, lec) { return D.items.filter(function (it) { return it.lec === lec; }); }
  function lectureLevels(D, S) {
    var out = {};
