  <h2>Read me</h2>
  <p>This exam has two pages that work as one system: the <b>Drill</b> finds what you do not know and proves when you do, and the <b>Mastery Guide</b> teaches it again. Every fact on a Fix my misses card in the Drill is in the Guide section it links to.</p>

  <h3>How to use the Drill</h3>
  <ol>
    <li><b>Start with the pre-test.</b> It asks 3 questions from every topic and gives each topic a level: Strong (80% and up), Okay (60-79%) or Weak (under 60%). It never uses last-pass questions, so those stay fresh.</li>
    <li><b>Think first.</b> Each question appears without its choices for 10-15 seconds. Answer it in your head before the choices show up. Turn the timer off on any question if you need to.</li>
    <li><b>Be honest after a right answer.</b> Choose "Knew it" or "I guessed" (key G). A guess comes back sooner.</li>
    <li><b>Read the "why" on every miss.</b> You get why your pick is wrong, the key idea and the concept card. A different question on the same concept follows 3-6 questions later.</li>
    <li><b>Use short daily sessions.</b> Pick 20 questions or a 30-minute timed plan. Questions you just answered rest before they come back, so each session is new work.</li>
    <li><b>Finish with the last pass.</b> It asks every question from the cases asked in class, the slide exercises and the facts flagged on slides, shakiest first.</li>
  </ol>
  <p class="small">Keys: 1-6 pick an option, Enter checks and moves on, S stars, G marks a guess. Progress saves on this device and, inside claude.ai, to your account so your phone, tablet and laptop share it.</p>

  <h3>How to use the Mastery Guide</h3>
  <ol>
    <li>Read a section in order: how it works, what to do first, the client example, the common trap and the memory trick.</li>
    <li>Cover the page and tap each blank in "Test yourself" only after you have said the answer.</li>
    <li>Finish each section by reading the Key ideas box. Those lines are exactly what the Drill's concept cards show.</li>
  </ol>

  <h3>How to use both together</h3>
  <ol>
    <li><b>Drill to find:</b> run the pre-test, then open Fix my misses to see the concepts you keep missing.</li>
    <li><b>Guide to re-learn:</b> follow the card's "Open in the guide" link and study that section.</li>
    <li><b>Drill to prove:</b> come back and press "Fix this". A question counts as solid only after you get it right twice in a row (three times for true/false), with rest between.</li>
  </ol>
</div>

gmatic surface of both ventricles is supplied by the posterior interventricular artery (and in co-dominance a circumflex branch).","4":"The right atrium gets atrial branches of the right coronary artery."},"m":{"1":"mixes up LAD and PDA septal territory","2":"thinks LAD supplies the AV node","3":"mixes up sternocostal and diaphragmatic surfaces"},"lp":true,"k":"anat-coronary","src":"Anatomy L4 slides, in-class case","kind":"Recognize and interpret"},{"id":"q1","u":"Anatomy","t":"mc","q":"A client's angiogram shows a blocked posterior interventricular (descending) artery. Which region should the nurse anticipate is at greatest risk of ischemia?","o":["Posterior one third of the interventricular septum","Anterior two thirds of the interventricular septum","Sternocostal surface of both ventricles","Left atrium","Infundibulum of the right ventricle"],"c":0,"w":"The posterior interventricular (descending) artery runs in the posterior interventricular groove together with the middle cardiac vein. It supplies the diaphragmatic surface of both ventricles and the posterior one third of the interventricular septum. The septum is therefore shared: the front two thirds belong to the LAD and the back third to the PDA, so a PDA block threatens the posterior septum. (Anatomy L4 slides)","x":{"1":"The anterior 2/3 of the septum is LAD territory.","2":"The sternocostal surface of both ventricles is supplied by the LAD.","3":"The left atrium receives branches of the circumflex artery.","4":"The infundibulum is supplied by the right conus artery, an early RCA branch."},"m":{"1":"mixes up LAD and PDA septal territory","2":"mixes up sternocostal and diaphragmatic surfaces"},"lp":false,"k":"anat-coronary","src":"Anatomy L4 slides","kind":"Recognize and interpret"},{"id":"q2","u":"Anatomy","t":"sata","q":"A client has a sudden occlusion of the proximal right coronary artery. Which structures should the nurse recognize may lose their arterial supply? Select all that apply.","o":["SA node","AV node","Right ventricle via the acute (right) marginal branch","Posterior one third of the interventricular septum","Anterior two thirds of the interventricular septum","Left ventricle via the obtuse (left) marginal branch"],"c":[0,1,2,3],"w":"The RCA arises from the right aortic sinus and runs in the coronary groove, first between the right atrium and right ventricle and then posteriorly. Along the way it gives the artery to the SA node (65% of people), the artery to the AV node (80%), ventricular branches and the acute (right) marginal artery to the right ventricle, and it ends as the posterior interventricular artery that supplies the posterior third of the septum. A proximal occlusion can therefore starve all of these. (Anatomy L4 slides)","x":{"4":"The anterior 2/3 of the septum is supplied by the LAD.","5":"The obtuse (left) marginal artery is a branch of the circumflex, a branch of the left coronary."},"m":{"4":"thinks RCA supplies the anterior septum","5":"mixes up acute and obtuse marginal"},"lp":false,"k":"anat-coronary","src":"Anatomy L4 slides","kind":"Recognize and interpret"},{"id":"q3","u":"Anatomy","t":"mc","q":"A client with angina asks where the coronary arteries begin. Which response by the nurse is accurate?","o":["The right coronary artery arises from the right aortic sinus, just above the right cusp of the aortic valve.","The right coronary artery arises from the posterior aortic sinus.","The left coronary artery arises from the pulmonary trunk.","Both coronary arteries arise from the arch of the aorta."],"c":0,"w":"The ascending aorta has three sinuses just above the cusps of the aortic valve: right, left and posterior. The right coronary artery arises from the right (anterior) aortic sinus and the left coronary artery from the left (anterior) aortic sinus. The posterior sinus gives no coronary branch. (Anatomy L4 slides)","x":{"1":"The posterior aortic sinus lies above the posterior cusp and gives no coronary artery.","2":"The left coronary artery only runs between the pulmonary trunk and the left auricle; it arises from the left aortic sinus.","3":"The arch gives the brachiocephalic, left common carotid and left subclavian arteries; the coronaries arise from sinuses of the ascending aorta."},"m":{"1":"thinks a coronary arises from the posterior sinus","2":"confuses the LCA's course with its origin"},"lp":false,"k":"anat-coronary","src":"Anatomy L4 slides","kind":"Teaching and statements"},{"id":"q4","u":"Anatomy","t":"mc","q":"A client develops complete heart block after a coronary occlusion. The nurse knows the artery to the AV node most often arises from which vessel?","o":["Right coronary artery","Circumflex artery","Left anterior descending artery","Left (obtuse) marginal artery"],"c":0,"w":"The AV node sits in the conduction path between atria and ventricles, so losing its blood supply can block conduction. The artery to the AV node comes from the right coronary artery in about 80% of people and from the circumflex in about 20%. The LAD supplies the A-V bundle further down the conducting system. (Anatomy L4 slides)","x":{"1":"The circumflex gives the artery to the AV node in only about 20% of people.","2":"The LAD supplies the A-V bundle, not the AV node itself.","3":"The obtuse marginal is a circumflex branch to the left ventricle."},"m":{"1":"reverses the AV-node percentages","2":"thinks LAD supplies the AV node"},"lp":false,"k":"anat-coronary","src":"Anatomy L4 slides","kind":"Apply a fact"},{"id":"q5","u":"Anatomy","t":"mc","q":"A nursing student describes the blood supply of the SA node. Which statement by the student is accurate?","o":["It arises from the right coronary artery in about 65% of people and from the circumflex in about 35%.","It arises from the circumflex in about 65% of people and from the right coronary in about 35%.","It always arises from the left anterior descending artery.","It arises from the right conus artery."],"c":0,"w":"The SA node artery is a branch of the right coronary artery in about 65% of people and of the circumflex branch of the left coronary in about 35%. Knowing the percentages helps predict which occlusion can disturb the pacemaker. (Anatomy L4 slides)","x":{"1":"The percentages are reversed: the RCA supplies the SA node in about 65%.","2":"The LAD supplies the sternocostal surface, anterior 2/3 of the septum and the A-V bundle, not the SA node.","3":"The right conus artery goes to the infundibulum of the right ventricle."},"m":{"1":"reverses the SA-node percentages"},"lp":false,"k":"anat-coronary","src":"Anatomy L4 slides","kind":"Teaching and statements"},{"id":"q6","u":"Anatomy","t":"tf","q":"A nurse states that the LAD supplies the A-V bundle as well as the anterior two thirds of the interventricular septum.","o":["True","False"],"c":0,"w":"The anterior interventricular artery (LAD) supplies the sternocostal surface of both ventricles, the anterior 2/3 of the interventricular septum and the A-V bundle. (Anatomy L4 slides)","x":{"1":"This statement is true: the A-V bundle is listed among the LAD's territories."},"m":{},"lp":false,"k":"anat-coronary","src":"Anatomy L4 slides","kind":"Apply a fact"},{"id":"q7","u":"Anatomy","t":"mc","q":"A client's angiography report reads \"left dominant circulation.\" Which interpretation by the nurse is correct?","o":["The posterior interventricular artery is a large branch of the circumflex artery.","The posterior interventricular artery is a large branch of the right coronary artery.","The RCA gives the posterior interventricular branch and the circumflex sends a branch to the diaphragmatic left ventricle.","The circumflex supplies the SA node in every client."],"c":0,"w":"Dominance is named by which artery gives the posterior interventricular artery. In left dominance (15% on the slide) the posterior interventricular artery is a large branch of the circumflex; in right dominance (15%) it is a large branch of the right coronary; in co-dominance (70%) the RCA gives it and the circumflex also reaches the diaphragmatic surface of the left ventricle. Note: the slide gives co-dominance as the most common pattern (70%); many textbooks give right dominance as the most common instead, so check which figure your instructor expects. (Anatomy L4 slides)","x":{"1":"That describes right dominance.","2":"That describes co-dominance (balanced circulation).","3":"The circumflex supplies the SA node in only about 35% of people, whatever the dominance."},"m":{"1":"mixes up right and left dominance","2":"mixes up co-dominance and left dominance"},"lp":false,"k":"anat-dominance","src":"Anatomy L4 slides","kind":"Recognize and interpret"},{"id":"q8","u":"Anatomy","t":"cloze","q":"While reviewing a cardiac venogram with a client, the nurse identifies where each vein runs or ends. Match each vein to its location.","o":{"rows":["Great cardiac vein","Middle cardiac vein","Coronary sinus","Anterior cardiac veins"],"choices":["Anterior interventricular groove, with the LAD","Posterior interventricular groove, with the posterior interventricular artery","Posterior wall of the right atrium","Anterior wall of the right atrium","Directly into all four chambers"]},"c":[0,1,2,3],"w":"The heart drains by three routes. Most blood collects into the coronary sinus, which lies between the left atrium and the diaphragmatic surface and ends in the posterior wall of the right atrium; its tributaries include the great cardiac vein (with the LAD in the anterior groove) and the middle cardiac vein (with the PDA in the posterior groove). The 2-3 anterior cardiac veins of the right ventricle end in the anterior wall of the right atrium, and the venae cordis minimi open directly into the chambers. Note: one slide says 3-4 anterior cardiac veins and another says 2-3. (Anatomy L4 slides, slide exercise)","x":{"4":"This is how the venae cordis minimi drain, not any of the named veins."},"m":{"4":"confuses named veins with venae cordis minimi"},"lp":true,"k":"anat-cardiac-veins","src":"Anatomy L4 slides, slide exercise","rs":{"0":"During cardiac surgery the nurse watches the surgeon trace the vein that accompanies the LAD. In which location does the great cardiac vein run?","1":"A client's venogram highlights the middle cardiac vein. Where should the nurse expect this vein to run?","2":"A nurse explains to a client where the heart's main venous channel empties. Where does the coronary sinus end?","3":"A nurse reviews the small veins draining the right ventricle. Where do the anterior cardiac veins end?"},"kind":"Apply a fact"},{"id":"q9","u":"Anatomy","t":"tf","q":"A nurse explains to a client that the coronary sinus empties into the posterior wall of the left atrium.","o":["True","False"],"c":1,"w":"False. The coronary sinus lies between the left atrium and the diaphragmatic surface of the heart, but it terminates in the posterior wall of the RIGHT atrium, like the rest of the systemic venous return. (Anatomy L4 slides)","x":{"0":"The coronary sinus ends in the right atrium, not the left."},"m":{"0":"thinks coronary sinus drains into left atrium"},"lp":false,"k":"anat-cardiac-veins","src":"Anatomy L4 slides","kind":"Teaching and statements"},{"id":"q10","u":"Anatomy","t":"sata","q":"A client's coronary sinus is being cannulated for a procedure. Which veins should the nurse recognize as tributaries that drain into it? Select all that apply.","o":["Great cardiac vein","Middle cardiac vein","Small cardiac vein","Oblique vein of the left atrium","Anterior cardiac veins","Venae cordis minimi"],"c":[0,1,2,3],"w":"The coronary sinus collects five tributaries: the great, middle and small cardiac veins, the posterior vein of the left ventricle and the oblique vein of the left atrium. The anterior cardiac veins and the venae cordis minimi do not join it; they drain straight into the right atrium or the chambers. (Anatomy L4 slides)","x":{"4":"Anterior cardiac veins bypass the coronary sinus and end directly in the anterior wall of the right atrium.","5":"Venae cordis minimi drain directly into the cardiac chambers."},"m":{"4":"thinks anterior cardiac veins join the coronary sinus"},"lp":false,"k":"anat-cardiac-veins","src":"Anatomy L4 slides","kind":"Recognize and interpret"},{"id":"q11","u":"Anatomy","t":"blanks","q":"Before a cardiac exam, a nurse marks the outline of a client's heart on the chest wall. Point A lies at the lower border of the left {1} costal cartilage, point B at the upper border of the right {2} costal cartilage, and point D, the apex, lies in the left {3}, 3.5 inches from the midline.","o":[["2nd","3rd","4th"],["3rd","2nd","6th"],["5th intercostal space","4th intercostal space","6th costal cartilage"]],"c":[0,0,0],"w":"Four points outline the heart: A (lower border of the left 2nd costal cartilage, 0.5 inch from the sternum), B (upper border of the right 3rd costal cartilage, 0.5 inch from the sternum), C (right 6th costal cartilage, 0.5 inch from the sternum) and D (left 5th intercostal space, 3.5 inches from the midline). Joining them gives the borders: upper A-B, right B-C, lower C-D and left D-A. (Anatomy L4 slides)","x":{"0:1":"The left 3rd costal cartilage is where the pulmonary valve lies, not point A.","0:2":"The left 4th costal cartilage marks the mitral valve.","1:1":"The 2nd costal cartilage is point A on the LEFT side.","1:2":"The right 6th costal cartilage is point C, the lower end of the right border.","2:1":"The left 4th intercostal space marks the tricuspid valve.","2:2":"The 6th costal cartilage is point C, on the right."},"m":{"0:1":"puts point A one level too low","1:1":"swaps the levels of points A and B","2:1":"places the apex one space too high"},"lp":false,"k":"anat-surface","src":"Anatomy L4 slides","kind":"Apply a fact"},{"id":"q12","u":"Anatomy","t":"mc","q":"A nurse is marking the right border of a client's heart on the chest wall. Between which two points should the line be drawn?","o":["From the right 3rd costal cartilage (B) to the right 6th costal cartilage (C)","From the left 2nd costal cartilage (A) to the right 3rd costal cartilage (B)","From the right 6th costal cartilage (C) to the left 5th intercostal space (D)","From the left 5th intercostal space (D) to the left 2nd costal cartilage (A)","From the left 3rd costal cartilage to point C"],"c":0,"w":"The borders are named by joining the four surface points in order: upper border A-B, right border B-C, lower border C-D and left border D-A. The right border therefore runs from the upper border of the right 3rd costal cartilage down to the right 6th costal cartilage, 0.5 inch from the sternum. The coronary groove is a separate line from the left 3rd costal cartilage to point C. (Anatomy L4 slides)","x":{"1":"A-B is the upper border.","2":"C-D is the lower border.","3":"D-A is the left border.","4":"This line marks the coronary groove, not a border."},"m":{"1":"mixes up upper and right borders"},"lp":false,"k":"anat-surface","src":"Anatomy L4 slides","kind":"Apply a fact"},{"id":"q13","u":"Anatomy","t":"mc","q":"A nurse places the stethoscope to locate the surface marking of a client's mitral valve. Where is the mitral valve located?","o":["Opposite the left 4th costal cartilage, behind the left half of the sternum","Behind the left 3rd costal cartilage at its junction with the sternum","Opposite the left 3rd intercostal space, behind the left margin of the sternum","Opposite the left 4th intercostal space, behind the midline of the sternum","Left 5th intercostal space, 3.5 inches from the midline"],"c":0,"w":"The valves lie in a diagonal line behind the sternum, from high on the left to low in the middle, remembered as PAMT. Pulmonary: behind the left 3rd costal cartilage at its junction with the sternum. Aortic: opposite the left 3rd intercostal space. Mitral: opposite the left 4th costal cartilage behind the left half of the sternum. Tricuspid: opposite the left 4th intercostal space behind the midline of the sternum. (Anatomy L4 slides)","x":{"1":"That is the surface marking of the pulmonary valve.","2":"That is the surface marking of the aortic valve.","3":"That is the surface marking of the tricuspid valve.","4":"That is point D, the apex of the heart, not a valve."},"m":{"1":"mixes up mitral and pulmonary valve markings","2":"mixes up mitral and aortic valve markings","3":"mixes up mitral and tricuspid valve markings"},"lp":false,"k":"anat-surface","src":"Anatomy L4 slides","kind":"Apply a fact"},{"id":"q14","u":"Anatomy","t":"order","q":"A nurse reviews the surface markings of the heart valves. Arrange the valves from the highest to the lowest position on the chest wall.","o":["Pulmonary valve (left 3rd costal cartilage)","Aortic valve (left 3rd intercostal space)","Mitral valve (left 4th costal cartilage)","Tricuspid valve (left 4th intercostal space)"],"c":[0,1,2,3],"w":"The mnemonic PAMT gives the order from top to bottom: pulmonary behind the left 3rd costal cartilage, aortic opposite the left 3rd intercostal space, mitral opposite the left 4th costal cartilage and tricuspid opposite the left 4th intercostal space. Each valve sits about half a level lower than the one before. (Anatomy L4 slides)","x":{},"m":{},"lp":false,"k":"anat-surface","src":"Anatomy L4 slides","kind":"Apply a fact"},{"id":"q15","u":"Anatomy","t":"order","q":"A client is scheduled for percutaneous coronary intervention. Arrange the steps of the procedure in the order they occur.","o":["Local anesthesia is given","A catheter is passed retrograde from the radial or femoral artery","The catheter reaches the ascending aorta","Contrast is injected into the orifice of each coronary artery and photographed","A stent is placed to open the narrowed vessel"],"c":[0,1,2,3,4],"w":"With the client under local anesthesia, a catheter is passed retrograde from the radial or femoral artery directly into the ascending aorta, where the coronary arteries begin. Multiple small doses of radiopaque contrast are injected into the orifice of each coronary artery to photograph every segment. A stent may then be placed to open a vessel narrowed by atherosclerotic plaque. (Anatomy L4 slides)","x":{},"m":{},"lp":false,"k":"anat-pci","src":"Anatomy L4 slides","kind":"Apply a fact"},{"id":"q16","u":"Anatomy","t":"mc","q":"A 45-year-old man is in surgery. While seated at the head of the operating table, the anesthesiologist periodically checks the patient's pulse by palpating the artery located anterior to the tragus of the external ear. Which of the following arteries is being utilized to monitor the patient's pulse?","o":["Superficial temporal","Maxillary","Posterior auricular","Facial","Internal carotid"],"c":0,"w":"The external carotid artery ends inside the parotid gland behind the neck of the mandible by dividing into the maxillary and superficial temporal arteries. The superficial temporal artery then ascends just in front of the tragus of the ear, where it can be felt, which makes it a convenient pulse for the anesthesiologist at the head of the table. (Anatomy L5 slides, in-class case)","x":{"1":"The maxillary artery is the other terminal branch of the external carotid; it runs deep, not in front of the tragus.","2":"The posterior auricular artery is an external carotid branch that runs behind the ear.","3":"The facial artery is an external carotid branch to the face, not in front of the tragus.","4":"The internal carotid has no branches in the neck and enters the skull through the carotid canal."},"m":{"1":"mixes up the two terminal ECA branches"},"lp":true,"k":"anat-carotid","src":"Anatomy L5 slides, in-class case","kind":"Apply a fact"},{"id":"q17","u":"Anatomy","t":"mc","q":"A nurse palpates the carotid pulse and recalls where the common carotid artery divides. At which level does the common carotid artery end?","o":["At the upper border of the thyroid cartilage (C3-C4)","Behind the sternoclavicular joint","At the outer border of the first rib","Behind the neck of the mandible within the parotid gland","At the jugular foramen"],"c":0,"w":"The common carotid arteries arise differently on each side (right from the brachiocephalic artery behind the sternoclavicular joint, left from the arch of the aorta), ascend inside the carotid sheath and end at the upper border of the thyroid cartilage, between C3 and C4, by dividing into the external and internal carotid arteries. (Anatomy L5 slides)","x":{"1":"That is where the right common carotid begins from the brachiocephalic artery.","2":"That is where the subclavian artery becomes the axillary artery.","3":"That is where the external carotid ends.","4":"That is where the internal jugular vein begins."},"m":{"1":"confuses origin with termination","3":"confuses common and external carotid termination"},"lp":false,"k":"anat-carotid","src":"Anatomy L5 slides","kind":"Apply a fact"},{"id":"q18","u":"Anatomy","t":"mc","q":"Before an internal jugular cannulation, the nurse reviews the relations of the common carotid artery in the carotid sheath. Which structure lies lateral to the artery?","o":["Internal jugular vein","Trachea","Larynx","Scalenus anterior"],"c":0,"w":"Inside the carotid sheath the common carotid artery is related medially to the trachea and larynx and laterally to the internal jugular vein. Knowing that the vein is lateral helps the operator avoid the artery during a jugular puncture. (Anatomy L5 slides)","x":{"1":"The trachea lies medial to the common carotid artery.","2":"The larynx lies medial to the common carotid artery.","3":"Scalenus anterior is a relation of the subclavian artery, which it divides into three parts."},"m":{"1":"reverses medial and lateral relations","2":"reverses medial and lateral relations"},"lp":false,"k":"anat-carotid","src":"Anatomy L5 slides","kind":"Apply a fact"},{"id":"q19","u":"Anatomy","t":"sata","q":"A client needs ligation of the external carotid artery. Which arteries should the nurse recognize arise directly from it? Select all that apply.","o":["Superior thyroid artery","Lingual artery","Facial artery","Occipital artery","Inferior thyroid artery","Vertebral artery","Transverse cervical artery"],"c":[0,1,2,3],"w":"The external carotid gives eight branches: superior thyroid, ascending pharyngeal, lingual, facial, occipital and posterior auricular, then ends as the superficial temporal and maxillary arteries. The inferior thyroid, transverse cervical and vertebral arteries all come from the subclavian system instead. (Anatomy L5 slides)","x":{"4":"The inferior thyroid artery is a branch of the thyrocervical trunk of the subclavian artery.","5":"The vertebral artery is a branch of the first part of the subclavian artery.","6":"The transverse cervical artery is a branch of the thyrocervical trunk."},"m":{"4":"mixes up superior and inferior thyroid origins"},"lp":false,"k":"anat-carotid","src":"Anatomy L5 slides","kind":"Recognize and interpret"},{"id":"q20","u":"Anatomy","t":"tf","q":"A nurse teaching about cerebral blood supply states that the internal carotid artery gives no branches in the neck.","o":["True","False"],"c":0,"w":"True. The internal carotid artery arises at the upper border of the thyroid cartilage, gives no branches in the neck, enters the cranial cavity through the carotid canal and supplies the brain, eyes, forehead and part of the nose. (Anatomy L5 slides)","x":{"1":"This statement is true: the internal carotid has no branches in the neck."},"m":{},"lp":false,"k":"anat-carotid","src":"Anatomy L5 slides","kind":"Teaching and statements"},{"id":"q21","u":"Anatomy","t":"mc","q":"A client is being assessed for compression of the subclavian artery in the root of the neck. Which structure divides this artery into three parts?","o":["Scalenus anterior, which passes anterior to the artery","Sternomastoid, which the external jugular vein crosses","The outer border of the first rib","The upper border of the thyroid cartilage"],"c":0,"w":"The subclavian artery arches laterally in the root of the neck and ends at the outer border of the first rib as the axillary artery. Scalenus anterior passes in front of it and divides it into three parts: the first part medial to the muscle, the second behind it and the third lateral to it. Each part has its own branches. (Anatomy L5 slides)","x":{"1":"The sternomastoid is the muscle the external jugular vein descends over.","2":"The outer border of the first rib is where the subclavian ends and becomes the axillary artery.","3":"That level marks the end of the common carotid artery."},"m":{"1":"confuses neck muscles","2":"confuses termination with the dividing muscle"},"lp":false,"k":"anat-subclavian","src":"Anatomy L5 slides","kind":"Apply a fact"},{"id":"q22","u":"Anatomy","t":"cloze","q":"A nurse reviews the branches of the subclavian artery before a neck procedure. Match each artery to the part of the subclavian artery it arises from.","o":{"rows":["Vertebral artery","Costocervical trunk","Dorsal scapular artery","Internal thoracic artery"],"choices":["1st part (medial to scalenus anterior)","2nd part (behind scalenus anterior)","3rd part (lateral to scalenus anterior)","External carotid artery"]},"c":[0,1,2,0],"w":"Scalenus anterior divides the subclavian artery into three parts. The first part (medial) gives the vertebral artery, the internal thoracic artery and the thyrocervical trunk. The second part (behind the muscle) gives the costocervical trunk, which divides into the superior intercostal and deep cervical arteries. The third part (lateral) gives the dorsal scapular artery in about 66% of people. (Anatomy L5 slides)","x":{"3":"The external carotid gives neck branches like the superior thyroid but none of these."},"m":{"3":"mixes subclavian and carotid branches"},"lp":false,"k":"anat-subclavian","src":"Anatomy L5 slides","rs":{"0":"A client has a vertebral artery injury. From which part of the subclavian artery does the vertebral artery arise?","1":"A nurse traces the costocervical trunk on a client's angiogram. Which part of the subclavian artery gives this trunk?","2":"A nurse reviews a client's shoulder angiogram showing the dorsal scapular artery. Which part of the subclavian artery gives it?","3":"A client is being evaluated for an internal thoracic artery graft. Which part of the subclavian artery gives the internal thoracic artery?"},"kind":"Apply a fact"},{"id":"q23","u":"Anatomy","t":"sata","q":"A client is undergoing thyroid surgery near the thyrocervical trunk. Which arteries should the nurse recognize as branches of this trunk? Select all that apply.","o":["Inferior thyroid artery","Transverse cervical artery","Suprascapular artery","Superior thyroid artery","Deep cervical artery","Superior intercostal artery"],"c":[0,1,2],"w":"The thyrocervical trunk is one of the three branches of the first part of the subclavian artery. It gives the inferior thyroid, transverse cervical and suprascapular arteries. The costocervical trunk from the second part gives the superior intercostal and deep cervical arteries. (Anatomy L5 slides)","x":{"3":"The superior thyroid artery is the first branch of the external carotid.","4":"The deep cervical artery is a branch of the costocervical trunk (2nd part).","5":"The superior intercostal artery is a branch of the costocervical trunk (2nd part)."},"m":{"3":"mixes up superior and inferior thyroid origins"},"lp":false,"k":"anat-subclavian","src":"Anatomy L5 slides","kind":"Recognize and interpret"},{"id":"q24","u":"Anatomy","t":"mc","q":"A client squeezed an infected pimple on the upper lip and now has a spreading infection. Which complication should the nurse be most concerned about?","o":["Spread of infection to the cavernous sinus","Spread of infection to the sigmoid sinus","Spread of infection to the subclavian vein through the external jugular vein","Spread of infection to the parotid gland through the deep facial vein"],"c":0,"w":"The nose and upper lip are the dangerous area of the face. Their blood drains into the anterior facial vein, which connects with the cavernous sinus through the ophthalmic veins and through the deep facial vein and pterygoid plexus. Infection in this area can therefore travel back into the cavernous sinus inside the skull. (Anatomy L5 slides)","x":{"1":"The sigmoid sinus continues as the internal jugular vein at the jugular foramen; it is not the route from the dangerous area.","2":"The external jugular vein drains into the subclavian vein, but it does not drain the nose and upper lip.","3":"The deep facial vein links the anterior facial vein to the pterygoid plexus, not to the parotid gland."},"m":{"1":"confuses cavernous and sigmoid sinus"},"lp":false,"k":"anat-facial-veins","src":"Anatomy L5 slides","kind":"Apply a fact"},{"id":"q25","u":"Anatomy","t":"order","q":"A client has an infected lesion on the upper lip. Arrange the deep venous route by which the infection can reach the cavernous sinus.","o":["Infected area of the nose and upper lip","Anterior facial vein","Deep facial vein","Pterygoid plexus","Cavernous sinus"],"c":[0,1,2,3,4],"w":"Infection in the dangerous area drains into the anterior facial vein. The deep facial vein connects the anterior facial vein to the pterygoid plexus of veins, and the plexus communicates with the cavernous sinus, so organisms can travel this deep route into the skull. A second route runs from the anterior facial vein through the ophthalmic veins. (Anatomy L5 slides)","x":{},"m":{},"lp":false,"k":"anat-facial-veins","src":"Anatomy L5 slides","kind":"Apply a fact"},{"id":"q26","u":"Anatomy","t":"blanks","q":"A nurse reviews the venous anatomy of the parotid region. The retromandibular vein forms inside the {1} by the union of the maxillary vein and the {2} vein; its posterior branch then joins the {3} vein to form the external jugular vein.","o":[["parotid gland","submandibular gland","cavernous sinus"],["superficial temporal","supraorbital","lingual"],["posterior auricular","anterior facial","transverse cervical"]],"c":[0,0,0],"w":"The retromandibular (posterior facial) vein is formed inside the parotid gland by the maxillary and superficial temporal veins. At the lower pole of the parotid it divides: the posterior branch joins the posterior auricular vein to form the external jugular vein, and the anterior branch joins the anterior facial vein to form the common facial vein, which drains into the IJV. (Anatomy L5 slides)","x":{"0:1":"The retromandibular vein forms inside the parotid gland, not the submandibular gland.","0:2":"The cavernous sinus is inside the skull and receives the ophthalmic veins.","1:1":"The supraorbital vein joins the supratrochlear vein to form the anterior facial vein.","1:2":"The lingual vein is a tributary of the internal jugular vein.","2:1":"The anterior facial vein joins the ANTERIOR branch to form the common facial vein.","2:2":"The transverse cervical vein is a tributary of the external jugular vein."},"m":{"1:1":"mixes up anterior facial and retromandibular formation","2:1":"mixes up anterior and posterior divisions"},"lp":false,"k":"anat-facial-veins","src":"Anatomy L5 slides","kind":"Apply a fact"},{"id":"q27","u":"Anatomy","t":"mc","q":"A nurse notices a distended vein crossing superficial to a client's sternomastoid muscle. Which veins unite to form this vein?","o":["The posterior division of the retromandibular vein and the posterior auricular vein","The supraorbital and supratrochlear veins","The maxillary and superficial temporal veins","The anterior facial vein and the anterior division of the retromandibular vein","The internal jugular and subclavian veins"],"c":0,"w":"The vein running superficial to sternomastoid is the external jugular vein. It forms from the posterior division of the retromandibular vein and the posterior auricular vein, descends over sternomastoid and ends in the subclavian vein. Its tributaries are the transverse cervical, suprascapular and anterior jugular veins. (Anatomy L5 slides, slide exercise)","x":{"1":"These form the anterior facial vein at the medial angle of the eye.","2":"These form the retromandibular vein inside the parotid gland.","3":"These form the common facial vein, which drains into the IJV.","4":"These form the brachiocephalic vein."},"m":{"1":"mixes up formation of the facial veins","2":"mixes up formation of the facial veins","3":"mixes up anterior and posterior divisions"},"lp":true,"k":"anat-neck-veins","src":"Anatomy L5 slides, slide exercise","kind":"Apply a fact"},{"id":"q28","u":"Anatomy","t":"sata","q":"A client has an internal jugular central line. Which veins should the nurse recognize as tributaries of the internal jugular vein? Select all that apply.","o":["Common facial vein","Lingual vein","Superior thyroid vein","Middle thyroid vein","Pharyngeal vein","Transverse cervical vein","Suprascapular vein","Anterior jugular vein"],"c":[0,1,2,3,4],"w":"The internal jugular vein begins as the continuation of the sigmoid sinus at the jugular foramen and receives the pharyngeal, common facial, lingual, superior thyroid and middle thyroid veins before joining the subclavian vein. The transverse cervical, suprascapular and anterior jugular veins belong to the external jugular vein. (Anatomy L5 slides)","x":{"5":"The transverse cervical vein drains into the external jugular vein.","6":"The suprascapular vein drains into the external jugular vein.","7":"The anterior jugular vein drains into the external jugular vein."},"m":{"5":"mixes up IJV and EJV tributaries","6":"mixes up IJV and EJV tributaries","7":"mixes up IJV and EJV tributaries"},"lp":false,"k":"anat-neck-veins","src":"Anatomy L5 slides","kind":"Recognize and interpret"},{"id":"q29","u":"Anatomy","t":"tf","q":"A nurse states that the external jugular vein ends by draining into the internal jugular vein.","o":["True","False"],"c":1,"w":"False. The external jugular vein descends superficial to sternomastoid and ends in the SUBCLAVIAN vein; the subclavian vein then joins the internal jugular vein to form the brachiocephalic vein. (Anatomy L5 slides)","x":{"0":"The external jugular vein ends in the subclavian vein, not the internal jugular vein."},"m":{"0":"thinks EJV drains into IJV"},"lp":false,"k":"anat-neck-veins","src":"Anatomy L5 slides","kind":"Apply a fact"},{"id":"q30","u":"Anatomy","t":"order","q":"A nurse traces the venous drainage from a client's face to the heart. Arrange the veins in the order blood passes through them.","o":["Anterior facial vein","Common facial vein","Internal jugular vein","Brachiocephalic vein","Superior vena cava"],"c":[0,1,2,3,4],"w":"The anterior facial vein joins the anterior division of the retromandibular vein to form the common facial vein, which drains into the internal jugular vein. The internal jugular joins the subclavian vein to form the brachiocephalic vein, and the right and left brachiocephalic veins unite to form the superior vena cava. (Anatomy L5 slides)","x":{},"m":{},"lp":false,"k":"anat-neck-veins","src":"Anatomy L5 slides","kind":"Apply a fact"},{"id":"q31","u":"Physiology","t":"mc","q":"A nurse explains an ECG to an anxious client before attaching the electrodes. Which statement by the nurse is accurate?","o":["It records the electrical activity of your heart over time from the skin surface.","It measures how much blood flows through your heart with each beat.","It measures the pressure inside your coronary arteries.","It sends a small current into your heart to test the valves."],"c":0,"w":"The heart's electrical activity creates potential differences that the body, a good conductor, carries to the skin, where electrodes record them. The ECG is a measure of the electrical activity of the heart per unit time. It does not measure blood flow through the heart, so a normal tracing says nothing directly about how much blood is pumped. (Physiology L6 slides (ECG I))","x":{"1":"The ECG explicitly does NOT measure the flow of blood through the heart.","2":"The ECG records electrical potential differences, not pressures.","3":"The electrodes only pick up potential differences generated by the heart; the body conducts them to the skin."},"m":{"1":"thinks the ECG measures blood flow"},"lp":false,"k":"phys-ecg-leads","src":"materials","kind":"Teaching and statements"},{"id":"q32","u":"Physiology","t":"mc","q":"A nurse reviews a client's 12-lead ECG. Which group of leads records the potential difference between two active electrodes?","o":["I, II and III","aVR, aVL and aVF","V1 through V6","II, III and aVF"],"c":0,"w":"The standard 12-lead ECG has six limb leads in the frontal plane and six chest leads in the horizontal plane. Of the limb leads, I, II and III are bipolar (standard) leads that record the difference between two active electrodes; their axes form Einthoven's equilateral triangle. aVR, aVL and aVF are unipolar augmented leads that compare one active electrode with a zero-potential electrode. (Physiology L6 slides (ECG I))","x":{"1":"These are the unipolar (augmented) limb leads: an active electrode against an electrode at zero potential.","2":"These are the precordial (chest) leads, which look at the horizontal plane.","3":"These are the leads that view the inferior heart; aVF is unipolar."},"m":{"1":"mixes up bipolar and augmented leads","3":"confuses lead views with lead types"},"lp":false,"k":"phys-ecg-leads","src":"materials","kind":"Apply a fact"},{"id":"q33","u":"Physiology","t":"cloze","q":"A nurse is reading a client's 12-lead ECG to localize a problem. Match each group of leads to the part of the heart it views best.","o":{"rows":["I, aVL, V5, V6","V1, V2","V3, V4","II, III, aVF"],"choices":["Left lateral portion","Septum","Anterior portion","Inferior portion","Posterior portion"]},"c":[0,1,2,3],"w":"Each lead is like a picture of the heart from one direction. Leads I, aVL, V5 and V6 look at the left lateral wall; V1 and V2 look at the septum; V3 and V4 look at the anterior wall; and II, III and aVF look at the inferior wall. Knowing these views lets ST changes be matched to the region involved. (Physiology L7 slides (ECG II))","x":{"4":"None of these lead groups is described as giving a posterior view."},"m":{},"lp":false,"k":"phys-ecg-leads","src":"materials","rs":{"0":"A client's ECG shows changes in leads I, aVL, V5 and V6. Which part of the heart should the nurse recognize these leads view?","1":"A nurse notes abnormalities only in leads V1 and V2. Which part of the heart do these leads view best?","2":"A client's ECG shows changes confined to leads V3 and V4. Which part of the heart should the nurse associate with these leads?","3":"A nurse sees ECG changes in leads II, III and aVF. Which part of the heart do these leads view?"},"kind":"Apply a fact"},{"id":"q34","u":"Physiology","t":"mc","q":"A nurse notes a tall upright QRS complex in one lead of a client's ECG. What does this deflection tell the nurse about the electrical current?","o":["The current is flowing toward that lead's recording electrode.","The current is flowing away from that lead's recording electrode.","The ventricles are repolarizing.","More blood is being pumped through that part of the heart."],"c":0,"w":"A deflection's direction depends on the direction of current relative to the recording electrode. Current flowing toward the electrode gives an upward deflection and current flowing away gives a downward deflection. An upright QRS in a lead therefore means ventricular depolarization is heading toward that electrode. (Physiology L6 slides (ECG I))","x":{"1":"Current flowing away from the electrode gives a downward deflection.","2":"Ventricular repolarization is shown by the T wave, not the QRS.","3":"The ECG does not measure blood flow."},"m":{"1":"reverses the deflection rule","3":"thinks the ECG measures blood flow"},"lp":false,"k":"phys-ecg-leads","src":"materials","kind":"Apply a fact"},{"id":"q35","u":"Physiology","t":"mc","q":"While measuring a client's rhythm strip at standard paper speed, the nurse counts the width of one large box. What time does one large box represent?","o":["0.20 s","0.04 s","0.5 mV","25 mm/s"],"c":0,"w":"At the standard paper speed of 25 mm/sec, each small 1-mm box horizontally equals 0.04 s, and a large box (5 small boxes) equals 0.20 s. Vertically, one large box equals 0.5 mV. Durations are read horizontally and amplitudes vertically. (Physiology L6 slides (ECG I))","x":{"1":"0.04 s is one small (1 mm) box.","2":"0.5 mV is the VERTICAL value of one large box (voltage, not time).","3":"25 mm/s is the paper speed, not the value of a box."},"m":{"1":"confuses small and large boxes","2":"mixes up horizontal and vertical scales"},"lp":false,"k":"phys-ecg-waves","src":"materials","kind":"Apply a fact"},{"id":"q36","u":"Physiology","t":"mc","q":"A nurse measures a client's PR interval and counts 5 small boxes at standard paper speed. What is the PR interval in seconds?","o":["0.2","0.04","1","5"],"c":0,"w":"Each small box at 25 mm/sec is 0.04 s. Setup: 5 small boxes x 0.04 s per box = 0.20 s. A PR interval of 0.20 s is at the upper limit of normal (0.12-0.20 s). (Physiology L6 slides (ECG I))","x":{"1":"0.04 s is the value of a single small box; it was not multiplied by 5.","2":"1 s uses the large-box value (0.20 s) for each small box.","3":"5 is the number of boxes, not seconds."},"m":{},"lp":false,"k":"phys-ecg-waves","src":"materials","num":{"answer":0.2,"unit":"s","accept":{},"near":{"0.04":"0.04 is one small box; multiply by the 5 boxes counted.","1":"1 uses 0.20 s (a large box) for each small box.","5":"5 is the box count; multiply by 0.04 s per box.","0.5":"0.5 mV is the vertical value of a large box, not time."}},"kind":"Calculation"},{"id":"q37","u":"Physiology","t":"tf","q":"A nurse notes that the ECG paper moves at 25 mm/s, so each 1-mm small box equals 0.04 s.","o":["True","False"],"c":0,"w":"True. At 25 mm per second, 1 mm takes 1/25 s = 0.04 s; five small boxes make a large box of 0.20 s. (Physiology L6 slides (ECG I))","x":{"1":"This statement is true: 1 mm at 25 mm/s is 0.04 s."},"m":{},"lp":false,"k":"phys-ecg-waves","src":"materials","kind":"Apply a fact"},{"id":"q38","u":"Physiology","t":"cloze","q":"A nurse teaches a client what each part of the ECG tracing shows. Match each ECG component to the electrical event it represents.","o":{"rows":["P wave","QRS complex","T wave","PR interval"],"choices":["Atrial depolarization","Ventricular depolarization","Ventricular repolarization","Atrial depolarization plus the delay in the AV junction","Blood flow through the heart valves"]},"c":[0,1,2,3],"w":"Each ECG component maps to an electrical event in the conduction sequence SA node, AV node, bundle of His, bundle branches and Purkinje fibers. The P wave is atrial depolarization, the QRS is ventricular depolarization and the T wave is ventricular repolarization. The PR interval covers atrial depolarization plus the delay in the AV junction (AV node and bundle of His). (Physiology L6 slides (ECG I))","x":{"4":"The ECG does not measure blood flow through the heart."},"m":{"4":"thinks the ECG measures blood flow"},"lp":false,"k":"phys-ecg-waves","src":"materials","rs":{"0":"A nurse points to the P wave on a client's ECG. Which electrical event does it represent?","1":"A client asks what the tall spike on the ECG means. Which event does the QRS complex represent?","2":"A nurse explains the T wave on a client's tracing. Which electrical event does it represent?","3":"A nurse measures a client's PR interval. Which events does this interval include?"},"kind":"Teaching and statements"},{"id":"q39","u":"Physiology","t":"mc","q":"A nursing student asks why there is a pause between the P wave and the QRS complex on a client's ECG. Which explanation by the nurse is best?","o":["The delay in the AV junction gives the atria time to contract before the ventricles contract.","The pause lets the ventricles repolarize before the next beat.","The pause is the time the coronary arteries need to fill.","The pause occurs because the SA node fires twice per beat."],"c":0,"w":"The PR interval includes atrial depolarization plus a deliberate delay in the AV junction (AV node and bundle of His). The delay allows time for the atria to contract and finish filling the ventricles before ventricular depolarization starts. That is why the normal PR interval is 0.12-0.20 s rather than almost zero. (Physiology L6 slides (ECG I))","x":{"1":"Ventricular repolarization is the T wave, after the QRS.","2":"Coronary filling is linked to diastole, not to the PR interval.","3":"The SA node fires once per beat; the pause is conduction delay in the AV node and bundle of His."},"m":{"1":"places repolarization in the PR interval"},"lp":false,"k":"phys-ecg-waves","src":"materials","kind":"Teaching and statements"},{"id":"q40","u":"Physiology","t":"sata","q":"A nurse reviews measurements from several clients' ECGs. Which values are within normal limits? Select all that apply.","o":["PR interval 0.16 s","QRS duration 0.08 s","QT interval 0.42 s","PR interval 0.36 s","QRS duration 0.14 s","PR interval 0.08 s"],"c":[0,1,2],"w":"Normal intervals: PR 0.12-0.20 s, QRS 0.08-0.10 s and QT 0.40-0.43 s. Note: the rhythm-analysis slide gives a wider normal QRS range of 0.04-0.12 s (1-3 boxes), while the intervals slide says 0.08-0.10 s; 0.08 s is normal by both. (Physiology L6 slides (ECG I))","x":{"3":"A PR above 0.20 s is prolonged, as in first-degree AV block.","4":"A QRS wider than 0.12 s is wide, as when the impulse starts in a ventricle.","5":"0.08 s is below the 0.12 s lower limit of a normal PR interval."},"m":{"3":"accepts a prolonged PR as normal","4":"accepts a wide QRS as normal"},"lp":false,"k":"phys-ecg-waves","src":"materials","kind":"Apply a fact"},{"id":"q41","u":"Physiology","t":"order","q":"A nurse analyzes a client's rhythm strip. Arrange the steps of rhythm analysis in the correct order.","o":["Determine regularity","Calculate the rate","Assess the P waves","Determine the PR interval","Determine the QRS duration"],"c":[0,1,2,3,4],"w":"Rhythm analysis follows five steps: determine regularity from the R-R distances, calculate the rate, assess the P waves (present, alike, regular, one before each QRS), determine the PR interval and determine the QRS duration. Working in the same order every time keeps any abnormality from being missed. (Physiology L7 slides (ECG II))","x":{},"m":{},"lp":false,"k":"phys-ecg-rate","src":"materials","kind":"Apply a fact"},{"id":"q42","u":"Physiology","t":"mc","q":"A nurse counts 20 small squares between two consecutive R waves on a client's regular rhythm strip. What is the client's heart rate in beats/min?","o":["75","15","100","150"],"c":0,"w":"Setup: HR = 1500 / number of small squares between R-R = 1500 / 20 = 75 beats/min. The constant 1500 is the number of small squares per minute at 25 mm/s; 300 is the number of large squares per minute and goes with large-square counts. (Physiology L7 slides (ECG II), slide exercise)","x":{"1":"15 divides 300 (the large-square constant) by small squares.","2":"100 would need 15 small (3 large) squares between R waves.","3":"150 would need 10 small (2 large) squares."},"m":{"1":"uses the wrong constant"},"lp":true,"k":"phys-ecg-rate","src":"materials","num":{"answer":75,"unit":"beats/min","accept":{},"near":{"15":"15 used 300 / 20; 300 goes with LARGE squares. Use 1500 / 20.","30000":"30000 multiplied 1500 x 20 instead of dividing.","300":"300 is the rate for only 1 large square between R waves."}},"kind":"Calculation"},{"id":"q43","u":"Physiology","t":"mc","q":"A nurse counts 3 large squares between consecutive R waves on a client's regular rhythm strip. What is the heart rate in beats/min?","o":["100","500","75","150"],"c":0,"w":"Setup: HR = 300 / number of large squares between R-R = 300 / 3 = 100 beats/min. The quick sequence for large boxes is 300, 150, 100, 75 for 1, 2, 3 and 4 boxes. (Physiology L7 slides (ECG II))","x":{"1":"500 divides 1500 (the small-square constant) by large squares.","2":"75 is the rate for 4 large squares.","3":"150 is the rate for 2 large squares."},"m":{"1":"uses the wrong constant"},"lp":false,"k":"phys-ecg-rate","src":"materials","num":{"answer":100,"unit":"beats/min","accept":{},"near":{"500":"500 used 1500 / 3; 1500 goes with SMALL squares. Use 300 / 3.","900":"900 multiplied 300 x 3 instead of dividing.","75":"75 is the rate for 4 large squares, not 3."}},"kind":"Calculation"},{"id":"q44","u":"Physiology","t":"fill","q":"A nurse uses the quick count on a client's rhythm strip: the R wave lands on a heavy line and the next R wave is 2 large boxes away. The heart rate is about ____ beats/min.","o":["150","300","100","75"],"c":0,"w":"Find an R wave on a heavy line and count large boxes to the next R wave: 1 box = 300, 2 boxes = 150, 3 boxes = 100, 4 boxes = 75. This is the same as 300 divided by the number of large boxes. (Physiology L7 slides (ECG II))","x":{"1":"300 is the rate when the next R wave is only 1 large box away.","2":"100 is the rate for 3 large boxes.","3":"75 is the rate for 4 large boxes."},"m":{"1":"counts one box too few"},"lp":false,"k":"phys-ecg-rate","src":"materials","kind":"Apply a fact"},{"id":"q45","u":"Physiology","t":"mc","q":"A client's rhythm strip shows: rate 35 bpm, regular, normal P waves, PR 0.12 s, QRS 0.10 s. Which interpretation should the nurse document?","o":["Sinus bradycardia","Normal sinus rhythm","Sinus tachycardia","Third-degree AV block","Second-degree AV block, Mobitz type II"],"c":0,"w":"When every P wave is normal, each is followed by a QRS, and the PR and QRS durations are normal, the impulse is starting in the SA node and conducting normally. If such a sinus rhythm is slow (35 bpm here), it is sinus bradycardia; if fast (130 bpm in the example), sinus tachycardia. (Physiology L7 slides (ECG II), slide exercise)","x":{"1":"Normal sinus rhythm has these features at a normal rate (90-95 bpm in the slide example), not 35 bpm.","2":"Sinus tachycardia is a fast sinus rhythm (130 bpm in the slide example).","3":"Third-degree block has P waves with no relation to the QRS and a wide QRS.","4":"Mobitz II has some P waves not followed by a QRS."},"m":{"2":"reverses brady and tachy","3":"calls any slow rate complete block"},"lp":true,"k":"phys-sinus","src":"materials","kind":"Recognize and interpret"},{"id":"q46","u":"Physiology","t":"mc","q":"A nurse notices that a healthy young client's heart rate speeds up with each inspiration and slows with expiration; P waves, PR and QRS are normal. How should the nurse interpret this rhythm?","o":["Sinus arrhythmia","Atrial fibrillation","Second-degree AV block, Mobitz type I","Sinus tachycardia","Atrial flutter"],"c":0,"w":"In sinus arrhythmia every beat is still a normal sinus beat, but the rate varies with breathing: it increases during inspiration and decreases during expiration. The P waves, PR interval and QRS stay normal, which separates it from atrial fibrillation and the AV blocks. (Physiology L7 slides (ECG II), slide exercise)","x":{"1":"Atrial fibrillation has no normal P waves and an irregularly irregular rate.","2":"Mobitz I has a PR that lengthens until a QRS is dropped.","3":"Sinus tachycardia is a steadily fast sinus rhythm, not one that varies with breathing.","4":"Atrial flutter shows flutter waves instead of P waves."},"m":{"1":"calls any irregular rhythm AF"},"lp":true,"k":"phys-sinus","src":"materials","kind":"Recognize and interpret"},{"id":"q47","u":"Physiology","t":"sata","q":"A nurse reviews the rhythm strip of an 84-year-old client with atrial fibrillation. Which findings should the nurse expect? Select all that apply.","o":["No normal P waves","An irregularly irregular rate","Atrial activity above 350 per minute","Chaotic atrial activity not originating from the sinus node","A PR interval that lengthens until a beat is dropped","Regular saw-tooth flutter waves","P waves with no relation to the QRS complexes"],"c":[0,1,2,3],"w":"In atrial fibrillation the atria have no organized depolarization because impulses are not originating from the sinus node. There are therefore no normal P waves, the atrial rate is usually above 350 per minute, and the chaotic activity produces an irregularly irregular ventricular rate. It is common, affecting 2-4% of people and up to 5-10% of those over 80. (Physiology L7 slides (ECG II))","x":{"4":"This is second-degree AV block, Mobitz type I.","5":"Flutter waves belong to atrial flutter.","6":"This is third-degree AV block."},"m":{"4":"mixes up AF and Mobitz I","5":"mixes up atrial fibrillation and flutter"},"lp":false,"k":"phys-arrhythmia","src":"materials","kind":"Recognize and interpret"},{"id":"q48","u":"Physiology","t":"mc","q":"A client's rhythm strip shows: rate 60 bpm, regular, normal P waves each followed by a QRS, PR interval 0.36 s, QRS 0.08 s. Which interpretation should the nurse document?","o":["First-degree AV block","Second-degree AV block, Mobitz type I","Second-degree AV block, Mobitz type II","Third-degree AV block","Normal sinus rhythm"],"c":0,"w":"In first-degree AV block every impulse still reaches the ventricles, but it is held up too long in the AV node or bundle of His, so the PR interval exceeds 0.20 s. Every P wave is followed by a QRS and the rhythm is regular. Dropped beats would point to second-degree block instead. (Physiology L7 slides (ECG II), slide exercise)","x":{"1":"Mobitz I has a PR that keeps lengthening until a QRS is dropped; here every P conducts.","2":"Mobitz II drops beats with a constant PR.","3":"Third-degree block has P waves unrelated to the QRS.","4":"A PR of 0.36 s is above the normal 0.12-0.20 s."},"m":{"1":"calls any long PR Mobitz I","4":"accepts a prolonged PR as normal"},"lp":true,"k":"phys-av-block","src":"materials","kind":"Recognize and interpret"},{"id":"q49","u":"Physiology","t":"mc","q":"A client's rhythm strip shows the PR interval getting longer with each beat until a P wave is not followed by a QRS, and then the cycle repeats. Which rhythm should the nurse identify?","o":["Second-degree AV block, Mobitz type I","Second-degree AV block, Mobitz type II","First-degree AV block","Third-degree AV block","Atrial fibrillation"],"c":0,"w":"In Mobitz type I each successive atrial impulse meets a longer and longer delay in the AV node until one impulse, usually the 3rd or 4th, fails to get through. The strip shows a progressively lengthening PR and then a P wave without a QRS, giving a regularly irregular rhythm. (Physiology L7 slides (ECG II), slide exercise)","x":{"1":"Mobitz II drops beats suddenly with no PR prolongation.","2":"First-degree block has a long but constant PR and no dropped beats.","3":"Third-degree block has no relation at all between P waves and QRS complexes.","4":"Atrial fibrillation has no normal P waves."},"m":{"1":"mixes up Mobitz I and II"},"lp":true,"k":"phys-av-block","src":"materials","kind":"Recognize and interpret"},{"id":"q50","u":"Physiology","t":"mc","q":"A client's rhythm strip shows a constant PR interval of 0.14 s, but occasionally a P wave is not followed by a QRS. The nurse recognizes the block is typically located where?","o":["In the bundle of His","In the SA node","In the Purkinje fibers","In the AV node, with progressive delay"],"c":0,"w":"This is second-degree AV block, Mobitz type II: conduction is all or nothing, so there is no PR prolongation, but some P waves are completely blocked. The block typically lies in the bundle of His, below the AV node, unlike Mobitz I where the delay builds up in the AV node itself. (Physiology L7 slides (ECG II), slide exercise)","x":{"1":"The SA node generates the P waves, which are present and normal here.","2":"Purkinje fibers are not given as the usual site of Mobitz II block.","3":"Progressive AV-nodal delay describes Mobitz type I."},"m":{"3":"mixes up Mobitz I and II"},"lp":true,"k":"phys-av-block","src":"materials","kind":"Recognize and interpret"},{"id":"q51","u":"Physiology","t":"mc","q":"A client in third-degree AV block has a ventricular rate of 40 bpm and a QRS wider than 0.12 s. Which explanation of the wide QRS is accurate?","o":["The impulse originates in a ventricle, so conduction through the ventricles is inefficient.","The AV node is conducting slowly, which lengthens the QRS.","Flutter waves are merging with the QRS.","Sympathetic stimulation is speeding conduction through the bundle of His."],"c":0,"w":"In third-degree block nothing passes through the AV junction, so the atria and ventricles form impulses independently. Without atrial impulses the ventricles' own pacemaker takes over at about 30-45 beats/minute. Because that impulse starts in a ventricle instead of travelling down the normal conduction system, ventricular conduction is inefficient and the QRS is wide and bizarre. (Physiology L7 slides (ECG II), slide note (REMEMBER))","x":{"1":"Slow AV-nodal conduction lengthens the PR interval, not the QRS.","2":"Flutter waves belong to atrial flutter, not complete block.","3":"Sympathetic stimulation hastens conduction; it would not widen the QRS."},"m":{"1":"confuses PR and QRS prolongation"},"lp":true,"k":"phys-av-block","src":"materials","kind":"Apply a fact"},{"id":"q52","u":"Physiology","t":"cloze","q":"A nurse reviews the AV blocks before a cardiology rotation. Match each block to its defining feature.","o":{"rows":["First-degree AV block","Second-degree Mobitz type I","Second-degree Mobitz type II","Third-degree AV block"],"choices":["PR interval longer than 0.20 s with every P conducted","PR lengthens progressively until a P wave is not conducted","Constant PR with occasional P waves completely blocked","Atria and ventricles beat independently of each other","No P waves and an irregularly irregular rate"]},"c":[0,1,2,3],"w":"The AV blocks are graded by how many impulses get through. First degree: all get through but slowly (PR > 0.20 s). Mobitz I: delay builds until one fails. Mobitz II: all-or-nothing conduction, usually in the bundle of His. Third degree: complete block, so atria and ventricles are independent and a ventricular pacemaker drives the ventricles at 30-45 beats/minute. (Physiology L7 slides (ECG II))","x":{"4":"This describes atrial fibrillation, not an AV block."},"m":{"4":"mixes up AF and AV block"},"lp":false,"k":"phys-av-block","src":"materials","rs":{"0":"A client is diagnosed with first-degree AV block. Which ECG feature should the nurse expect?","1":"A client has second-degree AV block, Mobitz type I. Which ECG feature defines it?","2":"A client has second-degree AV block, Mobitz type II. Which ECG feature defines it?","3":"A client is in third-degree AV block. Which statement describes the relationship between the atria and ventricles?"},"kind":"Apply a fact"},{"id":"q53","u":"Physiology","t":"tf","q":"A nurse states that in second-degree AV block Mobitz type II, the PR interval lengthens progressively before a beat is dropped.","o":["True","False"],"c":1,"w":"False. In Mobitz type II conduction is all or nothing: the PR interval stays constant (0.14 s in the slide example) and occasional P waves are suddenly blocked. Progressive PR lengthening is Mobitz type I. (Physiology L7 slides (ECG II))","x":{"0":"Progressive PR lengthening is Mobitz type I; Mobitz II has a constant PR."},"m":{"0":"mixes up Mobitz I and II"},"lp":false,"k":"phys-av-block","src":"materials","kind":"Apply a fact"},{"id":"q54","u":"Physiology","t":"mc","q":"A client's ECG shows a positive QRS in lead I and a negative QRS in aVF. How should the nurse interpret the QRS axis?","o":["Left axis deviation","Normal axis","Right axis deviation","Right superior axis deviation (indeterminate)"],"c":0,"w":"The quadrant method uses lead I and aVF. Positive in both means a normal axis; positive in I but negative in aVF means the vector points up and to the left, left axis deviation; negative in I but positive in aVF is right axis deviation; negative in both is right superior (indeterminate) deviation. (Physiology L7 slides (ECG II), slide exercise)","x":{"1":"A normal axis has a positive QRS in both lead I and aVF.","2":"Right axis deviation is negative in lead I and positive in aVF.","3":"This is negative in both lead I and aVF."},"m":{"1":"ignores the negative aVF","2":"reverses left and right axis rules"},"lp":true,"k":"phys-axis","src":"materials","kind":"Recognize and interpret"},{"id":"q55","u":"Physiology","t":"mc","q":"A nurse examines a client's 12-lead ECG and finds the QRS negative in lead I and negative in lead II. Which axis should the nurse report?","o":["Right superior axis deviation (indeterminate)","Normal axis","Left axis deviation","Right axis deviation"],"c":0,"w":"When the QRS is negative in lead I the vector points to the right, and when it is also negative in the inferior leads the vector points upward. Up and to the right is the region between +180 and -90 degrees, called right superior axis deviation or indeterminate (extended right) axis. Note: the slide asks this with lead II; its quick table uses lead I and aVF, where negative-negative gives the same answer. (Physiology L7 slides (ECG II), in-class question)","x":{"1":"A normal axis is positive in lead I.","2":"Left axis deviation keeps lead I positive.","3":"Plain right axis deviation still has a positive aVF/inferior lead."},"m":{"1":"ignores negative lead I","3":"misses the superior component"},"lp":true,"k":"phys-axis","src":"materials","kind":"Apply a fact"},{"id":"q56","u":"Physiology","t":"blanks","q":"A nurse calculates a client's mean QRS axis. A normal axis lies between {1} and {2}; an axis between +110 and +180 degrees is called {3}.","o":[["-30 degrees","-90 degrees","0 degrees"],["+110 degrees","+180 degrees","+90 degrees"],["right axis deviation","left axis deviation","indeterminate axis"]],"c":[0,0,0],"w":"The QRS axis is read on a circle in the frontal plane where 0 degrees points to the client's left and the scale rotates clockwise, so +90 points down. The normal axis lies between -30 and +110 degrees; -30 to -90 is left axis deviation; +110 to +180 is right axis deviation; +180 to -90 is indeterminate (extended right). (Physiology L6 slides (ECG I))","x":{"0:1":"-90 degrees is the far end of left axis deviation.","0:2":"0 degrees is lead I's direction, inside the normal range, not its limit.","1:1":"+180 degrees is the far end of right axis deviation.","1:2":"+90 degrees (aVF) is inside the normal range, not its limit.","2:1":"Left axis deviation is -30 to -90 degrees.","2:2":"Indeterminate axis is +180 to -90 degrees."},"m":{"0:1":"places the normal limit too far left","1:1":"places the normal limit too far right","2:1":"reverses left and right axis rules"},"lp":false,"k":"phys-axis","src":"materials","kind":"Apply a fact"},{"id":"q57","u":"Physiology","t":"tf","q":"A nurse explains that the normal QRS axis points leftward and downward because most of the ventricular mass is in the left ventricle.","o":["True","False"],"c":0,"w":"True. When the ventricles depolarize in a normal heart, the current flows leftward and downward because most of the ventricular mass is in the left ventricle. (Physiology L7 slides (ECG II))","x":{"1":"This statement is true: the left ventricle's mass pulls the axis leftward and down."},"m":{},"lp":false,"k":"phys-axis","src":"materials","kind":"Teaching and statements"},{"id":"q58","u":"Physiology","t":"tf","q":"A nurse reads a client's QRS axis as +150 degrees and documents it as a normal axis.","o":["True","False"],"c":1,"w":"False. The normal axis is -30 to +110 degrees. +150 degrees falls between +110 and +180, which is right axis deviation. (Physiology L6 slides (ECG I))","x":{"0":"+150 degrees is right axis deviation, not normal."},"m":{"0":"accepts right axis deviation as normal"},"lp":false,"k":"phys-axis","src":"materials","kind":"Apply a fact"},{"id":"q59","u":"Physiology","t":"mc","q":"A client's heart rate is 80 beats/min and stroke volume is 75 mL. What is the client's cardiac output in L/min?","o":["6","155","6000","1.07"],"c":0,"w":"Setup: cardiac output = heart rate x stroke volume = 80 beats/min x 75 mL/beat = 6000 mL/min = 6 L/min. The slide's resting example is 70 x 70 = 4900 mL/min, about 5 L/min. (Physiology L8 slides (cardiac output))","x":{"1":"155 added heart rate and stroke volume instead of multiplying them.","2":"6000 is the answer in mL/min; it was not converted to L/min.","3":"1.07 divided stroke volume by heart rate."},"m":{},"lp":false,"k":"phys-co","src":"materials","num":{"answer":6,"unit":"L/min","accept":{},"near":{"155":"155 added HR and SV; cardiac output is HR x SV.","6000":"6000 is mL/min; divide by 1000 for L/min.","1.07":"1.07 divided SV by HR; multiply them instead."}},"kind":"Calculation"},{"id":"q60","u":"Physiology","t":"mc","q":"A client's echocardiogram shows an end-diastolic volume of 125 mL and an end-systolic volume of 50 mL. What is the ejection fraction in percent?","o":["60","40","75","0.6"],"c":0,"w":"Setup: SV = EDV - ESV = 125 - 50 = 75 mL. EF = SV / EDV x 100 = 75 / 125 x 100 = 60%. The slide's example is 75/120 x 100 = 62.5%, and the normal range is 50-75%. (Physiology L8 slides (cardiac output))","x":{"1":"40 divided ESV by EDV (50/125) instead of SV by EDV.","2":"75 is the stroke volume in mL, not the ejection fraction.","3":"0.6 forgot to multiply by 100."},"m":{"1":"uses ESV instead of SV"},"lp":false,"k":"phys-co","src":"materials","num":{"answer":60,"unit":"%","accept":{},"near":{"40":"40 is ESV/EDV x 100; use SV (EDV - ESV) on top.","75":"75 is the stroke volume in mL; divide it by EDV.","0.6":"0.6 forgot to multiply by 100.","150":"150 is EDV/SV x 100; the fraction is upside down."}},"kind":"Calculation"},{"id":"q61","u":"Physiology","t":"mc","q":"A client recovering from a myocardial infarction has an ejection fraction of 30%. How should the nurse interpret this value?","o":["It is consistent with a failing heart.","It is within the normal resting range.","It is the expected value during strenuous exercise.","It means the client's preload is increased."],"c":0,"w":"Ejection fraction is the percentage of the end-diastolic volume ejected with each stroke and is a good index of ventricular function. A healthy heart ejects 50-75% at rest and up to 90% in strenuous exercise; a failing heart may eject 30% or less. (Physiology L8 slides (cardiac output))","x":{"1":"The normal resting ejection fraction is 50-75%.","2":"During strenuous exercise EF can rise to as much as 90%, not fall to 30%.","3":"EF is the fraction of EDV ejected; a low EF reflects poor ventricular function, not raised preload."},"m":{"1":"thinks 30% EF is normal"},"lp":false,"k":"phys-co","src":"materials","kind":"Recognize and interpret"},{"id":"q62","u":"Physiology","t":"mc","q":"A nurse explains why a large client's cardiac output is reported as cardiac index. Which definition should the nurse give?","o":["Cardiac output per minute per square meter of body surface area","The difference between resting cardiac output and the maximum output","The volume pumped by each ventricle per beat","The percentage of end-diastolic volume ejected with each beat"],"c":0,"w":"Cardiac output depends on body size, so it is normalized as the cardiac index: cardiac output per minute per square meter of body surface area, normally 3.2 L/min/m2. Cardiac reserve is a different idea: how much output can rise from rest to maximum. (Physiology L8 slides (cardiac output))","x":{"1":"That is cardiac reserve.","2":"That is stroke volume.","3":"That is ejection fraction."},"m":{"1":"confuses cardiac index and cardiac reserve"},"lp":false,"k":"phys-co","src":"materials","kind":"Teaching and statements"},{"id":"q63","u":"Physiology","t":"cloze","q":"A client receives a drug that stimulates the vagus nerve. Match each part of the heart to the parasympathetic effect the nurse should expect.","o":{"rows":["SA node","AV node","Atrial muscle","Ventricular muscle"],"choices":["Decreases heart rate","Increases AV nodal delay","Decreases contractility","No effect","Increases contractility"]},"c":[0,1,2,3],"w":"The vagus nerve supplies mainly the atria, including the SA and AV nodes, and its supply to the ventricles is sparse. It therefore slows the SA node's rate of depolarization (lower heart rate), increases AV nodal delay and reduces atrial contractility, but has no effect on ventricular muscle. (Physiology L8 slides (cardiac output))","x":{"4":"Increased contractility is a sympathetic effect."},"m":{"4":"gives parasympathetic a sympathetic effect"},"lp":false,"k":"phys-autonomic","src":"materials","rs":{"0":"A client receives a vagal stimulant. What effect should the nurse expect at the SA node?","1":"A client has strong vagal stimulation. What effect should the nurse expect at the AV node?","2":"A nurse anticipates the effect of parasympathetic stimulation on atrial muscle. What is it?","3":"A client has increased parasympathetic activity. What effect should the nurse expect on ventricular muscle?"},"kind":"Recognize and interpret"},{"id":"q64","u":"Physiology","t":"sata","q":"A client is frightened and has a surge of sympathetic activity. Which cardiac effects should the nurse expect? Select all that apply.","o":["Increased heart rate","Decreased AV nodal delay","Increased ventricular contractility","Epinephrine secretion from the adrenal medulla","Increased AV nodal delay","Decreased atrial contractility","No change in ventricular muscle"],"c":[0,1,2,3],"w":"Sympathetic nerves supply the SA node, AV node and ventricles. They speed depolarization to threshold (higher heart rate), increase AV excitability and decrease AV delay, hasten conduction through the bundle of His and Purkinje fibers, increase atrial and ventricular contractility, and stimulate the adrenal medulla to release epinephrine, which adds to these effects. (Physiology L8 slides (cardiac output))","x":{"4":"Increased AV nodal delay is a parasympathetic effect.","5":"Decreased atrial contractility is a parasympathetic effect.","6":"No effect on ventricular muscle is the parasympathetic pattern; sympathetic stimulation increases it."},"m":{"4":"mixes up sympathetic and parasympathetic AV effects"},"lp":false,"k":"phys-autonomic","src":"materials","kind":"Recognize and interpret"},{"id":"q65","u":"Physiology","t":"tf","q":"A nurse explains that under resting conditions parasympathetic discharge dominates control of heart rate.","o":["True","False"],"c":0,"w":"True. Heart rate is set by the balance between vagal inhibition of the SA node and sympathetic stimulation, and at rest parasympathetic discharge dominates. (Physiology L8 slides (cardiac output))","x":{"1":"This statement is true: at rest the vagus dominates."},"m":{},"lp":false,"k":"phys-autonomic","src":"materials","kind":"Teaching and statements"},{"id":"q66","u":"Physiology","t":"mc","q":"A client receives a fluid bolus that increases end-diastolic volume, and the stroke volume rises. Which mechanism explains the stronger contraction?","o":["Greater stretch brings cardiac fibers closer to their optimum length, so contraction force increases.","Sympathetic stimulation shifts the Frank-Starling curve to the left.","Afterload increases, forcing the ventricle to contract harder.","Parasympathetic stimulation increases ventricular contractility."],"c":0,"w":"This is the Frank-Starling law, the intrinsic control of stroke volume. Resting cardiac fiber length is shorter than the optimum length for maximum tension. Extra filling raises EDV, stretches the fibers closer to optimum and so increases the force of the next contraction, raising stroke volume. The extent of filling is the preload. (Physiology L8 slides (cardiac output))","x":{"1":"That is extrinsic control, which raises contractility at any EDV; the bolus works through intrinsic control.","2":"Afterload is arterial pressure; a fluid bolus acts on preload (EDV).","3":"Parasympathetic stimulation has no effect on ventricular muscle."},"m":{"1":"confuses intrinsic and extrinsic control","2":"mixes up preload and afterload"},"lp":false,"k":"phys-starling","src":"materials","kind":"Teaching and statements"},{"id":"q67","u":"Physiology","t":"tf","q":"A nurse defines afterload as the end-diastolic volume that stretches the ventricle before it contracts.","o":["True","False"],"c":1,"w":"False. That definition is preload (the load before contraction, the end-diastolic volume). Afterload is the load against which the ventricle pumps, i.e. the pressure in the artery (arterial blood pressure). (Physiology L8 slides (cardiac output))","x":{"0":"End-diastolic volume is preload; afterload is arterial pressure."},"m":{"0":"mixes up preload and afterload"},"lp":false,"k":"phys-starling","src":"materials","kind":"Apply a fact"},{"id":"q68","u":"Physiology","t":"sata","q":"A nurse encourages a client on bed rest to do leg exercises and deep breathing. Which factors increase venous return to the heart? Select all that apply.","o":["Skeletal muscle contraction compressing the veins","The fall in intrathoracic pressure during inspiration","Sympathetic vasoconstriction of the veins","One-way valves in the large veins","Veins storing a larger share of the blood volume","Parasympathetic stimulation of the veins"],"c":[0,1,2,3],"w":"Venous return rises when less blood sits in the capacitance veins. The skeletal muscle pump squeezes veins, the respiratory pump lowers intrathoracic pressure to about -5 mmHg in inspiration, sympathetic vasoconstriction raises venous pressure, the cardiac suction effect pulls the AV valves down during ventricular contraction, and venous valves every 2-4 cm stop backflow on standing. (Physiology L8 slides (cardiac output))","x":{"4":"When veins store MORE blood, less returns to the heart.","5":"Parasympathetic stimulation has no effect on veins."},"m":{"4":"reverses the capacitance effect"},"lp":false,"k":"phys-venous-return","src":"materials","kind":"Apply a fact"},{"id":"q69","u":"Physiology","t":"mc","q":"A client's oxygen uptake is 250 mL/min, arterial O2 content is 200 mL/L and pulmonary artery (mixed venous) O2 content is 150 mL/L. Using the Fick principle, what is the cardiac output in L/min?","o":["5","1.25","0.2","12500"],"c":0,"w":"Setup: cardiac output = O2 uptake / (arterial O2 - venous O2) = 250 mL/min / (200 - 150) mL/L = 250 / 50 = 5 L/min. Venous blood is sampled from the pulmonary artery. The slide example is 200 / (200 - 160) = 5 L/min. (Physiology L8 slides (cardiac output))","x":{"1":"1.25 divided O2 uptake by the ARTERIAL content (250/200) instead of the A-V difference.","2":"0.2 divided the A-V difference by O2 uptake; the fraction is upside down.","3":"12500 multiplied O2 uptake by the A-V difference."},"m":{"1":"divides by arterial instead of A-V difference"},"lp":false,"k":"phys-co-measure","src":"materials","num":{"answer":5,"unit":"L/min","accept":{},"near":{"1.25":"1.25 divided by arterial O2; divide by the A-V difference (200 - 150).","1.67":"1.67 divided by venous O2 (250/150); use the A-V difference.","0.2":"0.2 is upside down; O2 uptake goes on top.","12500":"12500 multiplied; divide O2 uptake by the A-V difference."}},"kind":"Calculation"},{"id":"q70","u":"Physiology","t":"sata","q":"A nurse reviews several clients' conditions. Which conditions increase cardiac output? Select all that apply.","o":["Hyperthyroidism","Anemia","Fever","Hypothyroidism","Hemorrhage","Valvular heart disease"],"c":[0,1,2],"w":"Among pathological states, hyperthyroidism, anemia and fever increase cardiac output. Hypothyroidism, myocardial damage and failure, valvular heart disease, arrhythmias, and hemorrhage and shock decrease it. Exercise, emotion, posture and pregnancy alter it physiologically. (Physiology L8 slides (cardiac output))","x":{"3":"Hypothyroidism decreases cardiac output.","4":"Hemorrhage and shock decrease cardiac output.","5":"Valvular heart disease decreases cardiac output."},"m":{"3":"reverses thyroid effects"},"lp":false,"k":"phys-co-measure","src":"materials","kind":"Apply a fact"},{"id":"q71","u":"Physiology","t":"mc","q":"A nurse is teaching a community group about heart failure. Which cause should the nu
