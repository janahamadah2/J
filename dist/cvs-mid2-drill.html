d":"Apply a fact"},{"id":"q414","u":"Embryology","t":"mc","q":"Patient came with difficulty in swallowing (dysphagia) and breathing (dyspnea); an X-ray shows that the right dorsal aorta is not degenerated. What is the anomaly?","o":["Double aortic arch","Patent ductus arteriosus","Coarctation of the aorta","Persistent truncus arteriosus"],"c":0,"w":"Persistence of the distal part of the right dorsal aorta gives a second arch, a double aortic arch. The two arches form a vascular ring around the trachea (dyspnea) and esophagus (dysphagia). (Shams Practices QB, 2024 Nov Q36; Embryology L3 slides)","x":{"1":"PDA is a duct left open between the left pulmonary artery and the aortic arch.","2":"Coarctation is a constriction of the aorta distal to the left subclavian.","3":"Persistent truncus arteriosus is not among the arch anomalies on your slides; it is a failure of the outflow tract to divide."},"m":{},"lp":true,"k":"emb-anomalies","src":"Shams Practices QB, 2024 Nov Q36; Embryology L3 slides","kind":"Apply a fact"},{"id":"q415","u":"Embryology","t":"mc","q":"Case: constriction of the aorta distal to the ductus arteriosus in a fetus. What is it?","o":["Postductal coarctation","Preductal coarctation","Double aortic arch","Persistent truncus arteriosus"],"c":0,"w":"A constriction distal to the ductus arteriosus is postductal coarctation; on your slide it is labelled \"fetal\", with the ductus usually closed. Note: many references call the postductal type the adult type; the bank and your slide both use \"fetal\". (Shams Practices QB, 2024 May Q73; Embryology L3 slides)","x":{"1":"Preductal coarctation lies proximal to the entrance of the ductus, which stays open.","2":"A double arch is a vascular ring, not a constriction.","3":"Persistent truncus arteriosus is a failure of the outflow tract to divide, not a constriction."},"m":{"1":"mixes up preductal and postductal"},"lp":true,"k":"emb-anomalies","src":"Shams Practices QB, 2024 May Q73; Embryology L3 slides","kind":"Apply a fact"},{"id":"q416","u":"Embryology","t":"mc","q":"Which embryonic vessels give rise to the medial umbilical ligaments after birth?","o":["Umbilical arteries","Umbilical veins","Vitelline arteries","Cardinal veins"],"c":0,"w":"After birth the umbilical arteries are obliterated and become the medial umbilical ligaments. Your slides cover only the veins: the left umbilical vein becomes the ligamentum teres and the ductus venosus the ligamentum venosum. The artery fact is from the bank's key. (Shams Practices QB, 2025 Q12; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The left umbilical vein becomes the ligamentum teres.","2":"Vitelline arteries supply the yolk sac and form gut arteries, not the umbilical ligaments.","3":"Cardinal veins form the systemic veins, such as the SVC and IVC."},"m":{"1":"mixes up umbilical arteries and veins"},"lp":true,"k":"emb-past","src":"materials","kind":"Apply a fact"},{"id":"q417","u":"Embryology","t":"mc","q":"Which structure normally forms by fusion of the endocardial cushions to divide the common atrioventricular canal into right and left channels?","o":["Septum intermedium","Septum secundum","Truncus arteriosus","Sinus venosus"],"c":0,"w":"The endocardial cushions fuse to form the septum intermedium, which divides the common atrioventricular canal into right and left channels. This heart-septation topic is not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2025 Q13; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The septum secundum is part of the interatrial septum, beside the foramen ovale.","2":"The truncus arteriosus is the outflow tract that divides into the aorta and pulmonary trunk.","3":"The sinus venosus receives the umbilical, vitelline and common cardinal veins."},"m":{},"lp":true,"k":"emb-past","src":"materials","kind":"Apply a fact"}],"concepts":{"anat-coronary":{"title":"Coronary arteries: origin, course and territories","unit":"Anatomy","points":["Right coronary artery: from the right (anterior) aortic sinus; left coronary artery: from the left (anterior) aortic sinus.","LAD runs in the anterior interventricular groove and supplies the sternocostal surface of both ventricles, the anterior 2/3 of the interventricular septum and the A-V bundle.","The posterior interventricular artery (PDA) runs in the posterior interventricular groove and supplies the diaphragmatic surface of both ventricles and the posterior 1/3 of the septum.","Circumflex (LCx): branches to the left atrium and to the left ventricle, including the left (obtuse) marginal artery.","Artery to the SA node: RCA 65%, circumflex 35%. Artery to the AV node: RCA 80%, circumflex 20%."],"source":"Anatomy L4 slides","items":["q0","q1","q2","q3","q4","q5","q6","q241","q243","q245"],"sec":[{"id":"anat-coronary","title":"Coronary arteries: origin, course and territories","key":["Right coronary artery: from the right (anterior) aortic sinus; left coronary artery: from the left (anterior) aortic sinus.","LAD runs in the anterior interventricular groove and supplies the sternocostal surface of both ventricles, the anterior 2/3 of the interventricular septum and the A-V bundle.","The posterior interventricular artery (PDA) runs in the posterior interventricular groove and supplies the diaphragmatic surface of both ventricles and the posterior 1/3 of the septum.","Circumflex (LCx): branches to the left atrium and to the left ventricle, including the left (obtuse) marginal artery.","Artery to the SA node: RCA 65%, circumflex 35%. Artery to the AV node: RCA 80%, circumflex 20%."]}]},"anat-dominance":{"title":"Coronary dominance","unit":"Anatomy","points":["Co-dominance (balanced) 70%: the right coronary has the posterior interventricular branch and the circumflex has a branch to the diaphragmatic surface of the left ventricle.","Right dominance (15%): the posterior interventricular artery is a large branch.","Left dominance (15%): the posterior interventricular artery is a large branch of the circumflex coronary."],"source":"Anatomy L4 slides","items":["q7"],"sec":[{"id":"anat-dominance","title":"Coronary dominance","key":["Co-dominance (balanced) 70%: the right coronary has the posterior interventricular branch and the circumflex has a branch to the diaphragmatic surface of the left ventricle.","Right dominance (15%): the posterior interventricular artery is a large branch.","Left dominance (15%): the posterior interventricular artery is a large branch of the circumflex coronary."]}]},"anat-cardiac-veins":{"title":"Venous drainage of the heart","unit":"Anatomy","points":["Coronary sinus: lies between the left atrium and the diaphragmatic surface and ends in the posterior wall of the right atrium.","Tributaries of the coronary sinus: great, middle and small cardiac veins, posterior vein of the left ventricle and oblique vein of the left atrium.","Anterior cardiac veins arise from the right ventricle and end in the anterior wall of the right atrium.","Venae cordis minimi drain directly into the cardiac chambers, especially on the right side.","The great cardiac vein runs with the LAD in the anterior interventricular groove; the middle cardiac vein runs with the posterior interventricular artery."],"source":"Anatomy L4 slides","items":["q8","q9","q10","q242","q244"],"sec":[{"id":"anat-cardiac-veins","title":"Venous drainage of the heart","key":["Coronary sinus: lies between the left atrium and the diaphragmatic surface and ends in the posterior wall of the right atrium.","Tributaries of the coronary sinus: great, middle and small cardiac veins, posterior vein of the left ventricle and oblique vein of the left atrium.","Anterior cardiac veins arise from the right ventricle and end in the anterior wall of the right atrium.","Venae cordis minimi drain directly into the cardiac chambers, especially on the right side.","The great cardiac vein runs with the LAD in the anterior interventricular groove; the middle cardiac vein runs with the posterior interventricular artery."]}]},"anat-surface":{"title":"Surface anatomy of the heart and valves","unit":"Anatomy","points":["Point A: lower border of the left 2nd costal cartilage, 0.5 inch from the sternum; point B: upper border of the right 3rd costal cartilage, 0.5 inch from the sternum.","Point C: right 6th costal cartilage, 0.5 inch from the sternum; point D: left 5th intercostal space, 3.5 inches from the midline.","Borders: upper A-B, right B-C, lower C-D, left D-A.","Valves (PAMT): pulmonary behind the left 3rd costal cartilage; aortic opposite the left 3rd intercostal space; mitral opposite the left 4th costal cartilage; tricuspid opposite the left 4th intercostal space behind the midline of the sternum."],"source":"Anatomy L4 slides","items":["q11","q12","q13","q14","q240"],"sec":[{"id":"anat-surface","title":"Surface anatomy of the heart and valves","key":["Point A: lower border of the left 2nd costal cartilage, 0.5 inch from the sternum; point B: upper border of the right 3rd costal cartilage, 0.5 inch from the sternum.","Point C: right 6th costal cartilage, 0.5 inch from the sternum; point D: left 5th intercostal space, 3.5 inches from the midline.","Borders: upper A-B, right B-C, lower C-D, left D-A.","Valves (PAMT): pulmonary behind the left 3rd costal cartilage; aortic opposite the left 3rd intercostal space; mitral opposite the left 4th costal cartilage; tricuspid opposite the left 4th intercostal space behind the midline of the sternum."]}]},"anat-pci":{"title":"Coronary angiography and PCI","unit":"Anatomy","points":["A catheter is passed retrograde from the radial or femoral artery into the ascending aorta under local anesthesia.","Radiopaque contrast is injected into the orifice of each coronary artery to photograph all segments of each vessel.","A stent may be placed to open vessels narrowed by plaque buildup (atherosclerosis)."],"source":"Anatomy L4 slides","items":["q15"],"sec":[{"id":"anat-pci","title":"Coronary angiography and PCI","key":["A catheter is passed retrograde from the radial or femoral artery into the ascending aorta under local anesthesia.","Radiopaque contrast is injected into the orifice of each coronary artery to photograph all segments of each vessel.","A stent may be placed to open vessels narrowed by plaque buildup (atherosclerosis)."]}]},"anat-carotid":{"title":"Common, external and internal carotid arteries","unit":"Anatomy","points":["Right common carotid: from the brachiocephalic artery behind the sternoclavicular joint; left common carotid: from the arch of the aorta.","The common carotid ascends in the carotid sheath, related medially to the trachea and larynx and laterally to the IJV, and ends at the upper border of the thyroid cartilage (C3-4).","The external carotid ends in the parotid gland behind the neck of the mandible by dividing into the maxillary and superficial temporal arteries.","External carotid branches: superior thyroid, ascending pharyngeal, lingual, facial, occipital, posterior auricular, superficial temporal and maxillary.","The internal carotid has no branches in the neck; it enters the skull through the carotid canal."],"source":"Anatomy L5 slides","items":["q16","q17","q18","q19","q20","q249","q253","q254"],"sec":[{"id":"anat-carotid","title":"Common, external and internal carotid arteries","key":["Right common carotid: from the brachiocephalic artery behind the sternoclavicular joint; left common carotid: from the arch of the aorta.","The common carotid ascends in the carotid sheath, related medially to the trachea and larynx and laterally to the IJV, and ends at the upper border of the thyroid cartilage (C3-4).","The external carotid ends in the parotid gland behind the neck of the mandible by dividing into the maxillary and superficial temporal arteries.","External carotid branches: superior thyroid, ascending pharyngeal, lingual, facial, occipital, posterior auricular, superficial temporal and maxillary.","The internal carotid has no branches in the neck; it enters the skull through the carotid canal."]}]},"anat-subclavian":{"title":"Subclavian artery","unit":"Anatomy","points":["Right subclavian: from the brachiocephalic artery behind the right sternoclavicular joint; left subclavian: from the arch of the aorta.","It ends at the outer border of the 1st rib by becoming the axillary artery.","Scalenus anterior passes anterior to the artery and divides it into 3 parts: medial, behind and lateral to the muscle.","1st part: vertebral, internal thoracic and thyrocervical trunk (inferior thyroid, transverse cervical, suprascapular). 2nd part: costocervical trunk. 3rd part: dorsal scapular (66%)."],"source":"Anatomy L5 slides","items":["q21","q22","q23","q248","q250","q255","q257"],"sec":[{"id":"anat-subclavian","title":"Subclavian artery","key":["Right subclavian: from the brachiocephalic artery behind the right sternoclavicular joint; left subclavian: from the arch of the aorta.","It ends at the outer border of the 1st rib by becoming the axillary artery.","Scalenus anterior passes anterior to the artery and divides it into 3 parts: medial, behind and lateral to the muscle.","1st part: vertebral, internal thoracic and thyrocervical trunk (inferior thyroid, transverse cervical, suprascapular). 2nd part: costocervical trunk. 3rd part: dorsal scapular (66%)."]}]},"anat-facial-veins":{"title":"Facial veins and the dangerous area of the face","unit":"Anatomy","points":["Anterior facial vein: formed by the supraorbital and supratrochlear veins at the medial angle of the eye.","Retromandibular (posterior facial) vein: formed by the maxillary and superficial temporal veins inside the parotid gland; divides at the lower pole of the parotid.","Common facial vein: anterior facial vein + anterior division of the retromandibular vein; drains into the IJV.","The deep facial vein connects the anterior facial vein to the pterygoid plexus.","Dangerous area of the face (nose and upper lip): infection can reach the cavernous sinus through the connections of the anterior facial vein."],"source":"Anatomy L5 slides","items":["q24","q25","q26","q246","q247","q252"],"sec":[{"id":"anat-facial-veins","title":"Facial veins and the dangerous area of the face","key":["Anterior facial vein: formed by the supraorbital and supratrochlear veins at the medial angle of the eye.","Retromandibular (posterior facial) vein: formed by the maxillary and superficial temporal veins inside the parotid gland; divides at the lower pole of the parotid.","Common facial vein: anterior facial vein + anterior division of the retromandibular vein; drains into the IJV.","The deep facial vein connects the anterior facial vein to the pterygoid plexus.","Dangerous area of the face (nose and upper lip): infection can reach the cavernous sinus through the connections of the anterior facial vein."]}]},"anat-neck-veins":{"title":"Jugular, subclavian and brachiocephalic veins","unit":"Anatomy","points":["External jugular vein: formed by the posterior division of the retromandibular vein and the posterior auricular vein; descends superficial to sternomastoid; ends in the subclavian vein.","External jugular tributaries: transverse cervical, suprascapular and anterior jugular veins.","Internal jugular vein: begins as the continuation of the sigmoid sinus at the jugular foramen; joins the subclavian vein to form the brachiocephalic vein.","Internal jugular tributaries: pharyngeal, common facial, lingual, superior thyroid and middle thyroid veins.","Right and left brachiocephalic veins unite to form the SVC."],"source":"Anatomy L5 slides","items":["q27","q28","q29","q30","q251","q256"],"sec":[{"id":"anat-neck-veins","title":"Jugular, subclavian and brachiocephalic veins","key":["External jugular vein: formed by the posterior division of the retromandibular vein and the posterior auricular vein; descends superficial to sternomastoid; ends in the subclavian vein.","External jugular tributaries: transverse cervical, suprascapular and anterior jugular veins.","Internal jugular vein: begins as the continuation of the sigmoid sinus at the jugular foramen; joins the subclavian vein to form the brachiocephalic vein.","Internal jugular tributaries: pharyngeal, common facial, lingual, superior thyroid and middle thyroid veins.","Right and left brachiocephalic veins unite to form the SVC."]}]},"phys-ecg-leads":{"title":"ECG leads and what they record","unit":"Physiology","points":["The ECG measures the electrical activity of the heart per unit time; it does NOT measure the flow of blood through the heart.","Six limb leads (frontal plane): bipolar I, II, III and unipolar augmented aVR, aVL, aVF. Six precordial leads V1-V6 (horizontal plane).","Current flowing towards the recording electrode gives an upward deflection; current flowing away gives a downward deflection.","Views: left lateral I, aVL, V5, V6; septum V1, V2; anterior V3, V4; inferior II, III, aVF."],"source":"Physiology L6 slides (ECG I)","items":["q31","q32","q33","q34","q273","q274","q275","q276","q277"],"sec":[{"id":"phys-ecg-leads","title":"ECG leads and what they record","key":["The ECG measures the electrical activity of the heart per unit time; it does NOT measure the flow of blood through the heart.","Six limb leads (frontal plane): bipolar I, II, III and unipolar augmented aVR, aVL, aVF. Six precordial leads V1-V6 (horizontal plane).","Current flowing towards the recording electrode gives an upward deflection; current flowing away gives a downward deflection.","Views: left lateral I, aVL, V5, V6; septum V1, V2; anterior V3, V4; inferior II, III, aVF."]}]},"phys-ecg-waves":{"title":"ECG paper, waves and intervals","unit":"Physiology","points":["Paper speed is 25 mm/sec: one small box = 0.04 s, one large box = 0.20 s; vertically one large box = 0.5 mV.","P wave = atrial depolarization; QRS = ventricular depolarization; T wave = ventricular repolarization.","PR interval = atrial depolarization + delay in the AV junction; the delay lets the atria contract before the ventricles.","PR 0.12-0.20 s; QRS 0.08-0.10 s; QT 0.40-0.43 s."],"source":"Physiology L6 slides (ECG I)","items":["q35","q36","q37","q38","q39","q40","q268","q269","q270","q271","q272"],"sec":[{"id":"phys-ecg-waves","title":"ECG paper, waves and intervals","key":["Paper speed is 25 mm/sec: one small box = 0.04 s, one large box = 0.20 s; vertically one large box = 0.5 mV.","P wave = atrial depolarization; QRS = ventricular depolarization; T wave = ventricular repolarization.","PR interval = atrial depolarization + delay in the AV junction; the delay lets the atria contract before the ventricles.","PR 0.12-0.20 s; QRS 0.08-0.10 s; QT 0.40-0.43 s."]}]},"phys-ecg-rate":{"title":"Rhythm analysis and heart rate","unit":"Physiology","points":["Steps: 1 regularity, 2 rate, 3 P waves, 4 PR interval, 5 QRS duration.","HR = 1500 / number of small squares between R-R, or 300 / number of large squares.","Large boxes to the next R wave: 1 = 300, 2 = 150, 3 = 100, 4 = 75."],"source":"Physiology L7 slides (ECG II)","items":["q41","q42","q43","q44"],"sec":[{"id":"phys-ecg-rate","title":"Rhythm analysis and heart rate","key":["Steps: 1 regularity, 2 rate, 3 P waves, 4 PR interval, 5 QRS duration.","HR = 1500 / number of small squares between R-R, or 300 / number of large squares.","Large boxes to the next R wave: 1 = 300, 2 = 150, 3 = 100, 4 = 75."]}]},"phys-sinus":{"title":"Normal sinus rhythm and its variations","unit":"Physiology","points":["Normal sinus rhythm: regular, normal P waves with one P for every QRS, PR 0.12-0.20 s, normal QRS.","Sinus bradycardia: everything normal but a slow rate (35 bpm on the slide); sinus tachycardia: normal but fast (130 bpm).","Sinus arrhythmia: heart rate increases during inspiration and decreases during expiration."],"source":"Physiology L7 slides (ECG II)","items":["q45","q46","q279"],"sec":[{"id":"phys-sinus","title":"Normal sinus rhythm and its variations","key":["Normal sinus rhythm: regular, normal P waves with one P for every QRS, PR 0.12-0.20 s, normal QRS.","Sinus bradycardia: everything normal but a slow rate (35 bpm on the slide); sinus tachycardia: normal but fast (130 bpm).","Sinus arrhythmia: heart rate increases during inspiration and decreases during expiration."]}]},"phys-arrhythmia":{"title":"Atrial fibrillation and atrial flutter","unit":"Physiology","points":["Atrial fibrillation: no organized atrial depolarization, so no normal P waves; atrial rate usually above 350/min; irregularly irregular.","Atrial fibrillation affects 2-4%, up to 5-10% of people over 80 years old.","Atrial flutter: flutter waves instead of P waves, no measurable PR interval; rhythm regular in the slide example."],"source":"Physiology L7 slides (ECG II)","items":["q47"],"sec":[{"id":"phys-arrhythmia","title":"Atrial fibrillation and atrial flutter","key":["Atrial fibrillation: no organized atrial depolarization, so no normal P waves; atrial rate usually above 350/min; irregularly irregular.","Atrial fibrillation affects 2-4%, up to 5-10% of people over 80 years old.","Atrial flutter: flutter waves instead of P waves, no measurable PR interval; rhythm regular in the slide example."]}]},"phys-av-block":{"title":"AV nodal blocks","unit":"Physiology","points":["1st degree: PR interval > 0.20 s; prolonged conduction delay in the AV node or bundle of His.","2nd degree Mobitz I: PR progressively lengthens until one impulse (usually the 3rd or 4th) fails to make it through the AV node.","2nd degree Mobitz II: occasional P waves are completely blocked with no PR prolongation (all or nothing); block typically in the bundle of His.","3rd degree: complete block in the AV junction; atria and ventricles beat independently; ventricular pacemaker at 30-45 beats/minute.","When an impulse originates in a ventricle, conduction is inefficient and the QRS is wide and bizarre."],"source":"Physiology L7 slides (ECG II)","items":["q48","q49","q50","q51","q52","q53","q282"],"sec":[{"id":"phys-av-block","title":"AV nodal blocks","key":["1st degree: PR interval > 0.20 s; prolonged conduction delay in the AV node or bundle of His.","2nd degree Mobitz I: PR progressively lengthens until one impulse (usually the 3rd or 4th) fails to make it through the AV node.","2nd degree Mobitz II: occasional P waves are completely blocked with no PR prolongation (all or nothing); block typically in the bundle of His.","3rd degree: complete block in the AV junction; atria and ventricles beat independently; ventricular pacemaker at 30-45 beats/minute.","When an impulse originates in a ventricle, conduction is inefficient and the QRS is wide and bizarre."]}]},"phys-axis":{"title":"Mean QRS axis","unit":"Physiology","points":["Normal ventricular depolarization flows leftward and downward because most of the ventricular mass is in the left ventricle.","Normal QRS axis: -30 to +110 degrees. Left axis deviation: -30 to -90. Right axis deviation: +110 to +180. Indeterminate (extreme right): +180 to -90.","Lead I and aVF: + + normal; + - left axis deviation; - + right axis deviation; - - right superior / indeterminate.","An abnormal axis can suggest disease such as pulmonary hypertension from a pulmonary embolism."],"source":"Physiology L7 slides (ECG II)","items":["q54","q55","q56","q57","q58","q278"],"sec":[{"id":"phys-axis","title":"Mean QRS axis","key":["Normal ventricular depolarization flows leftward and downward because most of the ventricular mass is in the left ventricle.","Normal QRS axis: -30 to +110 degrees. Left axis deviation: -30 to -90. Right axis deviation: +110 to +180. Indeterminate (extreme right): +180 to -90.","Lead I and aVF: + + normal; + - left axis deviation; - + right axis deviation; - - right superior / indeterminate.","An abnormal axis can suggest disease such as pulmonary hypertension from a pulmonary embolism."]}]},"phys-co":{"title":"Cardiac output, stroke volume and ejection fraction","unit":"Physiology","points":["Cardiac output = heart rate x stroke volume = 70 x 70 = 4900 ml/min, about 5 L/min.","Stroke volume = EDV - ESV (about 70-80 ml); EDV about 120-130 ml; ESV about 50-60 ml.","EF = SV / EDV x 100; normal 50-75%, up to 90% in strenuous exercise; 30% or less in a failing heart.","Cardiac index = cardiac output per minute per square meter of body surface area; normal 3.2 L/min/m2.","Cardiac reserve = the difference between cardiac output at rest and the maximum the heart can pump per minute."],"source":"Physiology L8 slides (cardiac output)","items":["q59","q60","q61","q62","q283","q284"],"sec":[{"id":"phys-co","title":"Cardiac output, stroke volume and ejection fraction","key":["Cardiac output = heart rate x stroke volume = 70 x 70 = 4900 ml/min, about 5 L/min.","Stroke volume = EDV - ESV (about 70-80 ml); EDV about 120-130 ml; ESV about 50-60 ml.","EF = SV / EDV x 100; normal 50-75%, up to 90% in strenuous exercise; 30% or less in a failing heart.","Cardiac index = cardiac output per minute per square meter of body surface area; normal 3.2 L/min/m2.","Cardiac reserve = the difference between cardiac output at rest and the maximum the heart can pump per minute."]}]},"phys-autonomic":{"title":"Autonomic control of heart rate and contractility","unit":"Physiology","points":["Parasympathetic (vagus) mainly supplies the atria (SA and AV nodes); parasympathetic innervation of the ventricles is sparse.","Parasympathetic: decreases heart rate, increases AV nodal delay, decreases atrial contractility, no effect on ventricular muscle.","Sympathetic: increases heart rate, decreases AV nodal delay, hastens ventricular conduction, increases atrial and ventricular contractility, promotes adrenal epinephrine.","Under resting conditions parasympathetic discharge dominates."],"source":"Physiology L8 slides (cardiac output)","items":["q63","q64","q65","q280","q281"],"sec":[{"id":"phys-autonomic","title":"Autonomic control of heart rate and contractility","key":["Parasympathetic (vagus) mainly supplies the atria (SA and AV nodes); parasympathetic innervation of the ventricles is sparse.","Parasympathetic: decreases heart rate, increases AV nodal delay, decreases atrial contractility, no effect on ventricular muscle.","Sympathetic: increases heart rate, decreases AV nodal delay, hastens ventricular conduction, increases atrial and ventricular contractility, promotes adrenal epinephrine.","Under resting conditions parasympathetic discharge dominates."]}]},"phys-starling":{"title":"Frank-Starling law, preload and afterload","unit":"Physiology","points":["Frank-Starling law: force of contraction is proportional to the initial length of the cardiac muscle fiber (EDV and stroke volume).","Resting cardiac fiber length is less than optimum, so more filling stretches fibers closer to optimum and increases the force of the next contraction.","Preload = load before contraction, the end-diastolic volume. Afterload = load the ventricle pumps against, the arterial blood pressure.","Sympathetic stimulation and epinephrine increase contractility at any EDV (more Ca2+ influx) and shift the Frank-Starling curve to the left."],"source":"Physiology L8 slides (cardiac output)","items":["q66","q67","q285"],"sec":[{"id":"phys-starling","title":"Frank-Starling law, preload and afterload","key":["Frank-Starling law: force of contraction is proportional to the initial length of the cardiac muscle fiber (EDV and stroke volume).","Resting cardiac fiber length is less than optimum, so more filling stretches fibers closer to optimum and increases the force of the next contraction.","Preload = load before contraction, the end-diastolic volume. Afterload = load the ventricle pumps against, the arterial blood pressure.","Sympathetic stimulation and epinephrine increase contractility at any EDV (more Ca2+ influx) and shift the Frank-Starling curve to the left."]}]},"phys-venous-return":{"title":"Factors controlling venous return","unit":"Physiology","points":["Veins are capacitance vessels holding about 60-70% of blood; when veins store less blood, more returns to the heart.","Skeletal muscle pump: contraction compresses veins and moves blood toward the heart.","Respiratory pump: in inspiration intrathoracic pressure falls (-5 mmHg), drawing blood into the chest.","Sympathetic venoconstriction, the cardiac suction effect and one-way venous valves (every 2-4 cm) also increase venous return."],"source":"Physiology L8 slides (cardiac output)","items":["q68","q286","q287"],"sec":[{"id":"phys-venous-return","title":"Factors controlling venous return","key":["Veins are capacitance vessels holding about 60-70% of blood; when veins store less blood, more returns to the heart.","Skeletal muscle pump: contraction compresses veins and moves blood toward the heart.","Respiratory pump: in inspiration intrathoracic pressure falls (-5 mmHg), drawing blood into the chest.","Sympathetic venoconstriction, the cardiac suction effect and one-way venous valves (every 2-4 cm) also increase venous return."]}]},"phys-co-measure":{"title":"Measuring cardiac output and conditions that change it","unit":"Physiology","points":["Fick principle: cardiac output = O2 uptake by the lungs / (arterial O2 - venous O2), e.g. 200 / (200 - 160) = 5 L/min.","Cardiac output rises in hyperthyroidism, anemia and fever; falls in hypothyroidism, myocardial damage and failure, valvular disease, arrhythmias, hemorrhage and shock.","Most common causes of heart failure: myocardial infarction, then working against increased afterload (hypertension, aortic stenosis)."],"source":"Physiology L8 slides (cardiac output)","items":["q69","q70","q71"],"sec":[{"id":"phys-co-measure","title":"Measuring cardiac output and conditions that change it","key":["Fick principle: cardiac output = O2 uptake by the lungs / (arterial O2 - venous O2), e.g. 200 / (200 - 160) = 5 L/min.","Cardiac output rises in hyperthyroidism, anemia and fever; falls in hypothyroidism, myocardial damage and failure, valvular disease, arrhythmias, hemorrhage and shock.","Most common causes of heart failure: myocardial infarction, then working against increased afterload (hypertension, aortic stenosis)."]}]},"phys-coronary-flow":{"title":"Coronary blood flow and oxygen extraction","unit":"Physiology","points":["Coronary blood flow at rest is about 225-250 ml/minute, about 5% of cardiac output.","At rest the heart extracts 60-70% of the oxygen from each unit of blood (other tissues about 25%).","Up to 40% of the cardiac cell is mitochondria, so the heart needs more O2; when more O2 is needed, delivery rises only by increasing blood flow.","The heart uses mainly free fatty acids; in ischemia it uses anaerobic glycolysis, forming lactic acid (one cause of cardiac pain)."],"source":"Physiology L9 slides (coronary circulation)","items":["q72","q73","q74","q288"],"sec":[{"id":"phys-coronary-flow","title":"Coronary blood flow and oxygen extraction","key":["Coronary blood flow at rest is about 225-250 ml/minute, about 5% of cardiac output.","At rest the heart extracts 60-70% of the oxygen from each unit of blood (other tissues about 25%).","Up to 40% of the cardiac cell is mitochondria, so the heart needs more O2; when more O2 is needed, delivery rises only by increasing blood flow.","The heart uses mainly free fatty acids; in ischemia it uses anaerobic glycolysis, forming lactic acid (one cause of cardiac pain)."]}]},"phys-phasic-flow":{"title":"Phasic changes in coronary flow","unit":"Physiology","points":["Left ventricular flow falls in systole: the contracting LV compresses the coronary arteries and the open aortic valve partially blocks their entrance.","Systole: aorta 120, LV 121 mmHg (gradient -1); diastole: aorta 80, LV 0 (gradient 80). Right ventricle gradient is 95 in systole, 80 in diastole.","The subendocardial surface of the left ventricle gets almost no flow in systole, so it is the most common site of myocardial infarction.","Tachycardia shortens diastole and reduces coronary flow; aortic stenosis and low aortic diastolic pressure also reduce LV flow."],"source":"Physiology L9 slides (coronary circulation)","items":["q75","q76","q77","q78","q289","q290","q291"],"sec":[{"id":"phys-phasic-flow","title":"Phasic changes in coronary flow","key":["Left ventricular flow falls in systole: the contracting LV compresses the coronary arteries and the open aortic valve partially blocks their entrance.","Systole: aorta 120, LV 121 mmHg (gradient -1); diastole: aorta 80, LV 0 (gradient 80). Right ventricle gradient is 95 in systole, 80 in diastole.","The subendocardial surface of the left ventricle gets almost no flow in systole, so it is the most common site of myocardial infarction.","Tachycardia shortens diastole and reduces coronary flow; aortic stenosis and low aortic diastolic pressure also reduce LV flow."]}]},"phys-coronary-control":{"title":"Chemical and neural control of coronary flow","unit":"Physiology","points":["Coronary blood flow shows considerable autoregulation.","Vasodilators: lack of oxygen, increased CO2, H+, K+, lactate, prostaglandins, adenosine and adenine nucleotides.","Adenosine, formed from ATP during cardiac metabolic activity, causes coronary vasodilatation.","Direct sympathetic effect: alpha-receptor vasoconstriction (seen when beta receptors are blocked). Indirect effect in the intact body: beta-1 raises heart rate and contractility, releasing vasodilator metabolites.","Parasympathetic influences are minor and weakly vasodilatory."],"source":"Physiology L9 slides (coronary circulation)","items":["q79","q80","q81"],"sec":[{"id":"phys-coronary-control","title":"Chemical and neural control of coronary flow","key":["Coronary blood flow shows considerable autoregulation.","Vasodilators: lack of oxygen, increased CO2, H+, K+, lactate, prostaglandins, adenosine and adenine nucleotides.","Adenosine, formed from ATP during cardiac metabolic activity, causes coronary vasodilatation.","Direct sympathetic effect: alpha-receptor vasoconstriction (seen when beta receptors are blocked). Indirect effect in the intact body: beta-1 raises heart rate and contractility, releasing vasodilator metabolites.","Parasympathetic influences are minor and weakly vasodilatory."]}]},"phys-ihd":{"title":"Ischemic heart disease and myocardial infarction","unit":"Physiology","points":["Risk factors of IHD: cigarette smoking, hypertension, diabetes mellitus, increased lipids (cholesterol), lack of exercise, anxiety.","Angina: retrosternal tightness or pain for a few minutes, often radiating to the inner side of the left arm, precipitated by effort and relieved by rest.","MI: at least 75% of the coronary lumen blocked by thrombus.","ECG: ST depression in IHD; ST elevation in MI, in the respective leads.","Treatment: coronary dilators (nitrates), beta-blockers, angioplasty, stent, bypass surgery."],"source":"Physiology L9 slides (coronary circulation)","items":["q82","q83","q84"],"sec":[{"id":"phys-ihd","title":"Ischemic heart disease and myocardial infarction","key":["Risk factors of IHD: cigarette smoking, hypertension, diabetes mellitus, increased lipids (cholesterol), lack of exercise, anxiety.","Angina: retrosternal tightness or pain for a few minutes, often radiating to the inner side of the left arm, precipitated by effort and relieved by rest.","MI: at least 75% of the coronary lumen blocked by thrombus.","ECG: ST depression in IHD; ST elevation in MI, in the respective leads.","Treatment: coronary dilators (nitrates), beta-blockers, angioplasty, stent, bypass surgery."]}]},"path-congestion":{"title":"Hyperemia and congestion","unit":"Pathology","points":["Hyperemia: an active process in which arteriolar dilation increases blood flow; tissue turns red (erythema) from oxygenated blood.","Congestion: a passive process from impaired venous outflow; tissue is dusky reddish-blue (cyanosis) from deoxygenated blood.","Acute localized congestion: sudden complete venous obstruction (DVT, ligature, twisted pedicle of an ovary) causing rapid edema and hemorrhage.","Chronic generalized venous congestion is caused by chronic right-sided heart failure; acute generalized congestion by acute heart failure."],"source":"Pathology L1 slides (hemodynamic disorders I)","items":["q85","q86","q87","q88","q89"],"sec":[{"id":"path-congestion","title":"Hyperemia and congestion","key":["Hyperemia: an active process in which arteriolar dilation increases blood flow; tissue turns red (erythema) from oxygenated blood.","Congestion: a passive process from impaired venous outflow; tissue is dusky reddish-blue (cyanosis) from deoxygenated blood.","Acute localized congestion: sudden complete venous obstruction (DVT, ligature, twisted pedicle of an ovary) causing rapid edema and hemorrhage.","Chronic generalized venous congestion is caused by chronic right-sided heart failure; acute generalized congestion by acute heart failure."]}]},"path-edema":{"title":"Edema: causes and classification","unit":"Pathology","points":["Edema: an abnormal increase in interstitial fluid within tissues; fluid may be transudate, exudate or lymph.","Causes: increased capillary hydrostatic pressure, decreased plasma colloid osmotic pressure, increased capillary permeability, lymphatic obstruction.","Hypoproteinemia: total plasma proteins below 2.5 gm% or serum albumin below 1.5 gm%.","Pitting edema: generalized edema and obstructive venous edema. Non-pitting: inflammatory and lymphatic edema."],"source":"Pathology L1 slides (hemodynamic disorders I)","items":["q90","q91","q92","q93"],"sec":[{"id":"path-edema","title":"Edema: causes and classification","key":["Edema: an abnormal increase in interstitial fluid within tissues; fluid may be transudate, exudate or lymph.","Causes: increased capillary hydrostatic pressure, decreased plasma colloid osmotic pressure, increased capillary permeability, lymphatic obstruction.","Hypoproteinemia: total plasma proteins below 2.5 gm% or serum albumin below 1.5 gm%.","Pitting edema: generalized edema and obstructive venous edema. Non-pitting: inflammatory and lymphatic edema."]}]},"path-ischemia-infarct":{"title":"Ischemia and infarction","unit":"Pathology","points":["Ischemia: deficient arterial blood supply due to partial or complete occlusion of the artery; acute (sudden complete) or chronic (gradual partial).","Organs with good collateral circulation show no effect; poor collateral circulation leads to infarction (acute) or chronic ischemic changes.","Infarct: an area of ischemic necrosis from occlusion of the arterial supply or venous drainage; 99% from thrombosis or embolism.","Red infarct: venous occlusion (ovary), loose tissue (lung), dual circulation (lung, liver, small intestine), reperfusion after angioplasty.","White infarct: arterial occlusion in solid organs with end-arterial circulation (heart, spleen, kidney); tissue density limits seepage of blood."],"source":"Pathology L1 slides (hemodynamic disorders I)","items":["q94","q95","q96","q97","q98"],"sec":[{"id":"path-ischemia-infarct","title":"Ischemia and infarction","key":["Ischemia: deficient arterial blood supply due to partial or complete occlusion of the artery; acute (sudden complete) or chronic (gradual partial).","Organs with good collateral circulation show no effect; poor collateral circulation leads to infarction (acute) or chronic ischemic changes.","Infarct: an area of ischemic necrosis from occlusion of the arterial supply or venous drainage; 99% from thrombosis or embolism.","Red infarct: venous occlusion (ovary), loose tissue (lung), dual circulation (lung, liver, small intestine), reperfusion after angioplasty.","White infarct: arterial occlusion in solid organs with end-arterial circulation (heart, spleen, kidney); tissue density limits seepage of blood."]}]},"path-virchow":{"title":"Thrombosis and Virchow's triad","unit":"Pathology","points":["Thrombosis: formation of a compact mass of circulating blood elements inside the cardiovascular system during life.","Virchow's triad: endothelial injury/dysfunction, alterations in blood flow (stasis or turbulence), hypercoagulability.","Endothelial dysfunction increases procoagulants (thromboplastin, vWF, PAI) and decreases anticoagulants (thrombomodulin, antithrombin III, NO, PA).","Stasis reduces inflow of fresh blood containing natural anticoagulants and retards removal of small platelet aggregates.","Acquired hypercoagulability: prolonged bed rest, surgery, burns, pregnancy, oral contraceptives, disseminated cancer, smoking, DIC. Hereditary: factor V and prothrombin gene mutations, antithrombin III deficiency."],"source":"Pathology L2 slides (hemodynamic disorders II)","items":["q99","q100","q101","q102","q296"],"sec":[{"id":"path-virchow","title":"Thrombosis and Virchow's triad","key":["Thrombosis: formation of a compact mass of circulating blood elements inside the cardiovascular system during life.","Virchow's triad: endothelial injury/dysfunction, alterations in blood flow (stasis or turbulence), hypercoagulability.","Endothelial dysfunction increases procoagulants (thromboplastin, vWF, PAI) and decreases anticoagulants (thrombomodulin, antithrombin III, NO, PA).","Stasis reduces inflow of fresh blood containing natural anticoagulants and retards removal of small platelet aggregates.","Acquired hypercoagulability: prolonged bed rest, surgery, burns, pregnancy, oral contraceptives, disseminated cancer, smoking, DIC. Hereditary: factor V and prothrombin gene mutations, antithrombin III deficiency."]}]},"path-thrombus-types":{"title":"Sites, types and fate of thrombi","unit":"Pathology","points":["Venous thrombi (phlebothrombosis, red thrombi) are the most common type, associated with stasis and hypercoagulability.","DVT sites: popliteal, femoral and iliac veins; complication: embolism to the lungs (pulmonary infarction).","Arterial thrombosis is less common because of rapid flow and the thick elastic arterial wall; most common cause is atherosclerosis (coronary, cerebral, femoral).","Cardiac thrombi: auricular thrombus in the left atrium in mitral stenosis; mural thrombus in the left ventricle over an infarct; vegetations on valves.","Fate: dissolution, propagation (a tail liable to detach), embolization, organization and recanalization."],"source":"Pathology L2 slides (hemodynamic disorders II)","items":["q103","q104","q105","q106","q107"],"sec":[{"id":"path-thrombus-types","title":"Sites, types and fate of thrombi","key":["Venous thrombi (phlebothrombosis, red thrombi) are the most common type, associated with stasis and hypercoagulability.","DVT sites: popliteal, femoral and iliac veins; complication: embolism to the lungs (pulmonary infarction).","Arterial thrombosis is less common because of rapid flow and the thick elastic arterial wall; most common cause is atherosclerosis (coronary, cerebral, femoral).","Cardiac thrombi: auricular thrombus in the left atrium in mitral stenosis; mural thrombus in the left ventricle over an infarct; vegetations on valves.","Fate: dissolution, propagation (a tail liable to detach), embolization, organization and recanalization."]}]},"path-embolism":{"title":"Embolism and pulmonary embolism","unit":"Pathology","points":["An embolus is a detached intravascular solid, liquid or gaseous mass carried by the blood to a site distant from its origin.","Thromboemboli are the most common type (99%); others: fat, parasitic, air or nitrogen, amniotic fluid, tumor, cholesterol and foreign body emboli.","Pulmonary emboli: 95% originate from deep vein thrombi of the legs; seen in up to 25-30% of DVT patients; 60-80% are small and silent.","Saddle embolus causes sudden death (acute right failure); medium emboli give hemorrhage in a normal lung or infarction in a congested lung; small repeated emboli give pulmonary hypertension and cor pulmonale."],"source":"Pathology L2 slides (hemodynamic disorders II)","items":["q108","q109","q110","q297"],"sec":[{"id":"path-embolism","title":"Embolism and pulmonary embolism","key":["An embolus is a detached intravascular solid, liquid or gaseous mass carried by the blood to a site distant from its origin.","Thromboemboli are the most common type (99%); others: fat, parasitic, air or nitrogen, amniotic fluid, tumor, cholesterol and foreign body emboli.","Pulmonary emboli: 95% originate from deep vein thrombi of the legs; seen in up to 25-30% of DVT patients; 60-80% are small and silent.","Saddle embolus causes sudden death (acute right failure); medium emboli give hemorrhage in a normal lung or infarction in a congested lung; small repeated emboli give pulmonary hypertension and cor pulmonale."]}]},"path-systemic-emboli":{"title":"Systemic, fat, air and amniotic fluid emboli","unit":"Pathology","points":["Systemic emboli: 80% from intracardiac thrombi (2/3 left ventricular wall infarcts, 1/3 dilated left atria or vegetations); also aortic aneurysm, ulcerated plaques, paradoxical emboli.","Paradoxical emboli start as venous emboli but pass through an interatrial or interventricular defect into the systemic circulation.","Site of arrest: 75% lower extremities, 10% brain.","Fat embolism: long bone fracture is the most common cause; the syndrome begins 1-3 days after injury with tachypnea, dyspnea, tachycardia, neurologic symptoms, thrombocytopenia and anemia.","Air embolism needs more than 100 cc of air for a pulmonary effect; causes include neck vein injury, chest wall injury, obstetric or laparoscopic procedures, bypass surgery and decompression sickness.","Amniotic fluid embolism: 1 in 40,000 deliveries, mortality 80%; sudden dyspnea, cyanosis, shock, seizures, pulmonary edema and DIC."],"source":"Pathology L2 slides (hemodynamic disorders II)","items":["q111","q112","q113","q114","q115","q116","q298","q299","q300","q301"],"sec":[{"id":"path-systemic-emboli","title":"Systemic, fat, air and amniotic fluid emboli","key":["Systemic emboli: 80% from intracardiac thrombi (2/3 left ventricular wall infarcts, 1/3 dilated left atria or vegetations); also aortic aneurysm, ulcerated plaques, paradoxical emboli.","Paradoxical emboli start as venous emboli but pass through an interatrial or interventricular defect into the systemic circulation.","Site of arrest: 75% lower extremities, 10% brain.","Fat embolism: long bone fracture is the most common cause; the syndrome begins 1-3 days after injury with tachypnea, dyspnea, tachycardia, neurologic symptoms, thrombocytopenia and anemia.","Air embolism needs more than 100 cc of air for a pulmonary effect; causes include neck vein injury, chest wall injury, obstetric or laparoscopic procedures, bypass surgery and decompression sickness.","Amniotic fluid embolism: 1 in 40,000 deliveries, mortality 80%; sudden dyspnea, cyanosis, shock, seizures, pulmonary edema and DIC."]}]},"path-arf":{"title":"Acute rheumatic fever: pathogenesis and lesions","unit":"Pathology","points":["ARF is an acute, immunologically mediated, multisystem inflammatory disease a few weeks after group A streptococcal pharyngitis.","It appears 10 days to 6 weeks after pharyngitis, in about 3% of infected patients, most often in children aged 5-15.","Antibodies and CD4+ T cells against streptococcal M proteins cross-react with self antigens in the heart.","Aschoff bodies are pathognomonic: focal necrosis, T lymphocytes and Anitschkow (caterpillar) cells with a slender wavy ribbon of chromatin.","Pancarditis: fibrinous \"bread and butter\" pericarditis, myocarditis, and small vegetations along the lines of closure over fibrinoid necrosis (mitral 65%, aortic 25%)."],"source":"Pathology L3 slides (rheumatic fever)","items":["q117","q118","q119","q120","q121","q122","q123","q303","q304"],"sec":[{"id":"path-arf","title":"Acute rheumatic fever: pathogenesis and lesions","key":["ARF is an acute, immunologically mediated, multisystem inflammatory disease a few weeks after group A streptococcal pharyngitis.","It appears 10 days to 6 weeks after pharyngitis, in about 3% of infected patients, most often in children aged 5-15.","Antibodies and CD4+ T cells against streptococcal M proteins cross-react with self antigens in the heart.","Aschoff bodies are pathognomonic: focal necrosis, T lymphocytes and Anitschkow (caterpillar) cells with a slender wavy ribbon of chromatin.","Pancarditis: fibrinous \"bread and butter\" pericarditis, myocarditis, and small vegetations along the lines of closure over fibrinoid necrosis (mitral 65%, aortic 25%)."]}]},"path-jones":{"title":"Jones criteria","unit":"Pathology","points":["Major: carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum, subcutaneous nodules.","Minor: fever, arthralgia, previous rheumatic fever, raised ESR, CRP or leukocytosis, prolonged PR interval.","Evidence of preceding group A strep: positive throat culture or rapid antigen test, or raised or rising streptococcal antibody titer.","Diagnosis: 2 major, or 1 major and 2 minor, supported by evidence of preceding group A streptococcal infection.","Migratory polyarthritis of large joints is self-limited with no chronic deformities."],"source":"Pathology L3 slides (rheumatic fever)","items":["q124","q125","q126","q302"],"sec":[{"id":"path-jones","title":"Jones criteria","key":["Major: carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum, subcutaneous nodules.","Minor: fever, arthralgia, previous rheumatic fever, raised ESR, CRP or leukocytosis, prolonged PR interval.","Evidence of preceding group A strep: positive throat culture or rapid antigen test, or raised or rising streptococcal antibody titer.","Diagnosis: 2 major, or 1 major and 2 minor, supported by evidence of preceding group A streptococcal infection.","Migratory polyarthritis of large joints is self-limited with no chronic deformities."]}]},"path-rhd":{"title":"Chronic rheumatic heart disease and mitral stenosis","unit":"Pathology","points":["Endocarditis of ARF heals by fibrosis; repeated pharyngeal infections reactivate the disease and scar the valves.","Mitral valve most commonly affected, then aortic; fibrosis of the leaflets leads to stenosis (\"fish mouth\" or \"buttonhole\").","Usually becomes clinically manifest decades after ARF.","Mitral stenosis: left atrial dilatation (with thrombi), chronic pulmonary venous congestion, lung fibrosis, pulmonary hypertension, chronic right-sided failure; the left ventricle is largely unaffected.","Other complications: arrhythmias (especially atrial fibrillation), thromboembolism, infective endocarditis."],"source":"Pathology L3 slides (rheumatic fever)","items":["q127","q128","q305","q306","q307","q308","q309"],"sec":[{"id":"path-rhd","title":"Chronic rheumatic heart disease and mitral stenosis","key":["Endocarditis of ARF heals by fibrosis; repeated pharyngeal infections reactivate the disease and scar the valves.","Mitral valve most commonly affected, then aortic; fibrosis of the leaflets leads to stenosis (\"fish mouth\" or \"buttonhole\").","Usually becomes clinically manifest decades after ARF.","Mitral stenosis: left atrial dilatation (with thrombi), chronic pulmonary venous congestion, lung fibrosis, pulmonary hypertension, chronic right-sided failure; the left ventricle is largely unaffected.","Other complications: arrhythmias (especially atrial fibrillation), thromboembolism, infective endocarditis."]}]},"path-arteriosclerosis":{"title":"Arteriosclerosis patterns","unit":"Pathology","points":["Arteriosclerosis: thickening and loss of elasticity of arterial walls (\"hardening of the arteries\").","Atherosclerosis: the most frequent and important pattern.","Mönckeberg medial sclerosis: calcific deposits in muscular arteries in people older than 50.","Arteriolosclerosis: small arteries and arterioles, with hypertension and diabetes; hyaline (amorphous proteinaceous wall) and hyperplastic (\"onion-skinning\")."],"source":"Pathology L4 slides (atherosclerosis)","items":["q129","q130","q321"],"sec":[{"id":"path-arteriosclerosis","title":"Arteriosclerosis patterns","key":["Arteriosclerosis: thickening and loss of elasticity of arterial walls (\"hardening of the arteries\").","Atherosclerosis: the most frequent and important pattern.","Mönckeberg medial sclerosis: calcific deposits in muscular arteries in people older than 50.","Arteriolosclerosis: small arteries and arterioles, with hypertension and diabetes; hyaline (amorphous proteinaceous wall) and hyperplastic (\"onion-skinning\")."]}]},"path-athero":{"title":"Atherosclerosis: risk factors, pathogenesis and plaque","unit":"Pathology","points":["Atherosclerosis: a chronic inflammatory disease of the arterial wall with intimal atheromas that protrude into the lumen and weaken the media.","Non-modifiable risk factors: increasing age, male gender, family history. Modifiable: hyperlipidemia (LDL), hypertension, cigarette smoking, diabetes mellitus.","Response to injury: chronic endothelial injury, endothelial dysfunction with monocyte adhesion, smooth muscle recruitment and macrophage activation, foam cells, then smooth muscle proliferation and collagen deposition.","Fatty spots (\u003c1 mm, foam cells) are the earliest lesion; fatty streaks (1 cm or longer) are not significantly raised and do not disturb blood flow.","Atheroma: raised intimal patch with a soft yellow lipid core under a firm white fibrous cap; cells, ECM and lipid."],"source":"Pathology L4 slides (atherosclerosis)","items":["q131","q132","q133","q134","q135","q320"],"sec":[{"id":"path-athero","title":"Atherosclerosis: risk factors, pathogenesis and plaque","key":["Atherosclerosis: a chronic inflammatory disease of the arterial wall with intimal atheromas that protrude into the lumen and weaken the media.","Non-modifiable risk factors: increasing age, male gender, family history. Modifiable: hyperlipidemia (LDL), hypertension, cigarette smoking, diabetes mellitus.","Response to injury: chronic endothelial injury, endothelial dysfunction with monocyte adhesion, smooth muscle recruitment and macrophage activation, foam cells, then smooth muscle proliferation and collagen deposition.","Fatty spots (\u003c1 mm, foam cells) are the earliest lesion; fatty streaks (1 cm or longer) are not significantly raised and do not disturb blood flow.","Atheroma: raised intimal patch with a soft yellow lipid core under a firm white fibrous cap; cells, ECM and lipid."]}]},"path-athero-complications":{"title":"Complications and sites of atherosclerosis","unit":"Pathology","points":["Common sites: lower abdominal aorta, coronary, popliteal and internal carotid arteries, and the circle of Willis.","Acute plaque changes: rupture, ulceration or erosion (induces thrombosis), and fissure with hemorrhage into the plaque.","Other complications: atheroembolism, aneurysm from weakened media, calcification.","Consequences: ischemic heart disease (coronary), stroke (cerebral), aortic aneurysm (aorta), peripheral vascular disease with gangrene (leg arteries)."],"source":"Pathology L4 slides (atherosclerosis)","items":["q136","q137","q138"],"sec":[{"id":"path-athero-complications","title":"Complications and sites of atherosclerosis","key":["Common sites: lower abdominal aorta, coronary, popliteal and internal carotid arteries, and the circle of Willis.","Acute plaque changes: rupture, ulceration or erosion (induces thrombosis), and fissure with hemorrhage into the plaque.","Other complications: atheroembolism, aneurysm from weakened media, calcification.","Consequences: ischemic heart disease (coronary), stroke (cerebral), aortic aneurysm (aorta), peripheral vascular disease with gangrene (leg arteries)."]}]},"pharm-classes":{"title":"Hypertension: definition and drug classes","unit":"Pharmacology","points":["Hypertension is defined as 130/80 mm Hg or higher (ACC/AHA 2023 and Saudi Heart Association).","Classes: diuretics, calcium channel blockers, drugs acting on the renin-angiotensin system, sympatholytic drugs, vasodilators.","Drug list: hydrochlorothiazide, indapamide, furosemide, spironolactone (diuretics); clonidine, methyldopa, prazosin, propranolol, labetalol, esmolol (sympathoplegic); hydralazine, nitroprusside, minoxidil, diazoxide, fenoldopam, CCBs (vasodilators); captopril, enalapril, enalaprilat (ACE inhibitors); losartan (ARB); aliskiren (renin inhibitor)."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q139","q140"],"sec":[{"id":"pharm-classes","title":"Hypertension: definition and drug classes","key":["Hypertension is defined as 130/80 mm Hg or higher (ACC/AHA 2023 and Saudi Heart Association).","Classes: diuretics, calcium channel blockers, drugs acting on the renin-angiotensin system, sympatholytic drugs, vasodilators.","Drug list: hydrochlorothiazide, indapamide, furosemide, spironolactone (diuretics); clonidine, methyldopa, prazosin, propranolol, labetalol, esmolol (sympathoplegic); hydralazine, nitroprusside, minoxidil, diazoxide, fenoldopam, CCBs (vasodilators); captopril, enalapril, enalaprilat (ACE inhibitors); losartan (ARB); aliskiren (renin inhibitor)."]}]},"pharm-diuretics":{"title":"Diuretics in hypertension","unit":"Pharmacology","points":["Early: diuretics lower plasma volume and cardiac output. After 4-8 weeks volume and output return toward normal while peripheral vascular resistance falls (arteriolar vasodilation).","Main mechanism of the vasodilation: depletion of body Na+, lowering smooth muscle Na+ and then intracellular Ca++ via the Na/Ca exchanger.","Thiazides are first choice; antihypertensive doses are lower than diuretic doses.","Loop diuretics are preferable in malignant hypertension and chronic kidney disease.","Potassium-sparing diuretics are used with thiazides to counteract hypokalemia; spironolactone is used in hyperaldosteronism."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q141","q142","q143","q144","q325"],"sec":[{"id":"pharm-diuretics","title":"Diuretics in hypertension","key":["Early: diuretics lower plasma volume and cardiac output. After 4-8 weeks volume and output return toward normal while peripheral vascular resistance falls (arteriolar vasodilation).","Main mechanism of the vasodilation: depletion of body Na+, lowering smooth muscle Na+ and then intracellular Ca++ via the Na/Ca exchanger.","Thiazides are first choice; antihypertensive doses are lower than diuretic doses.","Loop diuretics are preferable in malignant hypertension and chronic kidney disease.","Potassium-sparing diuretics are used with thiazides to counteract hypokalemia; spironolactone is used in hyperaldosteronism."]}]},"pharm-ccb":{"title":"Calcium channel blockers","unit":"Pharmacology","points":["CCBs bind the L-type voltage-gated Ca++ channel from the inner side of the membrane.","Verapamil and diltiazem block Ca++ channels in heart and vessels; dihydropyridines (nifedipine, nicardipine) block vessels only.","Heart rate: increased with dihydropyridines; unchanged or decreased with verapamil and diltiazem. Postural hypotension is negligible.","First-choice drugs, more effective in African patients; nicardipine for hypertensive emergencies; short-acting nifedipine increases mortality."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q145","q146","q147","q148"],"sec":[{"id":"pharm-ccb","title":"Calcium channel blockers","key":["CCBs bind the L-type voltage-gated Ca++ channel from the inner side of the membrane.","Verapamil and diltiazem block Ca++ channels in heart and vessels; dihydropyridines (nifedipine, nicardipine) block vessels only.","Heart rate: increased with dihydropyridines; unchanged or decreased with verapamil and diltiazem. Postural hypotension is negligible.","First-choice drugs, more effective in African patients; nicardipine for hypertensive emergencies; short-acting nifedipine increases mortality."]}]},"pharm-ras":{"title":"Renin inhibitors, ACE inhibitors and ARBs","unit":"Pharmacology","points":["Aliskiren competitively inhibits renin: angiotensin I, II and aldosterone fall and renin rises; hyperkalemia when combined with ACE inhibitors or ARBs.","ACE inhibitors block conversion of angiotensin I to II and raise bradykinin; less angiotensin II removes negative feedback, so renin rises.","Captopril, lisinopril and enalaprilat are active drugs; enalapril, benazepril and fosinopril are prodrugs activated by the liver; enalaprilat is the IV form.","ACE inhibitor adverse effects: first-dose hypotension, dry cough (bradykinin, prostaglandins or substance P), renal insufficiency in bilateral renal artery stenosis, hyperkalemia, angioedema; pregnancy category D.","ARBs (losartan) selectively block AT1 receptors, inhibit angiotensin more completely and have no effect on bradykinin; contraindicated in bilateral renal artery stenosis and pregnancy."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q149","q150","q151","q152","q153","q154","q155","q156","q157","q158","q322","q323","q324"],"sec":[{"id":"pharm-ras","title":"Renin inhibitors, ACE inhibitors and ARBs","key":["Aliskiren competitively inhibits renin: angiotensin I, II and aldosterone fall and renin rises; hyperkalemia when combined with ACE inhibitors or ARBs.","ACE inhibitors block conversion of angiotensin I to II and raise bradykinin; less angiotensin II removes negative feedback, so renin rises.","Captopril, lisinopril and enalaprilat are active drugs; enalapril, benazepril and fosinopril are prodrugs activated by the liver; enalaprilat is the IV form.","ACE inhibitor adverse effects: first-dose hypotension, dry cough (bradykinin, prostaglandins or substance P), renal insufficiency in bilateral renal artery stenosis, hyperkalemia, angioedema; pregnancy category D.","ARBs (losartan) selectively block AT1 receptors, inhibit angiotensin more completely and have no effect on bradykinin; contraindicated in bilateral renal artery stenosis and pregnancy."]}]},"pharm-central":{"title":"Centrally acting sympatholytics","unit":"Pharmacology","points":["Clonidine and methyldopa are alpha-2 receptor agonists; methyldopa is a false neurotransmitter converted to methylnorepinephrine; clonidine also acts on imidazoline receptors in the medulla.","The final common effect is a decrease in central adrenergic tone.","Second-choice drugs; methyldopa is often preferred in pregnancy.","Adverse effects: sedation, depression, bradycardia, AV block, sexual dysfunction; clonidine withdrawal can cause a hypertensive crisis; methyldopa can cause a positive Coombs' test."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q159","q160","q161","q162"],"sec":[{"id":"pharm-central","title":"Centrally acting sympatholytics","key":["Clonidine and methyldopa are alpha-2 receptor agonists; methyldopa is a false neurotransmitter converted to methylnorepinephrine; clonidine also acts on imidazoline receptors in the medulla.","The final common effect is a decrease in central adrenergic tone.","Second-choice drugs; methyldopa is often preferred in pregnancy.","Adverse effects: sedation, depression, bradycardia, AV block, sexual dysfunction; clonidine withdrawal can cause a hypertensive crisis; methyldopa can cause a positive Coombs' test."]}]},"pharm-alpha-beta":{"title":"Alpha blockers, beta blockers and alpha-beta blockers","unit":"Pharmacology","points":["Prazosin and doxazosin selectively block alpha-1 receptors, dilating resistance and capacitance vessels; postural hypotension after the first dose (\"first-dose phenomenon\").","Beta blockers lower cardiac output (cardiac beta-1) and inhibit renin release (juxtaglomerular beta-1); they do not cause postural hypotension.","Selective beta-1: atenolol, bisoprolol, metoprolol. Non-selective: propranolol, penbutolol, timolol.","Beta-blocker adverse effects: bradycardia, rebound hypertension on abrupt withdrawal, bronchoconstriction, insomnia, depression, hypoglycemia, sexual dysfunction.","Labetalol and carvedilol block alpha and beta; labetalol for hypertension in pregnancy and IV in emergencies; carvedilol for heart failure."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q163","q164","q165","q166","q167"],"sec":[{"id":"pharm-alpha-beta","title":"Alpha blockers, beta blockers and alpha-beta blockers","key":["Prazosin and doxazosin selectively block alpha-1 receptors, dilating resistance and capacitance vessels; postural hypotension after the first dose (\"first-dose phenomenon\").","Beta blockers lower cardiac output (cardiac beta-1) and inhibit renin release (juxtaglomerular beta-1); they do not cause postural hypotension.","Selective beta-1: atenolol, bisoprolol, metoprolol. Non-selective: propranolol, penbutolol, timolol.","Beta-blocker adverse effects: bradycardia, rebound hypertension on abrupt withdrawal, bronchoconstriction, insomnia, depression, hypoglycemia, sexual dysfunction.","Labetalol and carvedilol block alpha and beta; labetalol for hypertension in pregnancy and IV in emergencies; carvedilol for heart failure."]}]},"pharm-vasodilators":{"title":"Direct vasodilators","unit":"Pharmacology","points":["Nitroprusside: arterioles and veins, nitric oxide; metabolized by red cells releasing cyanide (to thiocyanate); half-life about 2 minutes, continuous infusion; for emergencies, severe heart failure, controlled hypotension.","Hydralazine: arterioles, uncertain mechanism; headache, palpitations, flushing; immunological lupoid syndrome (up to 20% at very high doses).","Minoxidil: arteriolar K+ channel opener, a prodrug; salt and water retention, tachycardia, hypertrichosis; also used for baldness.","Diazoxide: K+ channel opener without diuresis (lacks a sulfonamide group); salt and water retention, hyperglycemia; for hypertensive emergencies.","Fenoldopam: IV D1 agonist, renal and mesenteric vasodilation and natriuresis; reflex tachycardia, raised intraocular pressure, low potassium; contraindicated in angina, glaucoma and hypokalemia."],"source":"Pharmacology L2-L4 slides (treatment of hypertension)","items":["q168","q169","q170","q171","q172","q173","q174","q326"],"sec":[{"id":"pharm-vasodilators","title":"Direct vasodilators","key":["Nitroprusside: arterioles and veins, nitric oxide; metabolized by red cells releasing cyanide (to thiocyanate); half-life about 2 minutes, continuous infusion; for emergencies, severe heart failure, controlled hypotension.","Hydralazine: arterioles, uncertain mechanism; headache, palpitations, flushing; immunological lupoid syndrome (up to 20% at very high doses).","Minoxidil: arteriolar K+ channel opener, a prodrug; salt and water retention, tachycardia, hypertrichosis; also used for baldness.","Diazoxide: K+ channel opener without diuresis (lacks a sulfonamide group); salt and water retention, hyperglycemia; for hypertensive emergencies.","Fenoldopam: IV D1 agonist, renal and mesenteric vasodilation and natriuresis; reflex tachycardia, raised intraocular pressure, low potassium; contraindicated in angina, glaucoma and hypokalemia."]}]},"bio-lipids-chd":{"title":"Blood lipids and coronary heart disease","unit":"Biochemistry","points":["Total blood cholesterol comes from diet and endogenous synthesis and is carried by lipoproteins, especially LDL and HDL.","CHD risk rises with total and LDL cholesterol; high HDL-cholesterol is associated with decreased risk.","Diet control lowers TC and LDL-C by 10-20%; statins lower them by 30-40%."],"source":"Biochemistry L5 slides (diet fat and CHD)","items":["q175","q366","q367","q368","q369"],"sec":[{"id":"bio-lipids-chd","title":"Blood lipids and coronary heart disease","key":["Total blood cholesterol comes from diet and endogenous synthesis and is carried by lipoproteins, especially LDL and HDL.","CHD risk rises with total and LDL cholesterol; high HDL-cholesterol is associated with decreased risk.","Diet control lowers TC and LDL-C by 10-20%; statins lower them by 30-40%."]}]},"bio-fats":{"title":"Types of dietary fat and their effects","unit":"Biochemistry","points":["Saturated fats (no double bonds; dairy, meat, coconut and palm oils) raise TC and LDL-C and CHD risk.","Monounsaturated fats (one double bond; olive oil, oleic acid, omega-9) lower TC and LDL-C and raise HDL-C when substituted for saturated fats.","Omega-6 fats (first double bond at carbon 6 from the methyl end; corn, sesame, cottonseed, sunflower oils) lower TC and LDL-C but also lower HDL-C and are proinflammatory.","Omega-3 fats suppress arrhythmia, reduce blood triacylglycerol, decrease thrombosis and inflammation, with little effect on LDL-C and HDL-C.","Trans fats are chemically unsaturated but behave like saturated fats: they raise LDL-C and lower HDL-C; formed by partial hydrogenation of vegetable oils (margarine)."],"source":"Biochemistry L5 slides (diet fat and CHD)","items":["q176","q177","q178","q179","q180","q181","q182","q183","q184","q185","q360","q361","q362","q363","q364","q365"],"sec":[{"id":"bio-fats","title":"Types of dietary fat and their effects","key":["Saturated fats (no double bonds; dairy, meat, coconut and palm oils) raise TC and LDL-C and CHD risk.","Monounsaturated fats (one double bond; olive oil, oleic acid, omega-9) lower TC and LDL-C and raise HDL-C when substituted for saturated fats.","Omega-6 fats (first double bond at carbon 6 from the methyl end; corn, sesame, cottonseed, sunflower oils) lower TC and LDL-C but also lower HDL-C and are proinflammatory.","Omega-3 fats suppress arrhythmia, reduce blood triacylglycerol, decrease thrombosis and inflammation, with little effect on LDL-C and HDL-C.","Trans fats are chemically unsaturated but behave like saturated fats: they raise LDL-C and lower HDL-C; formed by partial hydrogenation of vegetable oils (margarine)."]}]},"bio-cholesterol-sterols":{"title":"Dietary cholesterol, plant sterols and cholesterol-lowering factors","unit":"Biochemistry","points":["Dietary cholesterol is found only in animal products; its effect on blood cholesterol is less important than the amount and type of fatty acids.","Plant sterols reduce LDL-cholesterol by inhibiting intestinal absorption of cholesterol.","Dietary factors that decrease blood cholesterol: omega-6 PUFA, MUFA, antioxidants (beta carotene, vitamins E and C), plant sterols, vegetable fiber, large-dose vitamin B3."],"source":"Biochemistry L5 slides (diet fat and CHD)","items":["q186","q187"],"sec":[{"id":"bio-cholesterol-sterols","title":"Dietary cholesterol, plant sterols and cholesterol-lowering factors","key":["Dietary cholesterol is found only in animal products; its effect on blood cholesterol is less important than the amount and type of fatty acids.","Plant sterols reduce LDL-cholesterol by inhibiting intestinal absorption of cholesterol.","Dietary factors that decrease blood cholesterol: omega-6 PUFA, MUFA, antioxidants (beta carotene, vitamins E and C), plant sterols, vegetable fiber, large-dose vitamin B3."]}]},"bio-ros":{"title":"Free radicals, ROS and RNS","unit":"Biochemistry","points":["Oxidative stress: an imbalance favoring oxidants and/or disfavoring antioxidants, potentially leading to damage.","A free radical is a molecule with an unpaired electron in an outer valence shell; it plucks an electron from the nearest molecule.","ROS radicals: superoxide, hydroxyl, peroxyl. ROS non-radicals: hydrogen peroxide, hypochlorous acid, ozone.","RNS radicals: nitric oxide, nitrogen dioxide. RNS non-radical: peroxynitrite.","Endogenous sources: electron leak from the respiratory chain, oxidases (xanthine oxidase), prostaglandin synthesis, NO from arginine, phagocytosis. Exogenous: drug metabolism (halothane, cytochrome P450), ionizing radiation, cigarette smoke."],"source":"Biochemistry L6 slides (oxidative stress)","items":["q188","q189","q190","q191"],"sec":[{"id":"bio-ros","title":"Free radicals, ROS and RNS","key":["Oxidative stress: an imbalance favoring oxidants and/or disfavoring antioxidants, potentially leading to damage.","A free radical is a molecule with an unpaired electron in an outer valence shell; it plucks an electron from the nearest molecule.","ROS radicals: superoxide, hydroxyl, peroxyl. ROS non-radicals: hydrogen peroxide, hypochlorous acid, ozone.","RNS radicals: nitric oxide, nitrogen dioxide. RNS non-radical: peroxynitrite.","Endogenous sources: electron leak from the respiratory chain, oxidases (xanthine oxidase), prostaglandin synthesis, NO from arginine, phagocytosis. Exogenous: drug metabolism (halothane, cytochrome P450), ionizing radiation, cigarette smoke."]}]},"bio-burst-no":{"title":"Respiratory burst, nitric oxide and antioxidants","unit":"Biochemistry","points":["Respiratory burst: NADPH oxidase converts O2 to superoxide; superoxide dismutase makes H2O2; myeloperoxidase converts H2O2 and chloride to hypochlorous acid, which kills bacteria.","NO is a free radical gas with a half-life of seconds, made from L-arginine by NO synthase.","eNOS and nNOS are constitutive and make low levels of NO; iNOS (macrophages, neutrophils; induced by bacterial toxins, TNF, cytokines) makes large amounts for hours or days.","eNOS-derived NO improves vascular dilation and perfusion; nitroglycerin is metabolized to NO and relieves coronary spasm in angina.","Enzymatic antioxidants: superoxide dismutase, catalase, glutathione peroxidase. Nutrient antioxidants: vitamins A, E, C, selenium. Metabolic: glutathione, ceruloplasmin, albumin, transferrin, ferritin, uric acid."],"source":"Biochemistry L6 slides (oxidative stress)","items":["q192","q193","q194","q195","q196","q352","q353","q354","q355","q356"],"sec":[{"id":"bio-burst-no","title":"Respiratory burst, nitric oxide and antioxidants","key":["Respiratory burst: NADPH oxidase converts O2 to superoxide; superoxide dismutase makes H2O2; myeloperoxidase converts H2O2 and chloride to hypochlorous acid, which kills bacteria.","NO is a free radical gas with a half-life of seconds, made from L-arginine by NO synthase.","eNOS and nNOS are constitutive and make low levels of NO; iNOS (macrophages, neutrophils; induced by bacterial toxins, TNF, cytokines) makes large amounts for hours or days.","eNOS-derived NO improves vascular dilation and perfusion; nitroglycerin is metabolized to NO and relieves coronary spasm in angina.","Enzymatic antioxidants: superoxide dismutase, catalase, glutathione peroxidase. Nutrient antioxidants: vitamins A, E, C, selenium. Metabolic: glutathione, ceruloplasmin, albumin, transferrin, ferritin, uric acid."]}]},"bio-oxldl":{"title":"Oxidized LDL and the stages of atherosclerosis","unit":"Biochemistry","points":["Free radicals oxidize LDL cholesterol; oxidized LDL triggers inflammation and plaque buildup.","Stages: endothelial dysfunction, LDL retention and oxidation in the intima, recruitment of monocytes and T cells by VCAM-1, ICAM-1 and MCP-1, foam cell formation (fatty streak), SMC migration and fibrous cap, necrotic core and calcification, rupture or erosion with thrombosis.","Macrophages engulf oxidized LDL via scavenger receptors and become lipid-laden foam cells.","Failure to clear dead macrophages and SMCs (impaired efferocytosis) enlarges an acellular necrotic core."],"source":"Biochemistry L6 slides (oxidative stress)","items":["q197","q198","q199","q357","q358","q359"],"sec":[{"id":"bio-oxldl","title":"Oxidized LDL and the stages of atherosclerosis","key":["Free radicals oxidize LDL cholesterol; oxidized LDL triggers inflammation and plaque buildup.","Stages: endothelial dysfunction, LDL retention and oxidation in the intima, recruitment of monocytes and T cells by VCAM-1, ICAM-1 and MCP-1, foam cell formation (fatty streak), SMC migration and fibrous cap, necrotic core and calcification, rupture or erosion with thrombosis.","Macrophages engulf oxidized LDL via scavenger receptors and become lipid-laden foam cells.","Failure to clear dead macrophages and SMCs (impaired efferocytosis) enlarges an acellular necrotic core."]}]},"micro-ie-types":{"title":"Infective endocarditis: classification and organisms","unit":"Microbiology","points":["IE: infection of the endocardium and its valves (native or prosthetic) with septic vegetations; left-sided in over 95% of cases.","Acute IE: rapid (hours to days), mostly healthy valves, severe symptoms; S. aureus, S. pyogenes; mitral and aortic valves.","Subacute IE: slow (weeks to months), preexisting valve disease, low-grade fever, weight loss; viridans streptococci, enterococci, HACEK.","Prosthetic valve IE: early (within 12 months, intraoperative contamination) or late; mostly S. epidermidis and S. aureus.","IV drug use IE: mainly the tricuspid valve; S. aureus, Pseudomonas aeruginosa, Candida."],"source":"Microbiology L3 slides (infective endocarditis)","items":["q200","q201","q202","q203","q204","q396","q397"],"sec":[{"id":"micro-ie-types","title":"Infective endocarditis: classification and organisms","key":["IE: infection of the endocardium and its valves (native or prosthetic) with septic vegetations; left-sided in over 95% of cases.","Acute IE: rapid (hours to days), mostly healthy valves, severe symptoms; S. aureus, S. pyogenes; mitral and aortic valves.","Subacute IE: slow (weeks to months), preexisting valve disease, low-grade fever, weight loss; viridans streptococci, enterococci, HACEK.","Prosthetic valve IE: early (within 12 months, intraoperative contamination) or late; mostly S. epidermidis and S. aureus.","IV drug use IE: mainly the tricuspid valve; S. aureus, Pseudomonas aeruginosa, Candida."]}]},"micro-organisms":{"title":"Specific organisms and their associations","unit":"Microbiology","points":["S. aureus: most common overall, IV drug users and healthcare-associated IE; acute, rapid valve destruction.","Streptococcus bovis is associated with colorectal carcinoma or GI lesions.","Enterococcus faecalis: elderly and hospital-acquired IE, after genitourinary or gastrointestinal procedures.","HACEK (Haemophilus, Aggregatibacter, Cardiobacterium hominis, Eikenella corrodens, Kingella): slow-growing fastidious Gram-negative bacilli of pharyngeal flora; subacute IE with negative cultures unless special media are used.","Cardiac device IE (pacemaker, ICD) usually comes from skin contamination at implantation; mostly staphylococci."],"source":"Microbiology L3 slides (infective endocarditis)","items":["q205","q206","q207","q399"],"sec":[{"id":"micro-organisms","title":"Specific organisms and their associations","key":["S. aureus: most common overall, IV drug users and healthcare-associated IE; acute, rapid valve destruction.","Streptococcus bovis is associated with colorectal carcinoma or GI lesions.","Enterococcus faecalis: elderly and hospital-acquired IE, after genitourinary or gastrointestinal procedures.","HACEK (Haemophilus, Aggregatibacter, Cardiobacterium hominis, Eikenella corrodens, Kingella): slow-growing fastidious Gram-negative bacilli of pharyngeal flora; subacute IE with negative cultures unless special media are used.","Cardiac device IE (pacemaker, ICD) usually comes from skin contamination at implantation; mostly staphylococci."]}]},"micro-patho":{"title":"Pathophysiology of infective endocarditis","unit":"Microbiology","points":["IE needs endothelial injury, bacteremia and microbial adherence leading to vegetation formation.","Damaged valvular endothelium collects platelets and fibrin, forming a sterile microthrombus (sterile vegetation).","Adherence factors: S. aureus clumping factor and fibronectin-binding protein; viridans streptococci dextran; E. faecalis teichoic acid; Gram-negatives pili.","Vegetations contain fibrin, platelets, bacteria and inflammatory cells; they are friable and embolize, and the bacteria are protected from phagocytes and antibiotics.","Consequences: valve destruction with regurgitation and heart failure, septic emboli with infarcts or abscesses, immune complex glomerulonephritis and vasculitis."],"source":"Microbiology L3 slides (infective endocarditis)","items":["q208","q209","q390","q391"],"sec":[{"id":"micro-patho","title":"Pathophysiology of infective endocarditis","key":["IE needs endothelial injury, bacteremia and microbial adherence leading to vegetation formation.","Dam
