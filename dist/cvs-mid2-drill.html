rse identify as the most common?","o":["Myocardial infarction","Hypertension","Anemia","Hyperthyroidism"],"c":0,"w":"Heart failure is the inability of the heart to provide a cardiac output that keeps pace with the body's demand; it may be left, right or biventricular. The most common cause is a heart attack (myocardial infarction), followed by working against increased afterload, as in hypertension or aortic valve stenosis. (Physiology L8 slides (cardiac output))","x":{"1":"Hypertension causes failure by raising afterload; it is listed second, after myocardial infarction.","2":"Anemia increases cardiac output; it is not listed as a common cause of failure.","3":"Hyperthyroidism increases cardiac output; it is not listed as a common cause of failure."},"m":{"1":"puts afterload causes first"},"lp":false,"k":"phys-co-measure","src":"materials","kind":"Teaching and statements"},{"id":"q72","u":"Physiology","t":"mc","q":"A client with coronary artery disease begins an exercise program. How does the heart meet its extra oxygen demand during exercise?","o":["By increasing coronary blood flow, because extraction is already 60-70% at rest","By raising oxygen extraction from 25% to 70%","By switching to anaerobic glycolysis","By parasympathetic vasodilation of the coronary arteries"],"c":0,"w":"Cardiac muscle is packed with mitochondria (up to 40% of the cell) and works by aerobic metabolism, so at rest it already extracts 60-70% of the oxygen delivered, compared with about 25% in other tissues. Because little extra can be extracted, more oxygen can reach the heart only by increasing coronary blood flow. This is why narrowed coronaries cause symptoms on effort. (Physiology L9 slides (coronary circulation), slide exercise)","x":{"1":"25% is the extraction of other tissues; the heart already extracts 60-70% at rest.","2":"The heart turns to anaerobic glycolysis only in ischemia, producing lactic acid.","3":"Parasympathetic influences on coronary vessels are minor and only weakly vasodilatory."},"m":{"1":"thinks the heart can raise extraction a lot"},"lp":true,"k":"phys-coronary-flow","src":"materials","kind":"Apply a fact"},{"id":"q73","u":"Physiology","t":"tf","q":"A nurse states that resting coronary blood flow is about 225-250 mL/min, about 5% of cardiac output.","o":["True","False"],"c":0,"w":"True. Coronary blood flow in humans at rest is about 225-250 ml/minute, about 5% of the cardiac output. (Physiology L9 slides (coronary circulation))","x":{"1":"This statement is true: about 225-250 mL/min, 5% of cardiac output."},"m":{},"lp":false,"k":"phys-coronary-flow","src":"materials","kind":"Apply a fact"},{"id":"q74","u":"Physiology","t":"mc","q":"A client with stable angina asks why the chest pain happens. Which metabolic change during ischemia contributes to cardiac pain?","o":["Anaerobic glycolysis forms lactic acid","Increased oxidation of free fatty acids","Increased mitochondrial oxygen use","Storage of extra glucose in cardiac muscle"],"c":0,"w":"The heart normally uses mainly free fatty acids, and to a lesser extent glucose and lactate, by aerobic metabolism. In ischemic (anaerobic) conditions it derives energy from anaerobic glycolysis, which forms lactic acid, one of the causes of cardiac pain. (Physiology L9 slides (coronary circulation))","x":{"1":"Free fatty acids are the heart's main fuel under normal aerobic conditions.","2":"Ischemia means oxygen supply is short, so aerobic mitochondrial metabolism falls.","3":"Storing glucose is not a change the heart makes in ischemia."},"m":{"1":"thinks FFA use causes pain"},"lp":false,"k":"phys-coronary-flow","src":"materials","kind":"Teaching and statements"},{"id":"q75","u":"Physiology","t":"mc","q":"A nurse explains to a student why the left ventricle receives most of its coronary blood flow during diastole. Which explanation is accurate?","o":["The contracting left ventricle compresses its coronary vessels, and the open aortic valve partly blocks their entrance.","Aortic pressure is lowest during systole.","The pressure gradient from aorta to left ventricle is larger in systole than in diastole.","The right ventricle compresses the left coronary vessels during systole."],"c":0,"w":"During systole the powerful left ventricle squeezes the coronary arteries running through its wall, and the open aortic valve partially blocks the coronary openings. The LV pressure (121 mmHg) even slightly exceeds aortic pressure (120), so the gradient is about -1 mmHg. In diastole the LV pressure is 0 and the gradient is 80 mmHg, so most LV flow occurs then. (Physiology L9 slides (coronary circulation))","x":{"1":"Aortic pressure is highest in systole (120 mmHg on the slide).","2":"In systole the LV pressure (121) slightly exceeds the aorta (120), so the gradient is -1 mmHg; in diastole it is 80.","3":"The compression comes from the powerful left ventricle's own muscle."},"m":{"1":"reverses aortic pressure timing","2":"reverses the LV pressure gradient"},"lp":false,"k":"phys-phasic-flow","src":"materials","kind":"Teaching and statements"},{"id":"q76","u":"Physiology","t":"mc","q":"A nurse reviews why myocardial infarction most often begins in one part of the heart. Which region is most prone to ischemic damage?","o":["The subendocardial layer of the left ventricle","The right ventricular myocardium","The right atrial wall","All layers of the heart equally"],"c":0,"w":"During systole blood flow to the subendocardial surface of the left ventricle almost stops, because the contracting LV wall compresses the vessels most at its inner layer. This region therefore depends on diastole for its supply, is prone to ischemic damage and is the most common site of myocardial infarction. (Physiology L9 slides (coronary circulation))","x":{"1":"Right ventricular flow is not much affected in systole because the aorta-RV gradient stays high (95 mmHg).","2":"The pressure gradient from the aorta to the right atrium is larger in systole, so flow there is preserved.","3":"Flow is not equal; the LV subendocardium loses almost all flow in systole."},"m":{"1":"thinks the RV is most at risk"},"lp":false,"k":"phys-phasic-flow","src":"materials","kind":"Apply a fact"},{"id":"q77","u":"Physiology","t":"mc","q":"A client with a heart rate of 150 beats/min complains of chest tightness. Which explanation should the nurse give for reduced coronary blood flow in tachycardia?","o":["Diastole becomes shorter, so there is less time for coronary flow.","Systole becomes shorter, so the vessels are compressed less and flow rises.","Aortic diastolic pressure rises with heart rate.","Parasympathetic activity constricts the coronary arteries."],"c":0,"w":"Most left ventricular coronary flow occurs in diastole. When the heart rate increases, the diastolic period is shortened, so coronary blood flow to the heart is reduced, which can produce ischemic chest tightness. (Physiology L9 slides (coronary circulation))","x":{"1":"Tachycardia shortens diastole, and that is when most LV flow occurs.","2":"A LOW aortic diastolic pressure reduces coronary flow; rate does not raise it as an explanation here.","3":"Parasympathetic influences on coronary vessels are minor and weakly vasodilatory."},"m":{"1":"thinks tachycardia improves coronary flow"},"lp":false,"k":"phys-phasic-flow","src":"materials","kind":"Apply a fact"},{"id":"q78","u":"Physiology","t":"sata","q":"A nurse reviews conditions that reduce blood flow to the left ventricle. Which conditions decrease left ventricular coronary flow? Select all that apply.","o":["Aortic stenosis","Low aortic diastolic pressure","Tachycardia","Increased local adenosine","Increased local CO2 and H+"],"c":[0,1,2],"w":"In aortic stenosis the left ventricular pressure is very high in systole and compresses the coronary arteries more. A low aortic diastolic pressure lowers the driving pressure for coronary flow. Tachycardia shortens diastole, when most LV flow occurs. Metabolites such as adenosine, CO2 and H+ do the opposite and dilate coronary vessels. (Physiology L9 slides (coronary circulation))","x":{"3":"Adenosine is a coronary vasodilator that increases flow.","4":"Increased CO2 and H+ cause coronary vasodilation and increase flow."},"m":{"3":"thinks metabolites constrict coronaries","4":"thinks metabolites constrict coronaries"},"lp":false,"k":"phys-phasic-flow","src":"materials","kind":"Apply a fact"},{"id":"q79","u":"Physiology","t":"sata","q":"A nurse caring for a client with myocardial ischemia reviews local factors that dilate the coronary arteries. Which factors cause coronary vasodilation? Select all that apply.","o":["Lack of oxygen","Increased local CO2","Increased local H+","Adenosine formed from ATP","Increased local K+","Increased local oxygen","Direct alpha-adrenergic stimulation"],"c":[0,1,2,3,4],"w":"Coronary blood flow shows considerable autoregulation driven by local metabolism. Lack of oxygen and increased local CO2, H+, K+, lactate, prostaglandins, adenosine and adenine nucleotides all dilate coronary vessels. Adenosine, formed from ATP during cardiac metabolic activity, is singled out as a coronary vasodilator. (Physiology L9 slides (coronary circulation), slide note (NOTE))","x":{"5":"It is the LACK of oxygen that dilates coronary vessels.","6":"Alpha-adrenergic stimulation causes coronary vasoconstriction."},"m":{"5":"reverses the hypoxia effect","6":"thinks alpha stimulation dilates coronaries"},"lp":true,"k":"phys-coronary-control","src":"materials","kind":"Apply a fact"},{"id":"q80","u":"Physiology","t":"mc","q":"A client's sympathetic activity rises during exercise and the coronary arteries dilate. Which mechanism explains this dilation in the intact body?","o":["Beta-1 stimulation raises heart rate and contractility, releasing vasodilator metabolites.","Direct stimulation of coronary alpha receptors","Simultaneous parasympathetic vasodilation","A fall in myocardial metabolism"],"c":0,"w":"Sympathetic nerves release norepinephrine, which acts on beta-1 receptors to increase heart rate and force of contraction. The extra work releases vasodilator metabolites, so coronary vessels dilate. This indirect effect wins in the intact body. The direct effect on coronary arteries is vasoconstriction, seen when beta blockers remove the inotropic and chronotropic effects. In shock, this preserves heart flow while other organs are compromised. (Physiology L9 slides (coronary circulation), slide exercise)","x":{"1":"The direct effect of noradrenergic stimulation on coronary arteries is vasoconstriction.","2":"Parasympathetic influences are minor and only weakly vasodilatory.","3":"Metabolism rises with sympathetic stimulation; that rise produces the vasodilator metabolites."},"m":{"1":"thinks the direct sympathetic effect dilates"},"lp":true,"k":"phys-coronary-control","src":"materials","kind":"Teaching and statements"},{"id":"q81","u":"Physiology","t":"tf","q":"A nurse states that the direct effect of noradrenergic stimulation on the coronary arteries is vasodilation.","o":["True","False"],"c":1,"w":"False. The DIRECT effect is vasoconstriction (alpha receptors), seen when beta-adrenergic blockers remove the increase in heart rate and contractility. The vasodilation seen in the intact body is indirect, through vasodilator metabolites. (Physiology L9 slides (coronary circulation))","x":{"0":"The direct noradrenergic effect is vasoconstriction; dilation is indirect."},"m":{"0":"thinks the direct sympathetic effect dilates"},"lp":false,"k":"phys-coronary-control","src":"materials","kind":"Apply a fact"},{"id":"q82","u":"Physiology","t":"sata","q":"A client describes chest discomfort to the nurse. Which features are typical of angina pectoris? Select all that apply.","o":["Tightness or pain in the middle of the chest lasting a few minutes","Pain radiating to the inner side of the left arm","Pain precipitated by effort","Pain relieved by rest","ST-segment elevation in the respective leads","At least 75% of the coronary lumen blocked by thrombus"],"c":[0,1,2,3],"w":"In ischemic heart disease (angina pectoris) coronary flow is reduced by atherosclerotic plaque. The client feels retrosternal tightness or pain for a few minutes, often radiating to the inner side of the left arm; it is brought on by effort and relieved by rest. MI is different: a thrombus blocks at least 75% of the lumen. (Physiology L9 slides (coronary circulation))","x":{"4":"ST elevation is the ECG change of myocardial infarction.","5":"This describes myocardial infarction."},"m":{"4":"mixes up angina and MI ECG changes","5":"mixes up angina and MI"},"lp":false,"k":"phys-ihd","src":"materials","kind":"Apply a fact"},{"id":"q83","u":"Physiology","t":"mc","q":"A client with chest pain has a 12-lead ECG. Which finding should the nurse report as consistent with myocardial infarction rather than angina?","o":["ST-segment elevation in the leads facing the affected area","ST-segment depression in the leads facing the affected area","A PR interval of 0.24 s","A QRS wider than 0.12 s"],"c":0,"w":"The ECG distinguishes the two: in ischemic heart disease the ST segment is depressed in the respective leads, as on a treadmill test with horizontal ST depression; in myocardial infarction the ST segment is elevated in the respective leads. Cardiac enzymes, echocardiography, stress tests and angiography complete the work-up. (Physiology L9 slides (coronary circulation), slide note (NOTE))","x":{"1":"ST depression is the ECG change of ischemic heart disease (angina), as on an exercise test.","2":"A PR above 0.20 s is first-degree AV block.","3":"A wide QRS indicates an impulse starting in a ventricle."},"m":{"1":"mixes up angina and MI ECG changes"},"lp":true,"k":"phys-ihd","src":"materials","kind":"Recognize and interpret"},{"id":"q84","u":"Physiology","t":"sata","q":"A nurse screens a client for ischemic heart disease. Which findings are risk factors? Select all that apply.","o":["Cigarette smoking","Hypertension","Diabetes mellitus","Increased cholesterol","Lack of exercise","High HDL-cholesterol","Anemia"],"c":[0,1,2,3,4],"w":"The listed risk factors for ischemic heart disease are cigarette smoking, hypertension, diabetes mellitus, increased lipids (cholesterol) and other factors such as lack of exercise and anxiety. HDL is the exception among lipids: high HDL lowers coronary risk. (Physiology L9 slides (coronary circulation); HDL point from Biochemistry L5 slides)","x":{"5":"High HDL-cholesterol is associated with a DECREASED risk of coronary heart disease.","6":"Anemia is listed as a cause of increased cardiac output, not as an IHD risk factor."},"m":{"5":"thinks all cholesterol raises risk"},"lp":false,"k":"phys-ihd","src":"materials","kind":"Recognize and interpret"},{"id":"q85","u":"Pathology","t":"mc","q":"A client with a deep vein thrombosis of the left leg has a swollen limb that is dusky reddish-blue. How should the nurse interpret this color change?","o":["Congestion from impaired venous outflow with deoxygenated blood","Hyperemia from active arteriolar dilation","Ischemia from deficient arterial supply","Infarction from arterial occlusion"],"c":0,"w":"Congestion is a passive process caused by impaired venous outflow, such as a DVT. Red cells stagnate and deoxygenated venous blood accumulates, so the tissue turns dusky reddish-blue (cyanosis). Hyperemia is the opposite: an active arteriolar dilation that fills tissue with oxygenated blood and makes it red. Sudden complete venous obstruction also causes rapid edema and hemorrhage. (Pathology L1 slides (hemodynamic disorders I))","x":{"1":"Hyperemia makes tissue red (erythema) from oxygenated blood, not reddish-blue.","2":"Ischemia is deficient ARTERIAL supply; DVT obstructs venous outflow.","3":"Infarction is ischemic necrosis; the color described is the stasis of congestion."},"m":{"1":"mixes up hyperemia and congestion","2":"mixes up arterial and venous obstruction"},"lp":false,"k":"path-congestion","src":"materials","kind":"Recognize and interpret"},{"id":"q86","u":"Pathology","t":"sata","q":"A nurse is teaching about increased local blood volume. Which situations are examples of hyperemia? Select all that apply.","o":["Acute inflammation","Skeletal muscle during exercise","The gut following a meal","Blushing of the face","Deep vein thrombosis of the leg","Twisting of an ovarian pedicle","Pulmonary veins in left ventricular failure"],"c":[0,1,2,3],"w":"Hyperemia is active: arterioles dilate and more blood flows in, as in acute inflammation, exercising skeletal muscle, the gut after a meal and blushing. Congestion is passive: venous outflow is impaired, as with DVT, a twisted ovarian pedicle or left ventricular failure backing up into the pulmonary veins. (Pathology L1 slides (hemodynamic disorders I))","x":{"4":"DVT causes acute localized congestion.","5":"A twisted pedicle obstructs venous outflow: acute localized congestion.","6":"This is chronic localized (pulmonary) congestion."},"m":{"4":"mixes up hyperemia and congestion","5":"mixes up hyperemia and congestion"},"lp":false,"k":"path-congestion","src":"materials","kind":"Teaching and statements"},{"id":"q87","u":"Pathology","t":"mc","q":"A client with chronic left ventricular failure has sputum containing macrophages filled with hemosiderin. What are these cells called?","o":["Heart failure cells","Anitschkow cells","Foam cells","Aschoff bodies"],"c":0,"w":"In chronic pulmonary congestion, from chronic left ventricular failure or mitral stenosis, the alveolar capillaries are engorged. Fluid leaks into the alveoli (pulmonary edema) and capillaries rupture so red cells enter the alveoli. Alveolar macrophages phagocytose and degrade the red cells, becoming hemosiderin-laden heart failure cells. Long-standing congestion adds interstitial fibrosis: brown induration of the lung. (Pathology L1 slides (hemodynamic disorders I))","x":{"1":"Anitschkow (caterpillar) cells are cardiac histiocytes inside Aschoff bodies of rheumatic fever.","2":"Foam cells are lipid-filled macrophages and smooth muscle cells in atherosclerotic lesions.","3":"Aschoff bodies are the pathognomonic lesions of acute rheumatic fever."},"m":{"1":"mixes up heart failure cells and Anitschkow cells","2":"mixes up heart failure cells and foam cells"},"lp":false,"k":"path-congestion","src":"materials","kind":"Apply a fact"},{"id":"q88","u":"Pathology","t":"order","q":"A client has long-standing mitral stenosis. Arrange the changes of chronic pulmonary congestion in the order they develop.","o":["Congestion of the alveolar capillaries","Transudation of fluid and passage of red cells into the alveoli","Phagocytosis and degradation of the red cells by macrophages","Hemosiderin-laden macrophages (heart failure cells) appear","Fibrosis of the interstitium and alveolar septa (brown induration)"],"c":[0,1,2,3,4],"w":"Chronic left ventricular failure or mitral stenosis backs blood up into the alveolar capillaries. Fluid transudes into the alveoli and ruptured capillaries let red cells through; macrophages engulf and degrade the red cells and become hemosiderin-laden heart failure cells. With long-standing congestion, the interstitium and alveolar septa become fibrotic, giving brown induration of the lung. (Pathology L1 slides (hemodynamic disorders I))","x":{},"m":{},"lp":false,"k":"path-congestion","src":"materials","kind":"Apply a fact"},{"id":"q89","u":"Pathology","t":"mc","q":"A client with chronic right-sided heart failure has dyspnea, generalized edema and congestion of several organs. Which type of congestion is this?","o":["Chronic generalized venous congestion","Acute generalized congestion","Chronic localized congestion","Acute localized congestion"],"c":0,"w":"Chronic generalized venous congestion is gradual congestion of the whole venous system, caused by chronic right-sided heart failure. Its effects are dyspnea (from pulmonary congestion), chronic venous congestion in different organs and generalized cardiac edema. Acute heart failure instead gives rapid congestion in all viscera. (Pathology L1 slides (hemodynamic disorders I))","x":{"1":"Acute generalized congestion follows ACUTE heart failure.","2":"Localized congestion affects one region, from compression of a vein or left failure in the lung.","3":"Acute localized congestion follows a sudden complete venous obstruction such as a DVT."},"m":{"1":"mixes up acute and chronic generalized congestion"},"lp":false,"k":"path-congestion","src":"materials","kind":"Apply a fact"},{"id":"q90","u":"Pathology","t":"cloze","q":"A nurse cares for several clients with edema. Match each cause to the mechanism that produces the edema.","o":{"rows":["Hypoproteinemia","Histamine release in acute inflammation","Venous congestion","Filariasis"],"choices":["Decreased plasma colloid osmotic pressure","Increased capillary permeability","Increased capillary hydrostatic pressure","Lymphatic obstruction","Increased plasma colloid osmotic pressure"]},"c":[0,1,2,3],"w":"Edema has four mechanisms. Venous congestion or sodium and water retention raise capillary hydrostatic pressure; hypoproteinemia lowers plasma colloid osmotic pressure; toxins, hypoxia and chemicals such as histamine increase capillary permeability; and lymphangitis, filariasis, tumors, irradiation fibrosis or lymph node removal obstruct lymphatics. (Pathology L1 slides (hemodynamic disorders I))","x":{"4":"A rise in colloid osmotic pressure would hold fluid in vessels; edema follows a DECREASE."},"m":{"4":"reverses the oncotic effect"},"lp":false,"k":"path-edema","src":"materials","rs":{"0":"A malnourished client with hypoproteinemia develops edema. Which mechanism should the nurse identify?","1":"A client's inflamed ankle swells as histamine is released. Which mechanism causes this edema?","2":"A client with venous congestion develops leg edema. Which mechanism causes it?","3":"A client with filariasis develops massive leg swelling. Which mechanism causes the edema?"},"kind":"Apply a fact"},{"id":"q91","u":"Pathology","t":"fill","q":"A malnourished client's labs are reviewed for nutritional edema. Edema from hypoproteinemia occurs when serum albumin falls below ____.","o":["1.5 gm%","2.5 gm%","3.5 gm%"],"c":0,"w":"Decreased plasma colloid osmotic pressure causes edema when the plasma proteins that hold fluid in the vessels fall too low. Hypoproteinemia is defined as total plasma proteins below 2.5 gm% or serum albumin below 1.5 gm%; the resulting generalized edema is called nutritional edema. (Pathology L1 slides (hemodynamic disorders I))","x":{"1":"2.5 gm% is the threshold for TOTAL plasma proteins, not albumin.","2":"3.5 gm% is not the threshold given; the albumin threshold is 1.5 gm%."},"m":{"1":"mixes up albumin and total protein thresholds"},"lp":false,"k":"path-edema","src":"materials","kind":"Apply a fact"},{"id":"q92","u":"Pathology","t":"sata","q":"A nurse assesses several clients for pitting. Which clients would the nurse expect to have non-pitting edema? Select all that apply.","o":["A client with a cellulitis-related inflammatory edema","A client with lymphatic edema after lymph node removal","A client with cardiac edema from heart failure","A client with nutritional edema from hypoproteinemia","A client with obstructive venous edema"],"c":[0,1],"w":"Edema is classified by consistency. Pitting edema is seen in generalized edema (cardiac, renal and nutritional) and in obstructive venous edema. Non-pitting edema is seen in inflammatory edema and lymphatic edema. (Pathology L1 slides (hemodynamic disorders I))","x":{"2":"Cardiac edema is generalized, and generalized edema is pitting.","3":"Nutritional edema is generalized and pitting.","4":"Obstructive venous edema is pitting."},"m":{"2":"thinks generalized edema is non-pitting","4":"thinks venous edema is non-pitting"},"lp":false,"k":"path-edema","src":"materials","kind":"Recognize and interpret"},{"id":"q93","u":"Pathology","t":"tf","q":"A nurse states that lymphatic edema, such as that caused by filariasis, is typically pitting.","o":["True","False"],"c":1,"w":"False. Lymphatic edema (and inflammatory edema) is NON-pitting. Pitting edema is seen in generalized edema and obstructive venous edema. (Pathology L1 slides (hemodynamic disorders I))","x":{"0":"Lymphatic edema is non-pitting."},"m":{"0":"thinks lymphatic edema pits"},"lp":false,"k":"path-edema","src":"materials","kind":"Apply a fact"},{"id":"q94","u":"Pathology","t":"tf","q":"A nurse explains that sudden occlusion of an artery in an organ with good collateral circulation may produce no effect.","o":["True","False"],"c":0,"w":"True. In acute ischemia, organs with good collateral circulation show no effect, while organs with poor collateral circulation undergo infarction. (Pathology L1 slides (hemodynamic disorders I))","x":{"1":"This statement is true: good collaterals can prevent damage."},"m":{},"lp":false,"k":"path-ischemia-infarct","src":"materials","kind":"Teaching and statements"},{"id":"q95","u":"Pathology","t":"mc","q":"A client develops a pulmonary infarct after a pulmonary embolism. Which appearance should the nurse expect the infarct to have?","o":["A red (hemorrhagic) infarct","A white (anemic) infarct","A septic infarct","No infarct, because arterial occlusion never causes infarction in the lung"],"c":0,"w":"Infarcts are red when blood can seep into the necrotic area: with venous occlusion, in loose tissues like the lung, in tissues with a dual circulation (lung, liver, small intestine) and after reperfusion. White infarcts occur where arterial occlusion hits a dense solid organ with end-arterial circulation, which limits seepage of blood. (Pathology L1 slides (hemodynamic disorders I))","x":{"1":"White infarcts occur in solid organs with end-arterial circulation such as heart, spleen and kidney.","2":"A septic infarct is classified by infection, not color; nothing here suggests infection.","3":"Pulmonary infarction does occur, e.g. medium emboli in a congested lung."},"m":{"1":"thinks lung infarcts are white"},"lp":false,"k":"path-ischemia-infarct","src":"materials","kind":"Recognize and interpret"},{"id":"q96","u":"Pathology","t":"sata","q":"A nurse reviews infarct types. Which situations typically produce a red (hemorrhagic) infarct? Select all that apply.","o":["Venous occlusion of the ovary","Infarction of the lung","Infarction of the small intestine","Reperfusion after angioplasty of an occluded artery","Arterial occlusion in the kidney","Arterial occlusion in the spleen","Coronary arterial occlusion in the heart"],"c":[0,1,2,3],"w":"Red infarcts form where blood can enter the dead tissue: venous occlusion (ovary, testis), loose tissue (lung), dual blood supply (lung, liver, small intestine) and restored flow to a previously occluded site after angioplasty. Heart, spleen and kidney are dense end-arterial organs that give white infarcts. (Pathology L1 slides (hemodynamic disorders I))","x":{"4":"The kidney is a solid organ with end-arterial circulation: white infarct.","5":"The spleen gives a white (anemic) infarct.","6":"The heart gives a white (anemic) infarct."},"m":{"4":"thinks solid-organ infarcts are red","5":"thinks solid-organ infarcts are red"},"lp":false,"k":"path-ischemia-infarct","src":"materials","kind":"Apply a fact"},{"id":"q97","u":"Pathology","t":"mc","q":"A client has an infarct of the testis. Which cause should the nurse recognize as most likely for an infarct in this organ?","o":["Venous thrombosis, because the testis has a single venous outflow","Arterial occlusion in an organ with a dual blood supply","Chronic ischemia from gradual atherosclerosis with good collaterals","Septic embolism from a lung abscess"],"c":0,"w":"Almost all infarcts (99%) come from thrombosis or embolism, usually arterial. Venous thrombosis causes infarcts mainly in organs with a single venous outflow, such as the testis and ovary, because there is no alternative drainage route once that vein is blocked. (Pathology L1 slides (hemodynamic disorders I))","x":{"1":"Dual circulation describes the lung, liver and small intestine, not the testis.","2":"Good collaterals prevent damage; this would not produce an infarct.","3":"Nothing suggests infection; infection defines a septic infarct, not the usual testicular infarct."},"m":{},"lp":false,"k":"path-ischemia-infarct","src":"materials","kind":"Recognize and interpret"},{"id":"q98","u":"Pathology","t":"tf","q":"A nurse states that white (anemic) infarcts typically occur in the lung because of its dual circulation.","o":["True","False"],"c":1,"w":"False. The lung, with its loose tissue and dual circulation, gives RED (hemorrhagic) infarcts. White infarcts occur with arterial occlusion in solid organs with end-arterial circulation: heart, spleen and kidney. (Pathology L1 slides (hemodynamic disorders I))","x":{"0":"The lung gives red infarcts; white infarcts are heart, spleen and kidney."},"m":{"0":"thinks lung infarcts are white"},"lp":false,"k":"path-ischemia-infarct","src":"materials","kind":"Apply a fact"},{"id":"q99","u":"Pathology","t":"sata","q":"A nurse is assessing a postoperative client for thrombosis risk. Which factors make up Virchow's triad? Select all that apply.","o":["Endothelial injury or dysfunction","Stasis or turbulence of blood flow","Hypercoagulability of blood","Increased capillary permeability","Lymphatic obstruction","Active arteriolar dilation"],"c":[0,1,2],"w":"Thrombosis is inappropriate activation of normal hemostasis, which is regulated by the vessel wall, platelets and coagulation factors. Virchow's triad names the three primary causes: endothelial injury or dysfunction, alterations in normal blood flow (stasis or turbulence) and hypercoagulability of the blood. (Pathology L2 slides (hemodynamic disorders II))","x":{"3":"Increased capillary permeability is a mechanism of edema.","4":"Lymphatic obstruction is a mechanism of edema.","5":"Arteriolar dilation is hyperemia."},"m":{"3":"mixes up edema and thrombosis mechanisms","4":"mixes up edema and thrombosis mechanisms"},"lp":false,"k":"path-virchow","src":"materials","kind":"Apply a fact"},{"id":"q100","u":"Pathology","t":"sata","q":"A nurse reviews a client's history for ACQUIRED causes of hypercoagulability. Which findings apply? Select all that apply.","o":["Prolonged bed rest","Oral contraceptive use","Disseminated cancer","Recent surgery","Smoking","Factor V gene mutation","Antithrombin III deficiency since birth"],"c":[0,1,2,3,4],"w":"Hypercoagulability means more coagulation proteins or fewer natural anticoagulants. Hereditary causes include mutations of the factor V and prothrombin genes and antithrombin III deficiency. Acquired causes include prolonged bed rest or immobilization, tissue damage (surgery, burns), hyperestrogenic states (pregnancy, oral contraceptives), disseminated cancer, smoking and DIC. (Pathology L2 slides (hemodynamic disorders II))","x":{"5":"A factor V gene mutation is a HEREDITARY cause.","6":"Inherited antithrombin III deficiency is a HEREDITARY cause."},"m":{"5":"mixes up hereditary and acquired hypercoagulability","6":"mixes up hereditary and acquired hypercoagulability"},"lp":false,"k":"path-virchow","src":"materials","kind":"Recognize and interpret"},{"id":"q101","u":"Pathology","t":"mc","q":"A client with long-standing hypertension has endothelial dysfunction. Which change in the endothelium favors thrombosis?","o":["Decreased production of thrombomodulin and nitric oxide","Increased production of antithrombin III","Decreased production of von Willebrand factor","Increased production of plasminogen activator"],"c":0,"w":"Hemodynamic stress such as hypertension, trauma, inflammation, atherosclerosis or hyperlipidemia makes the endothelium dysfunctional. A dysfunctional endothelium produces more procoagulants (thromboplastin, vWF, PAI) and fewer anticoagulants (thrombomodulin, antithrombin III, NO, PA). If the endothelium is lost, exposed matrix lets vWF bind platelets and activates the coagulation cascade. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Antithrombin III is an anticoagulant; dysfunction DECREASES it.","2":"vWF is a procoagulant; dysfunction INCREASES it.","3":"Plasminogen activator (PA) is anticoagulant; dysfunction DECREASES it."},"m":{"1":"reverses the endothelial effect","2":"reverses the endothelial effect","3":"reverses the endothelial effect"},"lp":false,"k":"path-virchow","src":"materials","kind":"Apply a fact"},{"id":"q102","u":"Pathology","t":"mc","q":"A client with varicose veins asks why sluggish blood flow causes clots. Which explanation by the nurse is accurate?","o":["Slow flow reduces the inflow of fresh blood carrying natural anticoagulants and delays removal of platelet clumps.","Slow flow mechanically tears the endothelium.","Slow flow increases plasma colloid osmotic pressure.","Slow flow lowers the concentration of coagulation proteins."],"c":0,"w":"Stasis, mainly in veins with obstruction such as varicose veins, reduces the inflow of fresh blood that carries natural anticoagulants and retards the removal of small platelet aggregates. Turbulence (aneurysms, mitral stenosis, atrial fibrillation) instead injures endothelial cells. Both stasis and turbulence activate procoagulant secretion and bring platelets and leukocytes into contact with the endothelium. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Mechanical injury to endothelium is the effect of TURBULENCE, not stasis.","2":"Colloid osmotic pressure relates to edema, not to how stasis causes thrombosis.","3":"Lower coagulation proteins would reduce, not increase, clotting."},"m":{"1":"mixes up stasis and turbulence effects"},"lp":false,"k":"path-virchow","src":"materials","kind":"Teaching and statements"},{"id":"q103","u":"Pathology","t":"tf","q":"A nurse states that arterial thrombosis is more common than venous thrombosis because arterial blood flows rapidly.","o":["True","False"],"c":1,"w":"False. Venous thrombi are the MOST common type. Arterial thrombosis is LESS common precisely because of the rapid blood flow and the thick elastic arterial wall that resists injury. (Pathology L2 slides (hemodynamic disorders II), slide exercise)","x":{"0":"Venous thrombi are most common; rapid arterial flow protects arteries."},"m":{"0":"thinks arterial thrombi are most common"},"lp":true,"k":"path-thrombus-types","src":"materials","kind":"Apply a fact"},{"id":"q104","u":"Pathology","t":"mc","q":"A client is recovering from hip surgery and has a deep vein thrombosis in the femoral vein. Which complication should the nurse monitor for most closely?","o":["Embolization to the lungs causing pulmonary infarction","Embolization to the brain causing a stroke","Fat embolism syndrome","Cholesterol emboli to the kidney"],"c":0,"w":"Deep vein thrombi form in the popliteal, femoral and iliac veins, mainly through stasis and hypercoagulability after surgery or immobility. Their important complication is embolization to the lungs: about 95% of pulmonary emboli come from DVT, causing pulmonary infarction, hemorrhage or sudden death depending on size. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Systemic emboli to the brain come from the left heart or arteries; venous emboli reach the lungs unless there is a septal defect.","2":"Fat embolism follows long bone fracture, not venous thrombosis.","3":"Cholesterol emboli come from ruptured atheromatous plaques."},"m":{"1":"sends venous emboli to the systemic circulation"},"lp":false,"k":"path-thrombus-types","src":"materials","kind":"Priority / first action"},{"id":"q105","u":"Pathology","t":"cloze","q":"A nurse reviews clients with cardiac thrombi. Match each type of cardiac thrombus to its usual setting.","o":{"rows":["Auricular thrombus","Mural thrombus","Vegetations"],"choices":["Left atrial appendage in mitral stenosis","Left ventricular wall over a myocardial infarct","Heart valves in rheumatic fever, SLE or bacterial endocarditis","Popliteal vein after surgery"]},"c":[0,1,2],"w":"Cardiac thrombi form in chambers and on valves. In mitral stenosis, stasis in the dilated left atrium produces an auricular thrombus over the appendage. Over a myocardial infarct, the damaged left ventricular endocardium carries a mural thrombus. On valves, thrombi appear as vegetations in rheumatic fever, systemic lupus erythematosus and bacterial endocarditis. (Pathology L2 slides (hemodynamic disorders II))","x":{"3":"The popliteal vein is a site of deep vein thrombosis, not a cardiac thrombus."},"m":{"3":"confuses venous and cardiac thrombi"},"lp":false,"k":"path-thrombus-types","src":"materials","rs":{"0":"A client with mitral stenosis has an auricular thrombus. Where should the nurse expect it to form?","1":"A client recovering from a myocardial infarction develops a mural thrombus. Where does it form?","2":"A client's echocardiogram shows vegetations. Where are these thrombi located?"},"kind":"Apply a fact"},{"id":"q106","u":"Pathology","t":"mc","q":"A client's old thrombus is examined and shows ingrowth of endothelial cells, smooth muscle cells and fibroblasts with new capillary channels. Which fate of a thrombus is this?","o":["Organization and recanalization","Dissolution","Propagation","Embolization"],"c":0,"w":"Thrombi have four fates. Recent thrombi can dissolve by fibrinolysis. They can propagate, adding platelets and fibrin and forming a tail that is liable to detach. They can embolize. Older thrombi become organized by ingrowth of endothelial cells, smooth muscle cells and fibroblasts, and capillary channels form that re-establish the lumen (recanalization). (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Dissolution is rapid shrinkage and disappearance of a RECENT thrombus by fibrinolysis.","2":"Propagation is growth of the thrombus by adding platelets and fibrin, forming a tail.","3":"Embolization is detachment of the thrombus from the vessel wall."},"m":{"1":"mixes up dissolution and organization"},"lp":false,"k":"path-thrombus-types","src":"materials","kind":"Apply a fact"},{"id":"q107","u":"Pathology","t":"mc","q":"A nurse explains why a growing thrombus with a long tail is dangerous. What happens during propagation?","o":["The thrombus adds platelets and fibrin, forming a tail that is more liable to detach and embolize.","Fibrinolysis shrinks the thrombus until it disappears.","Fibroblasts grow in and form new channels through it.","The thrombus becomes infected and produces pyemia."],"c":0,"w":"Propagation means the thrombus keeps accumulating platelets and fibrin. The tail that forms is more liable to detach, so propagation sets up embolization. Infected venous thrombi (thrombophlebitis) are the source of septic emboli that produce pyemia. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"That is dissolution.","2":"That is organization and recanalization.","3":"Septic thrombi produce pyemia when they embolize; that is not propagation."},"m":{"1":"mixes up propagation and dissolution"},"lp":false,"k":"path-thrombus-types","src":"materials","kind":"Teaching and statements"},{"id":"q108","u":"Pathology","t":"mc","q":"A client on bed rest after surgery suddenly develops dyspnea, and pulmonary embolism is suspected. Which is the most likely source of the embolus?","o":["A thrombus in the deep veins of the legs","A mural thrombus in the left ventricle","An ulcerated atheromatous plaque in the aorta","Vegetations on the mitral valve"],"c":0,"w":"A pulmonary embolus starts in a systemic vein and lodges in the pulmonary arteries. In 95% of cases it originates from deep vein thrombi of the legs, and it is seen in up to 25-30% of patients with DVT. Emboli from the left heart or arteries travel instead to systemic organs. (Pathology L2 slides (hemodynamic disorders II), slide note (why venous thrombi are most common))","x":{"1":"Left heart thrombi enter the systemic circulation, giving systemic emboli.","2":"Aortic plaques give systemic or cholesterol emboli, not pulmonary emboli.","3":"Mitral vegetations embolize into the systemic arterial circulation."},"m":{"1":"sends left-heart emboli to the lungs"},"lp":true,"k":"path-embolism","src":"materials","kind":"Recognize and interpret"},{"id":"q109","u":"Pathology","t":"tf","q":"A nurse teaching about deep vein thrombosis states that about 95% of pulmonary emboli originate from thrombi in the deep veins of the legs.","o":["True","False"],"c":0,"w":"True. In 95% of cases pulmonary emboli originate from deep vein thrombi of the legs, and pulmonary embolism is observed in up to 25-30% of patients with DVT. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"This statement is true: 95% of pulmonary emboli come from leg DVT."},"m":{},"lp":false,"k":"path-embolism","src":"materials","kind":"Teaching and statements"},{"id":"q110","u":"Pathology","t":"cloze","q":"A nurse reviews the outcomes of pulmonary embolism by embolus size. Match each embolus to its usual outcome.","o":{"rows":["Large saddle embolus at the pulmonary bifurcation","Medium embolus in a normal lung","Medium embolus in a congested lung","Small repeated emboli over time"],"choices":["Sudden death from acute right-sided failure","Pulmonary hemorrhage only","Pulmonary infarction","Pulmonary hypertension and cor pulmonale","Clinically silent with no effect ever"]},"c":[0,1,2,3],"w":"The effect of a pulmonary embolus depends on its size and on the lung. 60-80% are small and clinically silent. A large saddle embolus at the bifurcation or in a main pulmonary artery causes sudden death from acute right-sided failure. A medium embolus causes only hemorrhage in a normal lung, but infarction in a congested lung. Small repeated emboli cause pulmonary hypertension and right-sided failure (cor pulmonale). (Pathology L2 slides (hemodynamic disorders II))","x":{"4":"60-80% of emboli are small and silent, but none of these listed emboli is silent."},"m":{},"lp":false,"k":"path-embolism","src":"materials","rs":{"0":"A client collapses from a saddle embolus at the pulmonary bifurcation. Which outcome should the nurse anticipate?","1":"A client with healthy lungs has a medium-sized pulmonary embolus. Which outcome is expected?","2":"A client with heart failure and lung congestion has a medium pulmonary embolus. Which outcome is expected?","3":"A client has had small pulmonary emboli repeatedly for years. Which long-term outcome should the nurse anticipate?"},"kind":"Apply a fact"},{"id":"q111","u":"Pathology","t":"mc","q":"A client recovering from a large anterior myocardial infarction develops a cold, pulseless leg. Which source of the arterial embolus is most likely?","o":["An intracardiac thrombus over the infarcted left ventricular wall","A deep vein thrombus of the leg","A fat embolus from bone marrow","An amniotic fluid embolus"],"c":0,"w":"Systemic emboli travel in the arterial circulation. About 80% arise from intracardiac thrombi, two thirds of which are associated with left ventricular wall infarcts. Others come from aortic aneurysms, ulcerated atheromatous plaques or paradoxical emboli. About 75% lodge in the lower extremities and 10% in the brain. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Leg vein thrombi travel to the lungs unless they pass through a septal defect.","2":"Fat emboli follow long bone fractures.","3":"Amniotic fluid embolism occurs during delivery."},"m":{"1":"sends venous emboli to the systemic circulation"},"lp":false,"k":"path-systemic-emboli","src":"materials","kind":"Apply a fact"},{"id":"q112","u":"Pathology","t":"mc","q":"A client with an interatrial septal defect and a known leg DVT suddenly develops stroke symptoms. Which type of embolism best explains this?","o":["Paradoxical embolism","Pulmonary thromboembolism","Fat embolism","Atheroembolism"],"c":0,"w":"A paradoxical embolus begins as a venous embolus, but instead of reaching the lungs it crosses an interatrial or interventricular defect into the systemic circulation. A leg vein thrombus can therefore reach the brain in a client with a septal defect. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"A pulmonary embolus lodges in the lung, not the brain.","2":"Fat embolism follows long bone fracture or soft tissue trauma.","3":"Atheroembolism discharges debris from a ruptured arterial plaque."},"m":{"1":"sends a crossed embolus to the lungs"},"lp":false,"k":"path-systemic-emboli","src":"materials","kind":"Teaching and statements"},{"id":"q113","u":"Pathology","t":"mc","q":"Two days after a femoral shaft fracture, a client becomes tachypneic, dyspneic, tachycardic and confused, and labs show thrombocytopenia and anemia. Which condition should the nurse suspect?","o":["Fat embolism syndrome","Air embolism","Amniotic fluid embolism","Cholesterol embolism"],"c":0,"w":"Fat embolism occurs in about 90% of people with severe skeletal injuries, most commonly long bone fractures, but fewer than 10% develop clinical findings. The syndrome begins 1-3 days after injury with tachypnea, dyspnea and tachycardia, neurologic symptoms, and thrombocytopenia and anemia. Fat globules obstruct vessels mechanically and free fatty acids injure endothelium and activate platelets; it is fatal in 5-15%. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Air embolism follows entry of more than 100 cc of air, as in neck vein or chest wall injury.","2":"Amniotic fluid embolism occurs during delivery.","3":"Cholesterol emboli come from atheromatous plaques."},"m":{"1":"mixes up fat and air emboli"},"lp":false,"k":"path-systemic-emboli","src":"materials","kind":"Recognize and interpret"},{"id":"q114","u":"Pathology","t":"sata","q":"A nurse reviews situations that carry a risk of air embolism. Which situations apply? Select all that apply.","o":["Injury to large neck veins","Chest wall injury","Laparoscopic procedures","Air trapped in a coronary artery during bypass surgery","Decompression sickness","Fracture of a long bone","Tear in the placental membranes","Rupture of an atheromatous plaque"],"c":[0,1,2,3,4],"w":"Gas bubbles in the circulation coalesce into frothy masses that obstruct flow and cause distal ischemia. Causes include injury to large neck veins, chest wall injury, obstetric or laparoscopic procedures, air trapped in a coronary artery during bypass surgery, and decompression sickness (Caisson disease). (Pathology L2 slides (hemodynamic disorders II), slide exercise (decompression sickness))","x":{"5":"Long bone fracture is the most common cause of FAT embolism.","6":"This lets amniotic fluid enter the maternal circulation: amniotic fluid embolism.","7":"Plaque rupture discharges cholesterol debris: atheroembolism."},"m":{"5":"mixes up fat and air emboli"},"lp":true,"k":"path-systemic-emboli","src":"materials","kind":"Apply a fact"},{"id":"q115","u":"Pathology","t":"tf","q":"A nurse states that more than 100 cc of air is required to have a clinical effect in the pulmonary circulation.","o":["True","False"],"c":0,"w":"True. Air embolism needs more than 100 cc of air to produce a clinical effect in the pulmonary circulation. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"This statement is true: more than 100 cc of air is needed."},"m":{},"lp":false,"k":"path-systemic-emboli","src":"materials","kind":"Apply a fact"},{"id":"q116","u":"Pathology","t":"mc","q":"During delivery, a client suddenly develops severe dyspnea, cyanosis, shock and a seizure, followed by bleeding from IV sites. Which condition should the nurse suspect?","o":["Amniotic fluid embolism","Fat embolism syndrome","Pulmonary thromboembolism from a DVT","Air embolism from a neck vein injury"],"c":0,"w":"Amniotic fluid or fetal tissue can enter the maternal circulation through a tear in the placental membranes or ruptured uterine veins. It causes sudden severe dyspnea, cyanosis and shock, neurologic impairment (headache, seizures, coma), pulmonary edema and DIC. It is rare (1 in 40,000 deliveries) but has 80% mortality, and 85% of survivors keep a neurologic deficit. (Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Fat embolism begins 1-3 days after a long bone fracture.","2":"PE from DVT does not explain the seizure and DIC at delivery.","3":"There is no neck vein injury; air embolism needs over 100 cc of air."},"m":{"1":"mixes up amniotic and fat emboli"},"lp":false,"k":"path-systemic-emboli","src":"materials","kind":"Recognize and interpret"},{"id":"q117","u":"Pathology","t":"mc","q":"A 14-year-old girl is brought to the physician because of a 1-week history of malaise and chest pain. Three weeks ago, she had a sore throat that resolved without treatment. Her temperature is 38.7°C (101.7°F). Examination shows several subcutaneous nodules on her elbows and wrist bilaterally and a new-onset early systolic murmur best heard at the apex in the left lateral position. An endomyocardial biopsy is most likely to show which of the following?","o":["Fibrinoid necrosis with histiocytic infiltrate","Coagulative necrosis with neutrophilic infiltrate","Deposits of misfolded protein aggregates","Myocardial infiltration with eosinophilic proteins","Fibrosis with myofibrillar disarray"],"c":0,"w":"A sore throat 3 weeks earlier, fever, subcutaneous nodules and a new apical murmur fit acute rheumatic fever. Its pathognomonic microscopic lesion is the Aschoff body, found in all layers of the heart: foci of necrosis with T lymphocytes and Anitschkow cells, which are activated macrophages (cardiac histiocytes). The valve vegetations overlie foci of fibrinoid necrosis. A biopsy therefore shows fibrinoid necrosis with a histiocytic infiltrate. (The slide's word \"endomysial\" is corrected here to endomyocardial.) (Pathology L3 slides (rheumatic fever), in-class case)","x":{"1":"This pattern is not the lesion of rheumatic carditis, which is the Aschoff body (focal necrosis, T lymphocytes and Anitschkow histiocytes).","2":"Misfolded protein deposits are not part of the rheumatic lesion described in ARF.","3":"Eosinophilic protein infiltration is not part of the rheumatic lesion described in ARF.","4":"Fibrosis follows healing in chronic disease; myofibrillar disarray is not part of the ARF lesion."},"m":{"1":"expects infarct-type necrosis in ARF"},"lp":true,"k":"path-arf","src":"materials","kind":"Apply a fact"},{"id":"q118","u":"Pathology","t":"mc","q":"A 9-year-old boy from Eritrea is admitted to the hospital for lethargy and increased work of breathing. He has had recurrent episodes of fever, shortness of breath, and fatigue over the past 3 years. His pulse is 132/min and blood pressure is 90/66 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 82%. Auscultation of the chest shows coarse crackles in both lungs and a diastolic murmur at the cardiac apex. Despite appropriate lifesaving measures, he dies. A photomicrograph of a section of myocardium obtained at autopsy is shown. Which of the following is the most likely underlying cause of this patient's cardiac disease?","o":["Type II hypersensitivity reaction","Amastigote infiltration","Exotoxin-mediated myonecrosis","Caseating granulomatous inflammation"],"c":0,"w":"Recurrent febrile episodes, pulmonary congestion and an apical diastolic murmur (mitral stenosis) in a child from an endemic area point to rheumatic heart disease, and the autopsy section shows Aschoff bodies. The disease is immunologically mediated: antibodies and CD4+ T cells raised against streptococcal M proteins cross-react with self antigens in the heart. Antibodies binding tissue antigens activate complement and recruit macrophages, which is a type II (antibody-mediated) hypersensitivity reaction; the slide states the antibody cross-reaction but not the term \"type II\". (Pathology L3 slides (rheumatic fever), in-class case)","x":{"1":"Amastigote infiltration means direct parasitic invasion of the myocardium, not the antibody cross-reaction of rheumatic heart disease.","2":"Rheumatic carditis is not caused by a toxin; it is caused by antibodies and T cells cross-reacting with heart antigens.","3":"Caseating granulomas are not the lesion of rheumatic heart disease; the Aschoff body is."},"m":{"2":"thinks strep toxin damages the heart directly"},"lp":true,"k":"path-arf","src":"materials","kind":"Apply a fact"},{"id":"q119","u":"Pathology","t":"mc","q":"A group of epidemiologists is studying the rates of cardiac surgeries performed in several Southeast Asian countries compared to the United States. Results show a significant increase in the number of mitral valve replacements performed in Vietnam in adults aged 30–50 years compared to the same age group in the United States. Which of the following public health interventions is most likely to decrease this number?","o":["Prompt antibiotic treatment for bacterial pharyngitis","Improved access to drug rehabilitation centers","Genetic screening program for FBN1 gene mutation","Childhood vaccination against Corynebacterium diphtheriae","Screening echocardiography for prolapsed anterior mitral valve leaflets"],"c":0,"w":"Mitral valve replacement in young adults in a developing country points to chronic rheumatic heart disease, which follows group A streptococcal pharyngitis by decades. The incidence and mortality of rheumatic fever fell over the past century because of better socioeconomic conditions and rapid diagnosis and treatment of strep pharyngitis. Prompt antibiotic treatment prevents the immune reaction and therefore the valve scarring. (Pathology L3 slides (rheumatic fever), in-class case)","x":{"1":"Drug rehabilitation addresses IV drug use endocarditis, which mainly affects the tricuspid valve.","2":"FBN1 mutation screening is unrelated to rheumatic valve disease, the cause described here.","3":"Diphtheria vaccination does not prevent group A streptococcal pharyngitis.","4":"Screening finds valve disease; it does not prevent rheumatic scarring."},"m":{"1":"links mitral disease to IV drug use"},"lp":true,"k":"path-arf","src":"materials","kind":"Apply a fact"},{"id":"q120","u":"Pathology","t":"mc","q":"A nurse takes the history of a child with suspected acute rheumatic fever. Which history is most consistent with the diagnosis?","o":["An 8-year-old with a sore throat caused by group A streptococci 3 weeks ago","A 40-year-old with a sore throat 3 weeks ago","An 8-year-old with a sore throat 2 days ago","An 8-year-old with a group A streptococcal skin infection 6 months ago"],"c":0,"w":"Acute rheumatic fever appears 10 days to 6 weeks after group A beta-hemolytic streptococcal pharyngitis, develops in about 3% of infected patients and is most common in children aged 5-15. The delay reflects the time needed for antibodies and T cells against streptococcal M proteins to form and cross-react with heart antigens. (Pathology L3 slides (rheumatic fever))","x":{"1":"ARF occurs most often in children aged 5-15.","2":"ARF appears 10 days to 6 weeks after the pharyngitis, not within 2 days.","3":"ARF follows streptococcal PHARYNGITIS by 10 days to 6 weeks."},"m":{"1":"ignores the age pattern","2":"ignores the latent period"},"lp":false,"k":"path-arf","src":"materials","kind":"Recognize and interpret"},{"id":"q121","u":"Pathology","t":"mc","q":"A pathology report on a child's heart describes macrophages with abundant cytoplasm and a central nucleus whose chromatin forms a slender wavy ribbon. What are these cells?","o":["Anitschkow cells","Heart failure cells","Foam cells","T lymphocytes"],"c":0,"w":"Anitschkow cells (caterpillar cells) are cardiac histiocytes: macrophages with abundant cytoplasm and central round to oval nuclei whose chromatin condenses into a slender wavy ribbon. Together with focal necrosis and T lymphocytes they form the Aschoff body, the pathognomonic lesion of acute rheumatic fever found in all layers of the heart. (Pathology L3 slides (rheumatic fever))","x":{"1":"Heart failure cells are hemosiderin-laden alveolar macrophages in chronic pulmonary congestion.","2":"Foam cells are lipid-filled cells in atherosclerotic lesions.","3":"T lymphocytes are also in the Aschoff body, but they lack the caterpillar chromatin pattern."},"m":{"1":"mixes up heart failure cells and Anitschkow cells","2":"mixes up foam cells and Anitschkow cells"},"lp":false,"k":"path-arf","src":"materials","kind":"Apply a fact"},{"id":"q122","u":"Pathology","t":"mc","q":"A nurse auscultates a pericardial friction rub in a child with acute rheumatic fever. Which pericardial lesion is expected?","o":["Fibrinous \"bread and butter\" pericarditis","Vegetations along the lines of valve closure","Brown induration","A mural thrombus"],"c":0,"w":"Acute rheumatic fever causes a pancarditis with Aschoff bodies in all layers. In the pericardium it causes fibrinous inflammation, the \"bread and butter\" pericarditis that produces a friction rub. The myocardium shows myocarditis and the valves show small vegetations along the lines of closure. (Pathology L3 slides (rheumatic fever))","x":{"1":"Vegetations are the lesion of rheumatic ENDOcarditis, on the valves.","2":"Brown induration is fibrosis of the lung in chronic congestion.","3":"A mural thrombus forms in the left ventricle over an infarct."},"m":{"1":"puts valve lesions in the pericardium"},"lp":false,"k":"path-arf","src":"materials","kind":"Recognize and interpret"},{"id":"q123","u":"Pathology","t":"mc","q":"A child's echocardiogram during acute rheumatic fever shows small vegetations along the lines of valve closure. Which valve is most commonly affected?","o":["Mitral valve","Aortic valve","Tricuspid valve","Pulmonary valve"],"c":0,"w":"Rheumatic vegetations are small, lie along the lines of closure and overlie foci of fibrinoid necrosis. They favor the high-pressure valves: mitral (65%) and aortic (25%). Chronic rheumatic heart disease follows the same pattern, with the mitral valve most affected. (Pathology L3 slides (rheumatic fever))","x":{"1":"The aortic valve is second (25%).","2":"The tricuspid valve is typical of IV drug use endocarditis, not rheumatic fever.","3":"The pulmonary valve is not among the most common sites."},"m":{"1":"ranks aortic first","2":"confuses RHD with IVDU endocarditis"},"lp":false,"k":"path-arf","src":"materials","kind":"Apply a fact"},{"id":"q124","u":"Pathology","t":"sata","q":"A nurse reviews a child's findings using the Jones criteria. Which findings are MAJOR criteria? Select all that apply.","o":["Carditis","Migratory polyarthritis","Sydenham chorea","Erythema marginatum","Subcutaneous nodules","Fever","Arthralgia","Prolonged PR interval"],"c":[0,1,2,3,4],"w":"The Jones major criteria are carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum and subcutaneous nodules. The minor criteria are fever, arthralgia, previous rheumatic fever, laboratory evidence of inflammation (ESR, CRP, leukocytosis) and ECG changes (prolonged PR interval). (Pathology L3 slides (rheumatic fever))","x":{"5":"Fever is a minor criterion.","6":"Arthralgia (joint pain without arthritis) is a minor criterion.","7":"A prolonged PR interval is a minor criterion."},"m":{"5":"mixes up major and minor Jones criteria","6":"mixes up arthritis and arthralgia","7":"mixes up major and minor Jones criteria"},"lp":false,"k":"path-jones","src":"materials","kind":"Recognize and interpret"},{"id":"q125","u":"Pathology","t":"mc","q":"A child has Sydenham chorea, fever and a raised ESR, and the streptococcal antibody titer is elevated. How should the nurse interpret these findings using the Jones criteria?","o":["The criteria are met: 1 major and 2 minor criteria with evidence of preceding strep infection.","The criteria are not met because 2 major criteria are always required.","The criteria are not met because chorea is a minor criterion.","The criteria are met even without evidence of streptococcal infection."],"c":0,"w":"Acute rheumatic fever is diagnosed with 2 major criteria, or 1 major and 2 minor criteria, supported by evidence of a preceding group A streptococcal infection (positive throat culture or rapid antigen test, or a raised or rising antibody titer). Chorea is major; fever and a raised ESR are minor; the elevated titer is the supporting evidence. (Pathology L3 slides (rheumatic fever))","x":{"1":"Diagnosis needs 2 major OR 1 major plus 2 minor criteria.","2":"Sydenham chorea is a MAJOR criterion.","3":"The criteria must be supported by evidence of preceding group A strep infection; here the titer supplies it."},"m":{"1":"forgets the 1 major + 2 minor rule","2":"mixes up major and minor Jones criteria"},"lp":false,"k":"path-jones","src":"materials","kind":"Recognize and interpret"},{"id":"q126","u":"Pathology","t":"tf","q":"A nurse tells a family that the migratory polyarthritis of acute rheumatic fever typically leaves chronic joint deformities.","o":["True","False"],"c":1,"w":"False. Migratory (\"fleeting\") polyarthritis of the large joints is self-limited and leaves NO chronic deformities. The lasting damage of rheumatic fever is to the heart valves. (Pathology L3 slides (rheumatic fever))","x":{"0":"The arthritis is self-limited with no chronic deformities."},"m":{"0":"thinks rheumatic arthritis deforms joints"},"lp":false,"k":"path-jones","src":"materials","kind":"Apply a fact"},{"id":"q127","u":"Pathology","t":"sata","q":"A client has long-standing rheumatic mitral stenosis. Which consequences should the nurse anticipate? Select all that apply.","o":["Left atrial dilatation with possible thrombi","Chronic venous congestion of the lungs","Pulmonary hypertension","Chronic right-sided heart failure","Atrial fibrillation","Marked left ventricular dilatation"],"c":[0,1,2,3,4],"w":"A fibrotic \"fish mouth\" mitral valve obstructs flow from the left atrium, which dilates and may harbor thrombi that embolize. Back pressure causes chronic pulmonary venous congestion, lung fibrosis, pulmonary hypertension and eventually chronic right-sided failure. Atrial fibrillation, thromboembolism and infective endocarditis complicate it. The left ventricle, upstream of nothing that is blocked, is largely unaffected. (Pathology L3 slides (rheumatic fever))","x":{"5":"The left ventricle is largely unaffected by isolated pure mitral stenosis."},"m":{"5":"thinks mitral stenosis enlarges the LV"},"lp":false,"k":"path-rhd","src":"materials","kind":"Recognize and interpret"},{"id":"q128","u":"Pathology","t":"tf","q":"A nurse explains that chronic rheumatic heart disease usually becomes clinically manifest decades after the episode of acute rheumatic fever.","o":["True","False"],"c":0,"w":"True. ARF endocarditis heals by fibrosis, repeated infections reactivate it, and the chronic valve scarring usually becomes clinically manifest after decades. (Pathology L3 slides (rheumatic fever))","x":{"1":"This statement is true: RHD usually appears decades later."},"m":{},"lp":false,"k":"path-rhd","src":"materials","kind":"Teaching and statements"},{"id":"q129","u":"Pathology","t":"cloze","q":"A nurse reviews vessel biopsy reports. Match each pattern of arteriosclerosis to its description.","o":{"rows":["Atherosclerosis","Mönckeberg medial sclerosis","Hyaline arteriolosclerosis","Hyperplastic arteriolosclerosis"],"choices":["Intimal atheromas that protrude into the lumen","Calcific deposits in muscular arteries after age 50","Arteriolar wall thickened by amorphous proteinaceous material","\"Onion-skinning\" of the arteriolar wall","Fatty spots of foam cells under 1 mm"]},"c":[0,1,2,3],"w":"Arteriosclerosis means thickening and loss of elasticity of arterial walls, in three patterns. Atherosclerosis, the most frequent and important, forms intimal atheromas. Mönckeberg medial sclerosis lays down calcific deposits in muscular arteries of people over 50. Arteriolosclerosis affects small arteries and arterioles in hypertension and diabetes: the hyaline type deposits amorphous protein in the wall, and the hyperplastic type shows onion-skinning that narrows the lumen. (Pathology L4 slides (atherosclerosis))","x":{"4":"Fatty spots are the earliest lesion OF atherosclerosis, not a separate pattern."},"m":{},"lp":false,"k":"path-arteriosclerosis","src":"materials","rs":{"0":"A biopsy shows intimal atheromas protruding into an artery's lumen. Which pattern of arteriosclerosis is this?","1":"A 70-year-old client's report describes calcific deposits in the media of muscular arteries. Which pattern is this?","2":"A diabetic client's renal biopsy shows arterioles thickened by amorphous proteinaceous material. Which pattern is this?","3":"A biopsy from a client with severe hypertension shows onion-skinning of arterioles. Which pattern is this?"},"kind":"Apply a fact"},{"id":"q130","u":"Pathology","t":"tf","q":"A nurse explains that Mönckeberg medial sclerosis mainly affects arterioles in clients with hypertension.","o":["True","False"],"c":1,"w":"False. Mönckeberg medial sclerosis is calcific deposits in MUSCULAR ARTERIES in people older than 50. The pattern that affects small arteries and arterioles in hypertension and diabetes is arteriolosclerosis. (Pathology L4 slides (atherosclerosis))","x":{"0":"Mönckeberg affects muscular arteries; arteriolosclerosis affects arterioles."},"m":{"0":"mixes up Mönckeberg and arteriolosclerosis"},"lp":false,"k":"path-arteriosclerosis","src":"materials","kind":"Teaching and statements"},{"id":"q131","u":"Pathology","t":"sata","q":"A nurse counsels a client about atherosclerosis risk. Which risk factors can the client modify? Select all that apply.","o":["Hypercholesterolemia","Hypertension","Cigarette smoking","Diabetes mellitus","Increasing age","Male gender","Family history"],"c":[0,1,2,3],"w":"Atherosclerosis risk factors are split into non-modifiable (increasing age, male gender, genetic abnormalities and family history) and modifiable (hyperlipidemia, especially hypercholesterolemia with high LDL, hypertension, cigarette smoking and diabetes mellitus). Counseling targets the modifiable ones. (Pathology L4 slides (atherosclerosis))","x":{"4":"Age is a non-modifiable risk factor.","5":"Male gender is a non-modifiable risk factor.","6":"Genetic abnormalities and family history are non-modifiable."},"m":{"4":"thinks non-modifiable factors are modifiable","5":"thinks non-modifiable factors are modifiable","6":"thinks non-modifiable factors are modifiable"},"lp":false,"k":"path-athero","src":"materials","kind":"Apply a fact"},{"id":"q132","u":"Pathology","t":"order","q":"A nurse explains how an atheroma develops according to the response-to-injury hypothesis. Arrange the steps in order.","o":["Chronic endothelial injury (hyperlipidemia, hypertension, smoking)","Endothelial dysfunction with monocyte adhesion and emigration","Smooth muscle recruitment to the intima and macrophage activation","Macrophages and smooth muscle cells engulf lipid to form foam cells (fatty streak)","Smooth muscle proliferation with collagen and ECM deposition (fibrofatty atheroma)"],"c":[0,1,2,3,4],"w":"The response-to-injury hypothesis sees atherosclerosis as a chronic inflammatory response to endothelial injury. Injury from hyperlipidemia, hypertension, smoking, homocysteine, toxins, viruses or immune reactions makes the endothelium leaky and sticky, so monocytes adhere and migrate in. Smooth muscle cells are recruited into the intima and macrophages activate; both engulf lipid as foam cells, forming a fatty streak. Smooth muscle proliferation and collagen deposition then build the fibrofatty atheroma. (Pathology L4 slides (atherosclerosis))","x":{},"m":{},"lp":false,"k":"path-athero","src":"materials","kind":"Teaching and statements"},{"id":"q133","u":"Pathology","t":"mc","q":"A biopsy of a young client's aorta shows flat yellow lesions about 1 cm long made of foam cells that do not narrow the lumen. Which lesion is this?","o":["Fatty streak","Fatty spot","Atheromatous plaque","Mönckeberg medial sclerosis"],"c":0,"w":"Atherosclerotic lesions progress from fatty spots (multiple yellow spots under 1 mm made of foam cells) to fatty streaks, where spots coalesce into elongated streaks 1 cm or longer. Streaks contain foam cells and a little extracellular lipid, are not significantly raised and do not disturb blood flow. Atheromas come later. (Pathology L4 slides (atherosclerosis))","x":{"1":"Fatty spots are smaller (less than 1 mm) and are the earliest lesion.","2":"An atheroma is a RAISED patch with a lipid core under a fibrous cap.","3":"Mönckeberg sclerosis is calcification of the media of muscular arteries."},"m":{"1":"mixes up spots and streaks","2":"calls any fatty lesion a plaque"},"lp":false,"k":"path-athero","src":"materials","kind":"Apply a fact"},{"id":"q134","u":"Pathology","t":"mc","q":"A nurse reviews the gross description of a coronary atheroma. Which description is accurate?","o":["A raised intimal patch with a soft yellow lipid core covered by a firm white fibrous cap","A flat yellow streak that does not disturb blood flow","Calcific deposits in the media of a muscular artery","A thickened arteriolar wall with onion-skinning"],"c":0,"w":"An atheroma is a raised patch within the intima with a soft, yellow core of lipid covered by a firm, white fibrous cap. Microscopically it has cells (smooth muscle cells, macrophages, other leukocytes), extracellular matrix (collagen, elastic fibers, proteoglycans) and intracellular and extracellular lipid. (Pathology L4 slides (atherosclerosis))","x":{"1":"That describes a fatty streak.","2":"That describes Mönckeberg medial sclerosis.","3":"That describes hyperplastic arteriolosclerosis."},"m":{"1":"mixes up streaks and plaques"},"lp":false,"k":"path-athero","src":"materials","kind":"Apply a fact"},{"id":"q135","u":"Pathology","t":"tf","q":"A nurse states that fatty streaks are not significantly raised and do not disturb blood flow.","o":["True","False"],"c":0,"w":"True. Fatty streaks are elongated streaks 1 cm or longer that are not significantly raised and do not cause any disturbance in blood flow. (Pathology L4 slides (atherosclerosis))","x":{"1":"This statement is true: fatty streaks are flat and do not disturb flow."},"m":{},"lp":false,"k":"path-athero","src":"materials","kind":"Apply a fact"},{"id":"q136","u":"Pathology","t":"sata","q":"A nurse reviews where atherosclerosis most often develops. Which sites are common? Select all that apply.","o":["Lower abdominal aorta","Coronary arteries","Popliteal arteries","Internal carotid arteries","Vessels of the circle of Willis","Arterioles of the kidney","Deep veins of the leg"],"c":[0,1,2,3,4],"w":"Atheromas form in large and medium arteries. The common sites listed are the lower abdominal aorta, coronary arteries, popliteal arteries, internal carotid arteries and the vessels of the circle of Willis, which explains the main consequences: ischemic heart disease, stroke, aortic aneurysm and peripheral vascular disease. (Pathology L4 slides (atherosclerosis))","x":{"5":"Arterioles are affected by arteriolosclerosis, not atherosclerosis.","6":"Leg veins are a site of deep vein thrombosis, not atherosclerosis."},"m":{"5":"mixes up atherosclerosis and arteriolosclerosis sites"},"lp":false,"k":"path-athero-complications","src":"materials","kind":"Apply a fact"},{"id":"q137","u":"Pathology","t":"mc","q":"A client with known coronary atherosclerosis suddenly develops an acute myocardial infarction. Which plaque change most likely triggered the event?","o":["Rupture or erosion of the plaque surface, which induces thrombosis","Calcification of the atheroma","Formation of a new fatty streak","Mönckeberg medial sclerosis of the artery"],"c":0,"w":"Acute plaque changes are rupture, ulceration or erosion of the luminal surface, which induces thrombosis, and fissure with hemorrhage into the plaque, which can expand or rupture it. Plaque rupture can also discharge debris (atheroembolism). Thrombosis on a ruptured coronary plaque is what turns chronic ischemic disease into infarction. (Pathology L4 slides (atherosclerosis))","x":{"1":"Calcification is a chronic change of atheromas, not the acute trigger of thrombosis.","2":"Fatty streaks are flat early lesions that do not disturb flow.","3":"Mönckeberg sclerosis is medial calcification, a separate pattern."},"m":{"1":"thinks calcification causes acute events"},"lp":false,"k":"path-athero-complications","src":"materials","kind":"Apply a fact"},{"id":"q138","u":"Pathology","t":"cloze","q":"A nurse explains the clinical consequences of atherosclerosis at different sites. Match each site to its major consequence.","o":{"rows":["Coronary arteries","Cerebral arteries","Aorta","Arteries of the lower extremity"],"choices":["Ischemic heart disease","Cerebral infarction (stroke)","Aortic aneurysm","Peripheral vascular disease with gangrene of the legs","Pulmonary infarction"]},"c":[0,1,2,3],"w":"Where an atheroma narrows or thromboses an artery decides the disease. Coronary atherosclerosis causes ischemic heart disease, cerebral atherosclerosis causes stroke, aortic atherosclerosis weakens the media and causes aneurysms, and atherosclerosis of the limb arteries causes peripheral vascular disease and gangrene. (Pathology L4 slides (atherosclerosis))","x":{"4":"Pulmonary infarction follows pulmonary embolism, usually from DVT, not atherosclerosis."},"m":{"4":"links PE to atherosclerosis"},"lp":false,"k":"path-athero-complications","src":"materials","rs":{"0":"A client has severe coronary atherosclerosis. Which clinical consequence should the nurse anticipate?","1":"A client has atherosclerosis of the cerebral arteries. Which consequence is the nurse watching for?","2":"A client has advanced aortic atherosclerosis. Which consequence should the nurse anticipate?","3":"A client has atherosclerosis of the leg arteries. Which consequence should the nurse anticipate?"},"kind":"Teaching and statements"},{"id":"q139","u":"Pharmacology","t":"mc","q":"A 52-year-old client's average blood pressure over several visits is 132/82 mm Hg. How should the nurse interpret this reading?","o":["It meets the definition of hypertension.","It is normal because hypertension starts at 140/90 mm Hg.","It is hypertension only if the systolic reading is 140 or more.","It cannot be classified without a renin level."],"c":0,"w":"Both the ACC/AHA (2023) and the Saudi Heart Association define hypertension as a blood pressure of 130/80 mm Hg or higher. A reading of 132/82 is above both numbers. Hypertension affects 1 in 3 US adults and is more common with age and obesity. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"The current definition (ACC/AHA 2023 and SHA) is 130/80 mm Hg or higher.","2":"Either value at or above 130/80 meets the definition; 132/82 exceeds both.","3":"Hypertension is defined by blood pressure, not by renin."},"m":{"1":"uses the old 140/90 threshold"},"lp":false,"k":"pharm-classes","src":"materials","kind":"Recognize and interpret"},{"id":"q140","u":"Pharmacology","t":"cloze","q":"A nurse reviews a client's antihypertensive medication list. Match each drug to its class.","o":{"rows":["Hydrochlorothiazide","Clonidine","Hydralazine","Losartan"],"choices":["Diuretic","Sympathoplegic drug","Vasodilator","Angiotensin receptor blocker (ARB)","ACE inhibitor","Renin inhibitor"]},"c":[0,1,2,3],"w":"The drug list groups antihypertensives by where they act: diuretics (hydrochlorothiazide, indapamide, furosemide, spironolactone), sympathoplegic drugs (clonidine, methyldopa, prazosin, propranolol, labetalol, esmolol), vasodilators (hydralazine, nitroprusside, minoxidil, diazoxide, fenoldopam, CCBs) and inhibitors of the renin-angiotensin system: ACE inhibitors (captopril, enalapril, enalaprilat), ARBs (losartan) and renin inhibitors (aliskiren). (Pharmacology L2-L4 slides (treatment of hypertension), drug list slide)","x":{"4":"ACE inhibitors on the list are captopril, enalapril and enalaprilat.","5":"The only renin inhibitor is aliskiren."},"m":{"4":"mixes up ARBs and ACE inhibitors"},"lp":true,"k":"pharm-classes","src":"materials","rs":{"0":"A client is started on hydrochlorothiazide for hypertension. To which drug class does it belong?","1":"A client's medication list includes clonidine. Which drug class should the nurse identify?","2":"A client receives hydralazine for blood pressure. Which drug class does it belong to?","3":"A client who could not tolerate captopril is switched to losartan. Which drug class is losartan?"},"kind":"Apply a fact"},{"id":"q141","u":"Pharmacology","t":"mc","q":"A client who has taken a thiazide for 6 weeks asks why the blood pressure stays down even though urination is back to normal. Which explanation by the nurse is accurate?","o":["Peripheral vascular resistance has fallen because body sodium depletion lowers calcium in vascular smooth muscle.","Plasma volume and cardiac output stay reduced for as long as the drug is taken.","The thiazide blocks L-type calcium channels in the arterioles.","The thiazide blocks beta-1 receptors on the heart."],"c":0,"w":"Diuretics first lower blood pressure by reducing plasma volume and cardiac output. After 4-8 weeks of therapy volume and output return toward normal, but peripheral vascular resistance falls through arteriolar vasodilation. The likely main mechanism is depletion of body Na+ stores: less Na+ in smooth muscle lowers intracellular Ca++ through the Na/Ca exchanger. Renal prostaglandins and K channel opening may also contribute. This is why diuretic efficacy does not strictly match antihypertensive efficacy. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Volume and cardiac output return toward normal after 4-8 weeks; the early effect does not persist.","2":"Blocking L-type Ca++ channels is the mechanism of calcium channel blockers.","3":"Beta-1 blockade is the mechanism of beta blockers."},"m":{"1":"thinks diuretics work only by volume loss"},"lp":false,"k":"pharm-diuretics","src":"materials","kind":"Teaching and statements"},{"id":"q142","u":"Pharmacology","t":"mc","q":"A client with chronic kidney disease has hypertension that needs a diuretic. Which diuretic class should the nurse anticipate?","o":["A loop diuretic such as furosemide","A thiazide such as hydrochlorothiazide","A potassium-sparing diuretic alone","Diazoxide"],"c":0,"w":"Thiazides and thiazide-like drugs are the first-choice antihypertensive diuretics and the most effective in patients with normal renal function. Loop diuretics are preferable only in specific situations such as malignant hypertension and concomitant chronic kidney disease. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Thiazides are first choice in patients with NORMAL renal function.","2":"Potassium-sparing diuretics are used only combined with thiazides to counteract hypokalemia.","3":"Diazoxide is a potassium channel opener that does not cause diuresis."},"m":{"1":"uses thiazides in CKD","2":"thinks K-sparing diuretics are used alone"},"lp":false,"k":"pharm-diuretics","src":"materials","kind":"Recognize and interpret"},{"id":"q143","u":"Pharmacology","t":"mc","q":"A client on hydrochlorothiazide has a low serum potassium. Which drug should the nurse anticipate being added?","o":["Spironolactone","Furosemide","Indapamide","Fenoldopam"],"c":0,"w":"Potassium-sparing diuretics are used only in combination with thiazides, to counteract the hypokalemia thiazides cause. Spironolactone is the potassium-sparing diuretic on the list and is also used for hypertension due to hyperaldosteronism. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Furosemide is a loop diuretic; it would not correct hypokalemia.","2":"Indapamide is a thiazide-like diuretic, which also lowers potassium.","3":"Fenoldopam is an IV D1 agonist that itself decreases serum potassium."},"m":{"1":"adds a K-wasting diuretic"},"lp":false,"k":"pharm-diuretics","src":"materials","kind":"Recognize and interpret"},{"id":"q144","u":"Pharmacology","t":"tf","q":"A nurse explains that the antihypertensive doses of thiazides are lower than those required for a diuretic effect.","o":["True","False"],"c":0,"w":"True. Thiazides lower blood pre
