ssure at doses lower than those needed for diuresis, another sign that they do not work only by increasing urine output. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"This statement is true: antihypertensive doses are lower than diuretic doses."},"m":{},"lp":false,"k":"pharm-diuretics","src":"materials","kind":"Teaching and statements"},{"id":"q145","u":"Pharmacology","t":"mc","q":"A client starts nifedipine for hypertension. Which change in heart rate should the nurse expect?","o":["Heart rate may increase.","Heart rate will decrease.","Heart rate will fall and AV block will develop.","Marked postural drops in heart rate will occur."],"c":0,"w":"Dihydropyridines such as nifedipine block Ca++ channels in the vessels only, so they lower peripheral resistance and heart rate (and cardiac output) may increase. Verapamil and diltiazem also block cardiac channels, so heart rate is unchanged or decreased. All CCBs lower peripheral resistance with negligible postural hypotension. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Unchanged or decreased heart rate is the pattern of verapamil and diltiazem.","2":"Bradycardia and AV block are risks of central sympatholytics and of beta blockers.","3":"Postural hypotension with CCBs is negligible."},"m":{"1":"mixes up dihydropyridine and non-dihydropyridine effects"},"lp":false,"k":"pharm-ccb","src":"materials","kind":"Recognize and interpret"},{"id":"q146","u":"Pharmacology","t":"sata","q":"A nurse reviews the pharmacology of calcium channel blockers. Which statements are accurate? Select all that apply.","o":["They bind L-type voltage-gated Ca++ channels from the inner side of the membrane.","Verapamil and diltiazem block Ca++ channels in both heart and vessels.","Dihydropyridines block Ca++ channels in the vessels only.","Their blockade can be partly reversed by beta-1 agonists.","Nicardipine has low vascular selectivity.","Short-acting nifedipine is preferred for long-term hypertension."],"c":[0,1,2,3],"w":"Calcium channel blockers bind the L-type voltage-gated Ca++ channel from the inner side of the membrane. Verapamil and diltiazem (low vascular selectivity) block channels in heart and vessels, while dihydropyridines (nifedipine high, nicardipine very high selectivity) act only on vessels. Drugs that increase Ca++ flux, such as beta-1 agonists, can partly reverse the blockade. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"4":"Nicardipine has VERY HIGH vascular selectivity; verapamil and diltiazem have low selectivity.","5":"Short-acting nifedipine has been linked to increased mortality in hypertension."},"m":{"4":"mixes up vascular selectivity of CCBs","5":"thinks short-acting nifedipine is safe"},"lp":false,"k":"pharm-ccb","src":"materials","kind":"Apply a fact"},{"id":"q147","u":"Pharmacology","t":"mc","q":"A client is admitted with a hypertensive emergency. Which calcium channel blocker should the nurse anticipate?","o":["Nicardipine","Short-acting nifedipine","Verapamil","Diltiazem"],"c":0,"w":"Calcium channel blockers are first-choice drugs in hypertension and are more effective in African patients. For hypertensive emergencies nicardipine is used. Long-term studies have linked short-acting nifedipine to increased mortality, whereas slow-release formulations apparently do not increase the risk. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Short-acting nifedipine is linked to increased mortality in hypertension.","2":"Verapamil is not the CCB named for hypertensive emergencies; it also blocks cardiac channels.","3":"Diltiazem is not the CCB named for hypertensive emergencies."},"m":{},"lp":false,"k":"pharm-ccb","src":"materials","kind":"Recognize and interpret"},{"id":"q148","u":"Pharmacology","t":"tf","q":"A nurse states that short-acting nifedipine is preferred for long-term hypertension because it lowers mortality.","o":["True","False"],"c":1,"w":"False. Long-term epidemiological studies report an INCREASED risk of mortality with short-acting nifedipine in hypertension; slow-release formulations apparently do not increase this risk. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"0":"Short-acting nifedipine is linked to increased mortality."},"m":{"0":"thinks short-acting nifedipine is safe"},"lp":false,"k":"pharm-ccb","src":"materials","kind":"Apply a fact"},{"id":"q149","u":"Pharmacology","t":"mc","q":"A client is started on aliskiren. Which laboratory pattern should the nurse expect?","o":["Decreased angiotensin II and aldosterone with increased renin concentration","Increased angiotensin II with decreased renin","Decreased renin, angiotensin II and aldosterone","Increased bradykinin with unchanged angiotensin II"],"c":0,"w":"Aliskiren, the only renin inhibitor on the market, competitively inhibits renin, the enzyme that converts angiotensinogen to angiotensin I (the rate-limiting step). Angiotensin I, angiotensin II and aldosterone fall, and with less negative feedback the renin level rises. It is usually well tolerated but can cause hyperkalemia when combined with ACE inhibitors or ARBs. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Aliskiren lowers angiotensin II; renin RISES because feedback is removed.","2":"Renin concentration increases, not decreases.","3":"Raised bradykinin is an effect of ACE inhibitors."},"m":{"1":"reverses the renin response","2":"thinks renin falls with a renin inhibitor","3":"mixes up renin and ACE inhibitors"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Recognize and interpret"},{"id":"q150","u":"Pharmacology","t":"mc","q":"A client taking captopril reports a dry, irritating cough. Which explanation should the nurse give?","o":["Accumulation of bradykinin, prostaglandins or substance P in the lungs","Accumulation of angiotensin II in the lungs","Excess aldosterone secretion","Blockade of beta-2 receptors in the airways"],"c":0,"w":"The converting enzyme both forms angiotensin II and inactivates bradykinin. Inhibiting it lowers angiotensin II and raises bradykinin. The dry, disturbing cough may be mediated by accumulation in the lungs of bradykinin and prostaglandins or, more likely, substance P. ARBs have no effect on bradykinin, which is why they are the alternative. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"ACE inhibitors DECREASE angiotensin II formation.","2":"ACE inhibitors reduce angiotensin II-driven aldosterone; aldosterone does not cause cough.","3":"Bronchoconstriction from beta blockade is a beta-blocker effect."},"m":{"1":"thinks ACE inhibitors raise angiotensin II","3":"mixes up ACE inhibitor cough and beta-blocker bronchospasm"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q151","u":"Pharmacology","t":"sata","q":"A client is started on enalapril. Which adverse effects should the nurse monitor for? Select all that apply.","o":["Hypotension after the first doses","Dry cough","Hyperkalemia","Angioedema","Renal insufficiency in bilateral renal artery stenosis","Hypokalemia","Hypertrichosis","Positive Coombs' test"],"c":[0,1,2,3,4],"w":"ACE inhibitor adverse effects follow from less angiotensin II and more bradykinin: hypotension and postural hypotension mainly after the first doses (in salt- and water-depleted or heart failure patients), dry cough, renal insufficiency in bilateral renal artery stenosis or a stenosed solitary kidney, hyperkalemia and rare but possibly fatal angioedema. They are pregnancy category D. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"5":"ACE inhibitors cause HYPERkalemia.","6":"Hypertrichosis is an adverse effect of minoxidil.","7":"A positive Coombs' test is caused by methyldopa."},"m":{"5":"reverses the potassium effect of ACE inhibitors"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q152","u":"Pharmacology","t":"mc","q":"A client who started lisinopril last week reports swelling of the lips and tongue. Which action should the nurse take first?","o":["Treat it as a potentially fatal reaction and report it immediately.","Reassure the client that this is the common ACE inhibitor cough.","Tell the client it happens only after the first dose and will settle.","Advise taking the next dose with food."],"c":0,"w":"Angioneurotic edema is a rare adverse effect of ACE inhibitors (up to 0.3%) but it may be fatal; inhibition of bradykinin metabolism may be involved. Swelling of the lips and tongue therefore needs immediate action, unlike the common dry cough. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"The cough is a different, non-dangerous adverse effect; swelling of lips and tongue is angioedema.","2":"First-dose hypotension, not angioedema, is the effect linked to initial doses.","3":"Taking the drug with food does nothing for angioedema."},"m":{"1":"confuses angioedema with ACE inhibitor cough","2":"confuses angioedema with first-dose hypotension"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Priority / first action"},{"id":"q153","u":"Pharmacology","t":"mc","q":"A client has liver disease and needs an ACE inhibitor. Which ACE inhibitor must be activated by the liver before it works?","o":["Enalapril","Captopril","Lisinopril","Enalaprilat"],"c":0,"w":"Captopril, lisinopril and enalaprilat are active drugs. All other ACE inhibitors (enalapril, benazepril, fosinopril and others) are prodrugs that the liver converts into active metabolites. Enalaprilat is also the only one given intravenously. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Captopril is an active drug and needs no activation.","2":"Lisinopril is an active drug and needs no activation.","3":"Enalaprilat is the active form of enalapril, given IV."},"m":{"1":"thinks all ACE inhibitors are prodrugs","2":"thinks all ACE inhibitors are prodrugs","3":"mixes up enalapril and enalaprilat"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q154","u":"Pharmacology","t":"mc","q":"A client in a hypertensive emergency needs an ACE inhibitor intravenously. Which drug should the nurse anticipate?","o":["Enalaprilat","Enalapril","Captopril","Losartan"],"c":0,"w":"All ACE inhibitors except enalaprilat are given by the oral route only. Enalaprilat, the active form of enalapril, is given IV and is the ACE inhibitor used in hypertensive emergencies. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Enalapril is an oral prodrug.","2":"Captopril is given by mouth only.","3":"Losartan is an ARB given by mouth only."},"m":{"1":"mixes up enalapril and enalaprilat"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Recognize and interpret"},{"id":"q155","u":"Pharmacology","t":"sata","q":"A pregnant client at 20 weeks has hypertension. Which drug orders should the nurse question? Select all that apply.","o":["Losartan","Enalapril","Methyldopa","Labetalol"],"c":[0,1],"w":"ACE inhibitors and ARBs are pregnancy category D; ARBs carry a substantial teratogenic risk. Orders for losartan or enalapril in pregnancy should be questioned. Methyldopa is often preferred in pregnancy, and labetalol is used for hypertension in pregnancy. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"2":"Methyldopa is often preferred in pregnancy; long experience shows it is not harmful to the fetus.","3":"Labetalol is used to treat hypertension in pregnancy."},"m":{"2":"thinks methyldopa is unsafe in pregnancy","3":"thinks labetalol is unsafe in pregnancy"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q156","u":"Pharmacology","t":"mc","q":"A client who developed a cough on captopril is switched to losartan. Which statement by the client indicates correct understanding?","o":["\"Losartan blocks the angiotensin receptor, so it should not cause the same cough.\"","\"Losartan works the same way as captopril by blocking the converting enzyme.\"","\"Losartan raises bradykinin even more than captopril.\"","\"Losartan is safe if I become pregnant.\""],"c":0,"w":"Losartan competitively and selectively blocks AT1 receptors. It prevents or reverses most actions of angiotensin II and inhibits them more completely than ACE inhibitors, because enzymes other than ACE can still make angiotensin II. It has no effect on bradykinin, so it does not cause the bradykinin-related cough, which makes it the alternative to ACE inhibitors. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Losartan blocks AT1 receptors; it does not inhibit ACE.","2":"ARBs have no effect on bradykinin metabolism.","3":"ARBs are pregnancy category D with substantial teratogenic risk."},"m":{"1":"thinks ARBs inhibit ACE","3":"thinks ARBs are safe in pregnancy"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Teaching and statements"},{"id":"q157","u":"Pharmacology","t":"tf","q":"A nurse states that losartan lowers blood pressure by inhibiting the converting enzyme that forms angiotensin II.","o":["True","False"],"c":1,"w":"False. Losartan is an angiotensin II receptor antagonist: it competitively blocks AT1 receptors. Inhibiting the converting enzyme is the mechanism of ACE inhibitors such as captopril. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"0":"Losartan blocks AT1 receptors; ACE inhibitors block the enzyme."},"m":{"0":"thinks ARBs inhibit ACE"},"lp":false,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q158","u":"Pharmacology","t":"mc","q":"A client with diabetes and early glomerular disease is prescribed an ACE inhibitor. How does the drug slow progression of the kidney disease?","o":["It prevents angiotensin II-induced vasoconstriction of the efferent glomerular arteriole.","It dilates the afferent arteriole by releasing nitric oxide.","It increases aldosterone to retain sodium.","It blocks D1 receptors in the renal vessels."],"c":0,"w":"In diabetic glomerulopathy and hypertensive nephroangiosclerosis, ACE inhibitors decrease disease progression by preventing angiotensin II-induced vasoconstriction of the efferent glomerular arteriole. They are also first-choice in hypertension and are used after myocardial infarction and in chronic heart failure. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Nitric oxide release is the mechanism of nitroprusside.","2":"ACE inhibitors reduce angiotensin II-driven aldosterone secretion.","3":"Fenoldopam ACTIVATES D1 receptors; ACE inhibitors do not act on them."},"m":{},"lp":false,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q159","u":"Pharmacology","t":"mc","q":"A pregnant client needs treatment for chronic hypertension. Which drug is often preferred because long experience shows it is not harmful to the fetus?","o":["Methyldopa","Losartan","Enalapril","Minoxidil"],"c":0,"w":"Methyldopa is taken up by adrenergic neurons and converted to methylnorepinephrine, which activates central alpha-2 receptors and lowers sympathetic tone. It is a second-choice drug in general, but it is often preferred for hypertension in pregnancy because long experience shows it does not harm the fetus. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Losartan is pregnancy category D with substantial teratogenic risk.","2":"ACE inhibitors are pregnancy category D.","3":"Minoxidil is reserved for severe resistant hypertension because of its toxicity."},"m":{"1":"thinks ARBs are safe in pregnancy","2":"thinks ACE inhibitors are safe in pregnancy"},"lp":false,"k":"pharm-central","src":"materials","kind":"Apply a fact"},{"id":"q160","u":"Pharmacology","t":"mc","q":"A client taking clonidine plans to stop the drug suddenly because it causes drowsiness. Which response by the nurse is best?","o":["\"Stopping clonidine suddenly can cause a hypertensive crisis, so talk with your provider before stopping.\"","\"Stopping suddenly is safe because clonidine has no withdrawal effects.\"","\"Drowsiness means the dose is too low; take an extra tablet.\"","\"Clonidine only causes problems when given through the skin.\""],"c":0,"w":"Clonidine and methyldopa lower central adrenergic tone. Their CNS adverse effects include sedation and drowsiness, and clonidine (rarely methyldopa) can cause a hypertensive crisis when suddenly withdrawn. The client should not stop it abruptly. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Sudden withdrawal of clonidine can cause a hypertensive crisis.","2":"Sedation and drowsiness are adverse effects, not a sign of under-dosing.","3":"Transdermal clonidine causes skin eruptions, but withdrawal crisis can occur with any route."},"m":{"1":"thinks clonidine can be stopped abruptly"},"lp":false,"k":"pharm-central","src":"materials","kind":"Teaching and statements"},{"id":"q161","u":"Pharmacology","t":"mc","q":"A client on long-term methyldopa needs a blood transfusion and the crossmatch shows a problem. Which adverse effect of methyldopa explains this?","o":["A positive Coombs' test","Lupoid syndrome","Hyperkalemia","Cyanide toxicity"],"c":0,"w":"Methyldopa is a false neurotransmitter that becomes methylnorepinephrine and stimulates central alpha-2 receptors. Besides sedation and sexual dysfunction, it can cause a positive Coombs' test, which matters when blood is crossmatched. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Lupoid syndrome is an immunological adverse effect of hydralazine.","2":"Hyperkalemia is an adverse effect of ACE inhibitors and aliskiren combinations.","3":"Cyanide toxicity is an adverse effect of nitroprusside."},"m":{"1":"mixes up methyldopa and hydralazine immune effects"},"lp":false,"k":"pharm-central","src":"materials","kind":"Teaching and statements"},{"id":"q162","u":"Pharmacology","t":"cloze","q":"A nurse reviews how several antihypertensives act. Match each drug to its mechanism.","o":{"rows":["Methyldopa","Clonidine","Prazosin","Propranolol"],"choices":["False neurotransmitter converted to methylnorepinephrine","Activates imidazoline receptors in the medulla","Selective alpha-1 receptor blockade","Non-selective beta receptor blockade","Selective beta-1 blockade"]},"c":[0,1,2,3],"w":"Methyldopa is taken up into adrenergic neurons and converted to methylnorepinephrine, an alpha-2 agonist. Clonidine activates central alpha-2 receptors and imidazoline receptors in the medulla. Both reduce central adrenergic tone. Prazosin selectively blocks alpha-1 receptors, dilating resistance and capacitance vessels. Propranolol is a non-selective beta blocker. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"4":"Selective beta-1 blockers are atenolol, bisoprolol and metoprolol."},"m":{"4":"thinks propranolol is beta-1 selective"},"lp":false,"k":"pharm-central","src":"materials","rs":{"0":"A client asks how methyldopa lowers blood pressure. Which mechanism should the nurse describe?","1":"A nurse explains clonidine's action. Which receptor site in the medulla does it activate?","2":"A client starts prazosin. Which mechanism lowers the client's blood pressure?","3":"A client with asthma is prescribed propranolol. Which mechanism makes the nurse concerned?"},"kind":"Apply a fact"},{"id":"q163","u":"Pharmacology","t":"mc","q":"A client receives the first dose of prazosin. Which adverse effect should the nurse monitor for most closely?","o":["Postural hypotension","Bronchoconstriction","Hypertrichosis","Cyanide toxicity","Dry cough"],"c":0,"w":"Prazosin and doxazosin selectively block alpha-1 receptors and lower blood pressure by dilating both resistance and capacitance (venous) vessels. Dilating the veins reduces venous return on standing, so postural hypotension can occur, mainly after the first dose: the \"first-dose phenomenon\". Tachycardia, palpitations and syncope may accompany it. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Bronchoconstriction is an adverse effect of beta blockers.","2":"Hypertrichosis is an adverse effect of minoxidil.","3":"Cyanide toxicity is an adverse effect of nitroprusside.","4":"Dry cough is an adverse effect of ACE inhibitors."},"m":{"1":"mixes up alpha and beta blocker effects"},"lp":false,"k":"pharm-alpha-beta","src":"materials","kind":"Priority / first action"},{"id":"q164","u":"Pharmacology","t":"sata","q":"A client is started on a beta blocker for hypertension. Which adverse effects should the nurse teach the client about? Select all that apply.","o":["Bradycardia","Bronchoconstriction","Hypoglycemia","Rebound hypertension if stopped abruptly","Insomnia or depression","Postural hypotension","Hyperglycemia","Hypertrichosis"],"c":[0,1,2,3,4],"w":"Beta blockers lower heart rate and cardiac output and leave venous tone unchanged, so they do not cause postural hypotension. Adverse effects: bradycardia, hypotension and rebound hypertension on abrupt withdrawal; bronchoconstriction; insomnia, depression and nightmares; hypoglycemia because the liver's gluconeogenesis and glycogenolysis are impaired; and sexual dysfunction. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"5":"Beta blockers do not cause postural hypotension because venous tone is unchanged.","6":"Hyperglycemia is an adverse effect of diazoxide; beta blockers cause HYPOglycemia.","7":"Hypertrichosis is an adverse effect of minoxidil."},"m":{"5":"thinks beta blockers cause postural hypotension","6":"reverses the glucose effect of beta blockers"},"lp":false,"k":"pharm-alpha-beta","src":"materials","kind":"Teaching and statements"},{"id":"q165","u":"Pharmacology","t":"mc","q":"A client with asthma needs a beta blocker. Which drug is beta-1 selective?","o":["Metoprolol","Propranolol","Timolol","Penbutolol","Labetalol"],"c":0,"w":"Beta blockers are divided into beta-1 selective drugs (atenolol, bisoprolol, metoprolol) and non-selective drugs (propranolol, penbutolol, timolol). Bronchoconstriction is a respiratory adverse effect of beta blockade, so selectivity matters in a client with asthma. Labetalol and carvedilol block both alpha and beta receptors. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Propranolol is a non-selective beta blocker.","2":"Timolol is a non-selective beta blocker.","3":"Penbutolol is a non-selective beta blocker.","4":"Labetalol blocks both alpha and beta receptors."},"m":{"1":"thinks propranolol is beta-1 selective"},"lp":false,"k":"pharm-alpha-beta","src":"materials","kind":"Apply a fact"},{"id":"q166","u":"Pharmacology","t":"mc","q":"A nurse explains how a beta blocker lowers a client's blood pressure. Which explanation is accurate?","o":["It decreases cardiac output and inhibits renin release by blocking beta-1 receptors.","It dilates both arterioles and veins by blocking alpha-1 receptors.","It opens potassium channels in arteriolar smooth muscle.","It lowers venous tone so blood pools on standing."],"c":0,"w":"Beta blockers lower blood pressure by two beta-1 effects: blocking cardiac beta-1 receptors lowers heart rate and cardiac output, and blocking beta-1 receptors on juxtaglomerular cells inhibits renin release. Venous tone is unchanged, so they do not cause postural hypotension. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Alpha-1 blockade of resistance and capacitance vessels is how prazosin works.","2":"Potassium channel opening is the mechanism of minoxidil and diazoxide.","3":"Beta blockers leave venous tone unchanged and do not cause postural hypotension."},"m":{"1":"mixes up alpha and beta blocker mechanisms"},"lp":false,"k":"pharm-alpha-beta","src":"materials","kind":"Teaching and statements"},{"id":"q167","u":"Pharmacology","t":"mc","q":"A client has heart failure and hypertension. Which alpha-beta blocker is used to treat heart failure?","o":["Carvedilol","Labetalol","Prazosin","Esmolol"],"c":0,"w":"Labetalol and carvedilol block both alpha and beta receptors, causing vasodilation and reduced heart rate and contractility. They are used in black and elderly patients; labetalol in hypertension with pregnancy and IV for hypertensive emergencies; carvedilol to treat heart failure. Their main side effects are orthostatic hypotension and dizziness. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Labetalol is used in pregnancy and IV for hypertensive emergencies, not named for heart failure.","2":"Prazosin is a selective alpha-1 blocker.","3":"Esmolol is on the sympathoplegic list but is not an alpha-beta blocker."},"m":{"1":"mixes up labetalol and carvedilol uses"},"lp":false,"k":"pharm-alpha-beta","src":"materials","kind":"Apply a fact"},{"id":"q168","u":"Pharmacology","t":"cloze","q":"A nurse reviews the vasodilators used in hypertension. Match each drug to its mechanism of action.","o":{"rows":["Nitroprusside","Minoxidil","Fenoldopam","Hydralazine"],"choices":["Production of nitric oxide in arterioles and veins","K+ channel opening in arterioles","D1-receptor activation in arterioles","Uncertain; perhaps inhibition of Ca++ release and NO release","Selective alpha-1 receptor blockade"]},"c":[0,1,2,3],"w":"The direct vasodilators differ by site and mechanism. Nitroprusside acts on arterioles and veins by producing nitric oxide. Minoxidil and diazoxide open K+ channels in arterioles. Fenoldopam activates D1 receptors in arterioles. Hydralazine relaxes arterioles by an uncertain mechanism, perhaps inhibiting Ca++ release from the sarcoplasmic reticulum and stimulating NO release. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"4":"Alpha-1 blockade is the mechanism of prazosin, not a direct vasodilator."},"m":{"4":"mixes up alpha blockers and direct vasodilators"},"lp":false,"k":"pharm-vasodilators","src":"materials","rs":{"0":"A client receives a nitroprusside infusion. Which mechanism produces its vasodilation?","1":"A client with resistant hypertension starts minoxidil. Which mechanism lowers the blood pressure?","2":"A client in a hypertensive emergency receives fenoldopam. Which mechanism does it use?","3":"A nurse explains hydralazine's mechanism to a client. Which description is accurate?"},"kind":"Apply a fact"},{"id":"q169","u":"Pharmacology","t":"mc","q":"A client has received a nitroprusside infusion for several days. Which toxicity should the nurse monitor for?","o":["Cyanide toxicity","Lupoid syndrome","Hypertrichosis","Hyperglycemia"],"c":0,"w":"Nitroprusside is rapidly metabolized by red blood cells, liberating cyanide, which is then metabolized to thiocyanate. Its half-life is about 2 minutes, so it must be given by continuous infusion. Adverse effects include excessive vasodilation, rebound hypertension, palpitations, nausea, substernal pain and cyanide toxicity. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Lupoid syndrome is an immunological adverse effect of hydralazine.","2":"Hypertrichosis is an adverse effect of minoxidil.","3":"Hyperglycemia is an adverse effect of diazoxide."},"m":{"1":"mixes up nitroprusside and hydralazine toxicity"},"lp":false,"k":"pharm-vasodilators","src":"materials","kind":"Apply a fact"},{"id":"q170","u":"Pharmacology","t":"tf","q":"A nurse states that nitroprusside has a half-life of about 2 minutes and must be given by continuous infusion.","o":["True","False"],"c":0,"w":"True. Nitroprusside's half-life is about 2 minutes, so it must be given by continuous infusion to be effective. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"This statement is true: half-life about 2 minutes, continuous infusion."},"m":{},"lp":false,"k":"pharm-vasodilators","src":"materials","kind":"Apply a fact"},{"id":"q171","u":"Pharmacology","t":"mc","q":"A client takes high-dose hydralazine. Which adverse effect is immunological rather than an extension of the drug's vasodilator action?","o":["Lupoid syndrome","Headache","Palpitations","Flushing"],"c":0,"w":"Hydralazine relaxes small arteries and arterioles. Headache, dizziness, palpitations and flushing extend that vasodilator effect. Separately, immunological reactions occur: lupoid syndrome (up to 20% with very high doses), fever, serum sickness, hemolytic anemia and vasculitis. It is used with isosorbide mononitrate in heart failure. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Headache is an extension of the pharmacological (vasodilator) effect.","2":"Palpitations are an extension of the pharmacological effect.","3":"Flushing is an extension of the pharmacological effect."},"m":{"1":"mixes up immune and pharmacological effects","2":"mixes up immune and pharmacological effects","3":"mixes up immune and pharmacological effects"},"lp":false,"k":"pharm-vasodilators","src":"materials","kind":"Apply a fact"},{"id":"q172","u":"Pharmacology","t":"mc","q":"A client on minoxidil for severe hypertension notices increased hair growth on the face and arms. How should the nurse interpret this?","o":["It is hypertrichosis, a known adverse effect of minoxidil.","It is a sign of cyanide toxicity.","It is part of a lupoid syndrome.","It means the drug is acting as a diuretic."],"c":0,"w":"Minoxidil is a prodrug that the liver converts to an active K+ channel opener in arterioles. Because of its toxicity it is reserved for severe hypertension that responds poorly to other drugs. Adverse effects are salt and water retention, tachycardia, palpitations, flushing and hypertrichosis, which is why it is also used locally to treat baldness. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Cyanide toxicity comes from nitroprusside.","2":"Lupoid syndrome is a hydralazine adverse effect.","3":"Minoxidil causes salt and water retention, not diuresis."},"m":{"2":"mixes up minoxidil and hydralazine effects"},"lp":false,"k":"pharm-vasodilators","src":"materials","kind":"Recognize and interpret"},{"id":"q173","u":"Pharmacology","t":"mc","q":"A client with diabetes receives diazoxide for a hypertensive emergency. Which value should the nurse monitor closely?","o":["Blood glucose, because diazoxide causes hyperglycemia","Urine output, because diazoxide causes strong diuresis","Blood cyanide, because diazoxide releases cyanide","Coombs' test, because diazoxide causes hemolysis"],"c":0,"w":"Diazoxide is a potassium channel opener used for hypertensive emergencies. It resembles the thiazides but does not cause diuresis, apparently because it lacks a sulfonamide group. Adverse effects are salt and water retention with edema, hyperglycemia, and excessive hypotension, flushing and headache. (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Diazoxide does NOT cause diuresis (it lacks a sulfonamide group); it causes salt and water retention.","2":"Cyanide is released from nitroprusside.","3":"A positive Coombs' test is caused by methyldopa."},"m":{"1":"thinks diazoxide is a diuretic"},"lp":false,"k":"pharm-vasodilators","src":"materials","kind":"Apply a fact"},{"id":"q174","u":"Pharmacology","t":"mc","q":"Fenoldopam is ordered for several clients with severe hypertension. For which client should the nurse question the order?","o":["A client with glaucoma","A client with a hypertensive emergency","A client with hyperkalemia","A client who needs renal vasodilation"],"c":0,"w":"Fenoldopam, the only D1-receptor agonist, is given by IV infusion for hypertensive emergencies. It dilates mainly renal and mesenteric vessels and increases natriuresis. Its adverse effects explain its contraindications: reflex tachycardia (angina), a dose-dependent rise in intraocular pressure (glaucoma) and a fall in serum potassium (hypokalemic states). (Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"A hypertensive emergency is fenoldopam's therapeutic use.","2":"Fenoldopam lowers potassium; the contraindication is HYPOkalemia.","3":"Fenoldopam mainly dilates renal and mesenteric vessels."},"m":{"2":"reverses the potassium contraindication"},"lp":false,"k":"pharm-vasodilators","src":"materials","kind":"Apply a fact"},{"id":"q175","u":"Biochemistry","t":"blanks","q":"A client with high LDL-cholesterol asks how much treatment can lower it. The nurse explains that diet control lowers total and LDL-cholesterol by about {1}, while a statin lowers them by about {2}.","o":[["10-20%","30-40%","1-2%"],["30-40%","10-20%","60-70%"]],"c":[0,0],"w":"Total blood cholesterol varies with diet and endogenous synthesis. Treating hypercholesterolemia by diet control or by drugs lowers LDL-cholesterol, raises HDL-cholesterol and reduces CHD risk. Diet control alone gives a 10-20% reduction in total and LDL-cholesterol; hypocholesterolemic drugs such as statins give 30-40%. (Biochemistry L5 slides (diet fat and CHD))","x":{"0:1":"30-40% is the reduction with statins.","0:2":"1-2% is not the figure given; diet control gives 10-20%.","1:1":"10-20% is the reduction with diet control.","1:2":"60-70% is not the figure given; statins give 30-40%."},"m":{"0:1":"swaps diet and statin effects","1:1":"swaps diet and statin effects"},"lp":false,"k":"bio-lipids-chd","src":"materials","kind":"Teaching and statements"},{"id":"q176","u":"Biochemistry","t":"sata","q":"A client asks which foods are main sources of saturated fat. Which foods should the nurse include? Select all that apply.","o":["Dairy products","Meat products","Coconut oil","Palm oil","Olive oil","Corn oil","Flaxseed oil"],"c":[0,1,2,3],"w":"Saturated fats are triacylglycerols whose fatty acids have no double bonds. Their main sources are dairy and meat products and some vegetable oils, notably coconut and palm oils. Saturated fat intake is strongly associated with high total and LDL-cholesterol and high CHD risk, so intake should be limited. (Biochemistry L5 slides (diet fat and CHD))","x":{"4":"Olive oil is mainly monounsaturated (oleic acid).","5":"Corn oil is an omega-6 polyunsaturated fat.","6":"Flaxseed oil is a plant source of omega-3 alpha-linolenic acid."},"m":{"4":"thinks all oils are unsaturated or all are saturated"},"lp":false,"k":"bio-fats","src":"materials","kind":"Teaching and statements"},{"id":"q177","u":"Biochemistry","t":"mc","q":"A client replaces butter with olive oil in cooking. Which change in blood lipids should the nurse expect?","o":["Lower total and LDL-cholesterol with higher HDL-cholesterol","Lower total and LDL-cholesterol with lower HDL-cholesterol","Higher LDL-cholesterol with lower HDL-cholesterol","Lower triacylglycerol with little effect on LDL or HDL"],"c":0,"w":"Olive oil is rich in monounsaturated fat (oleic acid, one double bond). Substituting monounsaturated for saturated fatty acids lowers total and LDL-cholesterol and increases HDL-cholesterol, lowering CHD risk. Mediterranean diets rich in olive oil show a low incidence of CHD. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Lowering HDL too is the pattern of omega-6 fats.","2":"This is the pattern of trans fats.","3":"This is the pattern of omega-3 fats."},"m":{"1":"mixes up MUFA and omega-6 effects","2":"mixes up MUFA and trans fat effects","3":"mixes up MUFA and omega-3 effects"},"lp":false,"k":"bio-fats","src":"materials","kind":"Recognize and interpret"},{"id":"q178","u":"Biochemistry","t":"mc","q":"A client uses large amounts of corn and sunflower oil to protect the heart. Which effect of these oils limits their benefit?","o":["They lower HDL-cholesterol as well and have a proinflammatory effect.","They raise LDL-cholesterol.","They contain dietary cholesterol.","They are not essential fatty acids."],"c":0,"w":"Corn, sesame, cottonseed and sunflower oils are rich in omega-6 polyunsaturated fat such as linoleic acid (18:2 n-6), an essential fatty acid needed for membrane fluidity and eicosanoid synthesis. They lower total and LDL-cholesterol, but they also lower HDL-cholesterol and are proinflammatory, which decreases their effect on CHD. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Omega-6 oils LOWER total and LDL-cholesterol; raising LDL is a trans fat effect.","2":"Dietary cholesterol is found only in animal products.","3":"Linoleic acid, the omega-6 in these oils, IS an essential fatty acid."},"m":{"1":"thinks omega-6 raises LDL"},"lp":false,"k":"bio-fats","src":"materials","kind":"Apply a fact"},{"id":"q179","u":"Biochemistry","t":"sata","q":"A client with high triglycerides asks about eating fatty fish such as salmon and sardines. Which effects of omega-3 fats should the nurse describe? Select all that apply.","o":["Suppressing cardiac arrhythmia","Reducing blood triacylglycerol","Decreasing the tendency to vascular thrombosis","Reducing inflammation","Markedly lowering LDL-cholesterol","Lowering HDL-cholesterol"],"c":[0,1,2,3],"w":"Omega-3 fats come from plants (alpha-linolenic acid in flaxseed and walnuts) and fatty fish (EPA and DHA in salmon, mackerel, anchovies, sardines, herring and tuna). They reduce CHD risk by suppressing arrhythmia, reducing blood triacylglycerol, decreasing thrombosis and reducing inflammation, with little effect on LDL- and HDL-cholesterol. (Biochemistry L5 slides (diet fat and CHD))","x":{"4":"Omega-3 fats have LITTLE effect on LDL- and HDL-cholesterol.","5":"Lowering HDL is an omega-6 effect."},"m":{"4":"thinks omega-3 mainly lowers LDL","5":"mixes up omega-3 and omega-6 effects"},"lp":false,"k":"bio-fats","src":"materials","kind":"Teaching and statements"},{"id":"q180","u":"Biochemistry","t":"fill","q":"A nurse explains fatty acid naming to a client. In an omega-3 fat, the first double bond begins at carbon number ____ counting from the methyl end.","o":["3","6","9"],"c":0,"w":"The omega number is the position of the first double bond counted from the methyl end of the fatty acid. Omega-3 fats begin at the 3rd carbon, omega-6 fats (linoleic acid) at the 6th and the monounsaturated oleic acid is omega-9. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Carbon 6 marks omega-6 fats such as linoleic acid.","2":"Carbon 9 marks omega-9 fats such as oleic acid (monounsaturated)."},"m":{"1":"mixes up omega-3 and omega-6"},"lp":false,"k":"bio-fats","src":"materials","kind":"Priority / first action"},{"id":"q181","u":"Biochemistry","t":"mc","q":"A vegetarian client wants an essential omega-3 fatty acid from plant foods. Which fatty acid should the nurse identify?","o":["Alpha-linolenic acid (ALA) from flaxseed oil and walnuts","Eicosapentaenoic acid (EPA) from flaxseed","Docosahexaenoic acid (DHA) from walnuts","Oleic acid from olive oil"],"c":0,"w":"Plant sources (flaxseed oils, walnuts) provide alpha-linolenic acid, an essential omega-3 fatty acid needed at 0.6-1.2% of total calories, with double bonds at carbons 9, 12 and 15. Fatty fish provide EPA (20 carbons, 5 double bonds) and DHA (22 carbons, 6 double bonds), which are not essential. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"EPA comes from fatty fish oils and is not an essential fatty acid.","2":"DHA (22 carbons, 6 double bonds) comes from fatty fish oils, not walnuts.","3":"Oleic acid is a monounsaturated omega-9 fat."},"m":{"1":"thinks EPA is a plant essential fatty acid"},"lp":false,"k":"bio-fats","src":"materials","kind":"Recognize and interpret"},{"id":"q182","u":"Biochemistry","t":"mc","q":"A nurse teaches a client how to spot trans fats when shopping. Which words on an ingredient list indicate trans fatty acids?","o":["\"Partially hydrogenated\"","\"Cold-pressed olive oil\"","\"Contains plant sterols\"","\"Fish oil (EPA/DHA)\""],"c":0,"w":"Trans fatty acids are not found in plants and occur only in small amounts in animal foods, but they are formed during hydrogenation of liquid vegetable oils, as in margarine manufacture. The key to their presence in a food is the words \"partially hydrogenated\" on the ingredient list. (Biochemistry L5 slides (diet fat and CHD), slide note (key to trans fats))","x":{"1":"Olive oil is a monounsaturated fat, not a trans fat.","2":"Plant sterols lower LDL by blocking cholesterol absorption.","3":"Fish oils are omega-3 fats."},"m":{"2":"confuses plant sterols with trans fats"},"lp":true,"k":"bio-fats","src":"materials","kind":"Teaching and statements"},{"id":"q183","u":"Biochemistry","t":"tf","q":"A nurse explains that trans fatty acids are chemically unsaturated but behave more like saturated fatty acids.","o":["True","False"],"c":0,"w":"True. Trans fatty acids are chemically classified as unsaturated, but they behave more like saturated fatty acids: they raise LDL-cholesterol, lower HDL-cholesterol and increase CHD risk. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"This statement is true: trans fats are unsaturated yet act like saturated fats."},"m":{},"lp":false,"k":"bio-fats","src":"materials","kind":"Teaching and statements"},{"id":"q184","u":"Biochemistry","t":"tf","q":"A nurse states that WHO recommends limiting trans fat to less than 10% of total energy intake.","o":["True","False"],"c":1,"w":"False. WHO recommends limiting trans fat to less than 1% of total energy intake, which is less than 2.2 g per day on a 2000-calorie diet. (Biochemistry L5 slides (diet fat and CHD))","x":{"0":"The WHO limit is less than 1% of energy (under 2.2 g/day on 2000 kcal)."},"m":{"0":"overestimates the trans fat limit"},"lp":false,"k":"bio-fats","src":"materials","kind":"Apply a fact"},{"id":"q185","u":"Biochemistry","t":"cloze","q":"A nurse reviews dietary fats with a client. Match each type of fat to its effect on blood lipids.","o":{"rows":["Saturated fat","Trans fat","Monounsaturated fat","Omega-3 fat"],"choices":["Raises total and LDL-cholesterol","Raises LDL-cholesterol and lowers HDL-cholesterol","Lowers LDL-cholesterol and raises HDL-cholesterol","Lowers triacylglycerol with little effect on LDL or HDL","Lowers both LDL- and HDL-cholesterol"]},"c":[0,1,2,3],"w":"Each fat has a signature effect. Saturated fats raise total and LDL-cholesterol. Trans fats raise LDL and lower HDL. Monounsaturated fats lower LDL and raise HDL. Omega-6 fats lower both LDL and HDL. Omega-3 fats lower triacylglycerol, suppress arrhythmia, thrombosis and inflammation, with little effect on LDL or HDL. (Biochemistry L5 slides (diet fat and CHD))","x":{"4":"Lowering both LDL and HDL is the effect of omega-6 fats."},"m":{"4":"mixes up omega-3 and omega-6 effects"},"lp":false,"k":"bio-fats","src":"materials","rs":{"0":"A client eats a diet high in saturated fat. Which effect on blood lipids should the nurse expect?","1":"A client eats many foods made with partially hydrogenated oil. Which lipid effect should the nurse expect?","2":"A client substitutes monounsaturated fat for saturated fat. Which lipid effect should the nurse expect?","3":"A client adds fish oil (omega-3) to the diet. Which lipid effect should the nurse expect?"},"kind":"Apply a fact"},{"id":"q186","u":"Biochemistry","t":"mc","q":"A nurse teaches a client about diet and cholesterol. Which statement by the client indicates a need for further teaching?","o":["\"The cholesterol I eat affects my blood cholesterol more than the type of fat I eat.\"","\"Cholesterol is found only in animal products.\"","\"Plant sterols lower LDL by blocking cholesterol absorption in my gut.\"","\"Fish oils can lower my triglycerides.\""],"c":0,"w":"Dietary cholesterol is found only in animal products, but its effect on blood cholesterol is LESS important than the amount and type of fatty acids eaten. A client who believes the opposite needs more teaching. Plant sterols in fortified margarines reduce LDL by blocking cholesterol absorption, and fish oils reduce triacylglycerol. (Biochemistry L5 slides (diet fat and CHD))","x":{"1":"This is accurate: dietary cholesterol is found only in animal products, so no teaching is needed.","2":"This is accurate: plant sterols inhibit intestinal absorption of cholesterol.","3":"This is accurate: omega-3 fish oils reduce blood triacylglycerol."},"m":{},"lp":false,"k":"bio-cholesterol-sterols","src":"materials","kind":"Teaching and statements"},{"id":"q187","u":"Biochemistry","t":"sata","q":"A client with high cholesterol asks which dietary factors help lower blood cholesterol. Which factors should the nurse include? Select all that apply.","o":["Monounsaturated fats","Plant sterols","Vegetable fiber","Antioxidants such as vitamins E and C","Large doses of vitamin B3","Saturated fats","Partially hydrogenated oils"],"c":[0,1,2,3,4],"w":"The dietary factors listed as decreasing blood cholesterol are omega-6 polyunsaturated fats, monounsaturated fats, antioxidants (beta carotene, vitamins E and C), plant sterols, vegetable fiber and large doses of vitamin B3. Saturated and trans fats push cholesterol the other way. (Biochemistry L5 slides (diet fat and CHD))","x":{"5":"Saturated fats RAISE total and LDL-cholesterol.","6":"Partially hydrogenated oils contain trans fats, which raise LDL."},"m":{"5":"thinks saturated fat lowers cholesterol","6":"thinks margarine trans fats are protective"},"lp":false,"k":"bio-cholesterol-sterols","src":"materials","kind":"Teaching and statements"},{"id":"q188","u":"Biochemistry","t":"mc","q":"A nurse explains oxidative stress to a client with coronary disease. Which definition is accurate?","o":["An imbalance favoring oxidants and/or disfavoring antioxidants that can lead to damage","Any production of reactive oxygen species in the body","An excess of antioxidants over oxidants","The buildup of lipid-rich plaque in the intima"],"c":0,"w":"Oxidative stress is a state in which reactive species increase without a matching increase in antioxidants: an imbalance favoring oxidants and/or disfavoring antioxidants, potentially leading to damage. Reactive oxygen species are not always harmful; phagocytes use them to kill microbes. The imbalance is what has been implicated in diseases such as atherosclerosis. (Biochemistry L6 slides (oxidative stress))","x":{"1":"ROS are made normally and can be useful (e.g. microbial killing); stress is the IMBALANCE.","2":"That is the opposite of oxidative stress.","3":"That describes atherosclerosis, which oxidative stress helps cause."},"m":{"1":"thinks any ROS is oxidative stress","2":"reverses the imbalance"},"lp":false,"k":"bio-ros","src":"materials","kind":"Teaching and statements"},{"id":"q189","u":"Biochemistry","t":"mc","q":"A nurse reviews reactive nitrogen species. Which one is a NON-radical?","o":["Peroxynitrite","Nitric oxide","Nitrogen dioxide","Superoxide"],"c":0,"w":"Reactive species are split into radicals, which carry an unpaired electron, and non-radicals, which are strong oxidants or favor strong oxidant formation. Among reactive nitrogen species, nitric oxide and nitrogen dioxide are radicals and peroxynitrite is a non-radical. Among reactive oxygen species, superoxide, hydroxyl and peroxyl are radicals; hydrogen peroxide, hypochlorous acid and ozone are not. (Biochemistry L6 slides (oxidative stress))","x":{"1":"Nitric oxide (NO.) is a free radical.","2":"Nitrogen dioxide (NO2.) is a free radical.","3":"Superoxide is a reactive OXYGEN species and a radical."},"m":{"1":"thinks NO is a non-radical"},"lp":false,"k":"bio-ros","src":"materials","kind":"Apply a fact"},{"id":"q190","u":"Biochemistry","t":"tf","q":"A nurse states that hydrogen peroxide is a free radical because it has an unpaired electron.","o":["True","False"],"c":1,"w":"False. Hydrogen peroxide (H2O2) is a NON-radical reactive oxygen species: a strong oxidant without an unpaired electron. The ROS radicals are superoxide, hydroxyl and peroxyl. (Biochemistry L6 slides (oxidative stress))","x":{"0":"H2O2 is a non-radical ROS."},"m":{"0":"thinks H2O2 is a radical"},"lp":false,"k":"bio-ros","src":"materials","kind":"Apply a fact"},{"id":"q191","u":"Biochemistry","t":"sata","q":"A nurse reviews ENDOGENOUS sources of free radicals in a client's cells. Which sources apply? Select all that apply.","o":["Leakage of electrons from the respiratory chain","Xanthine oxidase activity","Synthesis of prostaglandins","Phagocytosis by white cells","Cigarette smoke","X-ray exposure","Halothane metabolism"],"c":[0,1,2,3],"w":"Endogenous free radicals come from cellular metabolism: electron leakage from the respiratory chain, oxidase enzymes such as xanthine oxidase, prostaglandin synthesis, production of nitric oxide from arginine and phagocytosis (myeloperoxidase, NADPH oxidase). Exogenous sources are drug metabolism, ionizing radiation and cigarette smoke. (Biochemistry L6 slides (oxidative stress))","x":{"4":"Cigarette smoke is an exogenous (environmental) source.","5":"Ionizing radiation is an exogenous source.","6":"Drug metabolism (halothane, cytochrome P450) is listed as exogenous."},"m":{"4":"mixes up endogenous and exogenous sources","5":"mixes up endogenous and exogenous sources"},"lp":false,"k":"bio-ros","src":"materials","kind":"Apply a fact"},{"id":"q192","u":"Biochemistry","t":"order","q":"A client's neutrophils engulf bacteria. Arrange the steps of the oxygen-dependent killing pathway in order.","o":["Bacteria are phagocytosed and ROS production rises (respiratory burst)","NADPH oxidase converts molecular oxygen into superoxide","Superoxide dismutase converts superoxide into hydrogen peroxide","Myeloperoxidase converts H2O2 and chloride into hypochlorous acid","Hypochlorous acid kills the bacteria"],"c":[0,1,2,3,4],"w":"Reactive oxygen species are sometimes useful. In neutrophils and monocytes, phagocytosis triggers a rapid rise in ROS called the respiratory burst. NADPH oxidase converts oxygen to superoxide, superoxide dismutase converts it to H2O2, and myeloperoxidase uses H2O2 and chloride ions to make hypochlorous acid, which kills bacteria. H2O2 can also form hydroxyl radicals in a reaction catalyzed by free ferrous ions. (Biochemistry L6 slides (oxidative stress))","x":{},"m":{},"lp":false,"k":"bio-burst-no","src":"materials","kind":"Apply a fact"},{"id":"q193","u":"Biochemistry","t":"mc","q":"A client with severe sepsis has very high nitric oxide production driven by bacterial toxins and cytokines. Which enzyme is responsible?","o":["Inducible nitric oxide synthase (iNOS)","Endothelial nitric oxide synthase (eNOS)","Neural nitric oxide synthase (nNOS)","Xanthine oxidase"],"c":0,"w":"Nitric oxide is made from L-arginine by NO synthase. eNOS (endothelium) and nNOS (neural) are constitutive and produce low levels constantly. iNOS is expressed in many cells including macrophages and neutrophils; it is induced by bacterial toxins, TNF and inflammatory cytokines and can produce large amounts of NO for hours or days, so it is linked to inflammation. (Biochemistry L6 slides (oxidative stress))","x":{"1":"eNOS is constitutive and constantly produces LOW levels of NO.","2":"nNOS is constitutive and produces low levels of NO in neurons.","3":"Xanthine oxidase is an oxidase that produces ROS, not NO."},"m":{"1":"mixes up eNOS and iNOS"},"lp":false,"k":"bio-burst-no","src":"materials","kind":"Apply a fact"},{"id":"q194","u":"Biochemistry","t":"mc","q":"A client with angina takes sublingual nitroglycerin. How does it relieve coronary spasm?","o":["It is metabolized into nitric oxide, which causes vasodilation.","It is converted into superoxide, which relaxes smooth muscle.","It acts as an antioxidant that neutralizes oxidized LDL.","It induces iNOS in macrophages."],"c":0,"w":"NO produced by endothelial NOS improves vascular dilation and perfusion, which is beneficial. Vasodilators such as nitroglycerin are metabolized into NO and so dilate coronary arteries in spasm in angina, a therapeutic and diagnostic use. (Biochemistry L6 slides (oxidative stress))","x":{"1":"Superoxide is a damaging ROS radical, not a vasodilator.","2":"Nitroglycerin works through NO-mediated vasodilation, not as an antioxidant.","3":"iNOS induction is linked to inflammation, not to nitroglycerin's therapeutic effect."},"m":{"3":"mixes up iNOS and therapeutic NO"},"lp":false,"k":"bio-burst-no","src":"materials","kind":"Apply a fact"},{"id":"q195","u":"Biochemistry","t":"tf","q":"A nurse explains that nitric oxide is a free-radical gas with a half-life of seconds that is made from L-arginine.","o":["True","False"],"c":0,"w":"True. NO is a free radical gas with a very short half-life (seconds), synthesized by NO synthase from L-arginine and metabolized into nitrates, nitrites and peroxynitrite. (Biochemistry L6 slides (oxidative stress))","x":{"1":"This statement is true: NO is a short-lived radical made from L-arginine."},"m":{},"lp":false,"k":"bio-burst-no","src":"materials","kind":"Teaching and statements"},{"id":"q196","u":"Biochemistry","t":"cloze","q":"A nurse reviews the body's antioxidant defenses with a client. Match each antioxidant to its type.","o":{"rows":["Superoxide dismutase","Vitamin E (tocopherol)","Glutathione","Catalase"],"choices":["Enzymatic antioxidant","Nutrient (non-enzymatic) antioxidant","Metabolic (non-enzymatic) antioxidant","Pro-oxidant transition metal"]},"c":[0,1,2,0],"w":"Antioxidants are enzymatic (superoxide dismutase, catalase, glutathione peroxidase with glutathione reductase and G6PD) or non-enzymatic. Non-enzymatic antioxidants are nutrient (carotene, tocopherol, ascorbic acid, selenium) or metabolic (glutathione, thioredoxin, ceruloplasmin, albumin, melatonin, transferrin, ferritin, uric acid). (Biochemistry L6 slides (oxidative stress))","x":{"3":"Transition metals favor the formation of strong oxidants; they are not antioxidants."},"m":{"3":"thinks metals are antioxidants"},"lp":false,"k":"bio-burst-no","src":"materials","rs":{"0":"A nurse explains how superoxide dismutase protects cells. What type of antioxidant is it?","1":"A client takes vitamin E supplements. What type of antioxidant is vitamin E?","2":"A nurse describes glutathione to a client. What type of antioxidant is it?","3":"A nurse reviews catalase. What type of antioxidant is it?"},"kind":"Apply a fact"},{"id":"q197","u":"Biochemistry","t":"order","q":"A nurse explains how oxidized LDL drives atherosclerosis. Arrange the key stages in order.","o":["Endothelial dysfunction from hypertension, smoking or dyslipidemia","LDL enters the intima and is oxidized","Adhesion molecules (VCAM-1, ICAM-1) and MCP-1 recruit monocytes","Macrophages engulf oxidized LDL and become foam cells (fatty streak)","Smooth muscle cells migrate and form a fibrous cap","Plaque rupture or erosion triggers thrombosis"],"c":[0,1,2,3,4,5],"w":"Stressors damage the endothelium. LDL passes into the intima and is oxidized by free radicals and lipoxygenases. Activated endothelium expresses VCAM-1, ICAM-1 and MCP-1 that recruit monocytes and T cells. Monocytes become macrophages that engulf oxidized LDL via scavenger receptors and become foam cells, forming the fatty streak. Smooth muscle cells migrate from the media, proliferate and lay down a fibrous cap; a necrotic core and calcification follow, and a vulnerable plaque may rupture and trigger thrombosis. (Biochemistry L6 slides (oxidative stress), key stages slide)","x":{},"m":{},"lp":true,"k":"bio-oxldl","src":"materials","kind":"Teaching and statements"},{"id":"q198","u":"Biochemistry","t":"mc","q":"A nurse explains how fatty streaks form in a client's arteries. How do macrophages take up oxidized LDL?","o":["Through scavenger receptors, turning into lipid-laden foam cells","Through VCAM-1 and ICAM-1 on the macrophage","By efferocytosis of dead smooth muscle cells","By secreting collagen around the lipid"],"c":0,"w":"Monocytes recruited into the intima differentiate into macrophages and engulf oxidized LDL via scavenger receptors, becoming lipid-laden foam cells. The initial accumulation of foam cells creates the earliest visible lesion, the fatty streak. (Biochemistry L6 slides (oxidative stress))","x":{"1":"VCAM-1 and ICAM-1 are adhesion molecules on activated ENDOTHELIAL cells that capture monocytes.","2":"Efferocytosis is clearing dead cells; its failure enlarges the necrotic core.","3":"Collagen and proteoglycans are made by smooth muscle cells forming the fibrous cap."},"m":{"1":"mixes up adhesion molecules and scavenger receptors"},"lp":false,"k":"bio-oxldl","src":"materials","kind":"Teaching and statements"},{"id":"q199","u":"Biochemistry","t":"mc","q":"A nurse reviews why some atherosclerotic plaques develop a large necrotic core. Which process is responsible?","o":["Apoptosis of macrophages and SMCs with impaired clearance of the dead cells (efferocytosis)","Migration of smooth muscle cells to form a fibrous cap","Expression of VCAM-1 and ICAM-1 by endothelial cells","Inhibition of intestinal cholesterol absorption"],"c":0,"w":"As plaques progress, macrophages and smooth muscle cells undergo apoptosis and secondary necrosis. When the dead cells are not cleared (impaired efferocytosis), an acellular necrotic core rich in lipids and debris enlarges, and calcium salts deposit, causing calcification. Vulnerable plaques can then rupture or erode and trigger thrombosis. (Biochemistry L6 slides (oxidative stress))","x":{"1":"SMC migration builds the fibrous cap over the lipid core, not the necrotic core.","2":"Adhesion molecules recruit monocytes early in the process.","3":"Blocking intestinal cholesterol absorption is how plant sterols lower LDL."},"m":{"1":"mixes up cap formation and necrotic core"},"lp":false,"k":"bio-oxldl","src":"materials","kind":"Apply a fact"},{"id":"q200","u":"Microbiology","t":"mc","q":"A 32-year-old man presents to the emergency department with fever, fatigue, and shortness of breath for 2 weeks. He reports painful nodules on his fingertips and a new heart murmur. His past medical history is significant for intravenous drug use. Temperature 38.9°C, HR 110 bpm, BP 110/65 mmHg, RR 20/min; WBC 15,000/µL, ESR elevated; 3 sets of blood cultures show Gram-positive cocci in clusters; echocardiography shows vegetations on the tricuspid valve. Which of the following is the most likely causative organism?","o":["Staphylococcus aureus","Streptococcus viridans","Enterococcus faecalis","Haemophilus parainfluenzae"],"c":0,"w":"Intravenous drug use endocarditis mainly affects the tricuspid valve, and Staphylococcus aureus is its main cause and the most common cause of IE overall. S. aureus is a Gram-positive coccus in clusters, catalase and coagulase positive, and causes an acute, aggressive infection with rapid valve destruction. Painful finger-pad nodules are Osler nodes. (Microbiology L3 slides (infective endocarditis), in-class case)","x":{"1":"Viridans streptococci are Gram-positive cocci in CHAINS that cause subacute IE on damaged valves, often after oral sources.","2":"Enterococcus faecalis causes IE in the elderly after GU or GI procedures; it does not grow in clusters.","3":"Haemophilus is a HACEK Gram-negative bacillus, not a Gram-positive coccus."},"m":{"1":"picks viridans for any endocarditis"},"lp":true,"k":"micro-ie-types","src":"materials","kind":"Apply a fact"},{"id":"q201","u":"Microbiology","t":"mc","q":"A client with known rheumatic valve disease has had low-grade fever, malaise and weight loss for 6 weeks after a dental extraction. Which organism should the nurse suspect?","o":["Viridans group streptococci","Staphylococcus aureus","Staphylococcus epidermidis","Streptococcus bovis"],"c":0,"w":"Subacute IE progresses slowly over weeks to months, usually in people with preexisting valve disease such as rheumatic heart disease, and causes milder symptoms such as low-grade fever, malaise, chills and weight loss. It is caused by less virulent organisms: viridans streptococci (notably S. mutans) from the oral cavity, enterococci and the HACEK group. A dental procedure is a classic source of the transient bacteremia. (Microbiology L3 slides (infective endocarditis))","x":{"1":"S. aureus causes ACUTE, rapidly progressive IE, often on healthy valves.","2":"S. epidermidis is typical of prosthetic valve and device infections.","3":"S. bovis is associated with colorectal carcinoma or GI lesions, not dental sources."},"m":{"1":"mixes up acute and subacute organisms"},"lp":false,"k":"micro-ie-types","src":"materials","kind":"Recognize and interpret"},{"id":"q202","u":"Microbiology","t":"mc","q":"A client who had a prosthetic valve inserted 3 months ago develops endocarditis. Which organism is most likely?","o":["Staphylococcus epidermidis","Viridans streptococci","Streptococcus bovis","Streptococcus pneumoniae"],"c":0,"w":"Prosthetic valve endocarditis is early when it develops within 12 months of surgery, often from intraoperative contamination, and late after 12 months from community-acquired infection. It is caused mostly by Staphylococcus epidermidis and Staphylococcus aureus; S. epidermidis is closely associated with indwelling devices and catheters. (Microbiology L3 slides (infective endocarditis))","x":{"1":"Viridans streptococci cause subacute IE on damaged native valves after oral sources.","2":"S. bovis is linked to colorectal carcinoma and GI lesions.","3":"S. pneumoniae is a rare cause of IE."},"m":{"1":"picks viridans for any endocarditis"},"lp":false,"k":"micro-ie-types","src":"materials","kind":"Apply a fact"},{"id":"q203","u":"Microbiology","t":"tf","q":"A nurse states that endocarditis in clients who inject drugs mainly affects the tricuspid valve.","o":["True","False"],"c":0,"w":"True. Intravenous drug abuse endocarditis mainly affects the tricuspid valve and is caused mostly by S. aureus, Pseudomonas aeruginosa and Candida. (Microbiology L3 slides (infective endocarditis))","x":{"1":"This statement is true: IVDU endocarditis is mainly tricuspid."},"m":{},"lp":false,"k":"micro-ie-types","src":"materials","kind":"Apply a fact"},{"id":"q204","u":"Microbiology","t":"tf","q":"A nurse states that subacute infective endocarditis usually affects healthy valves and is mostly caused by Staphylococcus aureus.","o":["True","False"],"c":1,"w":"False. That describes ACUTE IE. Subacute IE usually occurs on preexisting diseased valves, progresses over weeks to months and is caused by less virulent organisms such as viridans streptococci, enterococci and HACEK. (Microbiology L3 slides (infective endocarditis))","x":{"0":"That is acute IE; subacute IE affects diseased valves with less virulent organisms."},"m":{"0":"mixes up acute and subacute IE"},"lp":false,"k":"micro-ie-types","src":"materials","kind":"Apply a fact"},{"id":"q205","u":"Microbiology","t":"mc","q":"A client's blood cultures grow Streptococcus bovis and echocardiography confirms endocarditis. Which follow-up evaluation should the nurse anticipate?","o":["Evaluation for colorectal carcinoma or another GI lesion","A dental examination for an oral source","A review of recent genitourinary procedures","Inspection of a pacemaker pocket for skin contamination"],"c":0,"w":"Streptococcus bovis endocarditis is associated with colorectal carcinoma or other gastrointestinal lesions, so finding it should prompt a search of the bowel. Viridans streptococci point to the mouth, enterococci to GU or GI procedures and staphylococci to skin and devices. (Microbiology L3 slides (infective endocarditis))","x":{"1":"An oral source is typical of viridans streptococci.","2":"GU and GI procedures are linked with Enterococcus faecalis.","3":"Skin contamination at implantation causes cardiac device IE, usually staphylococcal."},"m":{"1":"links S. bovis to the mouth"},"lp":false,"k":"micro-organisms","src":"materials","kind":"Recognize and interpret"},{"id":"q206","u":"Microbiology","t":"mc","q":"An 80-year-old client develops endocarditis two weeks after a urinary tract procedure in the hospital. Which organism should the nurse suspect?","o":["Enterococcus faecalis","Streptococcus mutans","Staphylococcus epidermidis","Kingella"],"c":0,"w":"Enterococcus faecalis is common in elderly and hospital-acquired IE and is often associated with genitourinary or gastrointestinal procedures. It adheres to the damaged valve using teichoic acid. (Microbiology L3 slides (infective endocarditis))","x":{"1":"S. mutans (viridans group) comes from the oral cavity.","2":"S. epidermidis is linked to prosthetic valves and indwelling devices.","3":"Kingella belongs to the HACEK group of pharyngeal flora."},"m":{"1":"picks viridans for any endocarditis"},"lp":false,"k":"micro-organisms","src":"materials","kind":"Recognize and interpret"},{"id":"q207","u":"Microbiology","t":"sata","q":"A client has culture-negative endocarditis and HACEK organisms are suspected. Which organisms belong to the HACEK group? Select all that apply.","o":["Haemophilus","Aggregatibacter","Cardiobacterium hominis","Eikenella corrodens","Kingella","Klebsiella","Enterococcus faecalis","Escherichia coli"],"c":[0,1,2,3,4],"w":"HACEK stands for Haemophilus, Aggregatibacter, Cardiobacterium hominis, Eikenella corrodens and Kingella. They are slow-growing, fastidious Gram-negative bacilli of the pharyngeal flora that cause subacute IE with negative blood cultures unless special media are used. (Microbiology L3 slides (infective endocarditis))","x":{"5":"Klebsiella is a rare Gram-negative cause of IE, mainly in immunocompromised clients, not a HACEK member.","6":"Enterococcus faecalis is a Gram-positive coccus, not a HACEK member.","7":"E. coli is a rare Gram-negative cause, not a HACEK member."},"m":{"5":"thinks the K in HACEK is Klebsiella","6":"thinks the E in HACEK is Enterococcus","7":"thinks the E in HACEK is E. coli"},"lp":false,"k":"micro-organisms","src":"materials","kind":"Recognize and interpret"},{"id":"q208","u":"Microbiology","t":"order","q":"A nurse explains to a client with valve disease how endocarditis develops. Arrange the steps in order.","o":["Damaged valvular endothelium","Platelets and fibrin form a sterile microthrombus","Transient bacteremia, e.g. after a dental procedure","Circulating microbes adhere to the fibrin-platelet matrix","Bacteria proliferate to form a friable vegetation","Fragments break off as septic emboli"],"c":[0,1,2,3,4,5],"w":"IE needs endothelial injury, bacteremia and microbial adherence. Damaged valvular endothelium attracts platelets and fibrin, forming a sterile microthrombus. A transient bacteremia from dental procedures, oral or skin infections, IV drug use or invasive procedures seeds the blood, and organisms adhere to the fibrin-platelet matrix. They proliferate inside it to form a vegetation of fibrin, platelets, bacteria and inflammatory cells, which is friable and can fragment into septic emboli. (Microbiology L3 slides (infective endocarditis))","x":{},"m":{},"lp":false,"k":"micro-patho","src":"materials","kind":"Teaching and statements"},{"id":"q209","u":"Microbiology","t":"cloze","q":"A nurse reviews how organisms stick to damaged heart valves. Match each organism to its adherence factor.","o":{"rows":["Staphylococcus aureus","Viridans streptococci","Enterococcus faecalis","Gram-negative bacteria"],"choices":["Clumping factor and fibronectin-binding protein","Dextran (sticky polysaccharide)","Teichoic acid","Pili","M protein cross-reacting with heart antigens"]},"c":[0,1,2,3],"w":"After a bacteremia, organisms must adhere to the fibrin-platelet matrix on the valve. S. aureus uses clumping factor and fibronectin-binding protein (protein F), viridans streptococci use dextran, a sticky polysaccharide, Enterococcus faecalis uses teichoic acid, and Gram-negative bacteria use pili. (Microbiology L3 slides (infective endocarditis))","x":{"4":"M-protein cross-reaction is the immune mechanism of rheumatic fever, not a valve adherence factor."},"m":{"4":"confuses rheumatic fever with endocarditis"},"lp":false,"k":"micro-patho","src":"materials","rs":{"0":"A client has S. aureus endocarditis. Which adherence factor lets this organism stick to the valve?","1":"A client develops viridans streptococcal endocarditis after dental work. Which adherence factor does the organism use?","2":"A client has Enterococcus faecalis endocarditis. Which adherence factor does this organism use?","3":"A client has Gram-negative bacterial endocarditis. Which structure helps the bacteria adhere?"},"kind":"Apply a fact"},{"id":"q210","u":"Microbiology","t":"sata","q":"A nurse assesses a client with suspected infective endocarditis. Which extracardiac findings are consistent with the diagnosis? Select all that apply.","o":["Splinter hemorrhages under the fingernails","Painless erythematous lesions on the palms and soles","Painful nodules on the pads of the fingers","Retinal hemorrhages","Erythema marginatum","Firm painless subcutaneous nodules on extensor surfaces","Sydenham chorea"],"c":[0,1,2,3],"w":"Septic emboli and immune-mediated injury give IE its extracardiac signs: petechiae, especially splinter hemorrhages under the nails; Janeway lesions (small, nontender, erythematous lesions on palms and soles); Osler nodes (painful nodules on finger and toe pads); and Roth spots (retinal hemorrhages). Rheumatic fever has different skin signs. (Microbiology L3 slides (infective endocarditis))","x":{"4":"Erythema marginatum is a major Jones criterion of acute rheumatic fever.","5":"Subcutaneous nodules on extensor surfaces belong to acute rheumatic fever.","6":"Sydenham chorea is a neurologic manifestation of acute rheumatic fever."},"m":{"4":"confuses rheumatic fever with endocarditis","5":"confuses rheumatic fever with endocarditis"},"lp":false,"k":"micro-signs","src":"materials","kind":"Recognize and interpret"},{"id":"q211","u":"Microbiology","t":"cloze","q":"A nurse documents the skin and eye findings of a client with endocarditis. Match each finding to its description.","o":{"rows":["Janeway lesions","Osler nodes","Roth spots","Splinter hemorrhages"],"choices":["Small, nontender, erythematous lesions on palms and soles","Painful nodules on the pads of the fingers and toes","Retinal hemorrhages","Hemorrhages underneath the fingernails","Firm painless nodules on extensor surfaces"]},"c":[0,1,2,3],"w":"The four classic extracardiac signs of IE are easy to mix up. Janeway lesions are nontender and on palms and soles; Osler nodes are painful and on finger and toe pads (\"O for ouch\"); Roth spots are in the retina; splinter hemorrhages are under the nails. (Microbiology L3 slides (infective endocarditis))","x":{"4":"These are the subcutaneous nodules of acute rheumatic fever."},"m":{"4":"confuses rheumatic fever with endocarditis"},"lp":false,"k":"micro-signs","src":"materials","rs":{"0":"A client with endocarditis has Janeway lesions. Which description should the nurse document?","1":"A client with endocarditis has Osler nodes. Which description fits?","2":"A client with endocarditis has Roth spots on eye examination. What are they?","3":"A nurse notes splinter hemorrhages in a client with endocarditis. Where are they found?"},"kind":"Recognize and interpret"},{"id":"q212","u":"Microbiology","t":"mc","q":"A client is admitted with suspected infective endocarditis and empiric antibiotics are ordered. Which action should the nurse take first?","o":["Draw three sets of blood cultures from different venipuncture sites before the first antibiotic dose.","Give the first antibiotic dose, then draw blood cultures.","Draw one set of blood cultures from the existing IV line.","Wait for the echocardiogram before drawing any cultures."],"c":0,"w":"Blood cultures are the gold standard for diagnosing IE: three sets from different venipuncture sites, taken before treatment. Empiric antibiotics start once cultures have been sampled, then switch to targeted therapy when results are available. Giving antibiotics first is a leading cause of culture-negative endocarditis. (Microbiology L3 slides (infective endocarditis), slide note (gold standard))","x":{"1":"Prior antibiotic therapy is a main cause of culture-negative endocarditis.","2":"The standard is three sets from different venipuncture sites.","3":"Blood cultures are the gold standard and are taken before treatment; empiric therapy starts once they are sampled."},"m":{"1":"gives antibiotics before cultures"},"lp":true,"k":"micro-dx-tx","src":"materials","kind":"Priority / first action"},{"id":"q213","u":"Microbiology","t":"sata","q":"A client's blood cultures stay negative despite clinical endocarditis. Which causes should the nurse consider? Select all that apply.","o":["Antibiotics given before the cultures were drawn","A fastidious organism such as Coxiella burnetii or Bartonella","A HACEK organism","A fungal infection","Infection with Staphylococcus aureus","Drawing three sets from different venipuncture sites"],"c":[0,1,2,3],"w":"Culture-negative endocarditis has three main causes: prior antibiotic therapy before cultures, fastidious bacteria (Coxiella burnetii, Bartonella, Brucella and the HACEK group), which are confirmed by serology or PCR, and fungal infection. (Microbiology L3 slides (infective endocarditis))","x":{"4":"S. aureus grows readily; it is the classic culture-positive cause.","5":"Three sets from different sites is the correct technique, not a cause of negative cultures."},"m":{"4":"thinks S. aureus is hard to culture"},"lp":false,"k":"micro-dx-tx","src":"materials","kind":"Apply a fact"},{"id":"q214","u":"Microbiology","t":"mc","q":"A client with a native valve has suspected endocarditis and blood cultures have been drawn. Which empiric regimen should the nurse anticipate?","o":["Vancomycin plus cefepime","Vancomycin plus cefepime plus gentamicin plus rifampin","Amoxicillin 30-60 minutes before the procedure","Azithromycin alone"],"c":0,"w":"Empiric therapy starts once blood cultures have been sampled. Native valve endocarditis: vancomycin plus cefepime. Prosthetic valve endocarditis: vancomycin plus cefepime plus gentamicin plus rifampin. Therapy is switched to targeted antibiotics when culture results arrive, and antithrombotic agents are part of treatment. (Microbiology L3 slides (infective endocarditis))","x":{"1":"This four-drug regimen is for PROSTHETIC valve endocarditis.","2":"Amoxicillin is a prophylaxis regimen before dental or invasive procedures.","3":"Azithromycin is a prophylaxis option for penicillin-allergic clients."},"m":{"1":"mixes up native and prosthetic valve regimens","2":"confuses prophylaxis with treatment"},"lp":false,"k":"micro-dx-tx","src":"materials","kind":"Recognize and interpret"},{"id":"q215","u":"Microbiology","t":"mc","q":"A client with a prosthetic heart valve and a penicillin allergy is scheduled for a dental extraction. Which prophylaxis should the nurse anticipate?","o":["Azithromycin 30-60 minutes before the procedure","Amoxicillin 30-60 minutes before the procedure","Vancomycin plus cefepime for several weeks","No prophylaxis, because dental procedures are low risk"],"c":0,"w":"Endocarditis prophylaxis is indicated before dental or invasive procedures in clients with high-risk cardiac features or a prosthetic valve, given 30-60 minutes before. Without penicillin allergy, amoxicillin, ampicillin or cefazolin is used; with penicillin allergy, a macrolide such as azithromycin or doxycycline. (Microbiology L3 slides (infective endocarditis))","x":{"1":"Amoxicillin is a penicillin; it is the choice only without penicillin allergy.","2":"This is empiric TREATMENT of native valve endocarditis, not prophylaxis.","3":"Prophylaxis is indicated before dental procedures in clients with a prosthetic valve."},"m":{"1":"ignores the penicillin allergy","2":"confuses prophylaxis with treatment"},"lp":false,"k":"micro-dx-tx","src":"materials","kind":"Recognize and interpret"},{"id":"q216","u":"Microbiology","t":"cloze","q":"A nurse reviews laboratory reports from clients with endocarditis. Match each organism to its identifying result.","o":{"rows":["Staphylococcus aureus","Staphylococcus epidermidis","Viridans streptococci","Streptococcus pneumoniae"],"choices":["Cocci in clusters, coagulase positive","Cocci in clusters, catalase positive, coagulase negative","Cocci in chains, alpha hemolysis, optochin resistant","Lancet-shaped diplococci, optochin sensitive, bile soluble","Cocci in chains, beta hemolysis, catalase negative"]},"c":[0,1,2,3],"w":"Staphylococci grow in clusters and are catalase positive; coagulase separates S. aureus (positive, golden colonies, beta hemolysis, mannitol fermenter) from S. epidermidis (negative). Streptococci grow in chains: viridans streptococci are alpha hemolytic, optochin resistant and bile insoluble, S. pneumoniae is alpha hemolytic but optochin sensitive and bile soluble, and S. pyogenes is beta hemolytic and catalase negative. (Microbiology L3 slides (infective endocarditis))","x":{"4":"This is Streptococcus pyogenes."},"m":{"4":"mixes up streptococcal hemolysis patterns"},"lp":false,"k":"micro-lab-id","src":"materials","rs":{"0":"A client's blood culture grows S. aureus. Which laboratory result identifies it?","1":"A client with a prosthetic valve grows S. epidermidis. Which laboratory result identifies it?","2":"A client's blood culture grows viridans streptococci. Which laboratory result identifies them?","3":"A client's culture grows Streptococcus pneumoniae. Which laboratory result identifies it?"},"kind":"Recognize and interpret"},{"id":"q217","u":"Embryology","t":"mc","q":"A nurse reviews the embryology of a child's head arteries. Which artery develops from the remaining part of the 1st aortic arch?","o":["Maxillary artery","Stapedial artery","Common carotid artery","External carotid artery"],"c":0,"w":"The first two arch vessels largely disappear. The remaining part of the 1st arch forms the maxillary arteries and the remaining part of the 2nd arch forms the stapedial arteries. The 3rd arch gives the carotids, the 4th the aortic arch and right subclavian, and the 6th the pulmonary arteries and ductus arteriosus. (Embryology L3 slides (aortic arches))","x":{"1":"The stapedial artery is the remnant of the 2nd arch.","2":"The common carotid comes from the proximal part of the 3rd arch.","3":"The external carotid is a new bud from the junction of the common and internal carotids."},"m":{"1":"mixes up the 1st and 2nd arches"},"lp":false,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q218","u":"Embryology","t":"cloze","q":"A nurse reviews which adult vessels come from each aortic arch. Match each arch to its derivative.","o":{"rows":["3rd arch (proximal parts)","Left 4th arch","Right 4th arch","Left 6th arch (distal part)"],"choices":["Common carotid arteries","Arch of the aorta between the left common carotid and left subclavian","Proximal part of the right subclavian artery","Ductus arteriosus","Disappears completely"]},"c":[0,1,2,3],"w":"The 3rd arches form the common carotids (proximal parts) and, with the dorsal aorta, the internal carotids. The left 4th arch forms the part of the aortic arch between the left common carotid and left subclavian arteries, and the right 4th arch forms the proximal right subclavian. The 5th arch disappears. The left 6th arch forms the left pulmonary artery (proximal) and the ductus arteriosus (distal). (Embryology L3 slides (aortic arches))","x":{"4":"The 5th arch vessel disappears completely."},"m":{"4":"thinks the 5th arch persists"},"lp":false,"k":"emb-arches","src":"materials","rs":{"0":"A nurse reviews the 3rd aortic arch. What do its proximal parts form?","1":"A child has an anomaly of the left 4th aortic arch. Which adult vessel segment develops from it?","2":"A nurse explains the right 4th aortic arch. Which adult vessel does it form?","3":"A newborn has a patent vessel formed from the distal left 6th arch. Which vessel is it?"},"kind":"Apply a fact"},{"id":"q219","u":"Embryology","t":"mc","q":"A student nurse asks what happens to the 5th aortic arch vessel. Which response is accurate?","o":["It disappears completely.","It forms the stapedial artery.","It forms the ductus arteriosus.","It forms the right pulmonary artery."],"c":0,"w":"Of the six pairs of aortic arch vessels, the 1st and 2nd leave small remnants (maxillary and stapedial arteries), the 3rd, 4th and 6th form major vessels, and the 5th disappears completely. (Embryology L3 slides (aortic arches))","x":{"1":"The stapedial artery comes from the 2nd arch.","2":"The ductus arteriosus comes from the distal left 6th arch.","3":"The right pulmonary artery comes from the proximal right 6th arch."},"m":{"1":"mixes up the 2nd
