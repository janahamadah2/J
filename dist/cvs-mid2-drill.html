olic murmur. These findings are most suggestive of?","o":["Mitral stenosis","Aortic stenosis","Pulmonary stenosis","Mitral regurgitation"],"c":0,"w":"Chronic rheumatic heart disease most commonly scars the mitral valve into stenosis, decades after ARF. A diastolic opening snap and rumbling murmur are the sounds of a stenotic mitral valve; the murmur detail is from the bank, not your slides. (Shams Practices QB, 2023 Q102; Pathology L3 slides (rheumatic fever))","x":{"1":"Aortic stenosis gives a SYSTOLIC murmur.","2":"Pulmonary stenosis gives a systolic murmur and is not the usual rheumatic lesion.","3":"Mitral regurgitation gives a SYSTOLIC murmur."},"m":{},"lp":true,"k":"path-rhd","src":"materials","kind":"Recognize and interpret"},{"id":"q309","u":"Pathology","t":"mc","q":"Most affected valves regarding valvular diseases are?","o":["Mitral and Aortic","Aortic and pulmonary","Tricuspid and pulmonary","Mitral and pulmonary"],"c":0,"w":"Rheumatic vegetations and chronic scarring favor the high-pressure valves: mitral (65%) then aortic (25%). (Shams Practices QB, Unknown-2 Q176; Pathology L3 slides (rheumatic fever))","x":{"1":"The pulmonary valve is rarely affected.","2":"The right-sided valves are rarely affected.","3":"The pulmonary valve is rarely affected."},"m":{},"lp":true,"k":"path-rhd","src":"materials","kind":"Apply a fact"},{"id":"q310","u":"Pathology","t":"mc","q":"A woman with systemic lupus erythematosus dies, and autopsy reveals sterile, wart-like vegetations on the heart valves. What is the most likely diagnosis?","o":["Libman–Sacks endocarditis","Acute bacterial endocarditis","Calcific aortic stenosis","Mitral valve prolapse"],"c":0,"w":"Your slides list SLE among the causes of valve vegetations; the name for these sterile verrucous vegetations is Libman-Sacks endocarditis (from the bank's key). (Shams Practices QB, 2025 Q18; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Bacterial endocarditis has INFECTED (septic) vegetations.","2":"Calcific aortic stenosis has no vegetations.","3":"Mitral valve prolapse has no vegetations."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q311","u":"Pathology","t":"mc","q":"A woman died from systemic lupus. During the autopsy, the medical examiner found vegetations that had a warty (verrucous) appearance. What is the cause?","o":["Libman–Sacks disease","Calcific aortic stenosis","Aortic dissection","Congenital pulmonary valve stenosis"],"c":0,"w":"Verrucous sterile vegetations in SLE are Libman-Sacks endocarditis. (Shams Practices QB, 2024 May Q69; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Calcific aortic stenosis has no vegetations.","2":"Aortic dissection is a tear in the aortic wall.","3":"Congenital pulmonary stenosis has no vegetations."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q312","u":"Pathology","t":"mc","q":"A patient known to have SLE with high anti-nuclear antibodies, joint inflammation and renal involvement developed endocarditis. What type of endocarditis is it?","o":["Libman–Sacks endocarditis","Acute staphylococcal endocarditis","Fungal endocarditis","Prosthetic valve endocarditis"],"c":0,"w":"Endocarditis in SLE is Libman-Sacks endocarditis, with sterile verrucous vegetations. (Shams Practices QB, 2022 Q134; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Acute staphylococcal endocarditis is infective, with no link to SLE.","2":"Fungal endocarditis occurs mostly in immunocompromised clients, IV drug use or prosthetic valves.","3":"Prosthetic valve endocarditis needs a prosthetic valve."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q313","u":"Pathology","t":"mc","q":"Mucinous adenocarcinoma is associated with which cardiac lesion?","o":["Nonbacterial thrombotic endocarditis (NBTE)","Congenital pulmonary valve stenosis","Rheumatic mitral stenosis","Libman–Sacks endocarditis"],"c":0,"w":"Mucinous adenocarcinoma is associated with nonbacterial thrombotic endocarditis (sterile vegetations from a hypercoagulable state). Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem expanded from \"Mucinous adenocarcinoma?\".) (Shams Practices QB, 2024 May Q48; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Congenital pulmonary stenosis is a birth defect.","2":"Rheumatic mitral stenosis follows rheumatic fever.","3":"Libman-Sacks endocarditis is associated with SLE."},"m":{"3":"mixes up NBTE and Libman-Sacks"},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q314","u":"Pathology","t":"mc","q":"Cause of systemic pyemia?","o":["Infective endocarditis","Mitral valve prolapse","Atrial septal defect","Stable angina"],"c":0,"w":"Pyemia is spread of infected emboli. Your slides note that septic thrombi produce pyemia and that infective endocarditis vegetations shed septic emboli causing abscesses. (Shams Practices QB, 2024 May Q70; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Mitral valve prolapse is not an infection.","2":"An atrial septal defect is a structural defect, not an infection.","3":"Stable angina is ischemic chest pain, not an infection."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q315","u":"Pathology","t":"mc","q":"Systemic pyemic abscess is a complication of?","o":["Acute infective endocarditis","Stable angina","Mitral valve prolapse","Congenital pulmonary stenosis"],"c":0,"w":"Septic emboli from acute infective endocarditis vegetations cause infarcts and abscesses in brain, kidney, spleen and lung. (Shams Practices QB, 2023 Q105; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Stable angina is ischemic chest pain, not an infection.","2":"Mitral valve prolapse is not an infection.","3":"Congenital pulmonary stenosis is a birth defect, not an infection."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q316","u":"Pathology","t":"mc","q":"Systemic pyemic abscess is a complication of which condition?","o":["Acute infective endocarditis","Stable angina","Mitral valve prolapse","Atrial septal defect"],"c":0,"w":"Infected emboli from acute infective endocarditis cause abscesses in distant organs (pyemia). (Shams Practices QB, 2022 Q131; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Stable angina is ischemic chest pain, not an infection.","2":"Mitral valve prolapse is not an infection.","3":"An atrial septal defect is a structural defect, not an infection."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q317","u":"Pathology","t":"mc","q":"Acute infective endocarditis consists of?","o":["Suppurative inflammation","Granulomatous inflammation with caseous necrosis","Sterile fibrin deposition without inflammation","Calcification without inflammation"],"c":0,"w":"Acute infective endocarditis, usually from virulent organisms such as S. aureus, is a suppurative (pus-forming) inflammation that rapidly destroys the valve. Not in your uploaded pathology slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q177; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Caseating granulomas describe tuberculosis-type inflammation.","2":"Sterile fibrin deposits describe NBTE or Libman-Sacks vegetations.","3":"Calcification without inflammation describes degenerative valve disease."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q318","u":"Pathology","t":"mc","q":"Stable angina is caused by:","o":["Uncomplicated atheroma","Acute pericarditis","Aortic dissection","Pulmonary embolism"],"c":0,"w":"Stable angina comes from a fixed, uncomplicated atheroma that limits flow on effort; acute plaque changes (rupture, thrombosis) cause infarction instead. The pairing is from the bank's key. (Stem expanded from \"stable angina :\".) (Shams Practices QB, Unknown-1 Q148; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Acute pericarditis is inflammation of the pericardium.","2":"Aortic dissection is a tear in the aortic wall.","3":"Pulmonary embolism is a blocked pulmonary artery."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q319","u":"Pathology","t":"mc","q":"Granulation tissue appears in a myocardial infarct after:","o":["7 days","30 minutes","2 hours","6 months"],"c":0,"w":"Granulation tissue forms in an infarct at about 7 days, as it is repaired; it is replaced by a scar over weeks. Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem expanded from \"Granulation tissue :\".) (Shams Practices QB, Unknown-1 Q150; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"At 30 minutes the infarct shows no visible change.","2":"At 2 hours there is still no granulation tissue.","3":"By 6 months the infarct is a dense scar."},"m":{},"lp":true,"k":"path-past","src":"materials","kind":"Apply a fact"},{"id":"q320","u":"Pathology","t":"mc","q":"Atherosclerosis involves:","o":["Macrophage engulf lipid","Neutrophils produce antibodies","Erythrocytes synthesize collagen","Platelets produce hemoglobin"],"c":0,"w":"In atherogenesis macrophages and smooth muscle cells engulf lipid and become foam cells, forming the fatty streak. (Stem expanded from \"atherosclerosis :\".) (Shams Practices QB, Unknown-1 Q146; Pathology L4 slides (atherosclerosis))","x":{"1":"Antibodies are made by plasma cells, not neutrophils.","2":"Collagen in plaques is made by smooth muscle cells, not red cells.","3":"Platelets do not make hemoglobin."},"m":{},"lp":true,"k":"path-athero","src":"materials","kind":"Apply a fact"},{"id":"q321","u":"Pathology","t":"mc","q":"Arteriolosclerosis is associated with:","o":["Hypertension","Allergic rhinitis","Lactose intolerance","Acute appendicitis"],"c":0,"w":"Arteriolosclerosis affects small arteries and arterioles and is associated with hypertension and diabetes mellitus. (Stem expanded from \"Arteriolosclerosis\".) (Shams Practices QB, Unknown-1 Q147; Pathology L4 slides (atherosclerosis))","x":{"1":"Allergic rhinitis is nasal allergy.","2":"Lactose intolerance is an enzyme deficiency.","3":"Appendicitis is an acute abdominal infection."},"m":{},"lp":true,"k":"path-arteriosclerosis","src":"materials","kind":"Apply a fact"},{"id":"q322","u":"Pharmacology","t":"mc","q":"A woman with hypertension is in early pregnancy. Which antihypertensive is contraindicated because it is an angiotensin-converting enzyme (ACE) inhibitor?","o":["Enalapril","Labetalol","Methyldopa","Extended-release nifedipine"],"c":0,"w":"ACE inhibitors such as enalapril are pregnancy category D and should not be used in pregnancy. Methyldopa is often preferred and labetalol is used for hypertension in pregnancy. (Shams Practices QB, 2025 Q26; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Labetalol is an alpha-beta blocker used for hypertension in pregnancy.","2":"Methyldopa is often preferred in pregnancy because it is not harmful to the fetus.","3":"Nifedipine is a dihydropyridine CCB, not an ACE inhibitor."},"m":{"2":"thinks methyldopa is unsafe in pregnancy"},"lp":true,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q323","u":"Pharmacology","t":"mc","q":"A patient taking lisinopril and amlodipine for hypertension develops hyperkalemia. Which medication is the most likely cause?","o":["Lisinopril","Amlodipine","Acetaminophen","Loratadine"],"c":0,"w":"ACE inhibitors such as lisinopril reduce angiotensin II and aldosterone and cause hyperkalemia. Amlodipine is a dihydropyridine CCB and does not raise potassium. (Shams Practices QB, 2025 Q27; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Amlodipine is a calcium channel blocker, which does not cause hyperkalemia.","2":"Acetaminophen is a pain reliever, not an antihypertensive.","3":"Loratadine is an antihistamine."},"m":{},"lp":true,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q324","u":"Pharmacology","t":"mc","q":"Which ACE inhibitor can be administered intravenously to treat hypertension when oral therapy is impractical?","o":["Enalaprilat","Captopril","Lisinopril","Ramipril"],"c":0,"w":"All ACE inhibitors except enalaprilat are given orally only; enalaprilat is the IV form used in hypertensive emergencies. (Shams Practices QB, 2025 Q30; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Captopril is given by mouth only.","2":"Lisinopril is given by mouth only.","3":"Ramipril is an oral ACE inhibitor (a prodrug)."},"m":{"1":"thinks captopril can be given IV"},"lp":true,"k":"pharm-ras","src":"materials","kind":"Apply a fact"},{"id":"q325","u":"Pharmacology","t":"mc","q":"Which change has been proposed to contribute to the long-term vasodilator effect of thiazide diuretics?","o":["Decreased sodium content in vascular smooth muscle","Increased intracellular calcium in vascular smooth muscle","Increased alpha₁-receptor stimulation in vascular smooth muscle","Increased endothelin-mediated vasoconstriction"],"c":0,"w":"Depletion of body Na+ lowers smooth muscle Na+, which lowers intracellular Ca++ through the Na/Ca exchanger and relaxes arterioles. (Shams Practices QB, 2025 Q28; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Intracellular calcium FALLS, which is why the vessels relax.","2":"Alpha-1 stimulation would constrict vessels.","3":"Endothelin-mediated vasoconstriction would raise resistance."},"m":{"1":"reverses the calcium effect of diuretics"},"lp":true,"k":"pharm-diuretics","src":"materials","kind":"Apply a fact"},{"id":"q326","u":"Pharmacology","t":"mc","q":"Which potentially toxic metabolite can accumulate during a prolonged intravenous infusion of sodium nitroprusside?","o":["Thiocyanate","Urea","Bilirubin","Creatinine"],"c":0,"w":"Red blood cells metabolize nitroprusside, releasing cyanide, which is converted to thiocyanate; both can accumulate with prolonged infusion. (Shams Practices QB, 2025 Q29; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Urea is a normal nitrogen waste product.","2":"Bilirubin comes from hemoglobin breakdown.","3":"Creatinine comes from muscle creatine."},"m":{},"lp":true,"k":"pharm-vasodilators","src":"materials","kind":"Apply a fact"},{"id":"q327","u":"Pharmacology","t":"mc","q":"Beta blocker drug that can also block K channels?","o":["Sotalol","Atenolol","Metoprolol","Esmolol"],"c":0,"w":"Sotalol is a beta blocker that also blocks K+ channels, so it acts as a class III antiarrhythmic. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q56; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Atenolol is a selective beta-1 blocker without K+ channel block.","2":"Metoprolol is a selective beta-1 blocker without K+ channel block.","3":"Esmolol is a short-acting beta-1 blocker without K+ channel block."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q328","u":"Pharmacology","t":"mc","q":"During antiarrhythmic treatment a patient suffers from headache and tinnitus. Which drug is the cause?","o":["Quinidine","Omeprazole","Metformin","Levothyroxine"],"c":0,"w":"Quinidine causes cinchonism: headache, dizziness and tinnitus. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q57; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Metformin is a diabetes drug.","3":"Levothyroxine is thyroid hormone replacement."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q329","u":"Pharmacology","t":"mc","q":"In paroxysmal supraventricular tachycardia we choose?","o":["Adenosine","Atorvastatin","Levothyroxine","Omeprazole"],"c":0,"w":"Adenosine is the drug of choice to stop paroxysmal supraventricular tachycardia. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q59; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Atorvastatin is a statin for high cholesterol.","2":"Levothyroxine is thyroid hormone replacement.","3":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q330","u":"Pharmacology","t":"mc","q":"Which drug blocks Na and K channels?","o":["Procainamide","Omeprazole","Metformin","Levothyroxine"],"c":0,"w":"Procainamide is a class IA antiarrhythmic that blocks both Na+ and K+ channels. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q83; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Metformin is a diabetes drug.","3":"Levothyroxine is thyroid hormone replacement."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q331","u":"Pharmacology","t":"mc","q":"A patient came to the ER complaining of ventricular arrhythmia. After treatment the patient complained of headaches, dizziness and tinnitus. Which drug caused those symptoms?","o":["Quinidine","Adenosine","Esmolol","Atropine"],"c":0,"w":"Headache, dizziness and tinnitus are cinchonism, the classic adverse effect of quinidine. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q84; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Adenosine causes brief flushing and chest discomfort, not tinnitus.","2":"Esmolol is a short-acting beta blocker.","3":"Atropine is an anticholinergic used for bradycardia."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q332","u":"Pharmacology","t":"mc","q":"Which drug works on both ventricular and supraventricular arrhythmias?","o":["Amiodarone","Atorvastatin","Famotidine","Levothyroxine"],"c":0,"w":"Amiodarone is a broad-spectrum antiarrhythmic effective in both ventricular and supraventricular arrhythmias. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q85; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Atorvastatin is a statin.","2":"Famotidine is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Levothyroxine is thyroid hormone replacement."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q333","u":"Pharmacology","t":"mc","q":"Which of the following drugs is not in class I?","o":["Amiodarone","Quinidine","Lidocaine","Flecainide"],"c":0,"w":"Quinidine (IA), lidocaine (IB) and flecainide (IC) are class I Na+ channel blockers; amiodarone is class III. Note: the paper prints only options a-c but keys \"d\"; option d, \"Amiodarone\", is restored here as the class III drug used elsewhere in this bank. Not in your uploaded Mid 2 slides. (Shams Practices QB, 2023 Q111; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Quinidine is a class IA antiarrhythmic.","2":"Lidocaine is a class IB antiarrhythmic.","3":"Flecainide is a class IC antiarrhythmic."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q334","u":"Pharmacology","t":"mc","q":"A patient came to the clinic with pulmonary fibrosis; respiratory cultures were negative, and he noted he had taken an antiarrhythmic drug. Which drug do you suspect?","o":["Amiodarone","Adenosine","Esmolol","Lidocaine"],"c":0,"w":"Amiodarone causes pulmonary fibrosis. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2023 Q114; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Adenosine acts for seconds and does not cause fibrosis.","2":"Esmolol is a short-acting beta blocker.","3":"Lidocaine is a class IB drug that does not cause lung fibrosis."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Recognize and interpret"},{"id":"q335","u":"Pharmacology","t":"mc","q":"A patient was having side effects of headache, tinnitus and dizziness. Which drug is most likely to cause such side effects?","o":["Quinidine","Polyethylene glycol","Docusate","Calcium carbonate"],"c":0,"w":"Quinidine causes cinchonism: headache, tinnitus and dizziness. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q126; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Polyethylene glycol is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Docusate is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Calcium carbonate is an antacid and calcium supplement."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q336","u":"Pharmacology","t":"mc","q":"This drug blocks Na+ channels with no effect on the action potential duration:","o":["Flecainide","Amlodipine","Lisinopril","Losartan"],"c":0,"w":"Flecainide (class IC) blocks Na+ channels strongly with little effect on action potential duration. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q128; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Amlodipine is a dihydropyridine calcium channel blocker.","2":"Lisinopril is an ACE inhibitor.","3":"Losartan is an angiotensin receptor blocker."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q337","u":"Pharmacology","t":"mc","q":"Class 3 antiarrhythmics are:","o":["Potassium channel blockers","Sodium channel blockers","Beta receptor blockers","Calcium channel blockers"],"c":0,"w":"Class III antiarrhythmics (amiodarone, sotalol) block K+ channels and prolong repolarization. Class I block Na+, class II are beta blockers, class IV block Ca++. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-1 Q152; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Sodium channel blockers are class I.","2":"Beta blockers are class II.","3":"Calcium channel blockers are class IV."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q338","u":"Pharmacology","t":"mc","q":"Drug for intraoperative use:","o":["Esmolol","Ezetimibe","Cholestyramine","Fenofibrate"],"c":0,"w":"Esmolol is a very short-acting IV beta blocker, so it suits intraoperative control of heart rate and pressure. It is on your hypertension drug list; its intraoperative use is from the bank's key. (Shams Practices QB, Unknown-1 Q153; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Ezetimibe blocks intestinal cholesterol absorption.","2":"Cholestyramine binds bile acids in the gut.","3":"Fenofibrate lowers triglycerides."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q339","u":"Pharmacology","t":"mc","q":"Gray-blue skin discoloration in sun-exposed areas (smurf skin) is caused by:","o":["Amiodarone","Adenosine","Esmolol","Diltiazem"],"c":0,"w":"Amiodarone can cause blue-gray discoloration of sun-exposed skin. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-1 Q154; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Adenosine acts for seconds and has no skin effect.","2":"Esmolol is a short-acting beta blocker.","3":"Diltiazem is a non-dihydropyridine CCB."},"m":{},"lp":true,"k":"pharm-antiarrhythmic","src":"materials","kind":"Apply a fact"},{"id":"q340","u":"Pharmacology","t":"mc","q":"During antihyperlipidemic treatment a patient suffers from muscle pain. Which drug is the cause?","o":["Lovastatin","Famotidine","Loratadine","Polyethylene glycol"],"c":0,"w":"Statins such as lovastatin cause muscle pain (myopathy). Note: the paper prints only options a-c but keys \"d\"; option d, \"Lovastatin\", is restored from the matching questions in this bank. Not in your uploaded Mid 2 slides. (Shams Practices QB, 2024 Nov Q58; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Famotidine is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Loratadine is an antihistamine.","3":"Polyethylene glycol is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q341","u":"Pharmacology","t":"mc","q":"Niacin (antihyperlipidemic) can cause?","o":["Hyperuricemia","Iron-deficiency anemia","Vitamin B12 deficiency","Hypocalcemia"],"c":0,"w":"Niacin can raise uric acid (hyperuricemia) and cause flushing. Your slides mention large-dose vitamin B3 as a cholesterol-lowering dietary factor; its adverse effects are from the bank's key. (Shams Practices QB, 2024 Nov Q60; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Iron-deficiency anemia is not a niacin effect.","2":"B12 deficiency is not a niacin effect.","3":"Hypocalcemia is not a niacin effect."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q342","u":"Pharmacology","t":"mc","q":"A patient diagnosed with hyperlipidemia is prescribed cholestyramine. What is the action of this drug?","o":["Binds bile acids in the intestine and is excreted with them in the stool","Blocks beta₁ receptors in the heart","Inhibits gastric acid secretion","Blocks sodium channels in peripheral nerves"],"c":0,"w":"Cholestyramine is a bile acid sequestrant: it binds bile acids in the gut so they are lost in the stool, and the liver uses cholesterol to make more. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q74; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Blocking beta-1 receptors is the action of beta blockers.","2":"Inhibiting gastric acid is the action of drugs such as omeprazole.","3":"Blocking nerve sodium channels is the action of local anesthetics."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q343","u":"Pharmacology","t":"mc","q":"Which of the following is the drug of choice for hypertriglyceridemia?","o":["Fenofibrate","Amlodipine","Omeprazole","Loratadine"],"c":0,"w":"Fibrates such as fenofibrate are the drugs of choice for high triglycerides. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q86; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Amlodipine is a calcium channel blocker.","2":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Loratadine is an antihistamine."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q344","u":"Pharmacology","t":"mc","q":"A woman came to the ER complaining of muscle pain. She has a history of hyperlipidemia and is taking medication to treat it. Which drug caused her pain?","o":["Lovastatin","Pantoprazole","Cetirizine","Docusate"],"c":0,"w":"Statins such as lovastatin can cause myalgia and myopathy. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q87; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pantoprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","2":"Cetirizine is an antihistamine.","3":"Docusate is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q345","u":"Pharmacology","t":"mc","q":"Which of the following drugs is a selective inhibitor of intestinal cholesterol absorption?","o":["Ezetimibe","Fenofibrate","Atorvastatin","Niacin"],"c":0,"w":"Ezetimibe selectively blocks cholesterol absorption in the intestine. Your slides describe the same idea for plant sterols. The drug answer is from the bank's key. (Shams Practices QB, 2023 Q112; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Fenofibrate lowers triglycerides.","2":"Atorvastatin inhibits HMG CoA reductase.","3":"Niacin lowers triglycerides and raises HDL."},"m":{"2":"mixes up statins and ezetimibe"},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q346","u":"Pharmacology","t":"mc","q":"A patient treated with an antihyperlipidemic drug has rhabdomyolysis. Which drug has been used to treat him?","o":["Lovastatin","Loratadine","Famotidine","Polyethylene glycol"],"c":0,"w":"Statins can cause rhabdomyolysis, the severe form of statin myopathy. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2023 Q113; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Loratadine is an antihistamine.","2":"Famotidine is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Polyethylene glycol is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q347","u":"Pharmacology","t":"mc","q":"Adverse effect of niacin includes?","o":["Skin flushing","Gingival hyperplasia","Tooth discoloration","Orange discoloration of urine"],"c":0,"w":"Niacin causes skin flushing. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q127; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Gingival hyperplasia is not a niacin effect.","2":"Tooth discoloration is not a niacin effect.","3":"Orange urine is not a niacin effect."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q348","u":"Pharmacology","t":"mc","q":"A 62-year-old patient is on lovastatin; cholesterol levels decreased but he still has high triglycerides and low HDL. Which drug should be used?","o":["Niacin","Lisinopril","Omeprazole","Loratadine"],"c":0,"w":"Niacin lowers triglycerides and raises HDL, so it covers what a statin leaves. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q129; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Lisinopril is an ACE inhibitor for blood pressure.","2":"Omeprazole is a gastrointestinal drug (acid suppression or laxative), unrelated to the heart.","3":"Loratadine is an antihistamine."},"m":{},"lp":true,"k":"pharm-lipid","src":"materials","kind":"Apply a fact"},{"id":"q349","u":"Pharmacology","t":"mc","q":"A patient with increased nitrate tolerance is treated by?","o":["No therapy for a brief time","Shortening the interval between nitrate doses","Switching to continuous nitrate infusion","Adding an extra nitrate dose during the nitrate-free interval"],"c":0,"w":"Tolerance to nitrates develops with continuous exposure and is prevented or reversed by a daily nitrate-free interval. Your slides list nitrates as coronary dilators; tolerance is from the bank's key. (Shams Practices QB, Unknown-2 Q170; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Shorter dosing intervals give more continuous exposure, worsening tolerance.","2":"Continuous infusion is the setting in which tolerance develops.","3":"Filling the nitrate-free interval removes the break that prevents tolerance."},"m":{},"lp":true,"k":"pharm-antianginal","src":"materials","kind":"Apply a fact"},{"id":"q350","u":"Pharmacology","t":"mc","q":"Beta blocker action in angina is to?","o":["Decrease O₂ demand","Increase heart rate through β₁ stimulation","Increase myocardial contractility through β₁ stimulation","Increase renin release through β₁ stimulation"],"c":0,"w":"Beta blockers block cardiac beta-1 receptors, lowering heart rate and contractility, so the heart needs less oxygen; your slides list exertional angina among their uses. (Shams Practices QB, Unknown-2 Q171; Pharmacology L2-L4 slides (treatment of hypertension))","x":{"1":"Beta blockers DEcrease heart rate by blocking beta-1.","2":"Beta blockers DEcrease contractility.","3":"Beta blockers INHIBIT renin release from juxtaglomerular cells."},"m":{"1":"thinks beta blockers stimulate beta receptors"},"lp":true,"k":"pharm-antianginal","src":"materials","kind":"Apply a fact"},{"id":"q351","u":"Pharmacology","t":"mc","q":"Contraindication of nitrate is?","o":["Hyperthyroidism","Myopia","Lactose intolerance","Seasonal allergic rhinitis"],"c":0,"w":"The bank keys hyperthyroidism. Note: this is not in your slides, and standard nitrate contraindications are mainly hypotension and recent use of PDE-5 inhibitors; hyperthyroidism is simply the only cardiovascular-relevant option offered here. Check with your instructor. (Shams Practices QB, Unknown-2 Q175; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Myopia is short-sightedness, unrelated to nitrates.","2":"Lactose intolerance is an enzyme deficiency, unrelated to nitrates.","3":"Allergic rhinitis is nasal allergy, unrelated to nitrates."},"m":{},"lp":true,"k":"pharm-antianginal","src":"materials","kind":"Apply a fact"},{"id":"q352","u":"Biochemistry","t":"mc","q":"Which antioxidant enzyme contains selenium in its active site and uses reduced glutathione to break down peroxides?","o":["Glutathione peroxidase","Catalase","Superoxide dismutase","Glutathione reductase"],"c":0,"w":"Glutathione peroxidase uses reduced glutathione to break down peroxides and contains selenium. Your slides list glutathione peroxidase among the enzymatic antioxidants and selenium among the nutrient antioxidants; the link between them is from the bank's key. (Shams Practices QB, 2025 Q21; Biochemistry L6 slides (oxidative stress))","x":{"1":"Catalase breaks down H2O2 without glutathione or selenium.","2":"Superoxide dismutase converts superoxide into H2O2.","3":"Glutathione reductase regenerates reduced glutathione; it does not break down peroxides."},"m":{"3":"mixes up glutathione peroxidase and reductase"},"lp":true,"k":"bio-burst-no","src":"materials","kind":"Apply a fact"},{"id":"q353","u":"Biochemistry","t":"mc","q":"Which molecule mediates vasodilation after administration of sublingual nitroglycerin?","o":["Nitric oxide (NO)","Endothelin-1","Angiotensin II","Thromboxane A₂"],"c":0,"w":"Nitroglycerin is metabolized into nitric oxide, which relaxes vascular smooth muscle and relieves coronary spasm in angina. (Shams Practices QB, 2025 Q24; Biochemistry L6 slides (oxidative stress))","x":{"1":"Endothelin-1 is a vasoconstrictor.","2":"Angiotensin II is a vasoconstrictor.","3":"Thromboxane A2 is a vasoconstrictor that promotes platelet aggregation."},"m":{},"lp":true,"k":"bio-burst-no","src":"materials","kind":"Apply a fact"},{"id":"q354","u":"Biochemistry","t":"mc","q":"Nitroglycerin is metabolized into?","o":["Nitric oxide","Angiotensin II","Endothelin-1","Thromboxane A₂"],"c":0,"w":"Vasodilators such as nitroglycerin are metabolized into NO, which dilates coronary arteries in spasm. (Shams Practices QB, 2023 Q108; Biochemistry L6 slides (oxidative stress))","x":{"1":"Angiotensin II is a vasoconstrictor.","2":"Endothelin-1 is a vasoconstrictor.","3":"Thromboxane A2 is a vasoconstrictor."},"m":{},"lp":true,"k":"bio-burst-no","src":"materials","kind":"Apply a fact"},{"id":"q355","u":"Biochemistry","t":"mc","q":"Which of the following converts molecular oxygen into superoxide to help kill bacteria?","o":["NADPH oxidase","Catalase","Glutathione reductase","Carbonic anhydrase"],"c":0,"w":"In the respiratory burst of phagocytes, NADPH oxidase converts molecular oxygen into superoxide, which leads on to H2O2 and hypochlorous acid. (The paper calls it a \"ROS\"; it is the enzyme that makes ROS.) (Shams Practices QB, 2024 May Q81; Biochemistry L6 slides (oxidative stress))","x":{"1":"Catalase breaks down H2O2; it is an antioxidant enzyme.","2":"Glutathione reductase regenerates glutathione, an antioxidant role.","3":"Carbonic anhydrase makes bicarbonate from CO2 and water."},"m":{},"lp":true,"k":"bio-burst-no","src":"materials","kind":"Apply a fact"},{"id":"q356","u":"Biochemistry","t":"mc","q":"In microbial killing, molecular oxygen is converted into superoxide by?","o":["NADPH oxidase","Catalase","Pancreatic amylase","Creatine kinase"],"c":0,"w":"NADPH oxidase in neutrophils and monocytes converts O2 into superoxide during the respiratory burst. (Shams Practices QB, 2022 Q119; Biochemistry L6 slides (oxidative stress))","x":{"1":"Catalase breaks down H2O2.","2":"Pancreatic amylase digests starch.","3":"Creatine kinase transfers phosphate in muscle energy metabolism."},"m":{},"lp":true,"k":"bio-burst-no","src":"materials","kind":"Apply a fact"},{"id":"q357","u":"Biochemistry","t":"mc","q":"Which modification of LDL occurs early in atherosclerosis and promotes foam cell formation?","o":["Oxidation of LDL","Conversion of LDL into HDL","Conversion of LDL into chylomicrons","Conversion of LDL into albumin"],"c":0,"w":"LDL that enters the intima is oxidized by free radicals; macrophages take up oxidized LDL via scavenger receptors and become foam cells. (Shams Practices QB, 2025 Q22; Biochemistry L6 slides (oxidative stress))","x":{"1":"LDL is not converted into HDL.","2":"Chylomicrons are made in the intestine from dietary fat, not from LDL.","3":"Albumin is a plasma protein, not made from LDL."},"m":{},"lp":true,"k":"bio-oxldl","src":"materials","kind":"Apply a fact"},{"id":"q358","u":"Biochemistry","t":"mc","q":"Which of the following is the first step in formation of atherosclerotic plaques?","o":["Oxidized LDL","Calcification of the plaque","Rupture of the fibrous cap","Hemorrhage into the plaque"],"c":0,"w":"Among these options, LDL oxidation in the intima comes earliest; your slides list endothelial dysfunction first, then LDL retention and oxidation. Calcification, cap rupture and hemorrhage are late changes. (Shams Practices QB, 2024 May Q82; Biochemistry L6 slides (oxidative stress))","x":{"1":"Calcification is a late change in a progressed plaque.","2":"Rupture of the fibrous cap is a late complication.","3":"Hemorrhage into a plaque is an acute plaque change."},"m":{},"lp":true,"k":"bio-oxldl","src":"materials","kind":"Priority / first action"},{"id":"q359","u":"Biochemistry","t":"mc","q":"The core of an atherosclerotic plaque contains:","o":["Oxidized LDL","Bile salts","Glycogen granules","Keratin"],"c":0,"w":"The plaque core is rich in lipid, including oxidized LDL, debris and dead foam cells. (Stem fixed from \"Atherosclerosis contain in its core :\".) (Shams Practices QB, Unknown-1 Q140; Biochemistry L6 slides (oxidative stress))","x":{"1":"Bile salts are in bile, not plaques.","2":"Glycogen is a stored carbohydrate in liver and muscle.","3":"Keratin is a skin and hair protein."},"m":{},"lp":true,"k":"bio-oxldl","src":"materials","kind":"Apply a fact"},{"id":"q360","u":"Biochemistry","t":"mc","q":"Which effect of omega-3 fatty acids may help lower the risk of coronary heart disease?","o":["Reduced vascular thrombosis","Increased platelet aggregation","Increased coronary vasoconstriction","Increased formation of blood clots"],"c":0,"w":"Omega-3 fats suppress arrhythmia, reduce triacylglycerol, decrease the tendency to vascular thrombosis and reduce inflammation. (Shams Practices QB, 2025 Q23; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"More platelet aggregation would RAISE risk.","2":"Vasoconstriction would raise risk.","3":"More clots would raise risk."},"m":{},"lp":true,"k":"bio-fats","src":"materials","kind":"Apply a fact"},{"id":"q361","u":"Biochemistry","t":"mc","q":"A doctor advises a patient to reduce dietary trans fat intake. How does trans fat affect blood LDL cholesterol?","o":["It increases LDL cholesterol","It decreases LDL cholesterol","It leaves LDL cholesterol unchanged","It removes all LDL cholesterol from the bloodstream"],"c":0,"w":"Trans fats are chemically unsaturated but behave like saturated fats: they raise LDL-cholesterol and lower HDL-cholesterol. (Shams Practices QB, 2025 Q25; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Lowering LDL is the effect of MUFA and omega-6 fats.","2":"Trans fats do change LDL: they raise it.","3":"No fat removes all LDL."},"m":{"1":"thinks trans fats behave like unsaturated fats"},"lp":true,"k":"bio-fats","src":"materials","kind":"Apply a fact"},{"id":"q362","u":"Biochemistry","t":"mc","q":"HDL is increased by:","o":["Olive oil – Fish oil","Cigarette smoking","Physical inactivity","Industrial trans fat intake"],"c":0,"w":"Substituting monounsaturated fat (olive oil) for saturated fat raises HDL-cholesterol; fish oils are the protective omega-3 fats. (Stem fixed from \"increase HDL by :\".) (Shams Practices QB, Unknown-1 Q144; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Smoking is a coronary risk factor.","2":"Lack of exercise is a coronary risk factor.","3":"Trans fats LOWER HDL."},"m":{},"lp":true,"k":"bio-fats","src":"materials","kind":"Apply a fact"},{"id":"q363","u":"Biochemistry","t":"mc","q":"Biological effect of trans fatty acids is seen with:","o":["Palm oil","Egg whites","Table salt","Distilled water"],"c":0,"w":"The bank keys palm oil. Note: the question looks garbled; your slides list palm oil as a source of SATURATED fat, and trans fats come from partially hydrogenated vegetable oils. Palm oil is the only fat among the options. (Stem fixed from \"trans fatty acids biologi effect :\".) (Shams Practices QB, Unknown-1 Q145; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Egg whites are mostly protein and contain no fat.","2":"Table salt contains no fat.","3":"Distilled water contains no fat."},"m":{},"lp":true,"k":"bio-fats","src":"materials","kind":"Apply a fact"},{"id":"q364","u":"Biochemistry","t":"mc","q":"In the diet, which prevents coronary heart disease?","o":["Oleic acid","Industrial trans fat","Elaidic acid"],"c":0,"w":"Oleic acid is the monounsaturated (omega-9) fat of olive oil, linked with low CHD in Mediterranean diets. (The paper prints three options.) (Shams Practices QB, Unknown-2 Q172; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Industrial trans fat raises LDL and CHD risk.","2":"Elaidic acid is a trans fatty acid, which raises CHD risk."},"m":{"2":"thinks trans fats are protective"},"lp":true,"k":"bio-fats","src":"materials","kind":"Apply a fact"},{"id":"q365","u":"Biochemistry","t":"mc","q":"Which is a beneficial fatty acid?","o":["Omega 3","Elaidic acid","Industrial trans fatty acids","Trans-palmitelaidic acid"],"c":0,"w":"Omega-3 fatty acids reduce CHD risk; the other options are all trans fatty acids, which raise it. (Shams Practices QB, Unknown-2 Q174; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Elaidic acid is a trans fatty acid.","2":"Industrial trans fats raise LDL and lower HDL.","3":"Trans-palmitelaidic acid is a trans fatty acid."},"m":{},"lp":true,"k":"bio-fats","src":"materials","kind":"Apply a fact"},{"id":"q366","u":"Biochemistry","t":"mc","q":"A patient had coronary disease and a lipid profile was done. Which lipoprotein would you expect to find at a very low level?","o":["HDL","LDL","VLDL","IDL"],"c":0,"w":"High HDL-cholesterol is associated with decreased CHD risk, so a low HDL is expected in coronary disease. Elevated LDL raises risk. (Shams Practices QB, 2024 Nov Q44; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"LDL is expected to be HIGH in coronary disease.","2":"VLDL is not expected to be very low.","3":"IDL is not expected to be very low."},"m":{},"lp":true,"k":"bio-lipids-chd","src":"materials","kind":"Recognize and interpret"},{"id":"q367","u":"Biochemistry","t":"mc","q":"Which of the following is a negative risk factor?","o":["HDL more than 60 mg/dL","Cigarette smoking","HDL less than 40 mg/dL","Hypertension"],"c":0,"w":"A high HDL protects against CHD, so HDL above 60 mg/dL counts as a negative (protective) risk factor. The 60 mg/dL cut-off is from the bank's key. (Shams Practices QB, 2023 Q109; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Smoking is a positive risk factor.","2":"A low HDL is a positive risk factor.","3":"Hypertension is a positive risk factor."},"m":{"2":"thinks all HDL values raise risk"},"lp":true,"k":"bio-lipids-chd","src":"materials","kind":"Apply a fact"},{"id":"q368","u":"Biochemistry","t":"mc","q":"Which of these factors is a negative risk factor?","o":["LDL less than 100 mg/dl","Cigarette smoking","Hypertension","HDL less than 40 mg/dl"],"c":0,"w":"The bank keys LDL below 100 mg/dL as the protective option. Note: in most risk-factor schemes the classic negative risk factor is HDL of 60 mg/dL or more (as in the 2023 question); here LDL below 100 is simply the only option that is not a risk factor. (Shams Practices QB, 2022 Q118; Biochemistry L5 slides (diet fat and CHD))","x":{"1":"Smoking is a positive risk factor.","2":"Hypertension is a positive risk factor.","3":"A low HDL is a positive risk factor."},"m":{},"lp":true,"k":"bio-lipids-chd","src":"materials","kind":"Apply a fact"},{"id":"q369","u":"Biochemistry","t":"mc","q":"A 56-year-old male patient smokes cigarettes and has HDL 30. How many risk factors does he have?","o":["Three","Zero","One","Six"],"c":0,"w":"The key counts three: male age (over 45), cigarette smoking and a low HDL (under 40 mg/dL). The age cut-off and counting scheme are from the bank's key, not your slides. (Shams Practices QB, 2023 Q110; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Smoking alone is a risk factor, so it cannot be zero.","2":"Smoking and low HDL are already two.","3":"Only three listed findings count as risk factors."},"m":{},"lp":true,"k":"bio-lipids-chd","src":"materials","kind":"Apply a fact"},{"id":"q370","u":"Biochemistry","t":"mc","q":"Statins reduce cholesterol level in blood by competitively inhibiting the?","o":["HMG CoA reductase","Lipoprotein lipase","Pancreatic lipase","Lactate dehydrogenase"],"c":0,"w":"Statins competitively inhibit HMG CoA reductase, the rate-limiting enzyme of cholesterol synthesis. Your slides say statins lower TC and LDL-C by 30-40%; the enzyme is from the bank's key. (Shams Practices QB, 2024 Nov Q40; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Lipoprotein lipase breaks down triglycerides in circulating lipoproteins.","2":"Pancreatic lipase digests dietary fat.","3":"Lactate dehydrogenase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q371","u":"Biochemistry","t":"mc","q":"Statin drugs inhibit which enzyme?","o":["HMG CoA reductase","Pancreatic amylase","Creatine kinase","Lactate dehydrogenase"],"c":0,"w":"Statins inhibit HMG CoA reductase. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q76; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pancreatic amylase digests starch.","2":"Creatine kinase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism.","3":"Lactate dehydrogenase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q372","u":"Biochemistry","t":"mc","q":"During the fed state, insulin increases the activity of which enzyme?","o":["HMG CoA reductase","Pepsin","Carbonic anhydrase","Lactase"],"c":0,"w":"Insulin activates HMG CoA reductase in the fed state, increasing cholesterol synthesis. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q115; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pepsin digests protein in the stomach.","2":"Carbonic anhydrase makes bicarbonate.","3":"Lactase digests milk sugar."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q373","u":"Biochemistry","t":"mc","q":"In a hypothyroid patient, the increased cholesterol level is due to impairment in converting cholesterol to?","o":["Bile acid","Glycogen","Lactate","Creatinine"],"c":0,"w":"Thyroid hormone is needed for converting cholesterol to bile acids; in hypothyroidism this is impaired and cholesterol rises. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q41; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Glycogen is stored glucose, not made from cholesterol.","2":"Lactate is made from glucose.","3":"Creatinine comes from muscle creatine."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q374","u":"Biochemistry","t":"mc","q":"A patient came to the clinic with hypothyroidism and hypercholesterolemia. Which conversion of cholesterol is defective?","o":["Bile acids","Glycogen","Lactate","Creatinine"],"c":0,"w":"Hypothyroidism impairs the conversion of cholesterol to bile acids. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q75; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Glycogen is stored glucose.","2":"Lactate is made from glucose.","3":"Creatinine comes from muscle creatine."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q375","u":"Biochemistry","t":"mc","q":"A hypothyroid patient will develop hypercholesterolemia due to?","o":["Decrease in conversion of cholesterol to bile acids","Increased excretion of cholesterol in the stool","Decreased intestinal cholesterol absorption","Increased removal of LDL from the blood"],"c":0,"w":"Less cholesterol is converted to bile acids in hypothyroidism, so it accumulates. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q116; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"More cholesterol lost in the stool would LOWER blood cholesterol.","2":"Less absorption would LOWER blood cholesterol.","3":"More LDL removal would LOWER blood cholesterol."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q376","u":"Biochemistry","t":"mc","q":"Structural apolipoprotein of VLDL?","o":["Apo B-100","Apo A-I","Apo A-II","Apo B-48"],"c":0,"w":"Apo B-100 is the structural apolipoprotein of VLDL (and LDL); apo B-48 is the chylomicron's. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q42; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Apo A-I is the main apolipoprotein of HDL.","2":"Apo A-II is an HDL apolipoprotein.","3":"Apo B-48 is the structural apolipoprotein of chylomicrons."},"m":{"3":"mixes up apo B-100 and apo B-48"},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q377","u":"Biochemistry","t":"mc","q":"In fatty liver, production of TG in the liver will be more than ..?","o":["VLDL","Chylomicrons","HDL","IDL"],"c":0,"w":"The liver exports triglyceride packed in VLDL; fatty liver develops when triglyceride production exceeds VLDL export. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q43; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Chylomicrons are made by the intestine, not the liver.","2":"HDL carries cholesterol, not the liver's triglyceride export.","3":"IDL is a remnant of VLDL in the blood."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q378","u":"Biochemistry","t":"mc","q":"Fatty liver is due to accumulation of triglycerides in the liver and a decrease in liver synthesis of?","o":["VLDL","Hemoglobin","Chylomicrons","Myoglobin"],"c":0,"w":"Less VLDL synthesis means the liver cannot export its triglyceride, which accumulates. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q121; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Hemoglobin is the red cell oxygen carrier.","2":"Chylomicrons are made by the intestine.","3":"Myoglobin is the muscle oxygen store."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q379","u":"Biochemistry","t":"mc","q":"Which of the following is activated by apo A-I to convert free cholesterol to cholesterol esters?","o":["LCAT","Pancreatic amylase","Lactate dehydrogenase","Creatine kinase"],"c":0,"w":"Apo A-I of HDL activates LCAT (lecithin-cholesterol acyltransferase), which esterifies free cholesterol. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q45; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pancreatic amylase digests starch.","2":"Lactate dehydrogenase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism.","3":"Creatine kinase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q380","u":"Biochemistry","t":"mc","q":"The apo A-I of HDL activates which enzyme?","o":["LCAT","Pepsin","Acetylcholinesterase","Carbonic anhydrase"],"c":0,"w":"Apo A-I activates LCAT. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q120; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pepsin digests protein.","2":"Acetylcholinesterase breaks down acetylcholine at synapses.","3":"Carbonic anhydrase makes bicarbonate."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q381","u":"Biochemistry","t":"mc","q":"Where do nascent chylomicrons and VLDL get apo C-II and apo E?","o":["HDL","Albumin","Hemoglobin","Fibrinogen"],"c":0,"w":"HDL acts as a reservoir that donates apo C-II and apo E to nascent chylomicrons and VLDL. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q77; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Albumin carries free fatty acids, not apolipoproteins.","2":"Hemoglobin carries oxygen in red cells.","3":"Fibrinogen is a clotting protein."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q382","u":"Biochemistry","t":"mc","q":"Apo C-II activates which enzyme?","o":["Lipoprotein lipase","Pepsin","Carbonic anhydrase","Acetylcholinesterase"],"c":0,"w":"Apo C-II activates lipoprotein lipase, which breaks down triglycerides in chylomicrons and VLDL. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q78; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pepsin digests protein.","2":"Carbonic anhydrase makes bicarbonate.","3":"Acetylcholinesterase breaks down acetylcholine."},"m":{"1":"mixes up apo C-II and apo A-I targets"},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q383","u":"Biochemistry","t":"mc","q":"A patient came to the ER with orange-colored tonsils and an enlarged spleen and liver and was diagnosed with Tangier disease. Which lipoprotein is expected to be low?","o":["HDL","VLDL","Chylomicrons","IDL"],"c":0,"w":"Tangier disease is a defect in cholesterol efflux to HDL, so HDL is very low and cholesterol esters build up in tissues such as the tonsils. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q79; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"VLDL is not the lipoprotein lost in Tangier disease.","2":"Chylomicrons are not the lipoprotein lost in Tangier disease.","3":"IDL is not the lipoprotein lost in Tangier disease."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Recognize and interpret"},{"id":"q384","u":"Biochemistry","t":"mc","q":"A patient with a history of LDL receptor deficiency (type 2 hyperlipoproteinemia) came to the ER with acute pancreatitis and eruptive xanthomas. Deficiency of which of the following caused this condition?","o":["Apo B100","Hemoglobin A","Fibrinogen","Immunoglobulin A"],"c":0,"w":"The bank keys apo B-100, the ligand the LDL receptor binds. Note: this question looks garbled. Acute pancreatitis with eruptive xanthomas is classically type I (lipoprotein lipase or apo C-II deficiency), while type II is an LDL receptor or apo B-100 problem; apo B-100 is the only lipoprotein-related option. (Shams Practices QB, 2024 May Q80; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Hemoglobin A is the normal adult hemoglobin.","2":"Fibrinogen is a clotting protein.","3":"Immunoglobulin A is an antibody."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q385","u":"Biochemistry","t":"mc","q":"Effect of abetalipoproteinemia on lipoproteins?","o":["Decrease VLDL + decrease chylomicrons","Increase VLDL + increase chylomicrons","Increase VLDL + unchanged chylomicrons","Unchanged VLDL + increase chylomicrons"],"c":0,"w":"Abetalipoproteinemia is a failure to assemble apo B-containing lipoproteins, so both VLDL (apo B-100) and chylomicrons (apo B-48) are decreased. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2022 Q117; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Neither lipoprotein increases; both fall.","2":"VLDL falls and chylomicrons also fall.","3":"Chylomicrons fall, and VLDL falls too."},"m":{},"lp":true,"k":"bio-lipoproteins","src":"materials","kind":"Apply a fact"},{"id":"q386","u":"Biochemistry","t":"mc","q":"COX-2 is involved in:","o":["Inflammatory response","Hemoglobin synthesis","DNA replication","Glycogen breakdown"],"c":0,"w":"COX-2 is the inducible cyclooxygenase that makes prostaglandins in inflammation. Your slides mention prostaglandin synthesis as a free-radical source; COX-2's role is from the bank's key. (Stem expanded from \"COX-2 :\".) (Shams Practices QB, Unknown-1 Q142; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Hemoglobin synthesis does not involve COX-2.","2":"DNA replication does not involve COX-2.","3":"Glycogen breakdown does not involve COX-2."},"m":{},"lp":true,"k":"bio-eicosanoids","src":"materials","kind":"Apply a fact"},{"id":"q387","u":"Biochemistry","t":"mc","q":"PGI2 is a:","o":["Vasodilator","Vasoconstrictor","Platelet aggregation promoter","Clotting factor"],"c":0,"w":"Prostacyclin (PGI2) dilates vessels and opposes platelet aggregation. Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem expanded from \"PGI2 :\".) (Shams Practices QB, Unknown-1 Q143; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"PGI2 dilates, it does not constrict.","2":"PGI2 INHIBITS platelet aggregation; thromboxane A2 promotes it.","3":"PGI2 is a prostaglandin, not a clotting factor."},"m":{"2":"mixes up prostacyclin and thromboxane"},"lp":true,"k":"bio-eicosanoids","src":"materials","kind":"Apply a fact"},{"id":"q388","u":"Biochemistry","t":"mc","q":"Which enzyme makes prostaglandins in inflammation?","o":["Cox-2","Pancreatic amylase","Creatine kinase","Lactase"],"c":0,"w":"COX-2 produces inflammatory prostaglandins. Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem expanded from \"Prostaglandin inflammation ??\".) (Shams Practices QB, Unknown-2 Q173; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Pancreatic amylase digests starch.","2":"Creatine kinase is an unrelated enzyme, not part of cholesterol or lipoprotein metabolism.","3":"Lactase digests milk sugar."},"m":{},"lp":true,"k":"bio-eicosanoids","src":"materials","kind":"Apply a fact"},{"id":"q389","u":"Microbiology","t":"mc","q":"Which organism is a recognized cause of blood culture-negative endocarditis?","o":["Coxiella burnetii","Rhinovirus","Rotavirus","Norovirus"],"c":0,"w":"Culture-negative endocarditis comes from prior antibiotics, fungi, or fastidious bacteria such as Coxiella burnetii, Bartonella, Brucella and the HACEK group, confirmed by serology or PCR. (Shams Practices QB, 2025 Q14; Microbiology L3 slides (infective endocarditis))","x":{"1":"Rhinovirus is a virus that is not a cause of endocarditis. It causes the common cold.","2":"Rotavirus is a virus that is not a cause of endocarditis. It causes diarrhea.","3":"Norovirus is a virus that is not a cause of endocarditis. It causes gastroenteritis."},"m":{},"lp":true,"k":"micro-dx-tx","src":"materials","kind":"Recognize and interpret"},{"id":"q390","u":"Microbiology","t":"mc","q":"A blood culture grows gram-positive cocci in chains that are resistant to optochin. Which bacterial product helps viridans streptococci adhere to damaged heart valves?","o":["Dextran","Coagulase","Catalase","Urease"],"c":0,"w":"Viridans streptococci (optochin-resistant cocci in chains) adhere to the fibrin-platelet matrix on damaged valves using dextran, a sticky polysaccharide. (Shams Practices QB, 2025 Q15; Microbiology L3 slides (infective endocarditis))","x":{"1":"Coagulase is the identifying enzyme of S. aureus; its adherence factors are clumping factor and fibronectin-binding protein.","2":"Catalase is the staphylococcal test enzyme, not an adherence factor; streptococci are catalase negative.","3":"Urease is not an adherence factor of any endocarditis organism on your slides."},"m":{"1":"mixes up staphylococcal and streptococcal factors"},"lp":true,"k":"micro-patho","src":"materials","kind":"Apply a fact"},{"id":"q391","u":"Microbiology","t":"mc","q":"First step of infective endocarditis (from the following)?","o":["Expression of Beta 1 integrin","Breakdown of skeletal muscle glycogen","Secretion of insulin by pancreatic beta cells","Reabsorption of glucose in the proximal renal tubule"],"c":0,"w":"The bank keys expression of beta-1 integrin. Note: your slides describe the first step as endothelial injury with platelets and fibrin forming a sterile microthrombus; integrins on injured endothelium help that matrix and the bacteria bind. It is the only option related to endocarditis. (Shams Practices QB, 2024 Nov Q51; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Muscle glycogen breakdown is energy metabolism, unrelated to endocarditis.","2":"Insulin secretion is unrelated to endocarditis.","3":"Renal glucose reabsorption is unrelated to endocarditis."},"m":{},"lp":true,"k":"micro-patho","src":"materials","kind":"Priority / first action"},{"id":"q392","u":"Microbiology","t":"mc","q":"Endocarditis in a prosthetic valve; the organism is gram-positive, catalase-negative and alpha-hemolytic. What is it?","o":["Viridans streptococci","Staphylococcus aureus","Pseudomonas aeruginosa","Escherichia coli"],"c":0,"w":"Gram-positive, catalase-negative cocci with alpha hemolysis are viridans streptococci (staphylococci are catalase positive). Note: your slides name S. epidermidis and S. aureus as the main causes of prosthetic valve endocarditis; here the lab findings decide. (Shams Practices QB, 2024 Nov Q54; Microbiology L3 slides (infective endocarditis))","x":{"1":"S. aureus is catalase POSITIVE and beta hemolytic.","2":"Pseudomonas is a Gram-negative bacillus.","3":"E. coli is a Gram-negative bacillus."},"m":{"1":"ignores the catalase result"},"lp":true,"k":"micro-lab-id","src":"materials","kind":"Apply a fact"},{"id":"q393","u":"Microbiology","t":"mc","q":"A patient presents with chest pain and a tender, painful red pustule on the finger. Blood culture shows gram-positive cocci, catalase negative, alpha hemolytic. What is the causative agent?","o":["Viridans streptococci","Staphylococcus aureus","Escherichia coli","Pseudomonas aeruginosa"],"c":0,"w":"Catalase-negative, alpha-hemolytic Gram-positive cocci are viridans streptococci, a common cause of subacute endocarditis. The painful finger lesion is an Osler node. (Shams Practices QB, 2024 May Q68; Microbiology L3 slides (infective endocarditis))","x":{"1":"S. aureus is catalase POSITIVE and beta hemolytic.","2":"E. coli is a Gram-negative bacillus.","3":"Pseudomonas is a Gram-negative bacillus."},"m":{"1":"ignores the catalase result"},"lp":true,"k":"micro-lab-id","src":"materials","kind":"Apply a fact"},{"id":"q394","u":"Microbiology","t":"mc","q":"A drug abuser's tricuspid valve is infected; in the lab the organism is gram-positive and catalase-positive. What is this organism?","o":["Staphylococcus aureus","Streptococcus pyogenes","Escherichia coli","Pseudomonas aeruginosa"],"c":0,"w":"IV drug use endocarditis mainly affects the tricuspid valve and is mostly due to S. aureus, a Gram-positive, catalase-positive (and coagulase-positive) coccus in clusters. (Shams Practices QB, 2023 Q106; Microbiology L3 slides (infective endocarditis))","x":{"1":"S. pyogenes is catalase NEGATIVE.","2":"E. coli is a Gram-negative bacillus.","3":"Pseudomonas causes IV drug use endocarditis too, but it is a Gram-negative bacillus."},"m":{},"lp":true,"k":"micro-lab-id","src":"materials","kind":"Apply a fact"},{"id":"q395","u":"Microbiology","t":"mc","q":"A case of endocarditis: culture shows gram-positive, catalase-negative, non-hemolytic cocci. Which microorganism could be the causative agent?","o":["Enterococcus","Staphylococcus aureus","Escherichia coli","Pseudomonas aeruginosa"],"c":0,"w":"Enterococcus faecalis is a Gram-positive, catalase-negative coccus, often non-hemolytic, and causes endocarditis in the elderly after GU or GI procedures. The non-hemolytic detail is from the bank's key. (Shams Practices QB, 2022 Q124; Microbiology L3 slides (infective endocarditis))","x":{"1":"S. aureus is catalase POSITIVE and beta hemolytic.","2":"E. coli is a Gram-negative bacillus.","3":"Pseudomonas is a Gram-negative bacillus."},"m":{},"lp":true,"k":"micro-lab-id","src":"materials","kind":"Apply a fact"},{"id":"q396","u":"Microbiology","t":"mc","q":"A patient developed endocarditis due to a prosthetic valve. What could be the causative agent?","o":["Staphylococcus aureus","Rhinovirus","Rotavirus","Enterobius vermicularis"],"c":0,"w":"Prosthetic valve endocarditis is caused mostly by Staphylococcus epidermidis and Staphylococcus aureus. (Shams Practices QB, 2022 Q125; Microbiology L3 slides (infective endocarditis))","x":{"1":"Rhinovirus is a virus that is not a cause of endocarditis.","2":"Rotavirus is a virus that is not a cause of endocarditis.","3":"Enterobius vermicularis (pinworm) is an intestinal worm."},"m":{},"lp":true,"k":"micro-ie-types","src":"materials","kind":"Apply a fact"},{"id":"q397","u":"Microbiology","t":"mc","q":"Common cause of bacterial endocarditis?","o":["Streptococcus","Rhinovirus","Plasmodium falciparum","Enterobius vermicularis"],"c":0,"w":"Gram-positive cocci (staphylococci and streptococci) are the most common causes of bacterial endocarditis; viridans streptococci are a common cause of subacute IE. (Shams Practices QB, Unknown-2 Q169; Microbiology L3 slides (infective endocarditis))","x":{"1":"Rhinovirus is a virus that is not a cause of endocarditis.","2":"Plasmodium falciparum is the malaria parasite.","3":"Enterobius vermicularis is an intestinal worm."},"m":{},"lp":true,"k":"micro-ie-types","src":"materials","kind":"Apply a fact"},{"id":"q398","u":"Microbiology","t":"mc","q":"Small hemorrhagic macular lesions on the palms or soles: what is the name of this lesion?","o":["Janeway lesion","Roth spot","Kayser–Fleischer ring","Koplik spot"],"c":0,"w":"Janeway lesions are small, nontender, erythematous (hemorrhagic) lesions on the palms and soles in infective endocarditis. (Shams Practices QB, 2023 Q101; Microbiology L3 slides (infective endocarditis))","x":{"1":"Roth spots are retinal hemorrhages.","2":"Kayser-Fleischer rings are copper rings in the cornea in Wilson disease.","3":"Koplik spots are mouth lesions in measles."},"m":{"1":"mixes up Janeway lesions and Roth spots"},"lp":true,"k":"micro-signs","src":"materials","kind":"Apply a fact"},{"id":"q399","u":"Microbiology","t":"mc","q":"Anti-M protein antibodies in a rheumatic fever patient are directed against which organism?","o":["Streptococcus pyogenes","Staphylococcus epidermidis","Haemophilus influenzae","Neisseria meningitidis"],"c":0,"w":"Rheumatic fever follows group A streptococcal (S. pyogenes) pharyngitis; antibodies against its M protein cross-react with heart antigens. (Shams Practices QB, 2024 Nov Q55; Microbiology L3 slides (infective endocarditis))","x":{"1":"S. epidermidis causes prosthetic valve and device infections, not rheumatic fever.","2":"Haemophilus is a HACEK organism.","3":"Neisseria meningitidis causes meningitis, not rheumatic fever."},"m":{},"lp":true,"k":"micro-organisms","src":"materials","kind":"Apply a fact"},{"id":"q400","u":"Microbiology","t":"mc","q":"A patient in South America has constipation; microscopy shows a unicellular flagellated organism under Giemsa stain. What is the disease?","o":["Chagas disease","Enterobiasis","Ascariasis","Schistosomiasis"],"c":0,"w":"Trypanosoma cruzi, the cause of Chagas disease in South America, is a flagellated protozoan seen with Giemsa stain; chronic disease causes megacolon (constipation). Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q49; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Enterobiasis is pinworm infection, a worm, not a flagellate.","2":"Ascariasis is a roundworm infection.","3":"Schistosomiasis is a fluke infection."},"m":{},"lp":true,"k":"micro-past","src":"materials","kind":"Apply a fact"},{"id":"q401","u":"Microbiology","t":"mc","q":"Pleurodynia, runny nose and pharyngitis. Which finding fits?","o":["Anti-Coxsackievirus antibodies","Anti-hepatitis B surface antibodies","Anti-tetanus toxin antibodies","Anti-thyroid peroxidase antibodies"],"c":0,"w":"Coxsackievirus causes pleurodynia with upper respiratory symptoms, and Coxsackievirus B is a cause of myocarditis. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q50; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Anti-HBs antibodies show hepatitis B immunity.","2":"Anti-tetanus antibodies show tetanus immunity.","3":"Anti-TPO antibodies are seen in autoimmune thyroid disease."},"m":{},"lp":true,"k":"micro-past","src":"materials","kind":"Recognize and interpret"},{"id":"q402","u":"Microbiology","t":"mc","q":"Ixodes can cause myocarditis and hemolytic anemia by transmitting?","o":["Borrelia & Babesia","Salmonella & Shigella","Giardia & Entamoeba","Bordetella & Corynebacterium"],"c":0,"w":"Ixodes ticks transmit Borrelia (Lyme disease, which can cause myocarditis) and Babesia (hemolytic anemia). Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q52; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Salmonella and Shigella are food-borne gut bacteria.","2":"Giardia and Entamoeba are water-borne gut protozoa.","3":"Bordetella and Corynebacterium spread by respiratory droplets."},"m":{},"lp":true,"k":"micro-past","src":"materials","kind":"Apply a fact"},{"id":"q403","u":"Microbiology","t":"mc","q":"Eosinophilia and encysted larvae in muscle:","o":["Trichinella spiralis","Giardia lamblia","Entamoeba histolytica","Trichomonas vaginalis"],"c":0,"w":"Trichinella spiralis larvae encyst in muscle (including the heart) and cause eosinophilia. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 Nov Q53; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Giardia is an intestinal protozoan with no larvae.","2":"Entamoeba is an intestinal protozoan with no larvae.","3":"Trichomonas is a genital protozoan."},"m":{},"lp":true,"k":"micro-past","src":"materials","kind":"Apply a fact"},{"id":"q404","u":"Microbiology","t":"mc","q":"Portal phlebitis is caused by","o":["Enterococcus faecalis","Rhinovirus","Varicella-zoster virus","Trichomonas vaginalis"],"c":0,"w":"Portal phlebitis (pylephlebitis) follows abdominal infection and is caused by gut organisms such as Enterococcus. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q67; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Rhinovirus causes the common cold.","2":"Varicella-zoster causes chickenpox and shingles.","3":"Trichomonas is a genital protozoan."},"m":{},"lp":true,"k":"micro-past","src":"materials","kind":"Apply a fact"},{"id":"q405","u":"Microbiology","t":"mc","q":"Portal pyemia after an intra-abdominal abscess or enteric infection is caused by which organisms?","o":["Enterococcus and anaerobic bacteria","Rhinovirus and adenovirus","Influenza virus and respiratory syncytial virus","Giardia lamblia and Enterobius vermicularis"],"c":0,"w":"Infection spreading from the gut to the portal vein is caused by enteric organisms: Enterococcus and anaerobic bacteria. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2023 Q107; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Rhinovirus and adenovirus are respiratory viruses.","2":"Influenza and RSV are respiratory viruses.","3":"Giardia and Enterobius are intestinal parasites, not causes of portal pyemia."},"m":{},"lp":true,"k":"micro-past","src":"materials","kind":"Apply a fact"},{"id":"q406","u":"Microbiology","t":"mc","q":"Bunyaviridae mainly involve which system?","o":["Reticuloendothelial system","Skeletal system","Integumentary system","Reproductive system"],"c":0,"w":"The bank keys the reticuloendothelial system. Note: the original stem is only \"Bunyaviridae :\", so the question is incomplete; Bunyaviridae (for example hantaviruses and Crimean-Congo hemorrhagic fever virus) cause hemorrhagic fevers. Not in your uploaded Mid 2 slides. (Shams Practices QB, Unknown-1 Q151; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The skeletal system is not the bank's answer.","2":"The integumentary system (skin) is not the bank's answer.","3":"The reproductive system is not the bank's answer."},"m":{},"lp":true,"k":"micro-past","src":"materials","kind":"Apply a fact"},{"id":"q407","u":"Microbiology","t":"mc","q":"Which virus causes myocarditis?","o":["Coxsackievirus B","Enterobius vermicularis","Giardia lamblia","Escherichia coli"],"c":0,"w":"Coxsackievirus B is the classic viral cause of myocarditis. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q167; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Enterobius is a worm, not a virus.","2":"Giardia is a protozoan, not a virus.","3":"E. coli is a bacterium, not a virus."},"m":{},"lp":true,"k":"micro-past","src":"materials","kind":"Apply a fact"},{"id":"q408","u":"Microbiology","t":"mc","q":"Acute symptom of T. cruzi infection?","o":["Loss of appetite","Chronic megaesophagus","Chronic megacolon","Chronic dilated cardiomyopathy"],"c":0,"w":"Acute Chagas disease causes nonspecific symptoms such as fever and loss of appetite; megaesophagus, megacolon and dilated cardiomyopathy are CHRONIC complications. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q168; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Megaesophagus is a chronic complication.","2":"Megacolon is a chronic complication.","3":"Dilated cardiomyopathy is a chronic complication."},"m":{"1":"mixes up acute and chronic Chagas","2":"mixes up acute and chronic Chagas","3":"mixes up acute and chronic Chagas"},"lp":true,"k":"micro-past","src":"materials","kind":"Apply a fact"},{"id":"q409","u":"Embryology","t":"mc","q":"Which embryonic aortic arch gives rise to the proximal part of the right subclavian artery?","o":["Right fourth aortic arch","Left second aortic arch","Left sixth aortic arch","Right first aortic arch"],"c":0,"w":"The right 4th aortic arch forms the proximal part of the right subclavian artery; the distal part comes from the right dorsal aorta at the 7th intersegmental artery. The left 4th arch instead forms part of the arch of the aorta. (Shams Practices QB, 2025 Q11; Embryology L3 slides)","x":{"1":"The 2nd arch largely disappears; its remnant forms the stapedial artery.","2":"The left 6th arch forms the left pulmonary artery and the ductus arteriosus.","3":"The 1st arch largely disappears; its remnant forms the maxillary artery."},"m":{"2":"mixes up the 4th and 6th arches"},"lp":true,"k":"emb-arches","src":"Shams Practices QB, 2025 Q11; Embryology L3 slides","kind":"Apply a fact"},{"id":"q410","u":"Embryology","t":"mc","q":"Which aortic arch vessel gives a part of the arch of aorta?","o":["Left 4th arch","Right 1st arch","Left 2nd arch","Right 6th arch"],"c":0,"w":"The left 4th aortic arch forms the part of the arch of the aorta between the left common carotid and left subclavian arteries. The rest of the arch comes from the aortic sac, its left horn and the left dorsal aorta. (Shams Practices QB, 2024 Nov Q35; Embryology L3 slides)","x":{"1":"The 1st arch leaves only the maxillary artery.","2":"The 2nd arch leaves only the stapedial artery.","3":"The right 6th arch forms the right pulmonary artery; its distal part degenerates."},"m":{"3":"mixes up the 4th and 6th arches"},"lp":true,"k":"emb-arches","src":"Shams Practices QB, 2024 Nov Q35; Embryology L3 slides","kind":"Apply a fact"},{"id":"q411","u":"Embryology","t":"mc","q":"Origin of common carotid?","o":["3rd aortic arch","1st aortic arch","2nd aortic arch","6th aortic arch"],"c":0,"w":"The proximal parts of the 3rd aortic arches form the common carotid arteries; their distal parts join the dorsal aorta to form the internal carotids. (Shams Practices QB, 2024 May Q72; Embryology L3 slides)","x":{"1":"The 1st arch remnant forms the maxillary artery.","2":"The 2nd arch remnant forms the stapedial artery.","3":"The 6th arch forms the pulmonary arteries and the ductus arteriosus."},"m":{},"lp":true,"k":"emb-arches","src":"Shams Practices QB, 2024 May Q72; Embryology L3 slides","kind":"Apply a fact"},{"id":"q412","u":"Embryology","t":"mc","q":"The origin of brachiocephalic artery?","o":["Right horn of the aortic sac","Left horn of the aortic sac","Right seventh intersegmental artery","Left sixth aortic arch"],"c":0,"w":"The right horn of the aortic sac forms the brachiocephalic artery; the left horn forms the part of the aortic arch between the brachiocephalic and left common carotid arteries. (Shams Practices QB, 2023 Q95; Embryology L3 slides)","x":{"1":"The left horn forms part of the arch of the aorta.","2":"The right 7th intersegmental artery contributes to the distal right subclavian artery.","3":"The left 6th arch forms the left pulmonary artery and ductus arteriosus."},"m":{"1":"mixes up right and left horns"},"lp":true,"k":"emb-arches","src":"Shams Practices QB, 2023 Q95; Embryology L3 slides","kind":"Apply a fact"},{"id":"q413","u":"Embryology","t":"mc","q":"Ductus arteriosus arises from?","o":["6th arch","1st arch","2nd arch","3rd arch"],"c":0,"w":"The distal part of the left 6th aortic arch forms the ductus arteriosus; its proximal part forms the left pulmonary artery. (Stem fixed from \"( In case ) ductus areriosus from ?\".) (Shams Practices QB, 2023 Q96; Embryology L3 slides)","x":{"1":"The 1st arch remnant forms the maxillary artery.","2":"The 2nd arch remnant forms the stapedial artery.","3":"The 3rd arch forms the common and internal carotid arteries."},"m":{},"lp":true,"k":"emb-arches","src":"Shams Practices QB, 2023 Q96; Embryology L3 slides","kin
