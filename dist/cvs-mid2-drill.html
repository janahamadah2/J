and 5th arches","2":"mixes up the 5th and 6th arches"},"lp":false,"k":"emb-arches","src":"materials","kind":"Teaching and statements"},{"id":"q220","u":"Embryology","t":"mc","q":"A nurse explains the origin of a client's external carotid artery. How does the external carotid artery develop?","o":["As a new bud from the junction between the common and internal carotid arteries","From the distal part of the 3rd arch","From the remaining part of the 1st arch","From the right horn of the aortic sac"],"c":0,"w":"The 3rd arch's proximal parts form the common carotid arteries and its distal parts join the dorsal aorta to form the internal carotids. The external carotid artery is not an arch derivative: it arises as a newly formed bud from the junction between the common and internal carotid arteries. (Embryology L3 slides (aortic arches), slide note (N.B.))","x":{"1":"The distal 3rd arch joins the dorsal aorta to form the internal carotid.","2":"The 1st arch remnant forms the maxillary artery.","3":"The right horn forms the brachiocephalic artery."},"m":{"1":"mixes up internal and external carotid origins"},"lp":true,"k":"emb-arches","src":"materials","kind":"Teaching and statements"},{"id":"q221","u":"Embryology","t":"mc","q":"During surgery to ligate a patent ductus arteriosus, which nerve should the nurse know is at risk because it hooks around the ductus?","o":["Left recurrent laryngeal nerve","Right recurrent laryngeal nerve","Phrenic nerve","Vagus nerve trunk"],"c":0,"w":"The recurrent laryngeal nerves supply the 6th pharyngeal arches and hook around the 6th aortic arches. On the left, the distal 6th arch persists as the ductus arteriosus, so the left recurrent laryngeal nerve hooks around the ductus. On the right, the distal 6th arch degenerates, so the right nerve moves up and hooks around the proximal right subclavian artery (from the 4th arch). (Embryology L3 slides (aortic arches), slide note (N.B.))","x":{"1":"The right recurrent laryngeal nerve hooks around the proximal right subclavian artery.","2":"The phrenic nerve is not described as hooking around any aortic arch derivative.","3":"The nerves that hook around the arches are the recurrent laryngeal branches, not the vagal trunk."},"m":{"1":"mixes up the right and left recurrent laryngeal nerves"},"lp":true,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q222","u":"Embryology","t":"tf","q":"A nurse states that the distal part of the right 6th aortic arch degenerates.","o":["True","False"],"c":0,"w":"True. On the right, the proximal 6th arch forms the right pulmonary artery and the distal part degenerates; on the left, the distal part persists as the ductus arteriosus. (Embryology L3 slides (aortic arches))","x":{"1":"This statement is true: the distal right 6th arch degenerates."},"m":{},"lp":false,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q223","u":"Embryology","t":"tf","q":"A nurse states that the 5th aortic arch vessel disappears completely.","o":["True","False"],"c":0,"w":"True. The 5th arch vessel disappears completely; only the 1st and 2nd arches leave small remnants (maxillary and stapedial arteries) among those that regress. (Embryology L3 slides (aortic arches))","x":{"1":"This statement is true: the 5th arch disappears completely."},"m":{},"lp":false,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q224","u":"Embryology","t":"tf","q":"A nurse states that the 2nd aortic arch persists as the maxillary artery.","o":["True","False"],"c":1,"w":"False. The remaining part of the 2nd arch forms the STAPEDIAL artery; the maxillary artery comes from the remaining part of the 1st arch. (Embryology L3 slides (aortic arches))","x":{"0":"The 2nd arch gives the stapedial artery; the 1st gives the maxillary."},"m":{"0":"mixes up the 1st and 2nd arches"},"lp":false,"k":"emb-arches","src":"materials","kind":"Apply a fact"},{"id":"q225","u":"Embryology","t":"order","q":"A nurse traces the embryological origin of the arch of the aorta. Arrange its parts from proximal to distal by origin.","o":["Aortic sac (up to the brachiocephalic artery)","Left horn of the aortic sac (between brachiocephalic and left common carotid)","Left 4th aortic arch (between left common carotid and left subclavian)","Left dorsal aorta between the 4th and 6th arches (distal arch)"],"c":[0,1,2,3],"w":"The arch of the aorta is built from four sources in sequence: the aortic sac forms the part proximal to the brachiocephalic artery, the left horn of the sac forms the part between the brachiocephalic and left common carotid, the left 4th arch forms the part between the left common carotid and left subclavian, and the left dorsal aorta between the 4th and 6th arches forms the distal part. (Embryology L3 slides (aortic arches))","x":{},"m":{},"lp":false,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q226","u":"Embryology","t":"blanks","q":"A nurse completes an embryology review sheet. The brachiocephalic artery arises from the {1}; the left subclavian artery arises from the left dorsal aorta at the {2}; and the proximal part of the right subclavian artery arises from the {3}.","o":[["right horn of the aortic sac","left horn of the aortic sac","3rd aortic arch"],["attachment of the 7th intersegmental artery","junction of the 3rd and 4th arches","region caudal to the 6th arch"],["right 4th aortic arch","left 4th aortic arch","right 6th aortic arch"]],"c":[0,0,0],"w":"The slide's fill-in questions ask for these origins. The brachiocephalic artery comes from the right horn of the aortic sac. The internal carotids come from the distal 3rd arches plus the dorsal aorta cranial to the 3rd arch. The left subclavian forms from the left dorsal aorta at the attachment of the 7th intersegmental artery. The right subclavian has two parts: proximal from the right 4th arch and distal from the right dorsal aorta at the 7th intersegmental artery. (Embryology L3 slides (aortic arches), slide exercise (??? slide))","x":{"0:1":"The left horn forms the part of the arch between the brachiocephalic and left common carotid.","0:2":"The 3rd arch forms the common and internal carotid arteries.","1:1":"The left dorsal aorta between the 3rd and 4th arches disappears.","1:2":"Caudal to the 6th arch, the left dorsal aorta forms the descending thoracic and abdominal aorta.","2:1":"The left 4th arch forms part of the arch of the aorta.","2:2":"The right 6th arch forms the right pulmonary artery; its distal part degenerates."},"m":{"0:1":"mixes up right and left horns","1:1":"places the subclavian at the 3rd-4th segment","2:1":"mixes up right and left 4th arches"},"lp":true,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q227","u":"Embryology","t":"tf","q":"A nurse states that the left horn of the aortic sac forms the part of the aortic arch between the brachiocephalic and left common carotid arteries.","o":["True","False"],"c":0,"w":"True. The aortic sac forms the arch proximal to the brachiocephalic artery, the left horn forms the part between the brachiocephalic and left common carotid, and the right horn forms the brachiocephalic artery. (Embryology L3 slides (aortic arches))","x":{"1":"This statement is true: the left horn forms that segment of the arch."},"m":{},"lp":false,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q228","u":"Embryology","t":"tf","q":"A nurse states that the right horn of the aortic sac forms the right common carotid artery.","o":["True","False"],"c":1,"w":"False. The right horn of the aortic sac forms the BRACHIOCEPHALIC artery. The common carotid arteries come from the proximal parts of the 3rd arches. (Embryology L3 slides (aortic arches))","x":{"0":"The right horn forms the brachiocephalic artery."},"m":{"0":"mixes up brachiocephalic and carotid origins"},"lp":false,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q229","u":"Embryology","t":"mc","q":"A nurse reviews the fate of the left dorsal aorta caudal to the 6th arch. Which adult vessels does this segment form?","o":["The descending thoracic and abdominal aorta","The distal part of the arch of the aorta","The left subclavian artery","The distal internal carotid artery"],"c":0,"w":"Each segment of the left dorsal aorta has its own fate: cranial to the 3rd arch it forms the distal internal carotid, between the 3rd and 4th arches it disappears, at the 7th intersegmental artery it forms the subclavian, between the 4th and 6th arches it forms the distal arch, and caudal to the 6th arch it forms the descending thoracic and abdominal aorta. The common dorsal aorta forms the abdominal aorta and median sacral artery. (Embryology L3 slides (aortic arches))","x":{"1":"The distal arch comes from the left dorsal aorta BETWEEN the 4th and 6th arches.","2":"The left subclavian forms at the attachment of the 7th intersegmental artery.","3":"The distal internal carotid comes from the dorsal aorta cranial to the 3rd arch."},"m":{"1":"shifts the dorsal aorta segments"},"lp":false,"k":"emb-sac-dorsal","src":"materials","kind":"Apply a fact"},{"id":"q230","u":"Embryology","t":"mc","q":"A newborn has a continuous connection between the left pulmonary artery and the arch of the aorta. Which associated conditions should the nurse watch for?","o":["Aortic stenosis, pulmonary stenosis or Fallot's tetralogy","A vascular ring around the trachea and esophagus","Constriction of the aorta distal to the left subclavian","Persistence of the distal right dorsal aorta"],"c":0,"w":"Patent ductus arteriosus means the ductus, formed from the distal left 6th arch, stays open, leaving a duct between the left pulmonary artery and the arch of the aorta. It is associated with other congenital heart disease such as aortic stenosis, pulmonary stenosis and Fallot's tetralogy. (Embryology L3 slides (aortic arches))","x":{"1":"A vascular ring is the feature of a double aortic arch.","2":"That is coarctation of the aorta, a different anomaly.","3":"That is the cause of a double aortic arch."},"m":{"1":"mixes up PDA and double arch"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Apply a fact"},{"id":"q231","u":"Embryology","t":"mc","q":"An infant has noisy breathing and difficulty swallowing feeds, and imaging shows a vascular ring around the trachea and esophagus. Which anomaly should the nurse suspect?","o":["Double arch of the aorta","Right arch of the aorta","Patent ductus arteriosus","Coarctation of the aorta"],"c":0,"w":"A double aortic arch results from persistence of the distal part of the right dorsal aorta, so a second arch joins the left one. The two arches form a vascular ring around the trachea, causing dyspnea, and the esophagus, causing dysphagia. (Embryology L3 slides (aortic arches))","x":{"1":"A right arch forms from the right dorsal aorta and right 4th arch; a ring needs both arches to persist.","2":"PDA is an open duct between the left pulmonary artery and the aortic arch.","3":"Coarctation is a constriction of the aorta distal to the left subclavian."},"m":{"1":"mixes up right arch and double arch"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Recognize and interpret"},{"id":"q232","u":"Embryology","t":"mc","q":"A client's imaging shows a right-sided arch of the aorta. Which developmental cause should the nurse identify?","o":["The arch developed from the right dorsal aorta and the right 4th aortic arch.","The distal right dorsal aorta persisted alongside a normal left arch.","The ductus arteriosus failed to close.","The 5th arch persisted."],"c":0,"w":"Normally the left 4th arch and left dorsal aorta form the arch of the aorta. In a right arch of the aorta, the arch instead develops from the right dorsal aorta and the right 4th aortic arch vessel. (Embryology L3 slides (aortic arches))","x":{"1":"Persistence of the distal right dorsal aorta with the left arch gives a DOUBLE arch.","2":"A ductus that fails to close is a patent ductus arteriosus.","3":"The 5th arch vessel normally disappears completely and is not given as a cause of any listed anomaly."},"m":{"1":"mixes up right arch and double arch"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Recognize and interpret"},{"id":"q233","u":"Embryology","t":"mc","q":"A client's imaging shows a constriction of the aorta proximal to the entrance of the ductus arteriosus, with the ductus still open. How should this coarctation be classified?","o":["Preductal coarctation","Postductal coarctation","Double arch of the aorta","Patent ductus arteriosus alone"],"c":0,"w":"Coarctation is a constriction of the aorta distal to the origin of the left subclavian artery. In the preductal type the constriction is proximal to the entrance of the ductus arteriosus and the ductus stays open. In the postductal type the constriction is distal to the ductus, which is usually closed. Note: the slide labels preductal as \"Adult\" and postductal as \"fetal\" (and notes the closed duct as fatal); many references label them the other way round (preductal as infantile, postductal as adult), so check which label your instructor expects. (Embryology L3 slides (aortic arches))","x":{"1":"Postductal coarctation lies DISTAL to the ductus, which is usually closed.","2":"A double arch is a vascular ring, not a constriction.","3":"The ductus is open here, but the defining lesion is the constriction proximal to it."},"m":{"1":"mixes up preductal and postductal"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Apply a fact"},{"id":"q234","u":"Embryology","t":"tf","q":"A nurse states that coarctation of the aorta is a constriction proximal to the origin of the left subclavian artery.","o":["True","False"],"c":1,"w":"False. Coarctation of the aorta is a constriction DISTAL to the origin of the left subclavian artery, either before (preductal) or after (postductal) the entrance of the ductus arteriosus. (Embryology L3 slides (aortic arches))","x":{"0":"Coarctation lies distal to the left subclavian origin."},"m":{"0":"places coarctation proximal to the left subclavian"},"lp":false,"k":"emb-anomalies","src":"materials","kind":"Apply a fact"},{"id":"q235","u":"Embryology","t":"fill","q":"A nurse reviews the timeline of vascular development. The veins that drain into the horns of the sinus venosus develop at the ____ week.","o":["5th","4th","8th"],"c":0,"w":"The arterial system starts at the 4th week, when the two primitive aortae appear. The veins develop at the 5th week, when each horn of the sinus venosus receives an umbilical, a vitelline and a common cardinal vein. (Embryology L3 slides (aortic arches))","x":{"1":"The 4th week is when the two primitive aortae (arterial system) appear.","2":"The 8th week is not the time given for venous development."},"m":{"1":"mixes up arterial and venous timing"},"lp":false,"k":"emb-veins","src":"materials","kind":"Apply a fact"},{"id":"q236","u":"Embryology","t":"tf","q":"A nurse states that the vitelline veins form the inferior vena cava.","o":["True","False"],"c":1,"w":"False. The vitelline veins form the portal and superior mesenteric veins. The inferior vena cava develops from the posterior cardinal veins. (Embryology L3 slides (aortic arches))","x":{"0":"Vitelline veins form the portal and superior mesenteric veins; the IVC is posterior cardinal."},"m":{"0":"mixes up vitelline and cardinal derivatives"},"lp":false,"k":"emb-veins","src":"materials","kind":"Apply a fact"},{"id":"q237","u":"Embryology","t":"tf","q":"A nurse states that the inferior vena cava develops from the posterior cardinal veins.","o":["True","False"],"c":0,"w":"True. The posterior cardinal veins give the inferior vena cava, the common iliac, suprarenal, testicular or ovarian and renal veins. (Embryology L3 slides (aortic arches))","x":{"1":"This statement is true: the IVC is a posterior cardinal derivative."},"m":{},"lp":false,"k":"emb-veins","src":"materials","kind":"Apply a fact"},{"id":"q238","u":"Embryology","t":"cloze","q":"A nurse reviews the fate of the embryonic veins. Match each embryonic vein to its adult derivative.","o":{"rows":["Vitelline veins","Ductus venosus (after birth)","Left umbilical vein (after birth)","Left common cardinal vein"],"choices":["Portal and superior mesenteric veins","Ligamentum venosum","Ligamentum teres","Oblique vein of the left atrium","Inferior vena cava"]},"c":[0,1,2,3],"w":"Vitelline veins form the portal and superior mesenteric veins. After birth the ductus venosus closes to form the ligamentum venosum and the obliterated left umbilical vein forms the ligamentum teres. The common cardinal veins differ by side: the right forms the SVC inside the pericardium and the left forms the oblique vein of the left atrium. (Embryology L3 slides (aortic arches))","x":{"4":"The IVC comes from the posterior cardinal veins."},"m":{"4":"mixes up cardinal vein derivatives"},"lp":false,"k":"emb-veins","src":"materials","rs":{"0":"A nurse reviews the vitelline veins. Which adult veins do they form?","1":"After birth the ductus venosus closes. Which adult structure does it form?","2":"After birth the left umbilical vein is obliterated. Which adult structure does it form?","3":"A nurse traces the left common cardinal vein. Which adult vein does it form?"},"kind":"Apply a fact"},{"id":"q239","u":"Embryology","t":"sata","q":"A nurse reviews the derivatives of the posterior cardinal veins. Which adult veins develop from them? Select all that apply.","o":["Inferior vena cava","Common iliac veins","Renal veins","Testicular or ovarian veins","Suprarenal veins","Portal vein","Left brachiocephalic vein","Right internal jugular vein"],"c":[0,1,2,3,4],"w":"The cardinal veins are the main venous drainage of the fetus. The anterior cardinals drain the upper body and form the SVC (outside the pericardium), the brachiocephalic and internal jugular veins and the left superior intercostal vein. The posterior cardinals drain the lower body and form the IVC, common iliac, suprarenal, testicular or ovarian and renal veins. (Embryology L3 slides (aortic arches))","x":{"5":"The portal vein comes from the vitelline veins.","6":"The left brachiocephalic vein comes from the left ANTERIOR cardinal vein.","7":"The right internal jugular comes from the right ANTERIOR cardinal vein."},"m":{"5":"mixes up vitelline and cardinal derivatives","6":"mixes up anterior and posterior cardinal veins","7":"mixes up anterior and posterior cardinal veins"},"lp":false,"k":"emb-veins","src":"materials","kind":"Apply a fact"},{"id":"q240","u":"Anatomy","t":"mc","q":"Where is the anatomical surface projection of the tricuspid valve?","o":["Behind the midline of the sternum at the level of the fourth intercostal space","At the second intercostal space on the right midclavicular line","Behind the midpoint of the left clavicle","At the sixth intercostal space on the left midaxillary line"],"c":0,"w":"The valves lie in a diagonal line behind the sternum, remembered as PAMT from top to bottom: pulmonary behind the left 3rd costal cartilage, aortic opposite the left 3rd intercostal space, mitral opposite the left 4th costal cartilage, and tricuspid opposite the left 4th intercostal space behind the midline of the sternum. The tricuspid is the lowest and the most medial. Also asked in past papers: 2025 Q1. (Shams Practices, Blood Supply of the Heart, key slide 17; Anatomy L4 slides)","x":{"1":"No heart valve is marked here; the four valves all lie behind the sternum between the left 3rd costal cartilage and the left 4th intercostal space.","2":"No heart valve is marked behind the clavicle; the highest valve, the pulmonary, is behind the left 3rd costal cartilage.","3":"This lies outside the heart's outline; the lowest point on the left is the apex at the left 5th intercostal space, 3.5 inches from the midline."},"m":{"1":"places a valve away from the sternum","2":"places a valve away from the sternum"},"lp":true,"k":"anat-surface","src":"Shams Practices, Blood Supply of the Heart, key slide 17; Anatomy L4 slides","kind":"Apply a fact"},{"id":"q241","u":"Anatomy","t":"mc","q":"In a right-dominant heart, which artery arises from the right coronary artery and runs in the posterior interventricular groove?","o":["Posterior descending artery (PDA)","Left anterior descending artery (LAD)","Left circumflex artery","First diagonal artery"],"c":0,"w":"The right coronary artery runs in the coronary groove and ends as the posterior interventricular (posterior descending) artery, which runs in the posterior interventricular groove with the middle cardiac vein. It supplies the diaphragmatic surface of both ventricles and the posterior 1/3 of the septum. In right dominance this PDA is a large branch of the RCA. Also asked in past papers: 2025 Q3. (Shams Practices, Blood Supply of the Heart, key slide 8; Anatomy L4 slides)","x":{"1":"The LAD is a branch of the left coronary artery and runs in the ANTERIOR interventricular groove.","2":"The circumflex is a branch of the left coronary artery; in left dominance it gives the PDA, but it does not arise from the RCA.","3":"A diagonal artery is not described on your slides; it is not the vessel in the posterior interventricular groove."},"m":{"1":"mixes up LAD and PDA","2":"mixes up right and left dominance"},"lp":true,"k":"anat-coronary","src":"Shams Practices, Blood Supply of the Heart, key slide 8; Anatomy L4 slides","kind":"Apply a fact"},{"id":"q242","u":"Anatomy","t":"mc","q":"Which of the following is a content of the posterior interventricular groove?","o":["Middle cardiac vein","Great cardiac vein","Small cardiac vein","Anterior cardiac vein"],"c":0,"w":"Each interventricular groove carries an artery and a vein. The anterior groove has the LAD with the great cardiac vein; the posterior groove has the posterior interventricular artery with the middle cardiac vein. Both veins drain into the coronary sinus. Also asked in past papers: 2024 Nov Q32. (Shams Practices, Blood Supply of the Heart, key slide 8; Anatomy L4 slides)","x":{"1":"The great cardiac vein runs in the ANTERIOR interventricular groove with the LAD.","2":"The small cardiac vein is a tributary of the coronary sinus, but it does not run in the posterior interventricular groove.","3":"Anterior cardiac veins arise from the right ventricle and end in the anterior wall of the right atrium."},"m":{"1":"mixes up great and middle cardiac veins"},"lp":true,"k":"anat-cardiac-veins","src":"Shams Practices, Blood Supply of the Heart, key slide 8; Anatomy L4 slides","kind":"Apply a fact"},{"id":"q243","u":"Anatomy","t":"mc","q":"The posterior surface of the heart supplied by ?","o":["Posterior interventricular artery","Radial artery","Superior thyroid artery","Posterior interosseous artery"],"c":0,"w":"The posterior (diaphragmatic) surface of both ventricles is supplied by the posterior interventricular artery, which runs in the posterior interventricular groove and also supplies the posterior 1/3 of the interventricular septum. The front of the heart (sternocostal surface) belongs to the LAD. Also asked in past papers: 2023 Q92. (Shams Practices, Blood Supply of the Heart, key slide 8; Anatomy L4 slides)","x":{"1":"The radial artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","2":"The superior thyroid artery is the first branch of the external carotid in the neck; it does not supply the heart.","3":"The posterior interosseous artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer."},"m":{},"lp":true,"k":"anat-coronary","src":"Shams Practices, Blood Supply of the Heart, key slide 8; Anatomy L4 slides","kind":"Apply a fact"},{"id":"q244","u":"Anatomy","t":"mc","q":"Vein in the posterior interventricular groove ?","o":["Middle cardiac vein","Great cardiac vein","Anterior cardiac vein","Small cardiac vein"],"c":0,"w":"The middle cardiac vein runs in the posterior interventricular groove alongside the posterior interventricular artery and drains into the coronary sinus. Its partner in the anterior groove is the great cardiac vein. Note: this question tests the same fact as the earlier \"content of the posterior interventricular groove\" question; both are kept as uploaded. Also asked in past papers: 2023 Q93. (Shams Practices, Blood Supply of the Heart, key slide 8; Anatomy L4 slides)","x":{"1":"The great cardiac vein runs in the ANTERIOR interventricular groove with the LAD.","2":"Anterior cardiac veins arise from the right ventricle and end in the anterior wall of the right atrium.","3":"The small cardiac vein drains into the coronary sinus, but it is not the vein of the posterior interventricular groove."},"m":{"1":"mixes up great and middle cardiac veins"},"lp":true,"k":"anat-cardiac-veins","src":"Shams Practices, Blood Supply of the Heart, key slide 8; Anatomy L4 slides","kind":"Apply a fact"},{"id":"q245","u":"Anatomy","t":"mc","q":"Lateral infarct (lateral wall of the Lt. ventricle):","o":["Circumflex branch of the left coronary","Right marginal branch of the right coronary artery","Posterior interventricular artery","Conus branch of the right coronary artery"],"c":0,"w":"The circumflex branch of the left coronary artery gives branches to the left atrium and to the left ventricle, including the left (obtuse) marginal artery along the lateral wall. Occlusion of the circumflex therefore causes a lateral infarct of the left ventricle. Note: the stem was a phrase with an unclosed bracket; the question asks which artery is blocked in a lateral wall infarct. Also asked in past papers: Unknown-1 Q149. (Shams Practices, Blood Supply of the Heart, key slide 10; Anatomy L4 slides)","x":{"1":"The right (acute) marginal branch supplies the RIGHT ventricle.","2":"The posterior interventricular artery supplies the diaphragmatic surface and the posterior 1/3 of the septum.","3":"The right conus branch supplies the infundibulum of the right ventricle."},"m":{"1":"mixes up acute and obtuse marginal","2":"mixes up lateral and posterior walls"},"lp":true,"k":"anat-coronary","src":"Shams Practices, Blood Supply of the Heart, key slide 10; Anatomy L4 slides","kind":"Apply a fact"},{"id":"q246","u":"Anatomy","t":"mc","q":"The anterior division of the retromandibular vein joins the facial vein. Into which vein does the resulting common facial vein usually drain?","o":["Internal jugular vein (IJV)","Axillary vein","Azygos vein","Femoral vein"],"c":0,"w":"The anterior facial vein joins the anterior division of the retromandibular vein to form the common facial vein, which drains into the internal jugular vein. The common facial vein is one of the IJV's tributaries, with the pharyngeal, lingual, superior thyroid and middle thyroid veins. Also asked in past papers: 2025 Q2. (Shams Practices, Blood Supply of the Head and Neck, key slide 14; Anatomy L5 slides)","x":{"1":"The axillary vein is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","2":"The azygos vein is not part of the head and neck drainage on your slides; the common facial vein drains into the IJV.","3":"The femoral vein is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer."},"m":{},"lp":true,"k":"anat-facial-veins","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 14; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q247","u":"Anatomy","t":"mc","q":"Union of Anterior facial vein & anterior part of posterior facial vein will form?","o":["Common facial vein","External jugular vein","Anterior jugular vein","Vertebral vein"],"c":0,"w":"The posterior facial vein is another name for the retromandibular vein. At the lower pole of the parotid it divides: its anterior part joins the anterior facial vein to form the common facial vein (which drains into the IJV), and its posterior part joins the posterior auricular vein to form the external jugular vein. Also asked in past papers: 2024 Nov Q31. (Shams Practices, Blood Supply of the Head and Neck, key slide 14; Anatomy L5 slides)","x":{"1":"The external jugular vein forms from the POSTERIOR division of the posterior facial (retromandibular) vein and the posterior auricular vein.","2":"The anterior jugular vein is a tributary of the external jugular vein, not formed by the facial veins.","3":"The vertebral vein is not formed by the facial veins."},"m":{"1":"mixes up anterior and posterior divisions"},"lp":true,"k":"anat-facial-veins","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 14; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q248","u":"Anatomy","t":"mc","q":"Branch of 1st part of subclavian artery, runs dorsally to the suprascapular notch?","o":["Thyrocervical trunk","Vertebral artery","Internal thoracic artery","Axillary artery"],"c":0,"w":"The first part of the subclavian artery, medial to scalenus anterior, gives the vertebral artery, the internal thoracic artery and the thyrocervical trunk. The thyrocervical trunk divides into the inferior thyroid, transverse cervical and suprascapular arteries, and it is through its suprascapular branch that it reaches the suprascapular notch. Note: strictly, the artery that runs to the notch is the suprascapular artery; the key answer is the 1st-part branch that gives it. Also asked in past papers: 2024 Nov Q33. (Shams Practices, Blood Supply of the Head and Neck, key slide 10; Anatomy L5 slides)","x":{"1":"The vertebral artery is also a 1st-part branch, but it does not give the suprascapular artery.","2":"The internal thoracic artery is also a 1st-part branch, but it does not give the suprascapular artery.","3":"The axillary artery is the continuation of the subclavian beyond the outer border of the 1st rib, not a branch of its 1st part."},"m":{"1":"mixes up first-part branches","2":"mixes up first-part branches"},"lp":true,"k":"anat-subclavian","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 10; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q249","u":"Anatomy","t":"mc","q":"An artery which is medial to IJV, originate from aortic arch, and terminate in the thyroid cartilage ?","o":["Common carotid artery","Left subclavian artery","Left vertebral artery","Left superior thyroid artery"],"c":0,"w":"The left common carotid artery arises from the arch of the aorta (the right from the brachiocephalic artery). It ascends inside the carotid sheath, related medially to the trachea and larynx and laterally to the IJV, and ends at the upper border of the thyroid cartilage (C3-4) by dividing into the external and internal carotids. Also asked in past papers: 2024 Nov Q34. (Shams Practices, Blood Supply of the Head and Neck, key slide 4; Anatomy L5 slides)","x":{"1":"The left subclavian also arises from the arch of the aorta, but it arches laterally in the root of the neck and ends at the outer border of the 1st rib.","2":"The vertebral artery is a branch of the 1st part of the subclavian artery.","3":"The superior thyroid artery is the first branch of the external carotid artery."},"m":{"1":"mixes up carotid and subclavian"},"lp":true,"k":"anat-carotid","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 4; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q250","u":"Anatomy","t":"mc","q":"Which of the following is a branch from the 2nd part of subclavian artery?","o":["Deep cervical artery","Radial artery","Superior thyroid artery","Femoral artery"],"c":0,"w":"The second part of the subclavian artery lies behind scalenus anterior and gives the costocervical trunk, which divides into the superior intercostal and deep cervical arteries. The deep cervical artery is therefore a branch of the 2nd part through the costocervical trunk. Also asked in past papers: 2024 May Q61. (Shams Practices, Blood Supply of the Head and Neck, key slide 11; Anatomy L5 slides)","x":{"1":"The radial artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","2":"The superior thyroid artery is a branch of the external carotid artery.","3":"The femoral artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer."},"m":{"2":"mixes subclavian and carotid branches"},"lp":true,"k":"anat-subclavian","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 11; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q251","u":"Anatomy","t":"mc","q":"The brachiocephalic vein is formed by","o":["Subclavian vein and internal jugular vein","Radial vein and ulnar vein","Cephalic vein and basilic vein","Great saphenous vein and femoral vein"],"c":0,"w":"The internal jugular vein joins the subclavian vein to form the brachiocephalic vein, and the right and left brachiocephalic veins unite to form the superior vena cava. The subclavian vein itself begins as the continuation of the axillary vein at the outer border of the 1st rib. Also asked in past papers: 2024 May Q64. (Shams Practices, Blood Supply of the Head and Neck, key slide 21; Anatomy L5 slides)","x":{"1":"The radial and ulnar veins is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","2":"The cephalic and basilic veins is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","3":"The great saphenous and femoral veins is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer."},"m":{},"lp":true,"k":"anat-neck-veins","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 21; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q252","u":"Anatomy","t":"mc","q":"Posterior branch of facial vein will form ?","o":["External jugular vein","Anterior jugular vein","Vertebral vein","Subclavian vein"],"c":0,"w":"The posterior facial (retromandibular) vein divides at the lower pole of the parotid gland. Its posterior branch joins the posterior auricular vein to form the external jugular vein, which descends superficial to sternomastoid and ends in the subclavian vein. Note: the stem says \"facial vein\"; it means the posterior facial vein, since the anterior facial vein does not divide this way. Also asked in past papers: 2023 Q91. (Shams Practices, Blood Supply of the Head and Neck, key slide 13; Anatomy L5 slides)","x":{"1":"The anterior jugular vein is a tributary of the external jugular vein, not formed by the posterior branch.","2":"The vertebral vein is not formed by the facial veins.","3":"The subclavian vein begins as the continuation of the axillary vein; the external jugular drains into it."},"m":{},"lp":true,"k":"anat-facial-veins","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 13; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q253","u":"Anatomy","t":"mc","q":"Artery running in the sheath, medially to IJV, and arising from arch of aorta ?","o":["Left common carotid","Left vertebral artery","Left superior thyroid artery","Left axillary artery"],"c":0,"w":"Only the LEFT common carotid arises directly from the arch of the aorta; the right arises from the brachiocephalic artery behind the sternoclavicular joint. Inside the carotid sheath the common carotid lies medial to the internal jugular vein. Also asked in past papers: 2023 Q94. (Shams Practices, Blood Supply of the Head and Neck, key slide 4; Anatomy L5 slides)","x":{"1":"The vertebral artery is a branch of the 1st part of the subclavian artery and does not run in the carotid sheath.","2":"The superior thyroid artery is the first branch of the external carotid artery.","3":"The axillary artery is the continuation of the subclavian artery beyond the 1st rib."},"m":{},"lp":true,"k":"anat-carotid","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 4; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q254","u":"Anatomy","t":"mc","q":"Facial artery branch of :","o":["External Carotid Artery","Internal carotid artery","Subclavian artery","Axillary artery"],"c":0,"w":"The external carotid artery gives the superior thyroid, ascending pharyngeal, lingual, facial, occipital and posterior auricular arteries, then ends in the parotid gland as the maxillary and superficial temporal arteries. The internal carotid gives no branches in the neck. Also asked in past papers: Unknown-1 Q135. (Shams Practices, Blood Supply of the Head and Neck, key slide 6; Anatomy L5 slides)","x":{"1":"The internal carotid artery has no branches in the neck.","2":"The subclavian artery's branches are the vertebral, internal thoracic, thyrocervical, costocervical and dorsal scapular arteries.","3":"The axillary artery is the continuation of the subclavian beyond the 1st rib."},"m":{"1":"gives the ICA neck branches","2":"mixes subclavian and carotid branches"},"lp":true,"k":"anat-carotid","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 6; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q255","u":"Anatomy","t":"mc","q":"Axillary Artery is a continuation of :","o":["Subclavian Artery","Radial artery","Ulnar artery","Femoral artery"],"c":0,"w":"The subclavian artery arches laterally in the root of the neck and ends at the outer border of the 1st rib by becoming the axillary artery. Also asked in past papers: Unknown-1 Q136. (Shams Practices, Blood Supply of the Head and Neck, key slide 8; Anatomy L5 slides)","x":{"1":"The radial artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","2":"The ulnar artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","3":"The femoral artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer."},"m":{},"lp":true,"k":"anat-subclavian","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 8; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q256","u":"Anatomy","t":"mc","q":"Internal jugular Vein drains into :","o":["Brachiocephalic vein","Cephalic vein","Basilic vein","Femoral vein"],"c":0,"w":"The internal jugular vein begins as the continuation of the sigmoid sinus at the jugular foramen and ends by joining the subclavian vein to form the brachiocephalic vein. Also asked in past papers: Unknown-1 Q137. (Shams Practices, Blood Supply of the Head and Neck, key slide 20; Anatomy L5 slides)","x":{"1":"The cephalic vein is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","2":"The basilic vein is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","3":"The femoral vein is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer."},"m":{},"lp":true,"k":"anat-neck-veins","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 20; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q257","u":"Anatomy","t":"mc","q":"Axillary artery is a continuation of which artery?","o":["Subclavian artery","Radial artery","Ulnar artery","Femoral artery"],"c":0,"w":"The subclavian artery becomes the axillary artery at the outer border of the 1st rib. Note: this repeats question 10 of the same set; both are kept as uploaded. Also asked in past papers: Unknown-2 Q163. (Shams Practices, Blood Supply of the Head and Neck, key slide 8; Anatomy L5 slides)","x":{"1":"The radial artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","2":"The ulnar artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer.","3":"The femoral artery is not one of the head, neck or heart vessels taught in this block; it is a limb vessel, so it cannot be the answer."},"m":{},"lp":true,"k":"anat-subclavian","src":"Shams Practices, Blood Supply of the Head and Neck, key slide 8; Anatomy L5 slides","kind":"Apply a fact"},{"id":"q258","u":"Anatomy","t":"mc","q":"The deep palmar arch is formed by","o":["Radial artery","Brachial artery","Axillary artery","Posterior interosseous artery"],"c":0,"w":"The deep palmar arch is formed mainly by the terminal part of the radial artery, completed by the deep branch of the ulnar artery. The superficial arch is the ulnar artery's arch. This limb-vessel topic is not in your uploaded Mid 2 slides; the answer follows the bank's key. (Shams Practices QB, 2024 May Q62; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The brachial artery is the artery of the arm; it divides into the radial and ulnar arteries at the elbow.","2":"The axillary artery is the continuation of the subclavian artery in the axilla.","3":"The posterior interosseous artery runs in the back of the forearm."},"m":{},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q259","u":"Anatomy","t":"mc","q":"The anterior circumflex humeral branch is a branch of","o":["Axillary artery","Radial artery","Ulnar artery","Common carotid artery"],"c":0,"w":"The anterior and posterior circumflex humeral arteries are branches of the axillary artery, which continues the subclavian artery beyond the outer border of the 1st rib. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q63; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The radial artery is a forearm branch of the brachial artery.","2":"The ulnar artery is a forearm branch of the brachial artery.","3":"The common carotid artery ends at the upper border of the thyroid cartilage by dividing into the external and internal carotids."},"m":{},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q260","u":"Anatomy","t":"mc","q":"Which of the following is from the 2nd part of axillary artery?","o":["Lateral thoracic artery","Superior thoracic artery","Subscapular artery","Posterior circumflex humeral artery"],"c":0,"w":"Like the subclavian, the axillary artery is divided into three parts by a muscle crossing in front of it (pectoralis minor). The 2nd part gives the thoraco-acromial and lateral thoracic arteries. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q65; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The superior thoracic artery comes from the 1st part of the axillary artery.","2":"The subscapular artery comes from the 3rd part of the axillary artery.","3":"The posterior circumflex humeral artery comes from the 3rd part of the axillary artery."},"m":{"1":"mixes up the parts of the axillary artery","2":"mixes up the parts of the axillary artery","3":"mixes up the parts of the axillary artery"},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q261","u":"Anatomy","t":"mc","q":"Which of the following arteries forms the superficial palmar arch?","o":["Ulnar artery","Anterior interosseous artery","Posterior interosseous artery","Profunda brachii artery"],"c":0,"w":"The superficial palmar arch is formed mainly by the ulnar artery; the deep arch mainly by the radial artery. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, 2024 May Q66; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The anterior interosseous artery runs on the front of the interosseous membrane in the forearm.","2":"The posterior interosseous artery runs in the back of the forearm.","3":"The profunda brachii artery is the deep artery of the arm."},"m":{"1":"mixes up the palmar arches"},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q262","u":"Anatomy","t":"mc","q":"Which artery joins the deep branch of the ulnar artery to form the deep palmar arch?","o":["Radial Artery","Profunda brachii artery","Superior thoracic artery","Posterior circumflex humeral artery"],"c":0,"w":"The radial artery forms the deep palmar arch and is completed by the deep branch of the ulnar artery. Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem lightly reworded from \"artery joins deep branch of ulnar artery to form Deep Palmar Arch\".) (Shams Practices QB, Unknown-1 Q138; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The profunda brachii artery is the deep artery of the arm.","2":"The superior thoracic artery is a branch of the 1st part of the axillary artery.","3":"The posterior circumflex humeral artery is a branch of the 3rd part of the axillary artery."},"m":{},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q263","u":"Anatomy","t":"mc","q":"Blood for a blood test is usually drawn from:","o":["Median cubital vein","Hepatic portal vein","Pulmonary vein","Great cardiac vein"],"c":0,"w":"Routine venipuncture uses the median cubital vein in front of the elbow, which links the cephalic and basilic veins. Not in your uploaded Mid 2 slides; answer from the bank's key. (Stem fixed from \"drain blood test from :\".) (Shams Practices QB, Unknown-1 Q139; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The hepatic portal vein carries blood from the gut to the liver and is not reachable for a blood test.","2":"The pulmonary veins carry oxygenated blood from the lungs to the left atrium.","3":"The great cardiac vein runs in the anterior interventricular groove with the LAD."},"m":{},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q264","u":"Anatomy","t":"mc","q":"Ulnar and which artery join to form palmar arch?","o":["Radial Artery","Brachial artery","Axillary artery","Profunda brachii artery"],"c":0,"w":"The palmar arches are formed by the two forearm arteries, radial and ulnar: superficial arch mainly ulnar, deep arch mainly radial. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q159; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The brachial artery divides into the radial and ulnar arteries at the elbow; it does not reach the hand.","2":"The axillary artery is in the axilla, far above the hand.","3":"The profunda brachii artery is the deep artery of the arm."},"m":{},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q265","u":"Anatomy","t":"mc","q":"Dorsalis pedis is continuation of?","o":["Anterior Tibial","Posterior tibial artery","Fibular artery","Medial plantar artery"],"c":0,"w":"The anterior tibial artery runs down the front of the leg and becomes the dorsalis pedis artery in front of the ankle. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q160; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The posterior tibial artery ends behind the medial malleolus by dividing into the plantar arteries.","2":"The fibular (peroneal) artery is a branch of the posterior tibial artery.","3":"The medial plantar artery is a terminal branch of the posterior tibial artery in the sole."},"m":{},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q266","u":"Anatomy","t":"mc","q":"Cephalic vein drains to which vein?","o":["Axillary vein","Popliteal vein","Internal jugular vein","Great saphenous vein"],"c":0,"w":"The cephalic vein runs up the lateral side of the arm and drains into the axillary vein. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q161; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The popliteal vein is behind the knee; it receives the lesser saphenous vein.","2":"The internal jugular vein drains the head and neck and joins the subclavian vein.","3":"The great saphenous vein is a superficial vein of the lower limb."},"m":{},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q267","u":"Anatomy","t":"mc","q":"Lesser saphenous vein drains to which vein?","o":["Popliteal vein","Axillary vein","Internal jugular vein","Brachiocephalic vein"],"c":0,"w":"The lesser (small) saphenous vein runs up the back of the leg and drains into the popliteal vein behind the knee. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q162; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The axillary vein receives the cephalic vein from the upper limb.","2":"The internal jugular vein drains the head and neck.","3":"The brachiocephalic vein is formed by the internal jugular and subclavian veins."},"m":{},"lp":true,"k":"anat-limb-vessels","src":"materials","kind":"Apply a fact"},{"id":"q268","u":"Physiology","t":"mc","q":"Which ECG wave represents atrial depolarization initiated by the sinoatrial (SA) node?","o":["P wave","Q wave","R wave","T wave"],"c":0,"w":"The SA node starts each beat by depolarizing the atria, which the ECG records as the P wave. The QRS complex is ventricular depolarization and the T wave ventricular repolarization. (Shams Practices QB, 2025 Q8; Physiology L6 slides (ECG I))","x":{"1":"The Q wave is the first downward part of the QRS complex, ventricular depolarization.","2":"The R wave is the upward part of the QRS complex, ventricular depolarization.","3":"The T wave is ventricular repolarization."},"m":{"3":"mixes up P and T waves"},"lp":true,"k":"phys-ecg-waves","src":"materials","kind":"Apply a fact"},{"id":"q269","u":"Physiology","t":"mc","q":"What represents the function of the SA node?","o":["P wave","Q wave","T wave","U wave"],"c":0,"w":"The SA node's impulse depolarizes the atria, recorded as the P wave. (Shams Practices QB, 2024 May Q89; Physiology L6 slides (ECG I))","x":{"1":"The Q wave belongs to the QRS complex, ventricular depolarization.","2":"The T wave is ventricular repolarization.","3":"The U wave is not described on your slides and does not represent the SA node."},"m":{},"lp":true,"k":"phys-ecg-waves","src":"materials","kind":"Apply a fact"},{"id":"q270","u":"Physiology","t":"mc","q":"ECG paper contains many small squares in a horizontal line. Each small square equals?","o":["0.04 second","0.40 second","1 second"],"c":0,"w":"At the standard paper speed of 25 mm/sec, each 1-mm small box horizontally is 0.04 s, and a large box (5 small boxes) is 0.20 s. (Stem fixed from \"The ESG paper contain...\"; the paper prints only three options.) (Shams Practices QB, 2023 Q97; Physiology L6 slides (ECG I))","x":{"1":"0.40 s is ten small boxes (two large boxes), not one.","2":"1 second is 25 small boxes (five large boxes)."},"m":{"1":"confuses small and large boxes"},"lp":true,"k":"phys-ecg-waves","src":"materials","kind":"Apply a fact"},{"id":"q271","u":"Physiology","t":"mc","q":"PR segment is an indication for?","o":["AVN delay","Ventricular repolarization","Ventricular ejection","Isovolumetric relaxation"],"c":0,"w":"The PR interval covers atrial depolarization plus the delay in the AV junction (AV node and bundle of His), and the flat PR segment is that AV-nodal delay. The delay lets the atria contract before the ventricles. (Shams Practices QB, 2023 Q98; Physiology L6 slides (ECG I))","x":{"1":"Ventricular repolarization is the T wave.","2":"Ventricular ejection is a mechanical event, not shown by the PR segment.","3":"Isovolumetric relaxation is a mechanical event, not shown by the PR segment."},"m":{},"lp":true,"k":"phys-ecg-waves","src":"materials","kind":"Apply a fact"},{"id":"q272","u":"Physiology","t":"mc","q":"PR segment indicates which of the following?","o":["AV node delay","Ventricular ejection","Ventricular repolarization","Isovolumetric relaxation"],"c":0,"w":"The PR segment reflects the delay of the impulse in the AV junction, which gives the atria time to contract before the ventricles contract. (Shams Practices QB, 2022 Q123; Physiology L6 slides (ECG I))","x":{"1":"Ventricular ejection is a mechanical event, not shown by the PR segment.","2":"Ventricular repolarization is the T wave.","3":"Isovolumetric relaxation is a mechanical event, not shown by the PR segment."},"m":{},"lp":true,"k":"phys-ecg-waves","src":"materials","kind":"Teaching and statements"},{"id":"q273","u":"Physiology","t":"mc","q":"A patient with myocardial infarction has ECG changes in leads II, III, and aVF. Which wall of the heart do these leads view?","o":["Inferior wall","Anterior wall","Lateral wall","Septal wall"],"c":0,"w":"Leads II, III and aVF view the inferior portion of the heart. I, aVL, V5 and V6 view the left lateral wall, V1-V2 the septum and V3-V4 the anterior wall. (Shams Practices QB, 2025 Q9; Physiology L7 slides (ECG II))","x":{"1":"The anterior wall is viewed by V3 and V4.","2":"The lateral wall is viewed by I, aVL, V5 and V6.","3":"The septum is viewed by V1 and V2."},"m":{},"lp":true,"k":"phys-ecg-leads","src":"materials","kind":"Apply a fact"},{"id":"q274","u":"Physiology","t":"mc","q":"Myocardial ischemia with ST-segment elevation was seen in leads II, III and aVF. Which part of the heart is affected?","o":["Inferior wall","Anterior wall","Lateral wall"],"c":0,"w":"Leads II, III and aVF look at the inferior wall, so ST elevation there points to an inferior infarct. (The paper prints only three options.) (Shams Practices QB, 2024 Nov Q37; Physiology L7 slides (ECG II))","x":{"1":"The anterior wall is viewed by V3 and V4.","2":"The lateral wall is viewed by I, aVL, V5 and V6."},"m":{},"lp":true,"k":"phys-ecg-leads","src":"materials","kind":"Apply a fact"},{"id":"q275","u":"Physiology","t":"mc","q":"ECG showed myocardial infarction in leads I, aVL, V5 and V6. Where is the infarction located?","o":["Left lateral portion of heart","Inferior wall","Septal wall","Right ventricular free wall"],"c":0,"w":"Leads I, aVL, V5 and V6 give a good view of the left lateral portion of the heart. (Shams Practices QB, 2024 May Q90; Physiology L7 slides (ECG II))","x":{"1":"The inferior wall is viewed by II, III and aVF.","2":"The septum is viewed by V1 and V2.","3":"No lead group on your slides is described as viewing the right ventricular free wall."},"m":{},"lp":true,"k":"phys-ecg-leads","src":"materials","kind":"Apply a fact"},{"id":"q276","u":"Physiology","t":"mc","q":"A patient with MI has signs in ECG leads I, II and aVF. Which view of the heart is given by these leads?","o":["Inferior view","Anterior view","Septal view","Right ventricular view"],"c":0,"w":"The key answer is the inferior view, which on your slides is given by leads II, III and aVF. Note: the paper says \"I, II, aVF\"; lead I is a lateral lead, so this is almost certainly a typo for II, III, aVF. (Shams Practices QB, 2023 Q99; Physiology L7 slides (ECG II))","x":{"1":"The anterior wall is viewed by V3 and V4.","2":"The septum is viewed by V1 and V2.","3":"No lead group on your slides is described as viewing the right ventricle."},"m":{},"lp":true,"k":"phys-ecg-leads","src":"materials","kind":"Apply a fact"},{"id":"q277","u":"Physiology","t":"mc","q":"A patient with myocardial infarction had signs in ECG leads II, III and aVF. These leads give which view of the heart?","o":["Inferior view","Anterior view","Lateral view","Septal view"],"c":0,"w":"Leads II, III and aVF view the inferior portion of the heart. (Shams Practices QB, 2022 Q122; Physiology L7 slides (ECG II))","x":{"1":"The anterior wall is viewed by V3 and V4.","2":"The lateral wall is viewed by I, aVL, V5 and V6.","3":"The septum is viewed by V1 and V2."},"m":{},"lp":true,"k":"phys-ecg-leads","src":"materials","kind":"Apply a fact"},{"id":"q278","u":"Physiology","t":"mc","q":"Normal QRS axis?","o":["−30° to +90°","−180° to −120°","+120° to +180°","−120° to −90°"],"c":0,"w":"A normal axis points leftward and downward. The key answer, -30 to +90 degrees, is the only option inside the normal range. Note: your slides give the normal axis as -30 to +110 degrees, so expect either upper limit; the other options are all abnormal. (Shams Practices QB, 2024 Nov Q38; Physiology L6 slides (ECG I))","x":{"1":"-180 to -120 degrees lies in the indeterminate (extreme right) zone.","2":"+120 to +180 degrees is right axis deviation.","3":"-120 to -90 degrees lies in the indeterminate (extreme right) zone."},"m":{},"lp":true,"k":"phys-axis","src":"materials","kind":"Apply a fact"},{"id":"q279","u":"Physiology","t":"mc","q":"What is the rhythm?","o":["Sinus bradycardia","Ventricular fibrillation","Asystole","Ventricular tachycardia"],"c":0,"w":"The strip shows a normal P wave before every narrow QRS, with a regular rhythm but the beats far apart: a slow sinus rhythm, sinus bradycardia. Ventricular rhythms would have wide bizarre QRS complexes, and asystole has none. (Shams Practices QB, 2024 Nov Q39; Physiology L7 slides (ECG II))","x":{"1":"Ventricular fibrillation has no organized complexes, only chaotic waves.","2":"Asystole is a flat line with no complexes.","3":"Ventricular tachycardia is fast with wide, bizarre QRS complexes."},"m":{},"lp":true,"k":"phys-sinus","src":"materials","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoMAAAC9CAIAAABH4+AtAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR42ry97ZbjOI42iA+SkiOyqrt3z5537v/edv9t13RVRlgSSWB/PBTMkJ1Z1e/MrE+eTKctSyQIAiAefPA//+//Z11XZj6Ow91zziJSazWzUkq8FxFVZWYm673nnN398/NTRNZ1xQW1VmYupZjZcRzMXNbl6K225u4pJRXpvbO5iLTWSim//+e/lmVZ1/V+v6eURISEmbn33ntn5pSSu7fWcs5ElFKqte77vq6rqn58fGDMKSUi6r27OzOrqpm5O4aNO+BuvTm+JSIR2bat9/7LL7/UWuOJGAAuIHcRMTMzw51778dxLMuCWRzHoaq3242I9n0n5pwzM+OGIoIb1lpFBLfCOFU1qSbnf/6//+//9R//cdQjpfT9/qmqnDSmIyKJxd3JnYhSzrVW0HMmFEZ7HAcR3W43d8fAWDxIwczu47+qmlIys23bsNYg1HEc4IF4OjNjffFVznnfd3cvpbibme3H/e3tLaj3+fm5LAsRtdawOrgDCMikOWcQp5TSe6+1gp1EBMMTEXzSWmutgzFaa2YGJsStzCyl1Hvf972Usq7rcRyq8v37919++QVzWZYFlMf1GDwY+/fff//27ZuZB+eDIMEb7k7nC6Qjou6sqtSt1ppYSine+ufnJ8jOSY9W3T2XQiqtNa9HSgm0DZ "id":"q280","u":"Physiology","t":"mc","q":"A healthy man undergoes an ECG while running. What change in the PR interval is expected compared with rest?","o":["The PR interval decreases","The PR interval increases to more than 200 ms","The PR interval remains unchanged","The PR interval varies randomly because the P waves and QRS complexes become independent"],"c":0,"w":"During exercise sympathetic activity rises. Sympathetic stimulation increases AV-node excitability and decreases AV nodal delay, so the PR interval shortens. (Shams Practices QB, 2025 Q10; Physiology L8 slides (cardiac output))","x":{"1":"A PR above 0.20 s (200 ms) is first-degree AV block, not the effect of exercise.","2":"The PR does change: sympathetic stimulation shortens AV delay.","3":"P waves independent of QRS complexes describes third-degree AV block."},"m":{"1":"thinks sympathetic stimulation slows AV conduction"},"lp":true,"k":"phys-autonomic","src":"materials","kind":"Recognize and interpret"},{"id":"q281","u":"Physiology","t":"mc","q":"A man was running and an ECG was performed. What is expected to appear?","o":["Decreased PR interval","Complete atrioventricular block","Increased PR interval","Ventricular fibrillation"],"c":0,"w":"Exercise raises sympathetic activity, which decreases AV nodal delay and so shortens the PR interval. Note: the paper prints only options a-c but keys \"D\"; option d, \"Decreased PR interval\", is restored here from the matching 2025 question. (Shams Practices QB, 2024 May Q88; Physiology L8 slides (cardiac output))","x":{"1":"Complete AV block is a conduction disease, not a normal response to exercise.","2":"Sympathetic stimulation DEcreases AV delay, so the PR shortens.","3":"Ventricular fibrillation is a lethal arrhythmia, not a normal response to exercise."},"m":{"2":"thinks sympathetic stimulation slows AV conduction"},"lp":true,"k":"phys-autonomic","src":"materials","kind":"Recognize and interpret"},{"id":"q282","u":"Physiology","t":"mc","q":"Prolonged duration of PR segment?","o":["1st degree AV block","Ventricular fibrillation","Ventricular tachycardia","Asystole"],"c":0,"w":"First-degree AV block is a PR interval longer than 0.20 s, from prolonged conduction delay in the AV node or bundle of His; every P wave still conducts. (Shams Practices QB, 2023 Q100; Physiology L7 slides (ECG II))","x":{"1":"Ventricular fibrillation has no organized P waves or QRS complexes.","2":"Ventricular tachycardia is a fast rhythm with wide QRS complexes.","3":"Asystole is a flat line with no complexes."},"m":{},"lp":true,"k":"phys-av-block","src":"materials","kind":"Apply a fact"},{"id":"q283","u":"Physiology","t":"mc","q":"In which condition may left ventricular ejection fraction fall to 30% or less?","o":["Cardiac failure with reduced ejection fraction","Normal left ventricular systolic function","Hyperdynamic left ventricular systolic function","Isolated first-degree atrioventricular block with normal ventricular function"],"c":0,"w":"Normal EF is 50-75% at rest and up to 90% in strenuous exercise; a failing heart may eject 30% or less. (Shams Practices QB, 2025 Q6; Physiology L8 slides (cardiac output))","x":{"1":"Normal function gives an EF of 50-75%.","2":"A hyperdynamic ventricle ejects MORE, raising the EF.","3":"First-degree block only lengthens the PR interval; with normal ventricles the EF is normal."},"m":{},"lp":true,"k":"phys-co","src":"materials","kind":"Apply a fact"},{"id":"q284","u":"Physiology","t":"mc","q":"Increase COP by:","o":["Increase heart rate and stroke volume","Decrease heart rate and stroke volume","Decrease heart rate while stroke volume remains constant","Decrease stroke volume while heart rate remains constant"],"c":0,"w":"Cardiac output = heart rate x stroke volume, so it rises when either or both rise; in exercise it can reach 20-25 L/min by increasing both. (Shams Practices QB, Unknown-1 Q158; Physiology L8 slides (cardiac output))","x":{"1":"Lowering both factors lowers cardiac output.","2":"Lowering heart rate with constant stroke volume lowers cardiac output.","3":"Lowering stroke volume with constant heart rate lowers cardiac output."},"m":{},"lp":true,"k":"phys-co","src":"materials","kind":"Apply a fact"},{"id":"q285","u":"Physiology","t":"mc","q":"Frank-Starling law depends on:","o":["End diastolic volume","Plasma glucose concentration","Arterial oxygen saturation","Serum sodium concentration"],"c":0,"w":"The Frank-Starling law states that the force of contraction is proportional to the initial length of the cardiac fiber, set by the end-diastolic volume (preload). (The paper's stem is just \"Frank-Starling law\".) (Shams Practices QB, Unknown-1 Q155; Physiology L8 slides (cardiac output))","x":{"1":"Plasma glucose does not set fiber length.","2":"Arterial oxygen saturation does not set fiber length.","3":"Serum sodium does not set fiber length."},"m":{},"lp":true,"k":"phys-starling","src":"materials","kind":"Apply a fact"},{"id":"q286","u":"Physiology","t":"mc","q":"Which mechanism directly increases systemic venous return to the heart during normal spontaneous inspiration?","o":["Respiratory pump","Arterial baroreceptor reflex","Coronary autoregulation"],"c":0,"w":"During inspiration intrathoracic pressure falls (to about -5 mmHg), drawing blood from the lower veins into the chest: the respiratory pump. (The paper prints three options.) (Shams Practices QB, 2025 Q7; Physiology L8 slides (cardiac output))","x":{"1":"The baroreceptor reflex adjusts blood pressure; it is not the inspiratory mechanism.","2":"Coronary autoregulation adjusts flow in the heart's own vessels."},"m":{},"lp":true,"k":"phys-venous-return","src":"materials","kind":"Apply a fact"},{"id":"q287","u":"Physiology","t":"mc","q":"Which part of the vascular tree has high compliance?","o":["Veins","Arterioles","Capillaries","Muscular arteries"],"c":0,"w":"Veins are capacitance vessels that hold about 60-70% of the blood volume, which is what high compliance means. (Stem lightly reworded from \"vascular tree with high Compliance\".) (Shams Practices QB, Unknown-1 Q156; Physiology L8 slides (cardiac output))","x":{"1":"Arterioles are the resistance vessels.","2":"Capillaries are exchange vessels and hold little blood.","3":"Muscular arteries distribute blood and are not the capacitance vessels."},"m":{"1":"mixes up compliance and resistance vessels"},"lp":true,"k":"phys-venous-return","src":"materials","kind":"Apply a fact"},{"id":"q288","u":"Physiology","t":"mc","q":"When the heart needs more oxygen, such as during exercise, how is the additional oxygen delivered?","o":["By increasing coronary blood flow","By decreasing coronary blood flow","By diverting blood away from the myocardium","By reducing arterial oxygen saturation"],"c":0,"w":"At rest the heart already extracts 60-70% of the oxygen it receives, so when more is needed, delivery can rise only by increasing coronary blood flow. (Shams Practices QB, 2025 Q4; Physiology L9 slides (coronary circulation))","x":{"1":"Less flow would deliver less oxygen.","2":"Diverting blood away would starve the myocardium.","3":"Lower arterial saturation would deliver less oxygen."},"m":{},"lp":true,"k":"phys-coronary-flow","src":"materials","kind":"Apply a fact"},{"id":"q289","u":"Physiology","t":"mc","q":"What change in the cardiac cycle affects coronary perfusion during tachycardia?","o":["Diastole becomes shorter","Diastole becomes longer","Diastolic duration remains unchanged","Diastole disappears completely"],"c":0,"w":"With a faster heart rate the period of diastole is shorter, and since most left ventricular coronary flow happens in diastole, coronary flow falls. (Shams Practices QB, 2025 Q5; Physiology L9 slides (coronary circulation))","x":{"1":"Diastole shortens, not lengthens, as rate rises.","2":"Diastole does shorten with tachycardia.","3":"Diastole shortens but does not disappear."},"m":{},"lp":true,"k":"phys-phasic-flow","src":"materials","kind":"Apply a fact"},{"id":"q290","u":"Physiology","t":"mc","q":"Left ventricular coronary blood flow is at its highest during?","o":["Diastole","Isovolumetric contraction","Rapid ventricular ejection","Reduced ventricular ejection"],"c":0,"w":"In systole the contracting left ventricle compresses its coronary vessels and the open aortic valve partly blocks their entrance, so LV flow is highest in diastole. (Option d printed as \"Increased Diastole\".) (Shams Practices QB, Unknown-2 Q166; Physiology L9 slides (coronary circulation))","x":{"1":"Isovolumetric contraction is part of systole, when LV vessels are compressed.","2":"Rapid ejection is systole, when LV vessels are compressed.","3":"Reduced ejection is still systole."},"m":{},"lp":true,"k":"phys-phasic-flow","src":"materials","kind":"Apply a fact"},{"id":"q291","u":"Physiology","t":"mc","q":"Coronary circulation during diastole is increased due to?","o":["Increased adenosine","Increased compression of coronary vessels","Increased coronary arteriolar resistance","Decreased aortic diastolic pressure"],"c":0,"w":"The key answer is adenosine, a coronary vasodilator formed from ATP. Note: your slides explain higher diastolic flow mainly by the RELIEF of systolic compression (aorta-LV gradient 80 mmHg in diastole); among these options, adenosine is the only one that increases flow. (Shams Practices QB, Unknown-2 Q164; Physiology L9 slides (coronary circulation))","x":{"1":"Compression REDUCES flow; it is what happens in systole.","2":"Higher resistance reduces flow.","3":"A low aortic diastolic pressure reduces coronary flow."},"m":{},"lp":true,"k":"phys-phasic-flow","src":"materials","kind":"Apply a fact"},{"id":"q292","u":"Physiology","t":"mc","q":"Maximum resistance vessels?","o":["Arterioles","Aorta","Venae cavae","Large veins"],"c":0,"w":"Arterioles are the resistance vessels of the circulation. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-1 Q157; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The aorta is a large elastic artery with low resistance.","2":"The venae cavae are large, low-resistance veins.","3":"Large veins are capacitance vessels with low resistance."},"m":{"3":"mixes up compliance and resistance vessels"},"lp":true,"k":"phys-past","src":"materials","kind":"Apply a fact"},{"id":"q293","u":"Physiology","t":"mc","q":"Which of the following blood vessels has maximum resistance?","o":["Arteriole","Aorta","Vena cava","Large vein"],"c":0,"w":"Arterioles have the greatest resistance. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q178; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"The aorta is a large elastic artery with low resistance.","2":"The vena cava is a large, low-resistance vein.","3":"Large veins are capacitance vessels with low resistance."},"m":{},"lp":true,"k":"phys-past","src":"materials","kind":"Apply a fact"},{"id":"q294","u":"Physiology","t":"mc","q":"When lying down and then standing up, blood pressure is regulated through?","o":["Baroreceptors","Photoreceptors","Olfactory receptors","Taste receptors"],"c":0,"w":"Baroreceptors sense the fall in pressure on standing and reflexly restore it. Not in your uploaded Mid 2 slides; answer from the bank's key. (Shams Practices QB, Unknown-2 Q165; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Photoreceptors sense light in the retina.","2":"Olfactory receptors sense smell.","3":"Taste receptors sense taste."},"m":{},"lp":true,"k":"phys-past","src":"materials","kind":"Apply a fact"},{"id":"q295","u":"Physiology","t":"mc","q":"A patient had a myocardial infarction 10 days ago. Which marker is still elevated?","o":["cTn I","Myoglobin","CK-MB","Serum amylase"],"c":0,"w":"Cardiac troponin I stays elevated for about 10 days after an MI, much longer than myoglobin or CK-MB. Your slides list cardiac enzymes (CK, LDH, troponin) as investigations but not their timing; answer from the bank's key. (Stem fixed from \"patient with myocardial infarction before 10 days, then it elevated by\".) (Shams Practices QB, Unknown-1 Q141; not in your uploaded Mid 2 slides (answer from the bank's key))","x":{"1":"Myoglobin rises and falls within about a day, so it is gone by day 10.","2":"CK-MB returns to normal within a few days.","3":"Serum amylase is a pancreatic enzyme, not a cardiac marker."},"m":{},"lp":true,"k":"phys-past","src":"materials","kind":"Apply a fact"},{"id":"q296","u":"Pathology","t":"mc","q":"Phlebothrombosis is associated with which factor of Virchow's triad?","o":["Hypercoagulability","Increased fibrinolysis","Increased arterial oxygen saturation","Decreased plasma glucose"],"c":0,"w":"Venous thrombi (phlebothrombosis) are the most common type and are associated with stasis and a hypercoagulable state, two arms of Virchow's triad. (Shams Practices QB, 2022 Q132; Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Fibrinolysis dissolves thrombi; more of it would oppose thrombosis.","2":"Arterial oxygen saturation is not part of Virchow's triad.","3":"Plasma glucose is not part of Virchow's triad."},"m":{},"lp":true,"k":"path-virchow","src":"materials","kind":"Apply a fact"},{"id":"q297","u":"Pathology","t":"mc","q":"Which complication can occur when a thrombus from a deep leg vein embolizes to a pulmonary artery and causes ischemic necrosis of lung tissue?","o":["Pulmonary infarction","Renal infarction","Splenic infarction","Hepatic infarction"],"c":0,"w":"A leg DVT embolizes through the right heart to the pulmonary arteries; the complication of DVT is embolism to the lungs with pulmonary infarction (especially in a congested lung). (Shams Practices QB, 2025 Q19; Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Renal infarcts come from SYSTEMIC (arterial) emboli, such as left heart thrombi.","2":"Splenic infarcts come from systemic emboli.","3":"Hepatic infarcts are not a result of a venous embolus to the lungs."},"m":{"1":"sends venous emboli to the systemic circulation"},"lp":true,"k":"path-embolism","src":"materials","kind":"Apply a fact"},{"id":"q298","u":"Pathology","t":"mc","q":"What is the most common cause of fat embolism following trauma?","o":["Long bone fracture","Isolated ankle sprain","Superficial skin laceration","Isolated shoulder dislocation"],"c":0,"w":"Fracture of long bones is the most common cause of fat embolism, followed by soft tissue trauma and burns. (Shams Practices QB, 2025 Q20; Pathology L2 slides (hemodynamic disorders II))","x":{"1":"An ankle sprain does not release marrow fat.","2":"A superficial laceration does not release marrow fat.","3":"A dislocation without fracture does not release marrow fat."},"m":{},"lp":true,"k":"path-systemic-emboli","src":"materials","kind":"Apply a fact"},{"id":"q299","u":"Pathology","t":"mc","q":"Most common cause of fat embolism is?","o":["Multiple fractures of long bones","An isolated ankle sprain","A superficial skin laceration","An isolated finger dislocation"],"c":0,"w":"Long bone fractures are the most common cause; fat embolism occurs in 90% of people with severe skeletal injuries, though fewer than 10% develop symptoms. (Shams Practices QB, 2023 Q104; Pathology L2 slides (hemodynamic disorders II))","x":{"1":"An ankle sprain does not release marrow fat.","2":"A superficial laceration does not release marrow fat.","3":"A finger dislocation does not release marrow fat."},"m":{},"lp":true,"k":"path-systemic-emboli","src":"materials","kind":"Apply a fact"},{"id":"q300","u":"Pathology","t":"mc","q":"A pregnant woman, after giving birth, developed dyspnea, cyanosis, pulmonary edema and seizures. What is the cause?","o":["Amniotic fluid embolism","Carpal tunnel syndrome","Iron-deficiency anemia","Uncomplicated cystitis"],"c":0,"w":"Amniotic fluid entering the maternal circulation through torn membranes or ruptured uterine veins causes sudden dyspnea, cyanosis, shock, seizures, pulmonary edema and DIC. (Shams Practices QB, 2023 Q103; Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Carpal tunnel syndrome is a wrist nerve compression and causes none of these.","2":"Iron-deficiency anemia does not cause sudden seizures and pulmonary edema.","3":"Cystitis is a bladder infection and causes none of these."},"m":{},"lp":true,"k":"path-systemic-emboli","src":"materials","kind":"Apply a fact"},{"id":"q301","u":"Pathology","t":"mc","q":"A woman, after giving birth, developed dyspnea, pulmonary edema and seizures. What is the cause?","o":["Amniotic fluid embolism","Uncomplicated cystitis","Carpal tunnel syndrome","Allergic rhinitis"],"c":0,"w":"Sudden dyspnea, pulmonary edema and seizures at delivery are the picture of amniotic fluid embolism, which has 80% mortality. (Shams Practices QB, 2022 Q133; Pathology L2 slides (hemodynamic disorders II))","x":{"1":"Cystitis is a bladder infection and causes none of these.","2":"Carpal tunnel syndrome is a wrist nerve compression.","3":"Allergic rhinitis is nasal allergy."},"m":{},"lp":true,"k":"path-systemic-emboli","src":"materials","kind":"Apply a fact"},{"id":"q302","u":"Pathology","t":"mc","q":"A patient is suspected of having acute rheumatic fever. Which pair of findings are both major Jones criteria?","o":["Carditis and erythema marginatum","Fever and elevated C-reactive protein","Prolonged PR interval and elevated erythrocyte sedimentation rate","Fever and a positive throat culture for group A streptococci"],"c":0,"w":"The major Jones criteria are carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum and subcutaneous nodules. (Shams Practices QB, 2025 Q16; Pathology L3 slides (rheumatic fever))","x":{"1":"Fever and a raised CRP are both MINOR criteria.","2":"A prolonged PR interval and a raised ESR are both MINOR criteria.","3":"Fever is minor and a positive throat culture is supporting evidence of strep, not a major criterion."},"m":{"1":"mixes up major and minor Jones criteria","2":"mixes up major and minor Jones criteria"},"lp":true,"k":"path-jones","src":"materials","kind":"Recognize and interpret"},{"id":"q303","u":"Pathology","t":"mc","q":"Anitschkow cells are seen in:","o":["Acute rheumatic carditis","Calcific aortic stenosis","Viral pericarditis","Aortic dissection"],"c":0,"w":"Anitschkow (caterpillar) cells are macrophages with a slender wavy ribbon of chromatin found in Aschoff bodies, the pathognomonic lesion of acute rheumatic carditis. (Stem fixed from \"Antischow cell?\".) (Shams Practices QB, 2024 May Q47; Pathology L3 slides (rheumatic fever))","x":{"1":"Calcific aortic stenosis is not described with Aschoff bodies.","2":"Viral pericarditis is not described with Aschoff bodies.","3":"Aortic dissection is not described with Aschoff bodies."},"m":{},"lp":true,"k":"path-arf","src":"materials","kind":"Apply a fact"},{"id":"q304","u":"Pathology","t":"mc","q":"Lesion of acute rheumatic fever?","o":["Aschoff bodies","Psammoma bodies","Negri bodies","Lewy bodies"],"c":0,"w":"Aschoff bodies (focal necrosis, T lymphocytes and Anitschkow cells) are pathognomonic for acute rheumatic fever and appear in all layers of the heart. (Shams Practices QB, 2022 Q130; Pathology L3 slides (rheumatic fever))","x":{"1":"Psammoma bodies are calcified bodies in some tumors, not rheumatic fever.","2":"Negri bodies are seen in rabies.","3":"Lewy bodies are seen in Parkinson disease."},"m":{},"lp":true,"k":"path-arf","src":"materials","kind":"Apply a fact"},{"id":"q305","u":"Pathology","t":"mc","q":"A patient has left atrial enlargement and pulmonary edema. Which valvular lesion directly obstructs blood flow from the left atrium to the left ventricle?","o":["Mitral valve stenosis","Pulmonary valve stenosis","Tricuspid valve stenosis","Aortic valve regurgitation"],"c":0,"w":"Mitral stenosis obstructs flow from the left atrium, which dilates; back pressure causes chronic pulmonary venous congestion and edema, then pulmonary hypertension and right failure. (Shams Practices QB, 2025 Q17; Pathology L3 slides (rheumatic fever))","x":{"1":"Pulmonary stenosis obstructs the right ventricular outflow.","2":"Tricuspid stenosis obstructs flow from the RIGHT atrium.","3":"Aortic regurgitation is leakage at the left ventricular outflow, not obstruction of the left atrium."},"m":{},"lp":true,"k":"path-rhd","src":"materials","kind":"Apply a fact"},{"id":"q306","u":"Pathology","t":"mc","q":"Left atrial enlargement, pulmonary edema?","o":["Mitral valve stenosis","Pulmonary valve stenosis","Tricuspid valve stenosis","Pulmonary valve regurgitation"],"c":0,"w":"Left atrial dilatation and pulmonary congestion are the first consequences of mitral stenosis. (Shams Practices QB, 2024 May Q46; Pathology L3 slides (rheumatic fever))","x":{"1":"Pulmonary stenosis affects the right ventricular outflow.","2":"Tricuspid stenosis affects the right atrium.","3":"Pulmonary regurgitation affects the right side of the heart."},"m":{},"lp":true,"k":"path-rhd","src":"materials","kind":"Apply a fact"},{"id":"q307","u":"Pathology","t":"mc","q":"A patient came into the ER with pulmonary edema and an enlarged atrium. What is the lesion?","o":["Mitral stenosis","Tricuspid stenosis","Pulmonary stenosis","Pulmonary regurgitation"],"c":0,"w":"Mitral stenosis dilates the left atrium and backs blood into the lungs, causing pulmonary edema. (Stem completed from \"patient came into the ER with pulmonary edema, enlarged atrium...\".) (Shams Practices QB, 2024 May Q71; Pathology L3 slides (rheumatic fever))","x":{"1":"Tricuspid stenosis enlarges the right atrium and does not cause pulmonary edema.","2":"Pulmonary stenosis affects the right ventricular outflow.","3":"Pulmonary regurgitation affects the right side of the heart."},"m":{},"lp":true,"k":"path-rhd","src":"materials","kind":"Apply a fact"},{"id":"q308","u":"Pathology","t":"mc","q":"Physical examination of an asymptomatic 29-year-old woman with a history of rheumatic fever during childhood finds an early diastolic opening snap with a rumbling late diast
