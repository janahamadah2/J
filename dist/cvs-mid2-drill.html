aged valvular endothelium collects platelets and fibrin, forming a sterile microthrombus (sterile vegetation).","Adherence factors: S. aureus clumping factor and fibronectin-binding protein; viridans streptococci dextran; E. faecalis teichoic acid; Gram-negatives pili.","Vegetations contain fibrin, platelets, bacteria and inflammatory cells; they are friable and embolize, and the bacteria are protected from phagocytes and antibiotics.","Consequences: valve destruction with regurgitation and heart failure, septic emboli with infarcts or abscesses, immune complex glomerulonephritis and vasculitis."]}]},"micro-signs":{"title":"Clinical features of infective endocarditis","unit":"Microbiology","points":["Acute: high fever and sepsis. Subacute: mild fever, headache, myalgia, weight loss, night sweats. Cardiac: murmur, heart failure.","Splinter hemorrhages: petechial hemorrhages under the fingernails.","Janeway lesions: small, nontender, erythematous lesions on palms and soles. Osler nodes: painful nodules on the pads of fingers and toes.","Roth spots: retinal hemorrhages."],"source":"Microbiology L3 slides (infective endocarditis)","items":["q210","q211","q398"],"sec":[{"id":"micro-signs","title":"Clinical features of infective endocarditis","key":["Acute: high fever and sepsis. Subacute: mild fever, headache, myalgia, weight loss, night sweats. Cardiac: murmur, heart failure.","Splinter hemorrhages: petechial hemorrhages under the fingernails.","Janeway lesions: small, nontender, erythematous lesions on palms and soles. Osler nodes: painful nodules on the pads of fingers and toes.","Roth spots: retinal hemorrhages."]}]},"micro-dx-tx":{"title":"Diagnosis, treatment and prophylaxis","unit":"Microbiology","points":["Blood cultures are the gold standard: three sets from different venipuncture sites before treatment.","Culture-negative IE: prior antibiotics, fastidious bacteria (Coxiella burnetii, Bartonella, Brucella, HACEK; confirm by serology or PCR), fungal infection.","Empiric therapy once cultures are drawn: native valve vancomycin + cefepime; prosthetic valve vancomycin + cefepime + gentamicin + rifampin; then targeted therapy.","Prophylaxis before dental or invasive procedures in high-risk clients, 30-60 minutes before: amoxicillin, ampicillin or cefazolin; if penicillin-allergic, a macrolide (azithromycin) or doxycycline."],"source":"Microbiology L3 slides (infective endocarditis)","items":["q212","q213","q214","q215","q389"],"sec":[{"id":"micro-dx-tx","title":"Diagnosis, treatment and prophylaxis","key":["Blood cultures are the gold standard: three sets from different venipuncture sites before treatment.","Culture-negative IE: prior antibiotics, fastidious bacteria (Coxiella burnetii, Bartonella, Brucella, HACEK; confirm by serology or PCR), fungal infection.","Empiric therapy once cultures are drawn: native valve vancomycin + cefepime; prosthetic valve vancomycin + cefepime + gentamicin + rifampin; then targeted therapy.","Prophylaxis before dental or invasive procedures in high-risk clients, 30-60 minutes before: amoxicillin, ampicillin or cefazolin; if penicillin-allergic, a macrolide (azithromycin) or doxycycline."]}]},"micro-lab-id":{"title":"Laboratory identification of IE organisms","unit":"Microbiology","points":["S. aureus: Gram-positive cocci in clusters; golden yellow colonies, beta hemolysis, ferments mannitol; catalase and coagulase positive.","S. epidermidis: Gram-positive cocci in clusters; catalase positive, coagulase negative.","Viridans streptococci (S. mutans): Gram-positive cocci in chains; alpha hemolysis; optochin resistant; insoluble in bile.","S. pyogenes: Gram-positive cocci in chains; beta hemolysis; catalase negative.","S. pneumoniae: lancet-shaped capsulated diplococci; alpha hemolysis; optochin sensitive; bile soluble."],"source":"Microbiology L3 slides (infective endocarditis)","items":["q216","q392","q393","q394","q395"],"sec":[{"id":"micro-lab-id","title":"Laboratory identification of IE organisms","key":["S. aureus: Gram-positive cocci in clusters; golden yellow colonies, beta hemolysis, ferments mannitol; catalase and coagulase positive.","S. epidermidis: Gram-positive cocci in clusters; catalase positive, coagulase negative.","Viridans streptococci (S. mutans): Gram-positive cocci in chains; alpha hemolysis; optochin resistant; insoluble in bile.","S. pyogenes: Gram-positive cocci in chains; beta hemolysis; catalase negative.","S. pneumoniae: lancet-shaped capsulated diplococci; alpha hemolysis; optochin sensitive; bile soluble."]}]},"emb-arches":{"title":"Formation and derivatives of the aortic arches","unit":"Embryology","points":["At the 4th week two primitive aortae appear, each with a ventral aorta, a dorsal aorta and a connecting segment; the ventral aortae fuse into the aortic sac with right and left horns.","1st arch: disappears, remnant forms the maxillary arteries. 2nd arch: disappears, remnant forms the stapedial arteries. 5th arch: disappears completely.","3rd arch: proximal parts form the common carotid arteries; distal parts join the dorsal aorta to form the internal carotid arteries. The external carotid is a new bud from the junction.","Left 4th arch: part of the arch of the aorta between the left common carotid and left subclavian. Right 4th arch: proximal part of the right subclavian artery.","6th arch: left proximal forms the left pulmonary artery and left distal forms the ductus arteriosus; right proximal forms the right pulmonary artery and right distal degenerates."],"source":"Embryology L3 slides (aortic arches)","items":["q217","q218","q219","q220","q221","q222","q223","q224","q409","q410","q411","q412","q413"],"sec":[{"id":"emb-arches","title":"Formation and derivatives of the aortic arches","key":["At the 4th week two primitive aortae appear, each with a ventral aorta, a dorsal aorta and a connecting segment; the ventral aortae fuse into the aortic sac with right and left horns.","1st arch: disappears, remnant forms the maxillary arteries. 2nd arch: disappears, remnant forms the stapedial arteries. 5th arch: disappears completely.","3rd arch: proximal parts form the common carotid arteries; distal parts join the dorsal aorta to form the internal carotid arteries. The external carotid is a new bud from the junction.","Left 4th arch: part of the arch of the aorta between the left common carotid and left subclavian. Right 4th arch: proximal part of the right subclavian artery.","6th arch: left proximal forms the left pulmonary artery and left distal forms the ductus arteriosus; right proximal forms the right pulmonary artery and right distal degenerates."]}]},"emb-sac-dorsal":{"title":"Aortic sac, dorsal aorta and the origin of the great arteries","unit":"Embryology","points":["Aortic sac: arch of the aorta proximal to the brachiocephalic artery. Left horn: arch between the brachiocephalic and left common carotid. Right horn: brachiocephalic artery.","Right dorsal aorta: cranial to the 3rd arch forms the distal internal carotid; at the 7th intersegmental artery forms the distal right subclavian; the rest degenerates.","Left dorsal aorta: at the 7th intersegmental artery forms the subclavian; between the 4th and 6th arches forms the distal arch of the aorta; caudal to the 6th arch forms the descending thoracic and abdominal aorta.","Arch of the aorta from proximal to distal: aortic sac, left horn, left 4th arch, left dorsal aorta between the 4th and 6th arches."],"source":"Embryology L3 slides (aortic arches)","items":["q225","q226","q227","q228","q229"],"sec":[{"id":"emb-sac-dorsal","title":"Aortic sac, dorsal aorta and the origin of the great arteries","key":["Aortic sac: arch of the aorta proximal to the brachiocephalic artery. Left horn: arch between the brachiocephalic and left common carotid. Right horn: brachiocephalic artery.","Right dorsal aorta: cranial to the 3rd arch forms the distal internal carotid; at the 7th intersegmental artery forms the distal right subclavian; the rest degenerates.","Left dorsal aorta: at the 7th intersegmental artery forms the subclavian; between the 4th and 6th arches forms the distal arch of the aorta; caudal to the 6th arch forms the descending thoracic and abdominal aorta.","Arch of the aorta from proximal to distal: aortic sac, left horn, left 4th arch, left dorsal aorta between the 4th and 6th arches."]}]},"emb-anomalies":{"title":"Anomalies of the aortic arches","unit":"Embryology","points":["Patent ductus arteriosus: a patent duct between the left pulmonary artery and the arch of the aorta; associated with aortic stenosis, pulmonary stenosis and Fallot's tetralogy.","Right arch of aorta: develops from the right dorsal aorta and right 4th arch.","Double arch of aorta: persistence of the distal right dorsal aorta; a vascular ring around the trachea (dyspnea) and esophagus (dysphagia).","Coarctation: constriction of the aorta distal to the left subclavian. Postductal: distal to the ductus, ductus usually closed. Preductal: proximal to the ductus, ductus open."],"source":"Embryology L3 slides (aortic arches)","items":["q230","q231","q232","q233","q234","q414","q415"],"sec":[{"id":"emb-anomalies","title":"Anomalies of the aortic arches","key":["Patent ductus arteriosus: a patent duct between the left pulmonary artery and the arch of the aorta; associated with aortic stenosis, pulmonary stenosis and Fallot's tetralogy.","Right arch of aorta: develops from the right dorsal aorta and right 4th arch.","Double arch of aorta: persistence of the distal right dorsal aorta; a vascular ring around the trachea (dyspnea) and esophagus (dysphagia).","Coarctation: constriction of the aorta distal to the left subclavian. Postductal: distal to the ductus, ductus usually closed. Preductal: proximal to the ductus, ductus open."]}]},"emb-veins":{"title":"Development of the veins","unit":"Embryology","points":["At the 5th week each horn of the sinus venosus receives the umbilical, vitelline and common cardinal veins.","Vitelline veins form the portal and superior mesenteric veins. After birth the ductus venosus becomes the ligamentum venosum and the left umbilical vein the ligamentum teres.","Right common cardinal vein: SVC inside the pericardium. Left common cardinal vein: oblique vein of the left atrium.","Right anterior cardinal: SVC outside the pericardium, right brachiocephalic and right internal jugular veins. Left anterior cardinal: left superior intercostal, left brachiocephalic and left internal jugular veins.","Posterior cardinal veins: IVC, common iliac, suprarenal, testicular or ovarian, and renal veins."],"source":"Embryology L3 slides (aortic arches)","items":["q235","q236","q237","q238","q239"],"sec":[{"id":"emb-veins","title":"Development of the veins","key":["At the 5th week each horn of the sinus venosus receives the umbilical, vitelline and common cardinal veins.","Vitelline veins form the portal and superior mesenteric veins. After birth the ductus venosus becomes the ligamentum venosum and the left umbilical vein the ligamentum teres.","Right common cardinal vein: SVC inside the pericardium. Left common cardinal vein: oblique vein of the left atrium.","Right anterior cardinal: SVC outside the pericardium, right brachiocephalic and right internal jugular veins. Left anterior cardinal: left superior intercostal, left brachiocephalic and left internal jugular veins.","Posterior cardinal veins: IVC, common iliac, suprarenal, testicular or ovarian, and renal veins."]}]},"anat-limb-vessels":{"title":"Upper and lower limb vessels (past papers)","unit":"Anatomy","points":["The subclavian artery becomes the axillary artery at the outer border of the 1st rib.","Axillary artery: the anterior circumflex humeral artery is one of its branches; the lateral thoracic artery comes from its 2nd part.","The deep palmar arch is formed mainly by the radial artery, joined by the deep branch of the ulnar artery; the superficial palmar arch is formed mainly by the ulnar artery.","The dorsalis pedis artery is the continuation of the anterior tibial artery.","The cephalic vein drains into the axillary vein; the lesser (small) saphenous vein drains into the popliteal vein; blood tests are drawn from the median cubital vein."],"source":"Shams Practices QB (past papers); not in your uploaded slides","items":["q258","q259","q260","q261","q262","q263","q264","q265","q266","q267"],"sec":[{"id":"anat-limb-vessels","title":"Upper and lower limb vessels (past papers)","key":["The subclavian artery becomes the axillary artery at the outer border of the 1st rib.","Axillary artery: the anterior circumflex humeral artery is one of its branches; the lateral thoracic artery comes from its 2nd part.","The deep palmar arch is formed mainly by the radial artery, joined by the deep branch of the ulnar artery; the superficial palmar arch is formed mainly by the ulnar artery.","The dorsalis pedis artery is the continuation of the anterior tibial artery.","The cephalic vein drains into the axillary vein; the lesser (small) saphenous vein drains into the popliteal vein; blood tests are drawn from the median cubital vein."]}]},"phys-past":{"title":"Resistance, blood pressure regulation and cardiac markers (past papers)","unit":"Physiology","points":["Arterioles are the vessels with maximum resistance.","Blood pressure on standing up from lying down is regulated through the baroreceptors.","Troponin I (cTnI) stays elevated about 10 days after a myocardial infarction."],"source":"Shams Practices QB (past papers); not in your uploaded slides","items":["q292","q293","q294","q295"],"sec":[{"id":"phys-past","title":"Resistance, blood pressure regulation and cardiac markers (past papers)","key":["Arterioles are the vessels with maximum resistance.","Blood pressure on standing up from lying down is regulated through the baroreceptors.","Troponin I (cTnI) stays elevated about 10 days after a myocardial infarction."]}]},"path-past":{"title":"Endocarditis types, pyemia and MI healing (past papers)","unit":"Pathology","points":["Libman-Sacks endocarditis: sterile, wart-like (verrucous) vegetations on the valves in systemic lupus erythematosus.","Nonbacterial thrombotic endocarditis (NBTE) is associated with mucinous adenocarcinoma.","Acute infective endocarditis is a suppurative inflammation and can cause systemic pyemic abscesses.","Stable angina is caused by an uncomplicated atheroma; granulation tissue appears in an infarct at about 7 days."],"source":"Shams Practices QB (past papers); vegetations in SLE are on Pathology L2 slides","items":["q310","q311","q312","q313","q314","q315","q316","q317","q318","q319"],"sec":[{"id":"path-past","title":"Endocarditis types, pyemia and MI healing (past papers)","key":["Libman-Sacks endocarditis: sterile, wart-like (verrucous) vegetations on the valves in systemic lupus erythematosus.","Nonbacterial thrombotic endocarditis (NBTE) is associated with mucinous adenocarcinoma.","Acute infective endocarditis is a suppurative inflammation and can cause systemic pyemic abscesses.","Stable angina is caused by an uncomplicated atheroma; granulation tissue appears in an infarct at about 7 days."]}]},"pharm-antiarrhythmic":{"title":"Antiarrhythmic drugs (past papers)","unit":"Pharmacology","points":["Class I antiarrhythmics block Na+ channels: quinidine and procainamide (IA, also block K+), lidocaine (IB), flecainide (IC, no effect on action potential duration).","Quinidine causes cinchonism: headache, dizziness and tinnitus.","Class III antiarrhythmics block K+ channels: sotalol (also a beta blocker) and amiodarone.","Amiodarone treats both ventricular and supraventricular arrhythmias; it can cause pulmonary fibrosis and gray-blue (smurf) skin.","Adenosine is the choice for paroxysmal supraventricular tachycardia; esmolol is used intraoperatively."],"source":"Shams Practices QB (past papers); not in your uploaded slides","items":["q327","q328","q329","q330","q331","q332","q333","q334","q335","q336","q337","q338","q339"],"sec <script>
/* drill-core.js — pure drill logic (no DOM). Inlined into the drill page by
 * build-drill.py and loaded by simulate.js, so the simulations test the exact
 * code the page runs.
 *
 * Progress state S (saved in localStorage and synced to the account):
 *   seq        global answer counter (rest periods are counted in answers)
 *   p[id]      {h: recent results, ls: seq at last answer, lt: time, sid: session,
 *               t: last change, n: answers, sc: last full-question score 0..1,
 *               lp: last answer position (string)}
 *              h characters: R right, W wrong, P partly right, G right but guessed,
 *              r / w single-row practice right / wrong (r never counts toward solid)
 *   stars[id]  {on: 0|1, t}
 *   miss[]     {q, lab, t}  every wrong pick (misconception label when one exists)
 *   lastSid    id of the most recent session started
 */
(function (root) {
  'use strict';
  var H18 = 18 * 3600 * 1000;

  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function shuffle(a, r) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

  function newState() {
    return { v: 1, seq: 0, p: {}, stars: {}, miss: [], pre: { last: null }, tsec: { s: 0, n: 0 },
             lc: {}, ll: -1, lastSid: null, sidN: 0, t: 0 };
  }

  /* ------------------------------------------------------------ data context */
  function makeCtx(DATA) {
    var D = { cfg: DATA.cfg, items: DATA.items, concepts: DATA.concepts || {}, byId: {}, hiUnits: {} };
    DATA.items.forEach(function (it) { D.byId[it.id] = it; });
    (DATA.cfg.high_roi_units || []).forEach(function (u) { D.hiUnits[u] = 1; });
    return D;
  }
  // a question id is "q12" or a single-row variant "q12r3"
  function parseId(qid) {
    var m = /^(q\d+)(?:r(\d+))?$/.exec(qid);
    return m ? { base: m[1], row: m[2] === undefined ? -1 : +m[2] } : { base: qid, row: -1 };
  }
  function itemOf(D, qid) {
    var p = parseId(qid), it = D.byId[p.base];
    if (!it || p.row < 0) return it;
    return { id: qid, base: it.id, row: p.row, u: it.u, t: 'row', k: it.k, lp: it.lp, src: it.src, kind: it.kind,
             q: it.rs[p.row], o: it.o.choices, c: it.c[p.row], w: it.w, x: it.x, m: it.m, parent: it };
  }

  /* ------------------------------------------------------------ status */
  function eff(h) { return (h || '').replace(/r/g, '').replace(/w/g, 'W'); }
  function status(it, rec) {
    if (!rec) return 'new';
    var e = eff(rec.h);
    if (!e) return 'new';
    var last = e.charAt(e.length - 1);
    if (last !== 'R') return 'shaky';
    var need = it.t === 'tf' ? 3 : 2;
    return e.slice(-need) === new Array(need + 1).join('R') ? 'solid' : 'once';
  }
  function trailingMiss(rec) {
    var e = eff(rec && rec.h), n = 0;
    for (var i = e.length - 1; i >= 0 && (e[i] === 'W' || e[i] === 'P'); i--) n++;
    return n;
  }
  function lastIsMiss(rec) { var e = eff(rec && rec.h); var c = e.charAt(e.length - 1); return c === 'W' || c === 'P' || c === 'G'; }
  function isStar(S, id) { var s = S.stars[id]; return !!(s && s.on); }
  function isHi(D, S, it) { return isStar(S, it.id) || !!it.lp || !!D.hiUnits[it.u]; }

  function restLen(D, S, it, rec, n) {
    var e = eff(rec.h), last = e.charAt(e.length - 1);
    if (last === 'W' || last === 'P') {
      return trailingMiss(rec) >= 2 ? clamp(Math.round(0.10 * n), 6, 25) : clamp(Math.round(0.25 * n), 10, 60);
    }
    if (last === 'G') return clamp(Math.round(0.25 * n), 10, 60);
    var b = clamp(Math.round(0.7 * n), 12, 300);
    if (status(it, rec) === 'solid') b = Math.round(b * 1.5);
    if (isHi(D, S, it)) b = clamp(Math.round(0.4 * b), 8, 120);
    return b;
  }
  function isRested(D, S, it, n, now) {
    var rec = S.p[it.id];
    if (!rec || !eff(rec.h)) return true;
    if (now - rec.lt >= H18) return true;
    return (S.seq - rec.ls) >= restLen(D, S, it, rec, n);
  }
  // answered in the previous session and not allowed back yet
  function prevBlocked(D, S, it) {
    var rec = S.p[it.id], blk = S._block !== undefined ? S._block : S.lastSid;
    if (!rec || !blk || rec.sid !== blk) return false;
    return !(isHi(D, S, it) || trailingMiss(rec) >= 2);
  }

  /* ------------------------------------------------------------ pools */
  function unitItems(D, units) {
    var set = {}; units.forEach(function (u) { set[u] = 1; });
    return D.items.filter(function (it) { return set[it.u]; });
  }
  var FILTERS = {
    missed: function (D, S, it) { return status(it, S.p[it.id]) === 'shaky'; },
    starred: function (D, S, it) { return isStar(S, it.id); },
    lp: function (D, S, it) { return !!it.lp; },
    never: function (D, S, it) { return status(it, S.p[it.id]) === 'new'; }
  };
  function pool(D, S, units, filters, overlap) {
    var base = unitItems(D, units), act = Object.keys(FILTERS).filter(function (f) { return filters && filters[f]; });
    if (!act.length) return base.map(function (it) { return it.id; });
    return base.filter(function (it) {
      var hits = act.map(function (f) { return FILTERS[f](D, S, it); });
      return overlap ? hits.every(Boolean) : hits.some(Boolean);
    }).map(function (it) { return it.id; });
  }
  function filterCounts(D, S, units) {
    var base = unitItems(D, units), out = {};
    Object.keys(FILTERS).forEach(function (f) { out[f] = base.filter(function (it) { return FILTERS[f](D, S, it); }).length; });
    return out;
  }

  /* ------------------------------------------------------------ sequencing */
  function tfTruth(it) { return it.t === 'tf' ? (it.c === 0) : null; }
  function tfOK(it, tfh) {
    if (it.t !== 'tf') return true;
    var v = tfTruth(it), n = tfh.length;
    return !(n >= 2 && tfh[n - 1] === v && tfh[n - 2] === v);
  }
  // Order a list so the same topic never comes twice in a row when that is
  // possible, the same format is avoided, and no 3 identical true/false answers
  // run together (three true/false questions back to back with the same answer;
  // any other question in between breaks the run). prev = {u, t, tfh} carries
  // the state across a session; tfh holds true/false/null for the last questions.
  function arrangeSeq(D, ids, r, prev) {
    prev = prev || {};
    var groups = {}, order = [], total = ids.length;
    ids.forEach(function (id) { var it = itemOf(D, id); (groups[it.u] = groups[it.u] || []).push(id); });
    Object.keys(groups).forEach(function (u) { shuffle(groups[u], r); });
    var lastU = prev.u, lastT = prev.t, tfh = (prev.tfh || []).slice(), out = [];
    while (total > 0) {
      var units = Object.keys(groups).filter(function (u) { return groups[u].length; });
      var cand = units.filter(function (u) { return u !== lastU; });
      if (!cand.length) cand = units;
      var maxU = cand[0];
      cand.forEach(function (u) { if (groups[u].length > groups[maxU].length) maxU = u; });
      var pick;
      if (groups[maxU].length * 2 >= total) pick = maxU;
      else {
        var sum = 0; cand.forEach(function (u) { sum += groups[u].length; });
        var x = r() * sum; pick = cand[cand.length - 1];
        for (var i = 0; i < cand.length; i++) { x -= groups[cand[i]].length; if (x < 0) { pick = cand[i]; break; } }
      }
      var hasOK = function (u) { return groups[u].some(function (q) { return tfOK(itemOf(D, q), tfh); }); };
      if (!hasOK(pick)) {
        var alt = cand.filter(hasOK);
        if (!alt.length) alt = units.filter(function (u) { return u !== lastU && hasOK(u); });
        if (alt.length && !(groups[pick].length * 2 > total + 1)) pick = alt[Math.floor(r() * alt.length)];
      }
      var g = groups[pick], j = -1;
      for (var k = 0; k < g.length && j < 0; k++) { var a = itemOf(D, g[k]); if (a.t !== lastT && tfOK(a, tfh)) j = k; }
      for (k = 0; k < g.length && j < 0; k++) { if (tfOK(itemOf(D, g[k]), tfh)) j = k; }
      if (j < 0) j = 0;
      var id = g.splice(j, 1)[0], it = itemOf(D, id);
      out.push(id); total--; lastU = it.u; lastT = it.t;
      tfh.push(tfTruth(it));
    }
    return repairTF(D, out, prev);
  }
  // Moves a true/false item that would make 3 identical answers in a row to the
  // earliest place where it breaks no rule (true/false runs, topic adjacency).
  function tfBad(D, seq, tfh0) {
    var tfh = tfh0.slice();
    for (var i = 0; i < seq.length; i++) {
      var z = itemOf(D, seq[i]);
      if (!tfOK(z, tfh)) return i;
      tfh.push(tfTruth(z));
    }
    return -1;
  }
  function adj(D, seq, prevU) {
    var n = 0, last = prevU;
    seq.forEach(function (q) { var u = itemOf(D, q).u; if (u === last) n++; last = u; });
    return n;
  }
  function repairTF(D, seq, prev) {
    var tfh0 = (prev && prev.tfh) || [], guard = 0, i;
    while ((i = tfBad(D, seq, tfh0)) >= 0 && guard++ < 50) {
      var base = adj(D, seq, prev && prev.u), done = false;
      for (var slack = 0; slack <= 2 && !done; slack++) {
        for (var k = 0; k < seq.length && !done; k++) {
          if (k === i) continue;
          var t = seq.slice(), x = t.splice(i, 1)[0];
          t.splice(k, 0, x);
          var b = tfBad(D, t, tfh0);
          if ((b < 0 || b > i) && adj(D, t, prev && prev.u) <= base + slack) { seq = t; done = true; }
        }
      }
      if (!done) break;
    }
    return seq;
  }

  function info(D, S, it, n, now) {
    var rec = S.p[it.id], st = status(it, rec);
    return { id: it.id, it: it, rec: rec, st: st, hi: isHi(D, S, it), rested: isRested(D, S, it, n, now),
             blocked: prevBlocked(D, S, it), miss: !!rec && st === 'shaky', cons: trailingMiss(rec) >= 2,
             lt: rec ? rec.lt : 0 };
  }

  /* limited session: up to 1/4 rested misses, up to 1/5 rested review checks,
     then never answered (high ROI first-ish), then more rested, then recent. */
  function buildLimited(D, S, ids, N, nTopic, r, now) {
    var all = ids.map(function (id) { return info(D, S, D.byId[id], nTopic, now); });
    var elig = all.filter(function (x) { return !x.blocked; });
    var taken = {}, pick = [], counts = { miss: 0, review: 0, fresh: 0, more: 0, recent: 0, prev: 0 };
    function take(list, max, key) {
      for (var i = 0; i < list.length && max > 0 && pick.length < N; i++) {
        var x = list[i]; if (taken[x.id]) continue;
        taken[x.id] = 1; pick.push(x.id); counts[key]++; max--;
      }
    }
    var misses = elig.filter(function (x) { return x.miss && x.rested; })
      .sort(function (a, b) { return (b.cons - a.cons) || (a.lt - b.lt); });
    var rights = elig.filter(function (x) { return x.rec && !x.miss && x.st !== 'new' && x.rested; })
      .sort(function (a, b) { return (b.hi - a.hi) || (a.lt - b.lt); });
    var fresh = shuffle(elig.filter(function (x) { return x.st === 'new'; }), r)
      .map(function (x) { return { x: x, k: r() - (x.hi ? 0.5 : 0) }; })
      .sort(function (a, b) { return a.k - b.k; }).map(function (o) { return o.x; });
    take(misses, Math.floor(N / 4), 'miss');
    take(rights, Math.floor(N / 5), 'review');
    take(fresh, N, 'fresh');
    take(misses.concat(rights).sort(function (a, b) { return a.lt - b.lt; }), N, 'more');
    var note = null;
    if (pick.length < N) {
      var recent = elig.filter(function (x) { return !taken[x.id]; }).sort(function (a, b) { return a.lt - b.lt; });
      if (recent.length) { take(recent, N, 'recent'); note = 'recent'; }
    }
    if (pick.length < N) {
      var blocked = all.filter(function (x) { return x.blocked && !taken[x.id]; }).sort(function (a, b) { return a.lt - b.lt; });
      if (blocked.length) { take(blocked, N, 'prev'); note = 'prev'; }
    }
    return { ids: arrangeSeq(D, pick, r, { tfh: S.tfh || [] }), counts: counts, note: note };
  }

  function nextEndless(D, S, ids, nTopic, r, now, recent, prev) {
    prev = prev || {};
    var rec5 = {}; (recent || []).slice(-5).forEach(function (q) { rec5[parseId(q).base] = 1; });
    var all = ids.map(function (id) { return info(D, S, D.byId[id], nTopic, now); })
      .filter(function (x) { return !rec5[x.id]; });
    var cand = all.filter(function (x) { return x.rested && !x.blocked; });
    if (!cand.length) cand = all.slice().sort(function (a, b) { return a.lt - b.lt; }).slice(0, 10);
    if (!cand.length) return null;
    var tfh = prev.tfh || [], ws = cand.map(function (x) {
      var w = (x.miss ? 3 : 1) * (x.hi ? 1.5 : 1);
      if (x.it.u === prev.u) w *= 0.15;
      if (x.it.t === prev.t) w *= 0.4;
      if (!tfOK(x.it, tfh)) w *= 0.02;
      return w;
    });
    var sum = ws.reduce(function (a, b) { return a + b; }, 0), y = r() * sum;
    for (var i = 0; i < cand.length; i++) { y -= ws[i]; if (y < 0) return cand[i].id; }
    return cand[cand.length - 1].id;
  }

  var ST_RANK = { shaky: 0, 'new': 1, once: 2, solid: 3 };
  function buildLastPass(D, S, only20, r) {
    var lp = D.items.filter(function (it) { return it.lp; });
    var groups = [[], [], [], []];
    lp.forEach(function (it) { groups[ST_RANK[status(it, S.p[it.id])]].push(it.id); });
    var out = [], prev = { tfh: S.tfh || [] };
    groups.forEach(function (g) {
      var s = arrangeSeq(D, g, r, prev);
      out = out.concat(s);
      var tfh = prev.tfh.slice();

    var lk = Object.keys(labs).sort(function (a, b) { return labs[b].n - labs[a].n; }).slice(0, 10);
    var byC = {};
    D.items.forEach(function (x) { if (Core.status(x, S.p[x.id]) === 'shaky' && x.k) (byC[x.k] = byC[x.k] || []).push(x.id); });
    var cids = Object.keys(byC).sort(function (a, b) { return byC[b].length - byC[a].length; });
    var h = '<h1>Fix my misses</h1><p class="muted">Each fix re-teaches the concept, then asks a different question on it. A missed question is fixed once you get it and its follow-up right.</p>';
    h += '<div class="card"><h2>Mistakes I keep making</h2>' + (lk.length ? '<ul>' + lk.map(function (l) {
      var c = labs[l].k && D.concepts[labs[l].k];
      return '<li><b>' + esc(l) + '</b> <span class="count">× ' + labs[l].n + '</span>' + (c ? ' <span class="muted small">· ' + esc(c.title) + '</span>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="muted">No repeated mistakes yet.</p>') + '</div>';
    h += '<div class="card"><h2>Shaky questions by concept</h2>' + (cids.length ? '<div class="actions"><button class="btn primary" data-act="fixall">Fix all (' + cids.length + ' concepts)</button></div>' +
      cids.map(function (cid) {
        var c = D.concepts[cid];
        return '<div class="rv"><p class="eyebrow">' + esc(c.unit) + '</p><div class="row" style="justify-content:space-between"><span><b>' + esc(c.title) + '</b> <span class="count">' + plural(byC[cid].length, 'shaky question') + '</span></span><button class="btn small" data-act="fixone" data-cid="' + esc(cid) + '">Fix this</button></div></div>';
      }).join('') : '<p class="muted">Nothing shaky right now.</p>') + '</div>';
    h += '<details class="fold"><summary>Detailed miss rates</summary>' +
      rateTable('By kind of question', rates(function (x) { return x.kind; })) +
      rateTable('By topic', rates(function (x) { return x.u; })) +
      rateTable('By format', rates(function (x) { return x.num ? 'Typed number' : FMT[x.t]; })) +
      rateTable('By source', rates(function (x) { return x.src; })) + '</details>';
    app.innerHTML = h;
  }
  function renderReadme() {
    header({});
    app.innerHTML = document.getElementById('readme-src').innerHTML +
      (CFG.guide_url ? '<p><a class="btn small ghost" href="' + esc(CFG.guide_url) + '" target="_blank" rel="noopener">Open the Mastery Guide</a></p>' : '');
  }

  /* ------------------------------------------------------------ events */
  var resetArmed = 0;
  function toggleStar() {
    var cur = SESS && SESS.cur; if (!cur || cur.card) return;
    var id = Core.parseId(cur.q).base, on = !Core.isStar(S, id);
    S.stars[id] = { on: on ? 1 : 0, t: now() }; dirtyStars[id] = 1; saveLocal(); push(false);
    var b = document.querySelector('[data-act="star"]'); if (b) { b.textContent = on ? '★ Starred' : '☆ Star'; b.setAttribute('aria-pressed', on); }
  }
  function doReset() {
    var b = document.getElementById('reset');
    if (!resetArmed || now() - resetArmed > 6000) {
      resetArmed = now(); if (b) { b.classList.add('armed'); b.textContent = 'Tap again to erase all progress (stars are kept)'; }
      return;
    }
    resetArmed = 0;
    var stars = S.stars; S = Core.newState(); S.stars = stars; SESS = null; LASTRES = null; lsSet('lastres', null);
    saveLocal(); push(true); go('main');
  }
  app.addEventListener('click', onClick); hb.addEventListener('click', onClick);
  function onClick(e) {
    var t = e.target.closest('[data-act],[data-opt],[data-step],[data-slot],[data-len]');
    if (!t) return;
    if (t.hasAttribute('data-opt')) return pickOption(+t.getAttribute('data-opt'));
    if (t.hasAttribute('data-step')) { var cur = SESS.cur; if (!cur.checked && cur.pick.indexOf(+t.getAttribute('data-step')) < 0) { cur.pick.push(+t.getAttribute('data-step')); refreshAnswer(); } return; }
    if (t.hasAttribute('data-slot')) { var c2 = SESS.cur, i = +t.getAttribute('data-slot'); if (!c2.checked && c2.pick[i] !== undefined) { c2.pick.splice(i, 1); refreshAnswer(); } return; }
    if (t.hasAttribute('data-len')) { UI.len = t.getAttribute('data-len'); saveLocal(); return renderMain(); }
    var a = t.getAttribute('data-act');
    if (a === 'overlap' || a === 'think') return;
    if (a !== 'reset') { resetArmed = 0; }
    switch (a) {
      case 'home': clearInterval(clockTimer); if (SESS) { saveLocal(); push(false); } return go('main');
      case 'readme': return go('readme');
      case 'fix': return go('fix');
      case 'resume': return go('q');
      case 'fresh': SESS = null; saveLocal(); push(false); return renderMain();
      case 'pretest': return startPretest();
      case 'lp': return startLastPass(false);
      case 'lp20': return startLastPass(true);
      case 'uall': UI.units = UNITS.slice(); saveLocal(); return renderMain();
      case 'unone': UI.units = []; saveLocal(); return renderMain();
      case 'start': return startFromSetup();
      case 'reset': return doReset();
      case 'check': return doCheck();
      case 'next': return doNext(false);
      case 'guessed': return doNext(true);
      case 'star': return toggleStar();
      case 'timer': UI.think = !UI.think; saveLocal(); t.textContent = 'Timer: ' + (UI.think ? 'on' : 'off'); if (!UI.think && SESS.cur && !SESS.cur.revealed) reveal(); return;
      case 'sofar': return go('review');
      case 'submit': return go('submit');
      case 'backq': return go('q');
      case 'backres': return go('results');
      case 'dosubmit': return finish();
      case 'viewans': return go('review');
      case 'again':
        if (LASTRES && (LASTRES.mode === 'lastpass' || LASTRES.mode === 'lp20')) return startLastPass(LASTRES.mode === 'lp20');
        if (LASTRES && LASTRES.mode === 'pretest') return startPretest();
        return startFromSetup();
      case 'weakdrill': UI.units = t.getAttribute('data-units').split('|'); UI.filters = {}; UI.len = '20'; saveLocal(); return startFromSetup();
      case 'fixall': return startFix(Object.keys((function () { var o = {}; D.items.forEach(function (x) { if (x.k && Core.status(x, S.p[x.id]) === 'shaky') o[x.k] = 1; }); return o; })()).slice(0, 15));
      case 'fixone': return startFix([t.getAttribute('data-cid')]);
      case 'cardnext': SESS.pos++; SESS.cur = null; saveLocal(); push(false); if (SESS.pos >= SESS.queue.length) return finish(); return go('q');
    }
  }
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-unit')) {
      var u = t.getAttribute('data-unit'), i = UI.units.indexOf(u);
      if (t.checked && i < 0) UI.units.push(u); if (!t.checked && i >= 0) UI.units.splice(i, 1);
      UI.units.sort(function (a, b) { return UNITS.indexOf(a) - UNITS.indexOf(b); });
      saveLocal(); var y = window.pageYOffset; renderMain(); window.scrollTo(0, y); return;
    }
    if (t.hasAttribute('data-filter')) { UI.filters[t.getAttribute('data-filter')] = t.checked; saveLocal(); var y2 = window.pageYOffset; renderMain(); window.scrollTo(0, y2); return; }
    var a = t.getAttribute('data-act');
    if (a === 'overlap') { UI.overlap = t.checked; saveLocal(); document.getElementById('desc').textContent = describe(); return; }
    if (a === 'think') { UI.think = t.checked; saveLocal(); return; }
    if (t.id === 'custom') { UI.custom = Math.max(5, Math.min(500, +t.value || 25)); t.value = UI.custom; saveLocal(); document.getElementById('desc').textContent = describe(); return; }
    if (t.hasAttribute('data-row') && SESS && SESS.cur) { SESS.cur.pick[+t.getAttribute('data-row')] = +t.value; saveLocal(); drawActions(); return; }
    if (t.hasAttribute('data-blank') && SESS && SESS.cur) { SESS.cur.pick[+t.getAttribute('data-blank')] = +t.value; saveLocal(); drawActions(); return; }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'numin' && SESS && SESS.cur) { SESS.cur.pick = e.target.value; saveLocal(); drawActions(); }
  });
  document.addEventListener('keydown', function (e) {
    if (screen !== 'q' || !SESS || !SESS.cur || e.metaKey || e.ctrlKey || e.altKey) return;
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA');
    var cur = SESS.cur;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (cur.card) return onClick({ target: document.querySelector('[data-act="cardnext"]') });
      return cur.checked ? doNext(false) : doCheck();
    }
    if (typing || cur.card) return;
    if (/^[1-6]$/.test(e.key)) { pickOption(+e.key - 1); return; }
    if (e.key === 's' || e.key === 'S') return toggleStar();
    if ((e.key === 'g' || e.key === 'G') && cur.checked && cur.res && cur.res.full) return doNext(true);
  });

  /* ------------------------------------------------------------ boot */
  if (SESS && SESS.cur && SESS.cur.checked === 'done') { SESS.pos++; SESS.cur = null; }
  render();
  initSync();
})();
</script>
