<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column; sticky header with Guide / Read me tabs; contents list folds on phones. */
:root {
  --bg: #ffffff; --fg: #111111; --muted: #555b61; --line: #e3e5e8; --soft: #f5f6f7;
  --right: #1d7a3e; --right-bg: #eaf6ee; --wrong: #b3261e; --wrong-bg: #fcecea;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--sans); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.brand { font: 700 18px/1.2 var(--serif); flex: 1 1 auto; min-width: 0; }
.tabs { display: flex; gap: 6px; }
.tab { font: 500 14px var(--sans); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 6px 14px; cursor: pointer; text-decoration: none; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
@media (hover: hover) { .tab:hover { border-color: var(--fg); } }
.tab:active { background: var(--soft); }
main { max-width: 760px; margin: 0 auto; padding-block: 20px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .02em; margin: 0 0 4px; }
h1 { font: 700 30px/1.2 var(--serif); margin: 0 0 8px; text-wrap: balance; }
h2 { font: 700 24px/1.25 var(--serif); margin: 36px 0 8px; text-wrap: balance; }
h3 { font: 700 20px/1.3 var(--serif); margin: 0 0 10px; text-wrap: balance; }
h4 { font: 600 13px/1.3 var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; }
.lede { color: var(--muted); margin: 0 0 16px; max-width: 65ch; }
details.toc { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 16px 0 8px; }
details.toc summary { cursor: pointer; font-weight: 600; }
details.toc ul { list-style: none; padding: 0; margin: 8px 0 0; columns: 2 260px; column-gap: 24px; }
details.toc li { break-inside: avoid; padding: 2px 0; font-size: 14px; }
details.toc li.toc-unit { font: 700 15px var(--serif); margin-top: 8px; }
details.toc a { color: var(--fg); }
.unit-h { border-top: 2px solid var(--fg); padding-top: 14px; }
.sec { border-bottom: 1px solid var(--line); padding: 22px 0; scroll-margin-top: 80px; }
.sec-eyebrow { font-size: 12px; color: var(--muted); margin: 0 0 2px; letter-spacing: .04em; text-transform: uppercase; }
.block { margin: 12px 0; }
.block p, .block ol, .block ul { margin: 0; max-width: 68ch; }
.block ol, .block ul { padding-left: 22px; }
.trap p { border-left: 3px solid var(--wrong); padding-left: 10px; }
.hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
ul.blanks { list-style: none; padding-left: 0; }
ul.blanks li { padding: 4px 0; }
.blank { font: inherit; border: none; border-bottom: 2px solid var(--fg); background: var(--soft); border-radius: 4px 4px 0 0; padding: 0 6px; min-width: 64px; cursor: pointer; color: transparent; }
.blank .ans { visibility: hidden; }
.blank.shown { color: var(--right); background: var(--right-bg); border-color: var(--right); }
.blank.shown .ans { visibility: visible; }
.key { border: 1.5px solid var(--fg); border-radius: 10px; padding: 12px 14px; margin: 14px 0 6px; }
.key ul { margin: 0; padding-left: 20px; }
.key li { margin: 3px 0; }
.src { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.readme h2 { margin-top: 4px; }
.readme h3 { margin-top: 20px; }
.readme ol { padding-left: 22px; max-width: 68ch; }
.readme li { margin: 4px 0; }
.small { font-size: 14px; color: var(--muted); }
a { color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
@media (max-width: 480px) { h1 { font-size: 25px; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">__TITLE__</div>
    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-guide" role="tab" aria-selected="true">Guide</button>
      <button class="tab" id="tab-readme" role="tab" aria-selected="false">Read me</button>
      <a class="tab" id="drill-link" href="__DRILL_URL__" target="_blank" rel="noopener">Open the drill</a>
    </nav>
  </div>
</header>

<main>
  <div id="view-guide">
    <p class="eyebrow">__EYEBROW__</p>
    <h1>__TITLE__</h1>
    <p class="lede">__NSEC__ sections in lecture order, one for each concept card in the drill. Each one teaches the mechanism first, then what to do, a client example, the common trap, a memory trick, blanks to test yourself and a Key ideas box.</p>
    <details class="toc" id="toc"><summary>Contents</summary><ul><!--__TOC__--></ul></details>
    <!--__SECTIONS__-->
  </div>
  <div id="view-readme" hidden><!--__README__--></div>
</main>

<script>
(function () {
  var g = document.getElementById('view-guide'), r = document.getElementById('view-readme');
  var tg = document.getElementById('tab-guide'), tr = document.getElementById('tab-readme');
  var dl = document.getElementById('drill-link');
  if (!dl.getAttribute('href')) dl.hidden = true;
  function show(which) {
    var isR = which === 'readme';
    g.hidden = isR; r.hidden = !isR;
    tg.setAttribute('aria-selected', String(!isR)); tr.setAttribute('aria-selected', String(isR));
    window.scrollTo(0, 0);
  }
  tg.addEventListener('click', function () { show('guide'); });
  tr.addEventListener('click', function () { show('readme'); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.blank');
    if (b) b.classList.toggle('shown');
  });
  function go() {
    var id = (location.hash || '').slice(1);
    if (id === 'readme') { show('readme'); return; }
    var el = id && document.getElementById(id);
    if (el) { show('guide'); setTimeout(function () { el.scrollIntoView({ block: 'start' }); }, 30); }
  }
  window.addEventListener('hashchange', go);
  go();
  if (window.innerWidth > 720) document.getElementById('toc').open = true;
})();
</script>
