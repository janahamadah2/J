<style>
/* Layout: one working column (max 720px) under a sticky header; cards stack; every control is a large tap target. */
:root {
  --bg: #ffffff; --fg: #111111; --muted: #565c62; --line: #e2e4e7; --soft: #f4f5f6; --press: #e9ebee;
  --right: #1d7a3e; --right-bg: #eaf6ee; --right-soft: #9fd3b0;
  --wrong: #b3261e; --wrong-bg: #fcecea;
  --part: #8a5a00; --part-bg: #fff4dc;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, a, label, select, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.brand { font: 700 17px/1.2 var(--serif); flex: 1 1 140px; min-width: 0; }
.hbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.clock { font: 600 15px var(--sans); font-variant-numeric: tabular-nums; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; }
.clock.low { color: var(--wrong); border-color: var(--wrong); }
main { max-width: 720px; margin: 0 auto; padding-block: 16px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 28px/1.2 var(--serif); margin: 4px 0 6px; text-wrap: balance; }
h2 { font: 700 21px/1.25 var(--serif); margin: 0 0 6px; text-wrap: balance; }
h3 { font: 700 17px/1.3 var(--serif); margin: 14px 0 6px; }
.eyebrow { font-size: 13px; color: var(--muted); margin: 0; letter-spacing: .02em; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
.card.strong { border: 1.5px solid var(--fg); }
.badge { display: inline-block; font: 600 12px var(--sans); letter-spacing: .04em; text-transform: uppercase; border: 1.5px solid var(--fg); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1.5px solid var(--fg); background: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; border-width: 1px; }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger { border-color: var(--wrong); color: var(--wrong); }
.btn.danger.armed { background: var(--wrong); color: #fff; }
.linkbtn { background: none; border: none; padding: 0; text-decoration: underline; cursor: pointer; font-weight: 500; }
@media (hover: hover) {
  .btn:hover:not(:disabled) { background: var(--soft); }
  .btn.primary:hover:not(:disabled) { background: #333; }
  .opt:hover:not(.locked) { border-color: var(--fg); }
  .chip:hover { border-color: var(--fg); }
}
.btn:active:not(:disabled) { background: var(--press); }
.btn.primary:active:not(:disabled) { background: #444; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; background: var(--bg); cursor: pointer; font-size: 15px; min-height: 40px; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip:active { background: var(--press); }
.chip.on:active { background: #333; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: #111; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 16px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; }
.switch input { width: 20px; height: 20px; accent-color: #111; }
.desc { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
/* status bar */
.sbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--soft); margin: 8px 0 6px; }
.sbar i { display: block; height: 100%; }
.s-solid { background: var(--right); } .s-once { background: var(--right-soft); } .s-shaky { background: var(--wrong); } .s-new { background: #d5d8dc; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
/* question */
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.tag { border: 1px solid var(--fg); color: var(--fg); border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 600; }
.stem { font-size: 18px; line-height: 1.5; margin: 6px 0 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 48px; width: 100%; }
.opt .let { flex: 0 0 auto; width: 26px; height: 26px; border: 1.5px solid var(--fg); border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--sans); }
.opt.multi .let { border-radius: 6px; }
.opt.sel { border-color: var(--fg); background: var(--soft); }
.opt.sel .let { background: var(--fg); color: var(--bg); }
.opt:active:not(.locked) { background: var(--press); }
.opt.locked { cursor: default; }
.opt.is-right { border-color: var(--right); background: var(--right-bg); }
.opt.is-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.opt .txt { flex: 1 1 auto; min-width: 0; }
.think { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; }
.think .bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
.think .bar i { display: block; height: 100%; background: var(--fg); width: 100%; transition: width 1s linear; }
.qimg { overflow-x: auto; margin: 0 0 12px; } .qimg img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
.fillblank { display: inline-block; min-width: 80px; border-bottom: 2px solid var(--fg); text-align: center; padding: 0 4px; }
table.match { width: 100%; border-collapse: collapse; }
table.match td { border-top: 1px solid var(--line); padding: 10px 6px; vertical-align: middle; }
table.match td:first-child { width: 42%; font-weight: 500; }
select { font: inherit; width: 100%; min-height: 44px; padding: 8px; border: 1.5px solid var(--fg); border-radius: 8px; background: var(--bg); color: var(--fg); }
select.inline { width: auto; max-width: 100%; display: inline-block; min-height: 38px; padding: 4px 6px; margin: 2px 0; }
select.r { border-color: var(--right); background: var(--right-bg); } select.w { border-color: var(--wrong); background: var(--wrong-bg); }
.orderpick { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.orderpick .slot { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; display: flex; gap: 10px; align-items: center; cursor: pointer; text-align: left; background: var(--bg); width: 100%; }
.orderpick .slot.filled { border-style: solid; border-color: var(--fg); }
.orderpick .num { font-weight: 700; width: 22px; }
.numin { display: flex; gap: 10px; align-items: center; }
.numin input { font: 600 20px var(--sans); width: 160px; max-width: 60%; padding: 10px; border: 1.5px solid var(--fg); border-radius: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.verdict { border-radius: 12px; padding: 12px 14px; margin: 14px 0 8px; scroll-margin-top: 90px; }
.verdict h2 { margin: 0; }
.v-right { background: var(--right-bg); border: 1.5px solid var(--right); } .v-right h2 { color: var(--right); }
.v-wrong { background: var(--wrong-bg); border: 1.5px solid var(--wrong); } .v-wrong h2 { color: var(--wrong); }
.v-part { background: var(--part-bg); border: 1.5px solid var(--part); } .v-part h2 { color: var(--part); }
.why { margin: 8px 0; }
.why b { display: block; }
.keyidea { border-left: 3px solid var(--fg); padding-left: 12px; margin: 12px 0; }
.ccard { border: 1.5px solid var(--fg); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
.ccard ul { margin: 4px 0; padding-left: 20px; }
.ccard li { margin: 3px 0; }
.ok { color: var(--right); font-weight: 600; } .no { color: var(--wrong); font-weight: 600; }
.rv { border-top: 1px solid var(--line); padding: 14px 0; }
.bars .b { display: grid; grid-template-columns: minmax(90px, 30%) 1fr 52px; gap: 8px; align-items: center; margin: 6px 0; font-size: 14px; }
.bars .track { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--right); }
.bars .fill.low { background: var(--wrong); }
.bars .pct { text-align: right; font-variant-numeric: tabular-nums; }
.big { font: 700 44px/1 var(--serif); font-variant-numeric: tabular-nums; }
details.fold { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
details.fold summary { cursor: pointer; font-weight: 600; }
table.rates { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.rates th, table.rates td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); }
table.rates td.n { text-align: right; }
.tblwrap { overflow-x: auto; }
.lvl { font-weight: 700; }
.lvl.Strong { color: var(--right); } .lvl.Weak { color: var(--wrong); }
.readme h2 { margin-top: 0; } .readme ol { padding-left: 22px; } .readme li { margin: 5px 0; }
.syncline { font-size: 13px; color: var(--muted); margin-top: 18px; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .think .bar i { transition: none; } }
@media (max-width: 480px) { h1 { font-size: 24px; } .stem { font-size: 17px; } .big { font-size: 38px; } }
</style>

<script>
(function () {
  'use strict';
  var D = Core.makeCtx(DATA), CFG = DATA.cfg, KEY = CFG.storage_key, UNITS = CFG.units;
  var LET = 'ABCDEF';
  var app = document.getElementById('app'), hb = document.getElementById('hbtns');
  var R = Core.rng((Date.now() ^ (Math.random() * 1e9)) >>> 0);

  /* ------------------------------------------------------------ storage */
  function lsGet(k) { try { var v = localStorage.getItem(KEY + ':' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v === null) localStorage.removeItem(KEY + ':' + k); else localStorage.setItem(KEY + ':' + k, JSON.stringify(v)); } catch (e) {} }
  var S = lsGet('p') || Core.newState();
  ['p', 'stars', 'tsec', 'lc', 'pre'].forEach(function (k) { if (!S[k]) S[k] = Core.newState()[k]; });
  if (!S.miss) S.miss = [];
  var SESS = lsGet('s');
  var UI = lsGet('ui') || {};
  if (!UI.units) UI.units = UNITS.slice();
  UI.units = UI.units.filter(function (u) { return UNITS.indexOf(u) >= 0; });
  if (!UI.filters) UI.filters = {};
  if (!UI.len) UI.len = '20';
  if (UI.think === undefined) UI.think = true;
  if (!UI.custom) UI.custom = 25;
  if (!UI.seed) UI.seed = (Math.random() * 1e9) >>> 0;
  var DEV = lsGet('dev') || ('d' + Math.random().toString(36).slice(2, 10)); lsSet('dev', DEV);
  var LASTRES = lsGet('lastres');
  var dirty = {}, dirtyMiss = false, dirtyStars = {};

  function saveLocal() { var c = Object.assign({}, S); delete c._block; lsSet('p', c); lsSet('s', SESS); lsSet('ui', UI); }
  function now() { return Date.now(); }

  /* ------------------------------------------------------------ helpers */
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function it(q) { return Core.itemOf(D, q); }
  function unitsOn() { return UI.units.length ? UI.units : UNITS.slice(); }
  function plural(n, a, b) { return n + ' ' + (n === 1 ? a : (b || a + 's')); }
  function listText(a) { return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  var LECS = DATA.lectures || [], LECBY = {}; LECS.forEach(function (L) { LECBY[L.id] = L; });
  function lecIds(lec) { return Core.lecItems(D, lec).map(function (x) { return x.id; }); }
  function lecLP(lec) { return Core.lecItems(D, lec).filter(function (x) { return x.lp; }).map(function (x) { return x.id; }); }
  function isPreMode(m) { return m === 'pretest' || m === 'lpre'; }
  function nTopic(units) { return Core.unitItems(D, units).length; }
  function fmtDate(t) { try { return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); } catch (e) { return ''; } }
  function topOfPage() { window.scrollTo(0, 0); }
  function scrollUnderHeader(el) {
    var hh = document.querySelector('header.top').offsetHeight;
    var y = el.getBoundingClientRect().top + window.pageYOffset - hh - 8;
    window.scrollTo(0, Math.max(0, y));
  }
  function statusBar(c) {
    var t = c.solid + c.once + c.shaky + c['new'] || 1;
    function seg(k, cls) { return c[k] ? '<i class="' + cls + '" style="width:' + (100 * c[k] / t) + '%"></i>' : ''; }
    return '<div class="sbar" role="img" aria-label="status">' + seg('solid', 's-solid') + seg('once', 's-once') + seg('shaky', 's-shaky') + seg('new', 's-new') + '</div>' +
      '<div class="legend"><span style="--c:var(--right)">solid ' + c.solid + '</span><span style="--c:var(--right-soft)">right once ' + c.once +
      '</span><span style="--c:var(--wrong)">shaky ' + c.shaky + '</span><span style="--c:#d5d8dc">not answered yet ' + c['new'] + '</span></div>';
  }
  function header(opts) {
    opts = opts || {};
    var b = '';
    if (opts.clock) b += '<span class="clock" id="clock"></span>';
    if (!opts.main) b += '<button class="btn small" data-act="home">Main screen</button>';
    if (opts.main) b += '<button class="btn small ghost" data-act="fix">Fix my misses</button>';
    b += '<button class="btn small ghost" data-act="readme">Read me</button>';
    hb.innerHTML = b;
  }

  /* ------------------------------------------------------------ account sync (claude.ai db + user) */
  var SY = { ref: null, busy: false, again: false, wv: 0, state: 'local' };
  function sessStr() { return SESS ? JSON.stringify(SESS) : ''; }
  function meta() { return { seq: S.seq, tsec: S.tsec, lastSid: S.lastSid || null, sidN: S.sidN || 0, t: S.t || 0 }; }
  function fullDoc() {
    return { p: S.p, stars: S.stars, miss: S.miss, pre: S.pre, meta: meta(), sess: sessStr(), sessT: SESS ? (SESS.t || 0) : now(), dev: DEV, wv: ++SY.wv };
  }
  function push(full) {
    if (!SY.ref) return;
    if (SY.busy) { SY.again = SY.again || (full ? 'full' : true); return; }
    SY.busy = true;
    var doc;
    if (full) doc = fullDoc();
    else {
      var p = {}, st = {};
      Object.keys(dirty).forEach(function (id) { if (S.p[id]) p[id] = S.p[id]; });
      Object.keys(dirtyStars).forEach(function (id) { if (S.stars[id]) st[id] = S.stars[id]; });
      doc = { meta: meta(), sess: sessStr(), sessT: SESS ? (SESS.t || 0) : now(), dev: DEV, wv: ++SY.wv };
      if (Object.keys(p).length) doc.p = p;
      if (Object.keys(st).length) doc.stars = st;
      if (dirtyMiss) doc.miss = S.miss;
      doc.pre = S.pre;
    }
    dirty = {}; dirtyStars = {}; dirtyMiss = false;
    var pr = full ? SY.ref.set(doc) : SY.ref.update(doc);
    pr.then(function () { SY.state = 'synced'; syncLine(); })
      .catch(function () { SY.state = 'error'; syncLine(); })
      .then(function () { SY.busy = false; if (SY.again) { var f = SY.again === 'full'; SY.again = false; push(f); } });
  }
  function mergeRemote(d) {
    if (!d) return;
    var m = d.meta || {};
    var Rm = { p: d.p || {}, stars: d.stars || {}, miss: d.miss || [], pre: d.pre || { last: null }, seq: m.seq || 0,
               tsec: m.tsec || { s: 0, n: 0 }, lastSid: m.lastSid || null, sidN: m.sidN || 0, t: m.t || 0 };
    var keep = { lc: S.lc, ll: S.ll };
    S = Core.merge(S, Rm); S.lc = keep.lc; S.ll = keep.ll;
    var lt = SESS ? (SESS.t || 0) : 0;
    if ((d.sessT || 0) > lt) {
      if (d.sess) { try { SESS = JSON.parse(d.sess); } catch (e) {} }
      else if (SESS) SESS = null;
    }
    saveLocal();
  }
  function syncLine() {
    var el = document.getElementById('syncline'); if (!el) return;
    el.textContent = SY.state === 'synced' ? 'Progress, stars and misses sync to your account.' :
      SY.state === 'error' ? 'Could not reach your account just now; progress is saved on this device.' :
      'Progress is saved on this device.';
  }
  function initSync() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (uid) {
        if (!uid) return null;
        SY.ref = db.doc('data/users/' + uid + '/' + KEY);
        var timer = setTimeout(function () { SY.state = 'error'; syncLine(); }, 10000);
        return SY.ref.get().then(function (snap) {
          clearTimeout(timer);
          if (snap.exists) mergeRemote(snap.data());
          push(true);
          SY.ref.onSnapshot(function (s) {
            if (!s.exists || s.metadata.hasPendingWrites) return;
            var d = s.data();
            if (d.dev === DEV) return;
            mergeRemote(d);
            if (screen === 'main' || screen === 'fix') render();
          }, function () {});
          if (screen === 'main') render();
        });
      });
    }).catch(function () { SY.state = 'error'; syncLine(); });
  }
  function syncSoon() { saveLocal(); push(false); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') syncSoon(); });
  window.addEventListener('pagehide', syncSoon);

  /* ------------------------------------------------------------ screens */
  var screen = 'main', thinkTimer = null, clockTimer = null;
  function render() {
    clearInterval(thinkTimer);
    if (screen === 'main') return renderMain();
    if (screen === 'q') return renderQuestion();
    if (screen === 'review') return renderReview();
    if (screen === 'submit') return renderSubmit();
    if (screen === 'results') return renderResults();
    if (screen === 'fix') return renderFix();
    if (screen === 'readme') return renderReadme();
  }
  function go(s) { screen = s; render(); topOfPage(); }

  /* ---------------- main */
  function lenValue() { return UI.len === 'custom' ? Math.max(5, Math.min(500, +UI.custom || 25)) : UI.len; }
  function previewLimited(N) {
    var units = unitsOn(), ids = Core.pool(D, S, units, UI.filters, UI.overlap);
    return { plan: Core.buildLimited(D, S, ids, Math.min(N, ids.length), nTopic(units), Core.rng(UI.seed), now()), poolN: ids.length, units: units };
  }
  function describe() {
    var units = unitsOn(), L = lenValue(), uTxt = units.length === UNITS.length && UNITS.length > 1 ? 'all topics' : listText(units);
    var act = Object.keys(UI.filters).filter(function (k) { return UI.filters[k]; });
    var fTxt = act.length ? ' (' + (act.length > 1 ? (UI.overlap ? 'only the overlap of ' : 'mixed: ') : '') +
      act.map(function (k) { return { missed: 'missed', starred: 'starred', lp: 'last pass', never: 'never practiced' }[k]; }).join(act.length > 1 && UI.overlap ? ' and ' : ' + ') + ')' : '';
    if (L === 'endless') return 'Endless: rested questions from ' + uTxt + fTxt + ', weighted toward your misses, with high-ROI questions 1.5 times as likely. Stop whenever you like.';
    if (L === '30m' || L === '45m') {
      var mins = L === '30m' ? 30 : 45, t = Core.buildTimed(D, S, units, mins, Core.rng(UI.seed), now());
      var per = {}; t.ids.forEach(function (q) { var u = it(q).u; if (t.weak.indexOf(u) >= 0) per[u] = (per[u] || 0) + 1; });
      return 'Timed mixed plan: about ' + t.count + ' questions in ' + mins + ' min (' + Math.round(t.avg) + ' s each' + (S.tsec.n >= 3 ? ', from your history' : ' until there is history') + '). ' +
        t.mix.weak + ' from your weakest topics (' + t.weak.map(function (u) { return u + ' ' + (per[u] || 0); }).join(', ') + '), ' +
        t.mix.review + ' rested misses and review checks, ' + t.mix.fresh + ' never practiced or right once' + (t.mix.fill ? ', ' + t.mix.fill + ' others to fill' : '') +
        '. Topics alternate; when time is up you finish the question on screen.';
    }

  /* ---------------- sessions */
  function newSid() { return 's' + now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function startSession(mode, queue, extra) {

      started: now(), t: now(), units: unitsOn(), nTopic: nTopic(unitsOn()), tfh: [], lastU: null, lastT: null, recent: [] }, extra || {});

  function startFromSetup() {

    }
    if (L === '30m' || L === '45m') {
      var mins = L === '30m' ? 30 : 45, t = Core.buildTimed(D, S, units, mins, Core.rng(UI.seed), now());
      if (!t.ids.length) return;

  function startLecPretest(lec) { startSession('lpre', Core.buildLecturePretest(D, S, lec, R, 8), { lec: lec, units: [LECBY[lec].unit], nTopic: lecIds(lec).length }); }
  function startLecLastPass(lec) { var q = Core.buildLastPass(D, S, false, R, lec); if (q.length) startSession('llp', q, { lec: lec, units: [LECBY[lec].unit] }); }

  function startFix(cids) {
    var q = [];

      var c = D.concepts[cid]; if (!c) return;
      var members = c.items.slice(), shaky = members.filter(function (id) { return Core.status(D.byId[id], S.p[id]) === 'shaky'; });
      var other = members.filter(function (id) { return shaky.indexOf(id) < 0 && q.indexOf(id) < 0; });
      var pick = other.length ? other[Math.floor(R() * other.length)] : shaky[Math.floor(R() * shaky.length)];
      if (!pick) return;
      q.push('card:' + cid); q.push(pick);
    });
    if (q.length) startSession('fix', q, { units: UNITS.slice(), nTopic: D.items.length });
  }

  function curQid() { return SESS && SESS.queue[SESS.pos]; }
  function ensureCur() {
    if (SESS.mode === 'endless' && SESS.pos >= SESS.queue.length) {
      S._block = SESS.prevSid;
      var nx = Core.nextEndless(D, S, SESS.pool, SESS.nTopic, R, now(), SESS.recent, { u: SESS.lastU, t: SESS.lastT, tfh: S.tfh || [] });
      delete S._block;

    }
    var q = curQid();
    if (!q) return false;
    if (!SESS.cur || SESS.cur.q !== q) {
      if (q.indexOf('card:') === 0) { SESS.cur = { q: q, card: true }; return true; }
      var a = Core.arrange(D, S, q, R), x = it(q);
      var init = x.t === 'sata' || x.t === 'order' ? [] : x.t === 'cloze' || x.t === 'blanks' ? x.c.map(function () { return -1; }) : x.num ? '' : -1;
      var wait = 0;
      if (UI.think && !x.num) wait = (x.t === 'tf' || (x.q.length < 170 && (x.t === 'mc' || x.t === 'fill' || x.t === 'row'))) ? 10 : 15;
      SESS.cur = { q: q, perm: a.perm, pos: a.pos, pick: init, checked: false, shownAt: now(), wait: wait, revealed: wait === 0 };

    }

  }

  /* ---------------- question screen */

  function renderStem(x, cur) {

    }

      q = q.replace(/\{(\d)\}/g, function (m, d) {

        if (!cur.revealed) return '<span class="fillblank">&nbsp;</span>';
        var opts = cur.perm[b].map(function (o, i) { return '<option value="' + i + '"' + (cur.pick[b] === i ? ' selected' : '') + '>' + esc(x.o[b][o]) + '</option>'; }).join('');
        var cls = '';
        if (cur.checked) { var oo = cur.pick[b] >= 0 ? cur.perm[b][cur.pick[b]] : -1; cls = oo === x.c[b] ? ' r' : ' w'; }
        return '<select class="inline' + cls + '" data-blank="' + b + '"' + (cur.checked ? ' disabled' : '') + ' aria-label="Blank ' + d + '"><option value="-1">Choose…</option>' + opts + '</select>';
      });

  }
  function renderAnswerArea(x, cur) {
    if (!cur.revealed) {

    }

      return '<div class="numin"><input id="numin" type="text" inputmode="decimal" autocomplete="off" aria-label="Your answer" value="' + esc(cur.pick) + '"' + (cur.checked ? ' disabled' : '') + '><span>' + esc(x.num.unit) + '</span></div>' +

  function canCheck(x, cur) {
    if (!cur.revealed) return false;

    if (x.t === 'order') return cur.pick.length === x.o.length;
    if (x.t === 'cloze' || x.t === 'blanks') return cur.pick.every(function (p) { return p >= 0; });

  }
  function drawActions() {
    var cur = SESS.cur, x = it(cur.q), el = document.getElementById('acts'); if (!el) return;
    if (!cur.checked) el.innerHTML = '<button class="btn primary" data-act="check"' + (canCheck(x, cur) ? '' : ' disabled') + '>Check</button>';
    else if (cur.res.full && Core.parseId(cur.q).row < 0) el.innerHTML = '<button class="btn primary" data-act="next">Knew it - Next</button><button class="btn" data-act="guessed">I guessed</button>';
    else el.innerHTML = '<button class="btn primary" data-act="next">Next</button>';
  }
  function runThink() {
    var cur = SESS.cur, left = cur.wait - Math.floor((now() - cur.shownAt) / 1000);
    var bar = document.getElementById('thinkbar'), lab = document.getElementById('thinkleft');
    function tick() {
      left = cur.wait - Math.floor((now() - cur.shownAt) / 1000);
      if (bar) bar.style.width = Math.max(0, 100 * left / cur.wait) + '%';
      if (lab) lab.textContent = Math.max(0, left) + ' s';
      if (left <= 0) { clearInterval(thinkTimer); reveal(); }
    }
    tick(); thinkTimer = setInterval(tick, 250);
  }
  function reveal() {
    var cur = SESS.cur; if (!cur || cur.revealed) return;

  function refreshAnswer() {
    var cur = SESS.cur, x = it(cur.q);

    document.getElementById('answer').innerHTML = renderAnswerArea(x, cur);

  }
  function pickOption(d) {
    var cur = SESS.cur, x = it(cur.q);

      }).join('') : '<p class="muted">Nothing shaky right now.</p>') + '</div>';
    h += '<details class="fold"><summary>Detailed miss rates</summary>' +
      rateTable('By kind of question', rates(function (x) { return x.kind; })) +
      rateTable('By topic', rates(function (x) { return x.u; })) +
      rateTable('By format', rates(function (x) { return x.num ? 'Typed number' : FMT[x.t]; })) +
      rateTable('By source', rates(function (x) { return x.src; })) + '</details>';
    app.innerHTML = h;
  }
  function renderReadme() {
    header({});
    app.innerHTML = document.getElementById('readme-src').innerHTML +
      (CFG.guide_url ? '<p><a class="btn small ghost" href="' + esc(CFG.guide_url) + '" target="_blank" rel="noopener">Open the Mastery Guide</a></p>' : '');
  }

  /* ------------------------------------------------------------ events */
  var resetArmed = 0;
  function toggleStar() {
    var cur = SESS && SESS.cur; if (!cur || cur.card) return;
    var id = Core.parseId(cur.q).base, on = !Core.isStar(S, id);
    S.stars[id] = { on: on ? 1 : 0, t: now() }; dirtyStars[id] = 1; saveLocal(); push(false);
    var b = document.querySelector('[data-act="star"]'); if (b) { b.textContent = on ? '★ Starred' : '☆ Star'; b.setAttribute('aria-pressed', on); }
  }
  function doReset() {
    var b = document.getElementById('reset');
    if (!resetArmed || now() - resetArmed > 6000) {
      resetArmed = now(); if (b) { b.classList.add('armed'); b.textContent = 'Tap again to erase all progress (stars are kept)'; }
      return;
    }
    resetArmed = 0;
    var stars = S.stars; S = Core.newState(); S.stars = stars; SESS = null; LASTRES = null; lsSet('lastres', null);
    saveLocal(); push(true); go('main');
  }
  app.addEventListener('click', onClick); hb.addEventListener('click', onClick);
  function onClick(e) {
    var t = e.target.closest('[data-act],[data-opt],[data-step],[data-slot],[data-len]');
    if (!t) return;
    if (t.hasAttribute('data-opt')) return pickOption(+t.getAttribute('data-opt'));
    if (t.hasAttribute('data-step')) { var cur = SESS.cur; if (!cur.checked && cur.pick.indexOf(+t.getAttribute('data-step')) < 0) { cur.pick.push(+t.getAttribute('data-step')); refreshAnswer(); } return; }
    if (t.hasAttribute('data-slot')) { var c2 = SESS.cur, i = +t.getAttribute('data-slot'); if (!c2.checked && c2.pick[i] !== undefined) { c2.pick.splice(i, 1); refreshAnswer(); } return; }
    if (t.hasAttribute('data-len')) { UI.len = t.getAttribute('data-len'); saveLocal(); return renderMain(); }
    var a = t.getAttribute('data-act');
    if (a === 'overlap' || a === 'think') return;
    if (a !== 'reset') { resetArmed = 0; }
    switch (a) {
      case 'home': clearInterval(clockTimer); if (SESS) { saveLocal(); push(false); } return go('main');
      case 'readme': return go('readme');
      case 'fix': return go('fix');
      case 'resume': return go('q');
      case 'fresh': SESS = null; saveLocal(); push(false); return renderMain();
      case 'pretest': return startPretest();
      case 'lp': return startLastPass(false);
      case 'lp20': return startLastPass(true);
      case 'lpre': return startLecPretest(t.getAttribute('data-lec'));
      case 'llp': return startLecLastPass(t.getAttribute('data-lec'));
      case 'ldrill': return startLecDrill(t.getAttribute('data-lec'));
      case 'uall': UI.units = UNITS.slice(); saveLocal(); return renderMain();
      case 'unone': UI.units = []; saveLocal(); return renderMain();
      case 'start': return startFromSetup();
      case 'reset': return doReset();
      case 'check': return doCheck();
      case 'next': return doNext(false);
      case 'guessed': return doNext(true);
      case 'star': return toggleStar();
      case 'timer': UI.think = !UI.think; saveLocal(); t.textContent = 'Timer: ' + (UI.think ? 'on' : 'off'); if (!UI.think && SESS.cur && !SESS.cur.revealed) reveal(); return;
      case 'sofar': return go('review');
      case 'submit': return go('submit');
      case 'backq': return go('q');
      case 'backres': return go('results');
      case 'dosubmit': return finish();
      case 'viewans': return go('review');
      case 'again':
        if (LASTRES && (LASTRES.mode === 'lastpass' || LASTRES.mode === 'lp20')) return startLastPass(LASTRES.mode === 'lp20');
        if (LASTRES && LASTRES.mode === 'pretest') return startPretest();
        if (LASTRES && LASTRES.lec && LECBY[LASTRES.lec]) return LASTRES.mode === 'lpre' ? startLecPretest(LASTRES.lec) : LASTRES.mode === 'llp' ? startLecLastPass(LASTRES.lec) : startLecDrill(LASTRES.lec);
        return startFromSetup();
      case 'weakdrill': UI.units = t.getAttribute('data-units').split('|'); UI.filters = {}; UI.len = '20'; saveLocal(); return startFromSetup();
      case 'fixall': return startFix(Object.keys((function () { var o = {}; D.items.forEach(function (x) { if (x.k && Core.status(x, S.p[x.id]) === 'shaky') o[x.k] = 1; }); return o; })()).slice(0, 15));
      case 'fixone': return startFix([t.getAttribute('data-cid')]);
      case 'cardnext': SESS.pos++; SESS.cur = null; saveLocal(); push(false); if (SESS.pos >= SESS.queue.length) return finish(); return go('q');
    }
  }
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-unit')) {
      var u = t.getAttribute('data-unit'), i = UI.units.indexOf(u);
      if (t.checked && i < 0) UI.units.push(u); if (!t.checked && i >= 0) UI.units.splice(i, 1);
      UI.units.sort(function (a, b) { return UNITS.indexOf(a) - UNITS.indexOf(b); });
      saveLocal(); var y = window.pageYOffset; renderMain(); window.scrollTo(0, y); return;
    }
    if (t.hasAttribute('data-filter')) { UI.filters[t.getAttribute('data-filter')] = t.checked; saveLocal(); var y2 = window.pageYOffset; renderMain(); window.scrollTo(0, y2); return; }
    var a = t.getAttribute('data-act');
    if (a === 'overlap') { UI.overlap = t.checked; saveLocal(); document.getElementById('desc').textContent = describe(); return; }
    if (a === 'think') { UI.think = t.checked; saveLocal(); return; }
    if (t.id === 'custom') { UI.custom = Math.max(5, Math.min(500, +t.value || 25)); t.value = UI.custom; saveLocal(); document.getElementById('desc').textContent = describe(); return; }
    if (t.hasAttribute('data-row') && SESS && SESS.cur) { SESS.cur.pick[+t.getAttribute('data-row')] = +t.value; saveLocal(); drawActions(); return; }
    if (t.hasAttribute('data-blank') && SESS && SESS.cur) { SESS.cur.pick[+t.getAttribute('data-blank')] = +t.value; saveLocal(); drawActions(); return; }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'numin' && SESS && SESS.cur) { SESS.cur.pick = e.target.value; saveLocal(); drawActions(); }
  });
  document.addEventListener('keydown', function (e) {
    if (screen !== 'q' || !SESS || !SESS.cur || e.metaKey || e.ctrlKey || e.altKey) return;
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA');
    var cur = SESS.cur;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (cur.card) return onClick({ target: document.querySelector('[data-act="cardnext"]') });
      return cur.checked ? doNext(false) : doCheck();
    }
    if (typing || cur.card) return;
    if (/^[1-6]$/.test(e.key)) { pickOption(+e.key - 1); return; }
    if (e.key === 's' || e.key === 'S') return toggleStar();
    if ((e.key === 'g' || e.key === 'G') && cur.checked && cur.res && cur.res.full) return doNext(true);
  });

  /* ------------------------------------------------------------ boot */
  if (SESS && SESS.cur && SESS.cur.checked === 'done') { SESS.pos++; SESS.cur = null; }
  render();
  initSync();
})();
</script>
